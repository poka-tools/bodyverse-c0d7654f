window.deleteCust=function(name){
  const c=CDB.get(name); const n=(c?.records||[]).length;
  if(!confirm(`「${name}」を削除します（記録${n}件も消えます）。\n⚠️ 元に戻せません。よろしいですか？`))return;
  CDB.del(name); TDB.remove(name); SDB.remove(name); PDB.del(name);
  const bi=S.boardSel.indexOf(name); if(bi>=0)S.boardSel.splice(bi,1);
  if(S.active===name){S.active=null;ensureActive();syncTop();}
  closeSheet(); toast('削除しました'); renderCust();
};
window.openGoalForm=function(name){

window.saveGoal=function(name){
  const g=v=>{const e=$('gf_'+v);return e&&e.value!==''?+e.value:null;};
  const goal={weight:g('weight'),bodyFatPct:g('bodyFatPct'),muscleMass:g('muscleMass')};
  if(goal.weight==null&&goal.bodyFatPct==null&&goal.muscleMass==null){CDB.setGoal(name,null);}
  else CDB.setGoal(name,goal);
  closeSheet(); toast('目標を保存しました'); if(S.tab==='home')renderSummary(); else renderCust();
};

/* ════════ import / export ════════ */
function exportJSON(){
  const data=CDB.all(); if(!Object.keys(data).length){toast('書き出す顧客がいません');return;}
  const out=Object.assign({},data);
  const tr=TDB.load(); if(Object.keys(tr).length)out.__training_v1=tr;   // トレーニング記録も同梱（顧客扱いされない特殊キー）
  const ss=SDB.load(); if(Object.keys(ss).length)out.__sessions_v1=ss;   // セッション履歴も同梱
  const pl=PDB.load(); if(Object.keys(pl).length)out.__plans_v1=pl;      // 本日のプランも同梱
  const cx=XDB.all(); if(cx.length)out.__custom_ex_v1=cx;               // カスタム種目も同梱
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`bodyvis_customers_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  closeSheet(); toast('書き出しました');
}
function importJSON(e){
  const file=e.target.files?.[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const incoming=JSON.parse(r.result);
    if(typeof incoming!=='object'||!incoming||Array.isArray(incoming))throw new Error('JSON形式が不正です');
    // トレーニング記録の同梱分を取り出してマージ（顧客ループの前に分離）
    const trIn=incoming.__training_v1; if(trIn&&typeof trIn==='object'){delete incoming.__training_v1;
      const t=TDB.load(); for(const nm in trIn){ if(!Array.isArray(trIn[nm]))continue;
        const ex={}; [...(Array.isArray(t[nm])?t[nm]:[]),...trIn[nm]].forEach(x=>{if(x&&x.id)ex[x.id]=x;}); t[nm]=Object.values(ex); }
      TDB.save(t); }
    const ssIn=incoming.__sessions_v1; if(ssIn&&typeof ssIn==='object'){delete incoming.__sessions_v1;
      const sm=SDB.load(); for(const nm in ssIn){ if(!Array.isArray(ssIn[nm]))continue;
        const byId={}; [...(Array.isArray(sm[nm])?sm[nm]:[]),...ssIn[nm]].forEach(x=>{if(x&&x.id)byId[x.id]=x;});
        sm[nm]=Object.values(byId).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }
      SDB.save(sm); }
    const plIn=incoming.__plans_v1; if(plIn&&typeof plIn==='object'&&!Array.isArray(plIn)){delete incoming.__plans_v1;
      const pm=PDB.load(); for(const nm in plIn){ if(plIn[nm]&&typeof plIn[nm]==='object')pm[nm]=plIn[nm]; } PDB.save(pm); }
    const cxIn=incoming.__custom_ex_v1; if(Array.isArray(cxIn)){delete incoming.__custom_ex_v1;
      const ex=XDB.all(); cxIn.forEach(it=>{if(it&&it.name&&!ex.some(x=>x.name===it.name))ex.push({name:String(it.name),part:it.part||'',unit:it.unit==='秒'?'秒':'回'});}); XDB.save(ex); }
    const cur=CDB.all(); let added=0,merged=0;
    Object.values(incoming).forEach(c=>{if(!c||!c.name)return; c.records=Array.isArray(c.records)?c.records:[];
      // 取込データの目標値を数値へ強制（不正値の混入＝XSS/破損を防ぐ）
      if(c.goal&&typeof c.goal==='object'){for(const k of ['weight','bodyFatPct','muscleMass','visceralFat','armM','armF','legM','legF','trunkM','trunkF']){
        if(c.goal[k]!=null){const n=Number(c.goal[k]); c.goal[k]=isNaN(n)?null:n;}}}
      if(cur[c.name]){const byD={};[...(cur[c.name].records||[]),...c.records].forEach(x=>{if(x&&x.date)byD[x.date]=x;});
        cur[c.name].records=Object.values(byD).sort((a,b)=>b.date.localeCompare(a.date));
        if(c.goal)cur[c.name].goal=c.goal; if(c.age!=null&&cur[c.name].age==null)cur[c.name].age=c.age;
        if(c.dob&&!cur[c.name].dob)cur[c.name].dob=c.dob; merged++;}
      else{cur[c.name]=c;added++;}});
    CDB.save(cur); ensureActive(); syncTop();
    alert(`取込完了：新規 ${added} 名 / 更新 ${merged} 名`); renderCust();
  }catch(err){alert('取込に失敗しました：'+err.message);} e.target.value='';};
  r.readAsText(file);
}

/* ════════ 診断（データの状態を画面に表示） ════════ */
function buildDiag(){
  const det=el('details','more'); det.innerHTML='<summary>🔍 診断（データの状態を確認）</summary>';
  const b=el('div','more-body');
  const row=(k,val,warn)=>{const r=el('div'); r.style.cssText='display:flex;gap:.6rem;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.82rem';
    const kk=el('span',null,k); kk.style.color='var(--muted)'; kk.style.flex='0 0 auto';
    const vv=el('span',null,val); vv.style.cssText='text-align:right;word-break:break-all;font-weight:700'+(warn?';color:var(--red)':'');
    r.appendChild(kk); r.appendChild(vv); return r;};

  // 1) どこで開いているか（オリジン違いが「名前は出るが数値が空」の主因）
  b.appendChild(row('現在のURL', location.href));
  const isFile=location.protocol==='file:';
  b.appendChild(row('オリジン', isFile?'file://（共有されません）':location.origin, isFile));

  // 2) 保存キーの中身
  const raw=localStorage.getItem(DB_KEY);
  b.appendChild(row('保存キー', DB_KEY));
  b.appendChild(row('保存サイズ', raw?raw.length.toLocaleString()+'文字':'なし', !raw));

  // 3) bodyvis_ で始まる他キーも一覧（別キーに入っていないか確認）
  const otherKeys=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k!==DB_KEY&&/bodyvis/i.test(k))otherKeys.push(k);}
  if(otherKeys.length)b.appendChild(row('その他のキー', otherKeys.join(', ')));

  // 4) 顧客ごとの記録件数
  const all=CDB.all(), names=Object.keys(all);
  b.appendChild(row('顧客数', names.length+'名', !names.length));
  const noRec=names.filter(n=>!(all[n].records||[]).length);
  b.appendChild(row('記録0件の顧客', noRec.length+'名', noRec.length>0&&noRec.length===names.length));

  const list=el('div'); list.style.cssText='margin-top:.5rem;font-size:.78rem';
  if(!names.length){list.appendChild(el('div',null,'（このオリジンには顧客データがありません）'));}
  names.forEach(n=>{const r=(all[n].records||[]); const line=el('div');
    line.style.cssText='padding:.25rem 0;display:flex;justify-content:space-between;gap:.5rem';
    line.appendChild(el('span',null,n));
    const info=el('span',null, r.length?`記録${r.length}件 / 最新 ${r[0]?.date||'?'} ${fmt(r[0]?.weight)}kg`:'記録0件');
    info.style.cssText='color:'+(r.length?'var(--green)':'var(--red)')+';font-weight:700;text-align:right;white-space:nowrap';
    line.appendChild(info); list.appendChild(line);});
  b.appendChild(list);

  // 5) 判定メッセージ
  const verdict=el('div'); verdict.style.cssText='margin-top:.7rem;padding:.6rem .7rem;border-radius:10px;font-size:.8rem;line-height:1.5;background:var(--surf2);border:1px solid var(--border)';
  let msg;
  if(!names.length) msg='⚠️ このオリジンに顧客がいません。index-3d側と別オリジンで開いている可能性大。下の「⬇ 取り込む(JSON)」でこの画面に直接JSONを読み込んでください。';
  else if(noRec.length===names.length) msg='⚠️ 顧客はいるが全員が記録0件。名前だけの顧客が残り、記録付きデータは未取込です。「⬇ 取り込む(JSON)」でJSONを読み込めば記録が入ります。';
  else if(noRec.length) msg=`一部（${noRec.length}名）が記録0件です。残りは正常に記録が入っています。`;
  else msg='✅ 全顧客に記録が入っています。表示は正常な状態です。';
  verdict.textContent=msg; b.appendChild(verdict);

  det.appendChild(b); return det;
}

function buildMReport(c){
  const root=$('mReport'); root.innerHTML='';
  Object.keys(repCharts).forEach(k=>{repCharts[k].destroy();delete repCharts[k];});
  const a=asc(c); if(!a.length)return false;
  const recs=sorted(c), latest=recs[0], prev=recs[1]||null, first=a[0];
  const brand=getBrand();
  const gymName=c.__gym||brand.gymName, trainerName=c.__trainer||brand.trainerName; // 共有レポートはペイロード由来を優先

  /* ── 表紙 ── */
  const cover=el('div','mr-cover'), ctop=el('div','mr-cover-top'), cl=el('div');
  if(gymName)cl.appendChild(el('div','mr-gym',gymName));
  cl.appendChild(el('div','mr-title','BODY COMPOSITION REPORT'));
  const meta=el('div','mr-meta');
  const _age=custAge(c);
  meta.appendChild(el('div',null,`お名前: ${c.name||''}　/　${c.gender==='male'?'男性':'女性'}${_age!=null?`　/　${_age}歳`:''}`));
  meta.appendChild(el('div',null,`対象期間: ${ymLabel(first.date)} 〜 ${ymLabel(latest.date)}　/　${a.length} 件の測定`));
  if(trainerName)meta.appendChild(el('div',null,`担当: ${trainerName}`));
  meta.appendChild(el('div',null,`発行日: ${new Date().toLocaleDateString('ja-JP')}`));
  cl.appendChild(meta); ctop.appendChild(cl);
  const op=overallProgress(c);
  if(op){const col=op.pct>=100?'#1e8e5a':op.pct>=50?'#2563c0':'#c08a00';
    const ab=el('div','mr-ach');
    ab.appendChild(el('div','mr-ach-lbl',first.date===latest.date?'達成度（初回）':'総合達成度'));
    const big=el('div','mr-ach-pct',op.pct+'%'); big.style.color=col; ab.appendChild(big);
    ctop.appendChild(ab);}
  cover.appendChild(ctop); root.appendChild(cover);

  /* ── Before → After（初回 → 最新） ── */
  if(first.date!==latest.date){
    root.appendChild(el('h2',null,'Before → After'));
    const t=document.createElement('table');
    const thead=document.createElement('thead'),hr=document.createElement('tr');
    ['指標',`初回（${ymLabel(first.date)}）`,`最新（${ymLabel(latest.date)}）`,'変化'].forEach(h=>hr.appendChild(el('th',null,h)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb=document.createElement('tbody');
    [['weight','kg'],['bodyFatPct','%'],['muscleMass','%']].forEach(([k,u])=>{
      const m=METRICS[k],tr=document.createElement('tr');
      tr.appendChild(el('td',null,m.lbl));
      tr.appendChild(el('td',null,first[k]!=null?fmt(first[k])+u:'—'));
      tr.appendChild(el('td',null,latest[k]!=null?fmt(latest[k])+u:'—'));
      let txt='—',cls=null;
      if(first[k]!=null&&latest[k]!=null){const d=latest[k]-first[k];
        txt=(d>0?'+':'')+fmt(d)+u;
        cls=Math.abs(d)<1e-9?null:((d<0)===(m.dir==='down')?'mr-down':'mr-up');}
      tr.appendChild(el('td',cls,txt)); tb.appendChild(tr);});
    t.appendChild(tb); root.appendChild(t);
  }

  /* ── 測定サマリー（最新・前回比） ── */
  root.appendChild(el('h2',null,'測定サマリー'));
  const boxes=el('div','mr-boxes');
  const mkBox=(lbl,key,unit,val,base)=>{
    const b=el('div','mr-box'); b.appendChild(el('small',null,lbl));
    const line=el('div'); line.appendChild(Object.assign(el('b'),{textContent:val!=null?fmt(val)+unit:'—'}));
    if(val!=null&&base!=null){const d=val-base;
      if(Math.abs(d)>=0.05){const[cls,arw]=deltaClass(key,d);
        const sp=el('span','mr-d '+(cls==='up'?'mr-down':cls==='down'?'mr-up':''),`${arw}${fmt(Math.abs(d))}${unit}`);
        // deltaClass: 'up'=good(緑) 'down'=bad(赤)。印刷では mr-down=緑/mr-up=赤に合わせる
        line.appendChild(sp);}}
    b.appendChild(line); return b;};
  boxes.appendChild(mkBox('体重','weight','kg',latest.weight,prev?.weight));
  boxes.appendChild(mkBox('体脂肪率','bodyFatPct','%',latest.bodyFatPct,prev?.bodyFatPct));
  boxes.appendChild(mkBox('骨格筋率','muscleMass','%',latest.muscleMass,prev?.muscleMass));
  boxes.appendChild(mkBox('BMI','weight','',bmiOf(latest),bmiOf(prev||{})));
  root.appendChild(boxes);

  /* ── 部位別の前月比較（腕・脚・体幹） ── */
  if(prev){
    const PARTS=[['両腕','arm'],['両脚','leg'],['体幹','trunk']];
    const SEGM=[['骨格筋率','M','%','up'],['皮下脂肪率','F','%','down']];
    const has=PARTS.some(([,p])=>SEGM.some(([,mk])=>prev[p+mk]!=null||latest[p+mk]!=null));
    if(has){
      root.appendChild(el('h2',null,'部位別の前月比較（腕・脚・体幹）'));
      const t=document.createElement('table');
      const thead=document.createElement('thead'),hr=document.createElement('tr');
      ['部位','指標',`前月（${ymLabel(prev.date)}）`,`当月（${ymLabel(latest.date)}）`,'変化'].forEach(h=>hr.appendChild(el('th',null,h)));
      thead.appendChild(hr); t.appendChild(thead);
      const tb=document.createElement('tbody');
      PARTS.forEach(([pl,p])=>SEGM.forEach(([ml,mk,u,dir])=>{
        const pv=prev[p+mk],cv=latest[p+mk],tr=document.createElement('tr');
        tr.appendChild(el('td',null,pl)); tr.appendChild(el('td',null,ml));
        tr.appendChild(el('td',null,pv!=null?fmt(pv)+u:'—'));
        tr.appendChild(el('td',null,cv!=null?fmt(cv)+u:'—'));
        let txt='—',cls=null;
        if(pv!=null&&cv!=null){const d=cv-pv; txt=(d>0?'+':'')+fmt(d)+u;
          cls=Math.abs(d)<1e-9?null:((d<0)===(dir==='down')?'mr-down':'mr-up');}
        tr.appendChild(el('td',cls,txt)); tb.appendChild(tr);}));
      t.appendChild(tb); root.appendChild(t);
    }
  }

  /* ── 目標と達成度 ── */
  if(c.goal&&['weight','bodyFatPct','muscleMass'].some(k=>c.goal[k]!=null)){
    root.appendChild(el('h2',null,'目標と達成度'));
    root.appendChild(el('div','mr-legend','青＝現在　／　緑＝目標'));
    const gb=el('div','mr-boxes mr-boxes-3');
    [['体重','weight','kg'],['体脂肪率','bodyFatPct','%'],['骨格筋率','muscleMass','%']].forEach(([lbl,k,u])=>{
      const g=c.goal[k]; if(g==null)return; const cur=latest[k];
      const box=el('div','mr-box'); box.appendChild(el('small',null,lbl));
      const row=el('div','mr-gb-row');
      row.appendChild(el('span','mr-gb-cur',cur!=null?fmt(cur)+u:'—'));
      row.appendChild(el('span','mr-gb-arrow','→'));
      row.appendChild(el('span','mr-gb-tgt',fmt(g)+u));
      box.appendChild(row);
      if(cur!=null){const rem=g-cur; box.appendChild(el('small','mr-gb-rem',Math.abs(rem)<0.05?'✓ 達成':`あと ${rem>0?'+':''}${fmt(rem)}${u}`));}
      gb.appendChild(box);});
    root.appendChild(gb);
  }

  /* ── 推移グラフ（体重・体脂肪率・骨格筋率・BMI を1つにまとめて表示） ── */
  if(a.length>=2){
    root.appendChild(el('h2',null,'推移グラフ'));
    const labels=a.map(r=>r.date.slice(0,7));
    const defs=[['weight','体重 (kg)','#4f9fff'],['bodyFatPct','体脂肪率 (%)','#ff8a5b'],
                ['muscleMass','骨格筋率 (%)','#19c39a'],['bmi','BMI','#e0a52e']];
    const series=defs.filter(([k])=>k==='bmi'?a.some(r=>bmiOf(r)!=null):a.some(r=>r[k]!=null))
      .map(([k,cap,col])=>({label:cap,data:a.map(r=>k==='bmi'?bmiOf(r):(r[k]??null)),color:col}));
    if(series.length){
      const fig=el('figure','mr-chart'); const cv=repCanvas('mrc_all'); fig.appendChild(cv);
      fig.appendChild(el('figcaption',null,'体重・体脂肪率・骨格筋率・BMI の推移')); root.appendChild(fig);
      repLineMulti(cv,labels,series);
    }
  }

  /* ── 月次推移テーブル ── */
  if(a.length){
    root.appendChild(el('h2',null,'月次推移'));
    const t=document.createElement('table');
    const thead=document.createElement('thead'),hr=document.createElement('tr');
    ['年月','体重','体脂肪率','骨格筋率','BMI','前月比(体重)'].forEach(h=>hr.appendChild(el('th',null,h)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb=document.createElement('tbody');
    a.forEach((r,i)=>{const p=i>0?a[i-1]:null,tr=document.createElement('tr'),bmi=bmiOf(r);
      tr.appendChild(el('td',null,ymLabel(r.date)));
      tr.appendChild(el('td',null,r.weight!=null?fmt(r.weight):'—'));
      tr.appendChild(el('td',null,r.bodyFatPct!=null?fmt(r.bodyFatPct):'—'));
      tr.appendChild(el('td',null,r.muscleMass!=null?fmt(r.muscleMass):'—'));
      tr.appendChild(el('td',null,bmi!=null?fmt(bmi):'—'));
      let txt='—',cls=null;
      if(p&&r.weight!=null&&p.weight!=null){const d=r.weight-p.weight; txt=(d>0?'+':'')+fmt(d)+'kg';
        cls=Math.abs(d)<1e-9?null:(d<0?'mr-down':'mr-up');}
      tr.appendChild(el('td',cls,txt)); tb.appendChild(tr);});
    t.appendChild(tb); root.appendChild(t);
  }

  root.appendChild(el('div','mr-disc','※ 本レポートは体組成データに基づく一般的な目安であり、医療診断ではありません。'));
  return true;
}

/* ════════ レポートを直接PDFダウンロード（jsPDF + html2canvas・遅延読込） ════════ */
function loadScriptOnce(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s);});
}
function loadPdfLibs(){
  const need=[];
  if(!window.html2canvas) need.push(loadScriptOnce('./vendor/html2canvas/html2canvas.min.js'));
  if(!(window.jspdf&&window.jspdf.jsPDF)) need.push(loadScriptOnce('./vendor/jspdf/jspdf.umd.min.js'));
  return Promise.all(need);
}
let _pdfBusy=false;
/* レポートPDFを生成してダウンロード（トレーナー用・共有用で共通コア）。Promiseを返す。 */
function _reportToPDF(c){
  if(_pdfBusy)return Promise.resolve(false); _pdfBusy=true;
  closeSheet();
  if(!buildMReport(c)){ _pdfBusy=false; return Promise.resolve(false); }
  toast('PDFを作成しています…');
  const root=$('mReport'); root.classList.add('pdfgen');
  return loadPdfLibs()
    .then(()=>(document.fonts&&document.fonts.ready)||Promise.resolve())
    .then(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))) // レイアウト・チャート描画確定待ち
    .then(()=>window.html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:root.scrollWidth}))
    .then(canvas=>{
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
      const margin=8, imgW=pageW-margin*2;
      const pageHeightPx=(pageH-margin*2)/imgW*canvas.width;   // 1ページ分の画像高さ(px)
      const ratio=canvas.height/(root.scrollHeight||canvas.height); // CSS px → キャンバスpx
      // ブロック境界（見出し/表/グラフを跨がない切れ目）
      const blocks=[...root.children];
      const tops=blocks.map(b=>Math.round(b.offsetTop*ratio));
      const cuts=[]; let start=0, guard=0;
      while(start < canvas.height-1 && guard++<200){
        let end=Math.min(start+pageHeightPx, canvas.height);
        if(end<canvas.height){
          let idx=-1;
          for(let i=0;i<tops.length;i++){ if(tops[i]>start+4 && tops[i]<=end+0.5) idx=i; }
          if(idx>=0){
            if(idx>0 && blocks[idx-1] && blocks[idx-1].tagName==='H2' && tops[idx-1]>start+4) idx--; // 見出しは内容と同ページへ
            if(tops[idx]>start+4) end=tops[idx];  // ブロック先頭で改ページ
          }
          // 1ブロックがページより高い場合は end 据え置き＝やむを得ずハードカット
        }
        end=Math.round(end); if(end<=start+2)end=Math.min(start+pageHeightPx,canvas.height);
        cuts.push([start,end]); start=end;
      }
      cuts.forEach((seg,i)=>{
        const s=seg[0], h=seg[1]-seg[0]; if(h<=0)return;
        const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=h;
        tmp.getContext('2d').drawImage(canvas,0,s,canvas.width,h,0,0,canvas.width,h);
        if(i>0)pdf.addPage();
        pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,imgW,h*imgW/canvas.width,undefined,'FAST');
      });
      pdf.save('BODYVERSE_'+repSan(c.name)+'.pdf');
      toast('PDFを保存しました');
      return true;
    })
    .catch(()=>{ // ライブラリ未読込/生成失敗時は印刷ダイアログへフォールバック
      toast('直接保存に失敗しました。印刷から保存してください');
      try{window.print();}catch(e){}
      return false;
    })
    .finally(()=>{ root.classList.remove('pdfgen'); _pdfBusy=false; });
}
window.downloadReportPDF=function(name){
  const c=CDB.get(name||S.active);
  if(!c){toast('クライアントを選択してください');return;}
  if(!(c.records||[]).length){toast('記録がありません');return;}

/* QR共有ペイロード → 顧客オブジェクトを復元し、トレーナーと同じフルレポートをPDF化。 */
function buildCustomerFromShare(p){
  const rd=x=>(x==null||x===''||isNaN(+x))?null:+x;
  const L=p.L||[], S=p.S||[], G=p.G||[], T=p.T||[];
  const records=[];
  T.forEach(r=>{ const ym=String(r[0]); if(ym.length<4)return;   // 'YYMM' → 20YY-MM-01
    records.push({date:'20'+ym.slice(0,2)+'-'+ym.slice(2,4)+'-01', weight:rd(r[1]), bodyFatPct:rd(r[2]), muscleMass:rd(r[3])}); });
  const latestDate = p.d ? (String(p.d).length>=7?String(p.d).slice(0,7)+'-01':String(p.d)) : (records.length?records[records.length-1].date:null);
  if(latestDate){
    const latest={date:latestDate, weight:rd(L[0]), bodyFatPct:rd(L[1]), muscleMass:rd(L[2]),
      visceralFat:rd(L[3]), bmi:rd(L[4]), bodyAge:rd(L[5]), bmr:rd(L[6]),
      armM:rd(S[0]),armF:rd(S[1]),legM:rd(S[2]),legF:rd(S[3]),trunkM:rd(S[4]),trunkF:rd(S[5])};
    const i=records.findIndex(r=>r.date.slice(0,7)===latest.date.slice(0,7));
    if(i>=0)Object.assign(records[i],latest); else records.push(latest);
  }
  records.sort((a,b)=>b.date.localeCompare(a.date)); // 新しい順（CDB慣習）
  return {
    name: p.n||'ゲスト', gender: p.g||'', age: (p.a!=null&&!isNaN(+p.a))?+p.a:null,
    goal: G.some(g=>rd(g)!=null)?{weight:rd(G[0]),bodyFatPct:rd(G[1]),muscleMass:rd(G[2])}:null,
    records, __gym: p.b||'', __trainer: p.tn||''
  };
}
window.downloadSharedReportPDF=function(payload){
  const c=buildCustomerFromShare(payload||{});
  if(!c.records.length){ try{alert('レポートを作成できるデータがありません');}catch(e){} return Promise.resolve(false); }
  return _reportToPDF(c);
};

/* ════════ QR共有 ════════
   QR = 公開URL + '#share=<圧縮ペイロード>'。スキャンで読み取り専用の結果ビュー
   （このページ冒頭の早期スクリプト）が開く。データはURLフラグメントにのみ含まれ
   サーバー送信されない（オフライン・プライバシー配慮）。 */
const SHARE_PUBLIC_URL='https://poka-tools.github.io/bodyverse-c0d7654f/m.html';
function loadQR(){
  if(window.qrcode)return Promise.resolve(window.qrcode);
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src='./vendor/qrcode/qrcode.js';
    s.onload=()=>window.qrcode?resolve(window.qrcode):reject(new Error('QR初期化に失敗しました'));
    s.onerror=()=>reject(new Error('QRライブラリの読み込みに失敗しました'));
    document.head.appendChild(s);
  });
}
function shareBaseURL(){ return location.protocol==='file:'?SHARE_PUBLIC_URL:location.href.split('#')[0]; }
/* URLセーフな base64url（percentエンコード不使用＝QRを小さく保つ・UTF-8対応）。結果ビューの b64urlDecode と対。 */
function b64urlEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

/* 顧客→コンパクト共有ペイロード。形式は冒頭の結果ビュー render() と一致必須。 */
function buildSharePayload(c,opt){
  const anon=opt&&opt.anon; const rd=(x,p=1)=>(x==null||x===''||isNaN(+x))?null:+(+x).toFixed(p);
  const recs=(c.records||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)); // 昇順
  const latest=recs[recs.length-1]||{};
  const trend=recs.slice(-18).map(r=>[r.date.slice(2).replace('-',''),rd(r.weight),rd(r.bodyFatPct),rd(r.muscleMass)]);
  const brand=getBrand();
  const gym=(brand.gymName||'').trim(), trainer=(brand.trainerName||'').trim();
  const p={v:1,d:latest.date||'',
    L:[rd(latest.weight),rd(latest.bodyFatPct),rd(latest.muscleMass),rd(latest.visceralFat),rd(latest.bmi),rd(latest.bodyAge,0),rd(latest.bmr,0)],
    S:[rd(latest.armM),rd(latest.armF),rd(latest.legM),rd(latest.legF),rd(latest.trunkM),rd(latest.trunkF)],
    G:[rd(c.goal&&c.goal.weight),rd(c.goal&&c.goal.bodyFatPct),rd(c.goal&&c.goal.muscleMass)],
    T:trend};
  if(!anon&&c.name)p.n=c.name;
  if(c.gender)p.g=c.gender;                 // 性別・年齢はレポート表紙用（識別情報ではないので匿名時も含める）
  const _shareAge=custAge(c); if(_shareAge!=null)p.a=_shareAge;   // 共有時点の年齢（生年月日から自動計算）
  if(gym)p.b=gym;
  if(trainer)p.tn=trainer;                  // 担当名（表紙用）
  return p;
}
function shareLink(c,opt){ return shareBaseURL()+'#share='+b64urlEncode(JSON.stringify(buildSharePayload(c,opt))); }

/* QRモデルを canvas に描画（innerHTML不使用・PNG保存にも使う）。 */
function qrToCanvas(qr,px){
  px=px||560; const n=qr.getModuleCount(),margin=4,total=n+margin*2;
  const cv=document.createElement('canvas'); cv.width=cv.height=px;
  const ctx=cv.getContext('2d'),cell=px/total;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(qr.isDark(r,cc))
    ctx.fillRect(Math.round((cc+margin)*cell),Math.round((r+margin)*cell),Math.ceil(cell),Math.ceil(cell));
  return cv;
}

window.openShareQR=function(name){
  const c=CDB.get(name||S.active);
  if(!c){toast('顧客を選択してください');return;}
  if(!(c.records||[]).length){toast('記録がありません。QRを作成できません');return;}
  loadQR().then(()=>buildQRSheet(c)).catch(err=>toast(err.message||'QRの初期化に失敗しました'));
};

function buildQRSheet(c){
  const box=el('div','qr-sheet');
  box.appendChild(el('div','qr-name',c.name));         // 先頭に名前（textContent = 安全）

  const host=el('div','qr-host'); box.appendChild(host);

  const note=el('div','qr-note','スキャンすると結果画面が開きます。相手はその画面から「📄 PDFで保存」できます。データはリンク内にのみ含まれ、サーバーには送信されません（オンライン環境で開けます）。');
  box.appendChild(note);

  const anonLbl=el('label','qr-anon');
  const anonChk=el('input'); anonChk.type='checkbox';
  anonLbl.appendChild(anonChk); anonLbl.appendChild(document.createTextNode('名前を含めない（匿名で共有）'));
  box.appendChild(anonLbl);

  const linkRow=el('div','qr-linkrow');
  const link=el('input','qr-link'); link.readOnly=true;
  const copyBtn=el('button','btn'); copyBtn.textContent='コピー';
  linkRow.appendChild(link); linkRow.appendChild(copyBtn); box.appendChild(linkRow);

  // 結果ページを開く（トレーナーがPDF保存ボタンを確認・自分でPDF保存もできる）
  const previewBtn=el('button','btn ghost qr-preview'); previewBtn.textContent='🔗 結果ページを開く（PDFで保存を確認）';
  box.appendChild(previewBtn);

  const actions=el('div','qr-actions');
  const saveBtn=el('button','btn green'); saveBtn.textContent='画像を保存';
  const closeBtn=el('button','btn'); closeBtn.textContent='閉じる'; closeBtn.onclick=closeSheet;
  actions.appendChild(saveBtn); actions.appendChild(closeBtn); box.appendChild(actions);

  let curQR=null,curLink='';
  function refresh(){
    curLink=shareLink(c,{anon:anonChk.checked});
    curQR=null;
    // QRには「完全なURL」を入れる（スキャンで結果ページが開く）。Byteモード・ECC=M。
    for(let t=1;t<=40;t++){ try{const q=window.qrcode(t,'M');q.addData(curLink,'Byte');q.make();curQR=q;break;}catch(e){} }
    link.value=curLink; host.textContent='';
    if(!curQR){ const w=el('div',null,'記録が多すぎてQRに収まりません。リンクをコピーして共有してください。');
      w.style.cssText='color:var(--red);font-size:.74rem;text-align:center'; host.appendChild(w); return; }
    host.appendChild(qrToCanvas(curQR,560));   // innerHTML不使用
  }
  copyBtn.onclick=()=>{
    const done=()=>toast('リンクをコピーしました');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(curLink).then(done,()=>{link.select();document.execCommand('copy');done();});
    }else{link.select();document.execCommand('copy');done();}
  };
  previewBtn.onclick=()=>{
    if(!curLink){toast('リンクを生成できていません');return;}
    window.open(curLink,'_blank');   // 結果ページを新しいタブで開く＝PDF保存ボタンを確認できる
  };
  saveBtn.onclick=()=>{
    if(!curQR){toast('QRを生成できていません');return;}
    const a=el('a'); a.href=qrToCanvas(curQR,720).toDataURL('image/png');
    a.download=`BODYVERSE_QR_${repSan(c.name)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  anonChk.onchange=refresh;
  openSheetNode(box);
  refresh();
}

/* ════════ boot ════════ */
applyTheme(currentTheme());
ensureActive(); syncTop();
setTab('home');
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
