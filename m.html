<!-- ══ 結果共有ビュー（QRスキャンで開く読み取り専用画面） ══
     location.hash が #share= のとき本体アプリを隠して結果カードを描画。
     ペイロードはURLフラグメント由来＝外部入力なので全て textContent / DOM構築で安全描画。 -->
<script>
(function () {
  var HASH_KEY = '#share=';
  var h = location.hash || '';
  if (h.indexOf(HASH_KEY) !== 0) return;
  document.documentElement.classList.add('share-mode');

  // base64url → JSON（エンコーダ b64urlEncode と対）。旧percent方式もフォールバックで許容。
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  }
  var payload = null, raw = h.slice(HASH_KEY.length);
  try { payload = JSON.parse(b64urlDecode(raw)); }
  catch (e) {
    try { payload = JSON.parse(decodeURIComponent(raw)); } catch (e2) { payload = null; }
  }

  function num(x) { return (x === '' || x == null || isNaN(+x)) ? null : +x; }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;   // textContent = 安全
    return e;
  }
  function fmt(x, dp) { var n = num(x); return n == null ? '—' : (dp != null ? n.toFixed(dp) : String(n)); }
  // アイコン（このビュー専用のローカル版）。メインスクリプトの ic() は render() 実行時点でまだ未定義のため、依存を切る。
  function ic() {
    return '<svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'
      + '<line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>';
  }

  function metricCard(label, val, unit, dp, hint) {
    var c = el('div', 'sv-mc');
    c.appendChild(el('span', 'l', label));
    if (hint) c.appendChild(el('span', 'hint', hint));
    var v = el('div', 'v', fmt(val, dp));
    if (unit) v.appendChild(el('span', 'u', unit));
    c.appendChild(v);
    return c;
  }

  function sparkline(vals) {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'sv-sp-svg');
    svg.setAttribute('viewBox', '0 0 100 34');
    svg.setAttribute('preserveAspectRatio', 'none');
    var pts = vals.map(num).filter(function (v) { return v != null; });
    if (pts.length < 2) return svg;
    var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), rng = (mx - mn) || 1;
    var step = 100 / (pts.length - 1);
    var d = pts.map(function (v, i) {
      var x = i * step, y = 30 - ((v - mn) / rng) * 26 - 2;
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#4f9fff');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(path);
    return svg;
  }

  function hexA(hex, a) {
    var c = hex.replace('#', '');
    return 'rgba(' + parseInt(c.slice(0, 2), 16) + ',' + parseInt(c.slice(2, 4), 16) + ',' + parseInt(c.slice(4, 6), 16) + ',' + a + ')';
  }
  // レポート同様の折れ線グラフ（Chart.js）。goal!=null なら目標を金色の破線で重ねる。
  function makeLineChart(pc) {
    try {
      var ds = [{ data: pc.series, borderColor: pc.color, backgroundColor: hexA(pc.color, 0.12),
        fill: true, tension: 0.35, pointRadius: 2, pointBackgroundColor: pc.color, borderWidth: 2, spanGaps: true }];
      if (pc.goal != null) ds.push({ data: pc.labels.map(function () { return pc.goal; }),
        borderColor: '#ffd060', borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, fill: false });
      new window.Chart(pc.cv.getContext('2d'), {
        type: 'line',
        data: { labels: pc.labels, datasets: ds },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { ticks: { color: '#9aa0aa', font: { size: 9 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { display: false } },
            y: { ticks: { color: '#9aa0aa', font: { size: 9 } }, grid: { color: 'rgba(120,135,160,.14)' }, grace: '8%' },
          },
        },
      });
    } catch (e) { /* Chart描画失敗時は無視（見出し・数値は残る） */ }
  }

  function render() {
    var root = el('div', 'share-view'); root.id = 'shareView';
    var wrap = el('div', 'sv-wrap'); root.appendChild(wrap);
    var pendingCharts = [];

    if (!payload || payload.v !== 1) {
      var t = el('div', 'sv-title'); t.appendChild(el('div', 'sv-name', '結果を読み込めませんでした'));
      wrap.appendChild(t);
      wrap.appendChild(el('div', 'sv-foot', 'QRリンクが不完全な可能性があります。'));
      document.body.appendChild(root); return;
    }

    // ── データ・ヘルパー ──
    var G = payload.G || [], T = payload.T || [], L = payload.L || [], P = payload.P || [];
    var MICONS = {
      scale:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M12 4v2"/></svg>',
      drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3z"/></svg>',
      muscle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8v8M18 8v8M4 10v4M20 10v4M6 12h12"/></svg>',
      organ:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="3.2"/><path d="M5 21v-1.5a7 7 0 0 1 14 0V21"/></svg>',
      bmi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h5"/></svg>',
      age:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
    };
    var AV_M='<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#dbeafe"/><circle cx="24" cy="19" r="8" fill="#2f7de0"/><path d="M9 42a15 15 0 0 1 30 0z" fill="#2f7de0"/></svg>';
    var AV_F='<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fce7f0"/><circle cx="24" cy="19" r="8" fill="#e05a8a"/><path d="M9 42a15 15 0 0 1 30 0z" fill="#e05a8a"/></svg>';
    function fmtDate(d){var s=String(d);var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'年'+(+m[2])+'月'+(+m[3])+'日';var m2=s.match(/^(\d{4})-(\d{2})/);if(m2)return m2[1]+'年'+(+m2[2])+'月';return s;}
    function achMsg(p){if(p>=100)return '目標を達成しました！';if(p>=70)return 'あと少しで目標達成です！';if(p>=40)return '順調に目標へ近づいています！';return '一緒に目標を目指しましょう！';}
    function wrMetric(label,val,prev,unit,dp,iconKey,color,dir){
      var c=el('div','wr-mc');var hh=el('div','wr-mc-h');
      var ib=el('span','wr-mc-ic');ib.style.color=color;ib.innerHTML=MICONS[iconKey]||'';hh.appendChild(ib);
      hh.appendChild(el('span','wr-mc-l',label));c.appendChild(hh);
      var v=el('div','wr-mc-v',fmt(val,dp));if(unit)v.appendChild(el('span','u',unit));c.appendChild(v);
      var cv=num(val),pv=num(prev),rc=el('div','wr-mc-d'),eps=dp?0.05:0.5;
      if(cv==null||pv==null){rc.className='wr-mc-d flat';rc.textContent='前回比 —';}
      else{var dd=+(cv-pv).toFixed(dp||0);
        if(Math.abs(dd)<eps){rc.className='wr-mc-d flat';rc.textContent='前回比 ±0';}
        else{var good=dir==='down'?dd<0:dd>0;rc.className='wr-mc-d '+(good?'good':'bad');rc.textContent='前回比 '+(dd>0?'+':'')+fmt(dd,dp)+unit;}}
      c.appendChild(rc);return c;
    }
    var trendRange='3m',combinedChart=null;
    function drawCombined(){
      if(!window.Chart)return;
      var kmap={'1m':2,'3m':4,'6m':7,'1y':13},k=kmap[trendRange]||T.length;
      var rows=T.slice(Math.max(0,T.length-k));
      var labels=rows.map(function(r){var ym=String(r[0]);return ym.length>=4?((+ym.slice(0,2))+'/'+(+ym.slice(2))):ym;});
      var cdefs=[[1,'体重 (kg)','#4f9fff'],[2,'体脂肪率 (%)','#19c39a'],[3,'骨格筋率 (%)','#ff6b6b'],[4,'BMI','#e0a52e']];
      var datasets=cdefs.filter(function(d){return rows.some(function(r){return num(r[d[0]])!=null;});})
        .map(function(d){return {label:d[1],data:rows.map(function(r){return num(r[d[0]]);}),borderColor:d[2],backgroundColor:'transparent',borderWidth:2,tension:.35,pointRadius:2,pointBackgroundColor:d[2],pointBorderWidth:0,spanGaps:true,fill:false};});
      if(combinedChart){combinedChart.destroy();combinedChart=null;}
      var ctx=document.getElementById('wrTrendCv');if(!ctx)return;
      try{combinedChart=new window.Chart(ctx.getContext('2d'),{type:'line',data:{labels:labels,datasets:datasets},
        options:{responsive:true,maintainAspectRatio:false,animation:false,
          plugins:{legend:{display:true,position:'bottom',labels:{color:'#556',boxWidth:8,boxHeight:8,usePointStyle:true,pointStyle:'circle',font:{size:11},padding:12}},tooltip:{enabled:true}},
          scales:{x:{ticks:{color:'#9aa0aa',font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:6},grid:{display:false}},
                   y:{ticks:{color:'#9aa0aa',font:{size:10}},grid:{color:'rgba(120,135,160,.14)'},grace:'8%'}}}});}catch(e){}
    }

    // ── ヘッダー（アバター＋名前＋測定日＋測定場所） ──
    var head=el('div','wr-head');
    var av=el('div','wr-avatar');av.innerHTML=(payload.g==='female'?AV_F:AV_M);head.appendChild(av);
    var hi=el('div','wr-head-info');
    var nm=el('div','wr-name');nm.appendChild(el('span','n',payload.n?String(payload.n):'あなたの測定結果'));nm.appendChild(el('span','sama','様'));hi.appendChild(nm);
    if(payload.d)hi.appendChild(el('div','wr-sub','測定日：'+fmtDate(payload.d)));
    if(payload.b)hi.appendChild(el('div','wr-sub','測定場所：'+String(payload.b)));
    head.appendChild(hi);wrap.appendChild(head);

    try{document.title='トレカル'+(payload.n?('_'+String(payload.n).replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_')):'')+(payload.d?('_'+String(payload.d)):'');}catch(e){}

    // ── 目標達成度 ──
    var goalsExist=G.some(function(g){return num(g)!=null;});
    var achPct=null;
    if(goalsExist){var base0=(T.length&&T[0])?T[0]:null,aSum=0,aN=0;
      [{gi:0,ti:1},{gi:1,ti:2},{gi:2,ti:3}].forEach(function(x){var tg=num(G[x.gi]);if(tg==null)return;var cv=num(L[x.gi]);var bv=base0?num(base0[x.ti]):null;if(bv!=null&&cv!=null&&(tg-bv)!==0){var pp=((cv-bv)/(tg-bv))*100;pp=Math.max(0,Math.min(100,pp));aSum+=pp;aN++;}});
      achPct=aN?Math.round(aSum/aN):null;}
    if(achPct!=null){
      var aCard=el('div','wr-card wr-ach');
      var aTop=el('div','wr-ach-top');aTop.appendChild(el('span','wr-ach-lbl','目標達成度'));
      var apv=el('span','wr-ach-pct');apv.innerHTML=achPct+'<span class="u">%</span>';aTop.appendChild(apv);aCard.appendChild(aTop);
      aCard.appendChild(el('div','wr-ach-msg',achMsg(achPct)));
      var aBar=el('div','wr-ach-bar');var aFill=el('i');aFill.style.width=Math.max(5,Math.min(100,achPct))+'%';aBar.appendChild(aFill);
      var aStar=el('span','wr-ach-star');aStar.textContent='★';aBar.appendChild(aStar);aCard.appendChild(aBar);
      wrap.appendChild(aCard);
    }

    // ── 今回の測定結果（6カード＋前回比） ──
    var mSec=el('div','wr-card');mSec.appendChild(el('div','wr-h','今回の測定結果'));
    var grid=el('div','wr-metrics');
    [['体重',L[0],P[0],'kg',1,'scale','#2f7de0','down'],
     ['体脂肪率',L[1],P[1],'%',1,'drop','#e2483d','down'],
     ['骨格筋率',L[2],P[2],'%',1,'muscle','#e0517a','up'],
     ['内臓脂肪',L[3],P[3],'',0,'organ','#7b8494','down'],
     ['BMI',L[4],P[4],'',1,'bmi','#2f7de0','down'],
     ['体年齢',L[5],P[5],'歳',0,'age','#2f7de0','down']].forEach(function(m){grid.appendChild(wrMetric.apply(null,m));});
    mSec.appendChild(grid);wrap.appendChild(mSec);

    // ── 目標と達成度（バー） ──
    if (goalsExist) {
      var gSec = el('div', 'wr-card');
      gSec.appendChild(el('div', 'wr-h', '目標と達成度'));
      [{ i: 0, lbl: '体重', unit: 'kg', ti: 1 }, { i: 1, lbl: '体脂肪率', unit: '%', ti: 2 }, { i: 2, lbl: '骨格筋率', unit: '%', ti: 3 }].forEach(function (gd) {
        var target = num(G[gd.i]); if (target == null) return;
        var cur = num(L[gd.i]);
        var base = (T.length && T[0]) ? num(T[0][gd.ti]) : null;
        var g = el('div', 'sv-goal');
        var top = el('div', 'sv-goal-top');
        top.appendChild(el('span', 'sv-goal-lbl', gd.lbl));
        var val = el('span', 'sv-goal-val');
        val.appendChild(document.createTextNode((cur == null ? '—' : cur.toFixed(1)) + gd.unit + ' / '));
        val.appendChild(el('b', null, target.toFixed(1) + gd.unit));
        top.appendChild(val); g.appendChild(top);
        var pct = null;
        if (base != null && cur != null && (target - base) !== 0) {
          pct = ((cur - base) / (target - base)) * 100; pct = Math.max(0, Math.min(100, pct));
        }
        var done = (cur != null && Math.abs(target - cur) < 0.05);
        var bar = el('div', 'sv-bar' + (done ? ' done' : '')); var fill = el('i');
        fill.style.width = (done ? 100 : (pct == null ? 0 : +pct.toFixed(0))) + '%';
        bar.appendChild(fill); g.appendChild(bar);
        if (cur != null) {
          if (done) g.appendChild(el('span', 'sv-goal-rem done', '✓ 目標を達成しました！'));
          else g.appendChild(el('span', 'sv-goal-rem', 'あと ' + Math.abs(target - cur).toFixed(1) + gd.unit + ' で目標です'));
        }
        gSec.appendChild(g);
      });
      wrap.appendChild(gSec);
    }

    // ── これまでの変化（期間チップ＋合成グラフ） ──
    if (T.length >= 2) {
      var tSec = el('div', 'wr-card');
      tSec.appendChild(el('div', 'wr-h', 'これまでの変化'));
      if (window.Chart) {
        var chips = el('div', 'wr-chips');
        [['1m', '1ヶ月'], ['3m', '3ヶ月'], ['6m', '6ヶ月'], ['1y', '1年']].forEach(function (ch) {
          var b = el('button', 'wr-chip' + (trendRange === ch[0] ? ' on' : ''), ch[1]); b.type = 'button';
          b.onclick = function () { trendRange = ch[0]; Array.prototype.forEach.call(chips.children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); drawCombined(); };
          chips.appendChild(b);
        });
        tSec.appendChild(chips);
        var cbox = el('div', 'wr-chart-box'); var cv = el('canvas'); cv.id = 'wrTrendCv'; cbox.appendChild(cv); tSec.appendChild(cbox);
      } else {
        [[1, '体重', 'kg', '#4f9fff'], [2, '体脂肪率', '%', '#19c39a'], [3, '骨格筋率', '%', '#ff6b6b']].forEach(function (d) {
          var series = T.map(function (r) { return num(r[d[0]]); }); var last = series[series.length - 1];
          var row = el('div', 'sv-sp-row'); row.appendChild(el('div', 'sv-sp-lbl', d[1]));
          row.appendChild(sparkline(series)); row.appendChild(el('div', 'sv-sp-val', (last == null ? '—' : last.toFixed(1)) + d[2])); tSec.appendChild(row);
        });
      }
      wrap.appendChild(tSec);
    }

    // ── PDF保存ボタン ──
    var actions = el('div', 'wr-actions');
    var pdfBtn = el('button', 'wr-pdf'); pdfBtn.type = 'button'; pdfBtn.innerHTML = ic('doc') + 'レポートをダウンロード (PDF)';
    pdfBtn.onclick = function () {
      if (window.downloadSharedReportPDF) {
        var t = pdfBtn.innerHTML; pdfBtn.disabled = true; pdfBtn.innerHTML = ic('doc') + 'PDFを作成中…';
        Promise.resolve(window.downloadSharedReportPDF(payload)).catch(function () {}).then(function () { pdfBtn.disabled = false; pdfBtn.innerHTML = t; });
      } else { try { window.print(); } catch (e) {} }
    };
    actions.appendChild(pdfBtn); wrap.appendChild(actions);

    wrap.appendChild(el('div', 'wr-foot', 'このページはトレーナーから共有されました'));

    document.body.appendChild(root);
    drawCombined();   // DOM挿入後（コンテナが実サイズを持つ）に合成グラフを描画
  }

  if (document.body) render();
  else document.addEventListener('DOMContentLoaded', render);
})();
</script>

<script>
'use strict';
/* ════════ 診断ログ & 安全ストレージ (A2/A4) ════════ */
const LOG_KEY='bodyvis_log_v1', LOG_MAX=200;
const LOG={
  load(){try{const a=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}},
  _save(a){try{localStorage.setItem(LOG_KEY,JSON.stringify(a.slice(-LOG_MAX)))}catch(e){/* ログ保存失敗は無視＝無限ループ防止 */}},
  add(level,msg,detail){const a=this.load();
    a.push({t:new Date().toISOString(),lv:level,m:String(msg==null?'':msg).slice(0,500),d:detail?String(detail).slice(0,500):''});
    this._save(a);},
  clear(){try{localStorage.removeItem(LOG_KEY)}catch(e){}},
};
function logInfo(m,d){LOG.add('info',m,d);}
function logWarn(m,d){LOG.add('warn',m,d);}
function logError(m,d){LOG.add('error',m,d);}

// 安全な保存: 5MB上限(QuotaExceeded)や書込失敗を捕捉し、通知＋記録してアプリを落とさない
function lsSet(key,value){
  try{localStorage.setItem(key,value);return true;}
  catch(e){
    const quota=e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014);
    logError('保存失敗'+(quota?'（容量上限）':''),(e&&e.name||'')+': '+(e&&e.message||''));
    try{toast(quota?'保存容量がいっぱいです。バックアップ後に不要データを整理してください':'保存に失敗しました');}catch(_){}
    return false;
  }
}
// 静かなミラー保存: IndexedDBを主保存としつつlocalStorageにも複製（退避対策）。容量超過などは通知せず黙って諦める（写真等の大きい値はIDBのみ）
function lsSetQuiet(key,value){ try{localStorage.setItem(key,value);return true;}catch(e){return false;} }

// グローバルエラー捕捉: 握りつぶさずログへ残す（デバッグ・ログ確認用）
window.addEventListener('error',function(ev){logError('JSエラー: '+(ev.message||ev.type||''),(ev.filename||'')+(ev.lineno?':'+ev.lineno:''));});
window.addEventListener('unhandledrejection',function(ev){const r=ev&&ev.reason;logError('未処理のPromise: '+((r&&r.message)||r||''),(r&&r.stack)||'');});

/* ════════ ストレージ: IndexedDB 移行（大容量・自動削除防止） ════════ */
// 大きな顧客データはIndexedDBへ保存。既存コードは同期API(load/save)前提なので、
// 起動時に一度メモリ(MEM)へ読み込み→以降は同期的にMEMを読み、保存はMEM即時＋IDBへ書き戻す(write-through)。
// IndexedDBが使えない環境（古い/プライベート等）は自動でlocalStorageへフォールバック＝従来動作。
const IDB_NAME='bodyvis_db', IDB_STORE='kv';
const MEM={};   // key -> JSON文字列（ハイドレート後の実データ）
let _idb=null;  // IDBDatabase。null＝localStorage継続
const BIG_KEYS=['bodyvis_customers_v1','bodyvis_menus_v1','bodyvis_plans_v1','bodyvis_schedule_v1','bodyvis_menu_use_v1','bodyvis_custom_cats_v1','bodyvis_drafts_v1','bodyvis_custom_ex_v1','bodyvis_training_v1','bodyvis_sessions_v1','bodyvis_photos_v1','bodyvis_notes_v1','bodyvis_ex_custom_v1'];
function dbGet(key){ return (key in MEM) ? MEM[key] : localStorage.getItem(key); }
// 二層書き込み（write-through）: MEM即時＋IndexedDB＋localStorageミラー。
// どのブラウザでも「片方のストアが退避（Brave/Safari等）されても、もう片方から復旧」できるようにする。
function dbSet(key,str){ str=String(str); MEM[key]=str;
  if(_idb){ idbPut(key,str).catch(e=>logError('IndexedDB保存失敗（'+key+'）',e&&e.message));
    lsSetQuiet(key,str);   // ミラー（容量に収まる範囲・写真等はIDBのみ）
  } else lsSet(key,str);   // IDB非対応環境はlocalStorageのみ（5MB上限あり）
  return true; }
function dbDel(key){ delete MEM[key];
  if(_idb) idbDel(key).catch(()=>{});
  try{localStorage.removeItem(key);}catch(_){}   // 両層から削除してズレを防ぐ
}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));});}
function idbAll(){return new Promise((res,rej)=>{const out={};const tx=_idb.transaction(IDB_STORE,'readonly');
  const cur=tx.objectStore(IDB_STORE).openCursor();
  cur.onsuccess=e=>{const c=e.target.result; if(c){out[c.key]=c.value;c.continue();}else res(out);}; cur.onerror=()=>rej(cur.error);});}
function idbPut(key,val){return new Promise((res,rej)=>{const tx=_idb.transaction(IDB_STORE,'readwrite');
  tx.objectStore(IDB_STORE).put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);});}
function idbDel(key){return new Promise((res,rej)=>{const tx=_idb.transaction(IDB_STORE,'readwrite');
  tx.objectStore(IDB_STORE).delete(key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);});}
// 起動時ハイドレート: IDBを開き、未移行のlocalStorageデータを一度だけIDBへ移し、MEMへ読み込む
async function hydrateStore(){
  if(!('indexedDB' in window)){ logWarn('IndexedDB非対応のためlocalStorageを継続'); return; }
  try{
    _idb=await idbOpen();
    const existing=await idbAll();
    // (1) IndexedDBにある全キーをMEMへ読み込む。BIG_KEYSに未登録のキー（予定=schedule等）も
    //     確実に復元＝「保存はされていたが起動時に読み戻されず消えて見える」不具合を根絶。
    for(const k in existing){ MEM[k]=existing[k]; }
    // (2) localStorage側にしか無いデータキーをMEMへ＋IDBへ移行（初回移行＋IDB退避からの復旧を兼ねる）。
    //     既知キー(BIG_KEYS)に加え、localStorage上の bodyvis_ 系キーも走査して取りこぼしを防ぐ。
    const lsKeys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('bodyvis_')===0)lsKeys.push(k); }
    let migrated=0;
    for(const k of new Set([...BIG_KEYS,...lsKeys])){
      if(!(k in MEM)){ const ls=localStorage.getItem(k); if(ls!=null){ MEM[k]=ls; try{await idbPut(k,ls);}catch(_){} migrated++; } }
    }
    // (3) MEMをlocalStorageへも書き戻して二層を同期＝以降どちらが退避されても片方から復旧できる状態にする。
    for(const k in MEM){ lsSetQuiet(k,MEM[k]); }
    if(migrated)logInfo('localStorage→IndexedDBへ移行/復旧', migrated+'件');
    if(navigator.storage&&navigator.storage.persist){try{const g=await navigator.storage.persist(); logInfo('永続化ストレージ要求', g?'許可':'保留');}catch(_){}}
  }catch(e){ _idb=null; logError('IndexedDB初期化失敗→localStorage継続', e&&e.message); }
}

/* ════════ data layer (index-3d.html と完全互換) ════════ */
const DB_KEY='bodyvis_customers_v1', ACT_KEY='bodyvis_m_active';
const CDB={
  load(){try{return JSON.parse(dbGet(DB_KEY)||'{}')}catch{return{}}},
  save(d){dbSet(DB_KEY,JSON.stringify(d))},
  all(){return this.load()},
  get(n){return this.load()[n]||null},
  set(c){const d=this.load();d[c.name]=c;this.save(d)},
  del(n){const d=this.load();delete d[n];this.save(d)},
  rename(o,n){const d=this.load();if(!d[o]||d[n])return false;const c=d[o];c.name=n;d[n]=c;delete d[o];this.save(d);return true},
  addRec(name,rec){const d=this.load();if(!d[name])return;
    // 同じ測定日（YYYY-MM-DD）があれば上書き、無ければ追加＝毎日/週数回など任意の頻度で記録できる
    d[name].records=[rec,...d[name].records.filter(r=>r.date!==rec.date)].sort((a,b)=>b.date.localeCompare(a.date));
    this.save(d)},
  delRec(name,date){const d=this.load();if(!d[name])return;d[name].records=d[name].records.filter(r=>r.date!==date);this.save(d)},
  setGoal(name,goal){const d=this.load();if(!d[name])return;d[name].goal=goal;this.save(d)},
};

/* 画像を長辺 max px・JPEG(品質q) に縮小して data URL を返す（容量削減） */
function compressImageFile(file,max,q){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type||'')){reject(new Error('画像ファイルではありません'));return;}
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){URL.revokeObjectURL(url);reject(new Error('画像を読み込めませんでした'));return;}
        const scale=Math.min(1,(max||1280)/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const data=cv.toDataURL('image/jpeg',q||0.82);
        URL.revokeObjectURL(url);
        resolve({data,w,h});
      }catch(err){URL.revokeObjectURL(url);reject(err);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めませんでした'));};
    img.src=url;
  });
}

/* ════════ 本日のプラン データ層（セッションボード用・クライアント別に1件） ════════ */
/* plan = {template, part, exercises:[{name,part,sets:[{w,r,done}]}], memo, updatedAt} */
const PLAN_KEY='bodyvis_plans_v1';       // 旧・本日プラン(顧客名→1件)。SCHEDへ移行する元データ
const SCHED_KEY='bodyvis_schedule_v1';   // スケジュール(予約)＝日付つきプランの配列。1人が複数日を持てる
/* スケジュール1件 = {id, client, date:'YYYY-MM-DD', template, part, exercises, memo, updatedAt} */
const SCHED={
  load(){try{const a=JSON.parse(dbGet(SCHED_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}},
  save(a){dbSet(SCHED_KEY,JSON.stringify(a))},
  all(){return this.load()},
  forDate(d){return this.load().filter(x=>x.date===d)},
  forClient(n){return this.load().filter(x=>x.client===n).sort((a,b)=>String(a.date).localeCompare(String(b.date)))},
  getFor(n,d){return this.load().find(x=>x.client===n&&x.date===d)||null},
  setTime(n,d,t){const a=this.load(); const e=a.find(x=>x.client===n&&x.date===d); if(e){e.time=t||'';e.updatedAt=Date.now();this.save(a);}},
  upsert(n,d,plan){const a=this.load(); const i=a.findIndex(x=>x.client===n&&x.date===d);
    const rec=Object.assign({},plan,{client:n,date:d,updatedAt:Date.now()});
    rec.id=(i>=0&&a[i].id)?a[i].id:('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
    if(i>=0)a[i]=rec; else a.push(rec); this.save(a); return rec;},
  delFor(n,d){this.save(this.load().filter(x=>!(x.client===n&&x.date===d)))},
  removeClient(n){this.save(this.load().filter(x=>x.client!==n))},
  renameClient(a2,b2){const a=this.load(); a.forEach(x=>{if(x.client===a2)x.client=b2;}); this.save(a);},
  dates(){return[...new Set(this.load().map(x=>x.date))].sort();},
};
/* PDB：既存コード互換の「本日のプラン」ファサード（内部はSCHEDの今日分を読む） */
const PDB={

  save(o){ if(o&&typeof o==='object'&&!Array.isArray(o)) for(const nm in o){const p=o[nm]; if(p&&typeof p==='object')SCHED.upsert(nm,p.date||todayISO(),p);} },
};

/* 中身がある下書きだけ保存（空は削除してクリーンに） */
function persistDraft(s){
  if(!s||!s.client)return;
  const has=(s.exercises&&s.exercises.length)||(s.memo&&String(s.memo).trim());
  if(has)DDB.set(s.client,s); else DDB.del(s.client);
  // 予定済みクライアントの本日セッションは、編集内容をボード(プラン=SCHED)へもミラー＝セッション画面⇔ボードで数字を同期
  if(!s.editId && s.date===todayISO()){
    const pl=SCHED.getFor(s.client,todayISO());
    if(pl){ SCHED.upsert(s.client,todayISO(),{template:s.template||'',part:s.part||'',
      exercises:(s.exercises||[]).map(e=>({name:e.name,part:e.part||partOfExercise(e.name),unit:uOf(e),
        sets:(e.sets||[]).map(x=>({w:x.w,r:x.r,done:!!x.done})),plan:e.plan||null})),
      memo:s.memo||'',time:pl.time||''}); }
  }
}

// 旧・月単位の体組成記録(date='YYYY-MM')を日付(YYYY-MM-01)へ一度だけ正規化。以後は日単位で任意頻度に記録できる
const REC_DATE_MIG_KEY='bodyvis_rec_dates_migrated_v1';
function migrateRecDatesToDay(){
  try{ if(localStorage.getItem(REC_DATE_MIG_KEY))return;
    const d=CDB.load(); let changed=false;
    for(const n in d){const recs=(d[n]&&d[n].records)||[];
      recs.forEach(r=>{ if(r&&typeof r.date==='string'&&/^\d{4}-\d{2}$/.test(r.date)){r.date=r.date+'-01';changed=true;} });}
    if(changed)CDB.save(d);
    localStorage.setItem(REC_DATE_MIG_KEY,'1');
  }catch(e){}
}
// 旧・本日プラン(bodyvis_plans_v1 の 顧客名→1件)を、日付つきスケジュール(SCHED)へ一度だけ移行
const SCHED_MIG_KEY='bodyvis_sched_migrated_v1';
function migratePlansToSchedule(){
  try{ if(localStorage.getItem(SCHED_MIG_KEY))return;
    const raw=dbGet(PLAN_KEY);
    if(raw){ const o=JSON.parse(raw);
      if(o&&typeof o==='object'&&!Array.isArray(o)){
        const cur=SCHED.load();
        for(const nm in o){ const p=o[nm]; if(!p||typeof p!=='object')continue;
          const d=p.date||todayISO();
          if(!cur.some(x=>x.client===nm&&x.date===d))
            cur.push(Object.assign({},p,{client:nm,date:d,id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}));
        }
        SCHED.save(cur);
      }
    }
    localStorage.setItem(SCHED_MIG_KEY,'1');
  }catch(e){}
}
// 予定の重複（同一クライアント＋同一日が複数）を1件に整理＝人数が二重に見える不具合の保険。最新(updatedAt大)を残す
function dedupeSchedule(){
  try{ const a=SCHED.load(); if(!a.length)return;
    a.sort((x,y)=>(x.updatedAt||0)-(y.updatedAt||0));   // 古い→新しい。後勝ちで最新を残す
    const idx={}; const out=[]; let changed=false;
    a.forEach(x=>{ if(!x||!x.client||!x.date){changed=true;return;} const k=x.client+'|'+x.date;
      if(idx[k]!=null){ out[idx[k]]=x; changed=true; } else { idx[k]=out.length; out.push(x); } });
    if(changed)SCHED.save(out);
  }catch(e){}
}

/* 生年月日(YYYY-MM-DD)→ 現在日時基準の年齢。時間が経てば自動で上がる（保存し直し不要）。 */
function ageFromDob(dob){
  if(!dob)return null; const b=new Date(dob); if(isNaN(b))return null;
  const t=new Date(); let a=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate()))a--;
  return (a>=0&&a<150)?a:null;
}
/* 表示用の年齢：生年月日があれば自動計算を優先、無ければ手入力のageにフォールバック。 */
function custAge(c){ if(!c)return null; const a=ageFromDob(c.dob); return a!=null?a:(c.age!=null?c.age:null); }

/* metric meta: dir = which direction is "good" (down/up) */
const METRICS={
  weight:{lbl:'体重',unit:'kg',dir:'down',d:1},
  bodyFatPct:{lbl:'体脂肪率',unit:'%',dir:'down',d:1},
  muscleMass:{lbl:'骨格筋率',unit:'%',dir:'up',d:1},
};
function deltaClass(key,diff){if(diff==null||Math.abs(diff)<0.05)return['flat','→'];
  const good=METRICS[key]?.dir==='down'?diff<0:diff>0;
  return [good?'up':'down',(diff>0?'▲':'▼')];}

function activeCust(){return S.active?CDB.get(S.active):null;}
function ensureActive(){const names=Object.keys(CDB.all());
  if(S.active&&CDB.get(S.active))return; S.active=names[0]||null;
  if(S.active)localStorage.setItem(ACT_KEY,S.active);else localStorage.removeItem(ACT_KEY);}

/* goal progress: baseline(first)→latest に対する目標到達率 */
function metricProgress(first,latest,goal,key){
  if(first==null||latest==null||goal==null)return null;
  const denom=goal-first; if(Math.abs(denom)<1e-6)return latest===goal?100:0;
  let p=(latest-first)/denom*100; return Math.max(0,Math.min(100,Math.round(p)));}
function overallProgress(c){
  const a=asc(c); if(!a.length||!c.goal)return null;
  const first=a[0],latest=a[a.length-1]; let sum=0,n=0;
  for(const k of ['weight','bodyFatPct','muscleMass']){
    if(c.goal[k]==null)continue;
    const p=metricProgress(first[k],latest[k],c.goal[k],k);
    if(p!=null){sum+=p;n++;}}
  return n?{pct:Math.round(sum/n),n}:null;}

    c.onclick=()=>onSelect(key); wrap.appendChild(c);

  EX_PARTS.forEach(p=>mk(p,XPART_LABEL[p]||p,XPART_EN[p]||'',partColor(p),XPART_ICON[p]||DUMBBELL_MINI));
  CATDB.all().forEach(cat=>mk(cat.name,cat.name,'カスタム',cat.color||partColor(cat.name),XPART_ICON['cat'],()=>{
    uiConfirm('カテゴリー「'+cat.name+'」を削除しますか？\n（この部位の種目自体は削除されません）',()=>{CATDB.del(cat.name); if(onCatChange)onCatChange();},{title:'カテゴリーを削除',ok:'削除する',danger:true,icon:'trash'});

}
/* 種目作成フォーム用：画像追加フィールド（任意）。draft.image に圧縮dataURLを格納。rebuild=再描画関数 */
function exImageFieldNode(draft, rebuild){
  const wrap=el('div');
  wrap.appendChild(el('div','xa-label','種目の画像（任意）'));
  const fileInput=Object.assign(document.createElement('input'),{type:'file',accept:'image/*'}); fileInput.style.display='none';
  fileInput.onchange=async ev=>{const f=ev.target.files&&ev.target.files[0]; if(!f)return;
    try{const r=await compressImageFile(f,720,0.8); draft.image=r.data; rebuild();}catch(e){toast('画像を読み込めませんでした');} fileInput.value='';};
  wrap.appendChild(fileInput);
  if(draft.image){
    const pv=el('div','ef-imgwrap'); const im=document.createElement('img'); im.src=draft.image; im.className='ef-img'; pv.appendChild(im);
    const rm=el('button','ef-imgrm'); rm.type='button'; rm.innerHTML=ic('trash')+'画像を削除'; rm.onclick=()=>{draft.image=''; rebuild();}; pv.appendChild(rm);
    wrap.appendChild(pv);
  }else{
    const add=el('button','ef-imgadd'); add.type='button';
    const ics=el('span','ef-imgic'); ics.innerHTML=ic('camera'); add.appendChild(ics);
    add.appendChild(el('span','ef-imgl','画像を追加')); add.appendChild(el('span','ef-imgs','JPG / PNG'));
    add.onclick=()=>fileInput.click(); wrap.appendChild(add);
  }
  return wrap;
}

    box.appendChild(exImageFieldNode(draft, build));
    const add=el('button','btn green'); add.innerHTML=ic('save')+'この内容で作成';
    add.onclick=()=>{

      if(!nm){toast('種目名を入力してください');return;}
      if(!draft.part){toast('部位を選択してください');return;}
      if(XDB.all().some(x=>x.name===nm)||Object.values(EXERCISE_LIB).some(a=>a.some(e=>e.name===nm))){toast('同名の種目が既にあります');return;}

// その日の予定を時間帯ごとにまとめる（同一クライアントは1回に集約・空の時間は「時間未設定」として最後）
function slotsForDate(d){
  const byTime={};
  SCHED.forDate(d).forEach(x=>{ if(!CDB.get(x.client))return; const t=x.time||'';
    if(!byTime[t])byTime[t]={time:t,clients:[]};
    if(!byTime[t].clients.includes(x.client))byTime[t].clients.push(x.client); });
  return Object.values(byTime).sort((a,b)=>{
    if(!a.time&&b.time)return 1; if(a.time&&!b.time)return -1;   // 未設定は最後
    return a.time<b.time?-1:a.time>b.time?1:0;
  }).map(s=>({time:s.time,clients:s.clients.sort((a,b)=>a.localeCompare(b,'ja'))}));
}
const slotLabel=t=>t?t:'時間未設定';
// 予定の時間帯カード（本日/今後で共用）。1カード＝1つの時間帯＝そのままセッションボード
function buildSlotCard(date,slot,opts){
  opts=opts||{}; const clients=slot.clients;
  const card=el('div','sched-day'); card.style.cssText='background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:.7rem .8rem;margin-bottom:.6rem';
  const h=el('div'); h.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.4rem';
  const ht=el('div','sd-slot'); ht.style.cssText='font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  ht.textContent=(opts.showDate?jpDate(date)+'　':'')+slotLabel(slot.time);
  h.appendChild(ht); h.appendChild(el('div','sd-cnt',clients.length+'名')); card.appendChild(h);
  clients.forEach(n=>{
    const p=SCHED.getFor(n,date);
    const row=el('div','hs-row');
    const left=el('div'); left.style.cssText='flex:1;min-width:0;cursor:pointer';
    left.appendChild(el('div','hs-name',n));
    const subTxt=p&&p.template?p.template:(p?planPartLabel(p):'');
    if(subTxt)left.appendChild(el('div','hs-sub',subTxt));
    left.onclick=()=>{ selectCust(n); setTab('menu'); };
    row.appendChild(left);
    // 時間帯チップ（タップで設定/変更＝既存の予定も時間で分割できる）
    const tb=el('button','hs-time'+(slot.time?' set':'')); tb.type='button'; tb.setAttribute('aria-label','時間帯を設定');
    tb.textContent=slot.time?slot.time:'時間';
    tb.onclick=(ev)=>{ if(ev){ev.stopPropagation();ev.preventDefault();} openSetSlotTime(n,date); };
    row.appendChild(tb);
    const del=el('button','hs-del'); del.type='button'; del.setAttribute('aria-label','予定を削除'); del.innerHTML=ic('trash');
    del.onclick=(ev)=>{ if(ev){ev.stopPropagation();ev.preventDefault();}
      uiConfirm('「'+n+'」の'+jpDate(date)+(slot.time?' '+slot.time:'')+'の予定を削除します。',()=>{ SCHED.delFor(n,date); logWarn('予定を削除',n+' / '+date+' '+slot.time); toast(n+' の予定を削除しました'); renderHub(); },{title:'予定を削除',ok:'削除する',danger:true,icon:'trash'}); };
    row.appendChild(del); card.appendChild(row);
  });
  const openB=el('button','btn'); openB.style.marginTop='.5rem';
  openB.innerHTML=ic('play')+(slot.time?('この時間（'+slot.time+'）のボードを開く'):'このセッションのボードを開く');
  openB.onclick=()=>{ S.boardSel=clients.slice(); openBoard(date,slot.time); };
  card.appendChild(openB);
  return card;
}

  const today=todayISO();

    window._hubDateWatch=setInterval(()=>{
      if(window._hubDay && todayISO()!==window._hubDay){

/* ── 推移ピッカー（指標を選択 ＋ 部位別の指標 ＋ 期間）＝サマリー/体組成タブ共通 ──
   part='all' は全身指標(体重/体脂肪率/骨格筋率/BMI)、部位(体幹/腕/脚)は骨格筋率/皮下脂肪率の2指標。
   部位カードは計測(入力)がある部位だけ表示。keys={part,metric,range}=S のキー名。返り値 {part,metric,def}。 */
const PART_CARDS=[
  {part:'all',  lbl:'全身',sub:'全体の数値',        icon:'body' },
  {part:'trunk',lbl:'体幹',sub:'骨格筋率・皮下脂肪率',icon:'torso',keys:['trunkM','trunkF']},
  {part:'arm',  lbl:'腕',  sub:'骨格筋率・皮下脂肪率',icon:'arm',  keys:['armM','armF']},
  {part:'leg',  lbl:'脚',  sub:'骨格筋率・皮下脂肪率',icon:'leg',  keys:['legM','legF']},
];
const METRIC_ICON={weight:'scale',bodyFatPct:'percent',muscleMass:'muscle',bmi:'bmi'};
function partMetricDefs(part){
  if(part==='all')return BODY_DEFS;
  const map={trunk:['trunkM','trunkF'],arm:['armM','armF'],leg:['legM','legF']};
  return (map[part]||[]).map(k=>{const d=PART_DEFS.find(x=>x.key===k);
    return Object.assign({},d,{lbl:k.slice(-1)==='M'?'骨格筋率':'皮下脂肪率'});});
}
/* 部位を選んだときの既定指標。部位は「まとめて」（骨格筋率＋皮下脂肪率を1グラフに2本）を既定にする */
function defaultMetricFor(part){return part==='all'?partMetricDefs('all')[0].key:'both';}
function trendPicker(v,a,keys,rerender){
  const availParts=PART_CARDS.filter(p=>p.part==='all'||(p.keys&&p.keys.some(k=>a.some(r=>r&&r[k]!=null))));
  let part=S[keys.part]||'all';
  if(!availParts.find(p=>p.part===part)){part='all';S[keys.part]='all';}
  const realDefs=partMetricDefs(part);       // 全身=4指標 / 部位=骨格筋率・皮下脂肪率の2指標
  const isPart=part!=='all';
  // 指標ボタン：部位は先頭に「まとめて」（2本重ね）を追加
  const opts=isPart
    ? [{key:'both',lbl:'まとめて',icon:'chart'}].concat(realDefs.map(d=>({key:d.key,lbl:d.lbl,icon:d.key.slice(-1)==='M'?'muscle':'percent'})))
    : realDefs.map(d=>({key:d.key,lbl:d.lbl,icon:METRIC_ICON[d.key]||'chart'}));
  let metric=S[keys.metric];
  if(!opts.find(o=>o.key===metric)){metric=defaultMetricFor(part);S[keys.metric]=metric;}

  // 指標を選択
  v.appendChild(sec('指標を選択'));
  v.appendChild(el('div','pick-sub',part==='all'?'よく使う':PART_CARDS.find(p=>p.part===part).lbl+'の指標'));
  const mg=el('div','mgrid'); mg.style.setProperty('--n',opts.length);
  opts.forEach(o=>{const b=el('button','mbtn'+(metric===o.key?' on':''));
    b.innerHTML=ic(o.icon)+'<span>'+o.lbl+'</span>';
    b.onclick=()=>{S[keys.metric]=o.key;rerender();}; mg.appendChild(b);});
  v.appendChild(mg);

  // 部位別の指標（計測がある部位のみ）
  if(availParts.length>1){
    v.appendChild(sec('部位別の指標'));
    const pg=el('div','pgrid');
    availParts.forEach(p=>{const b=el('button','pcard'+(part===p.part?' on':''));
      b.innerHTML=ic(p.icon)+'<span class="pl">'+p.lbl+'</span><span class="ps">'+p.sub+'</span>';
      b.onclick=()=>{S[keys.part]=p.part;S[keys.metric]=defaultMetricFor(p.part);rerender();};
      pg.appendChild(b);});
    v.appendChild(pg);
  }

  // 期間
  v.appendChild(sec('期間'));
  v.appendChild(periodChips(S[keys.range],k=>{S[keys.range]=k;rerender();}));

  // 描画する系列とタイトルを算出（まとめて＝2本、単一＝1本）
  const partLbl=isPart?PART_CARDS.find(p=>p.part===part).lbl+' ':'';
  let plotDefs,title;
  if(metric==='both'){plotDefs=realDefs;title=partLbl+'骨格筋率・皮下脂肪率の推移';}
  else{const d=realDefs.find(x=>x.key===metric)||realDefs[0];plotDefs=[d];title=partLbl+d.lbl+'の推移';}
  return {part,metric,isPart,plotDefs,title};
}

function saveRec(){
  const c=activeCust(); if(!c)return;
  const date=$('af_date').value||todayISO();
  const g=id=>{const e=$(id);return e&&e.value!==''?+e.value:null;};
  const weight=g('af_weight'), bf=g('af_bodyFatPct');
  let muscle=g('af_muscle');
  if(weight==null||bf==null||muscle==null){toast('体重・体脂肪率・骨格筋は必須です');return;}
  if(muscleUnit==='kg'&&weight)muscle=+(muscle/weight*100).toFixed(1); // kg→%
  const rec={date,weight,bodyFatPct:bf,muscleMass:muscle};
  const opt={height:'af_height',visceralFat:'af_visceralFat',subcutFat:'af_subcutFat',bmr:'af_bmr',bmi:'af_bmi',bodyAge:'af_bodyAge',
    armM:'af_armM',armF:'af_armF',trunkM:'af_trunkM',trunkF:'af_trunkF',legM:'af_legM',legF:'af_legF'};
  for(const k in opt){const val=g(opt[k]);if(val!=null)rec[k]=val;}
  const note=$('af_note')?.value?.trim(); if(note)rec.note=note;
  if(rec.bmi==null&&rec.height&&weight)rec.bmi=+(weight/Math.pow(rec.height/100,2)).toFixed(1);

}

function rangeFilter(a,range){
  if(range==='all'||!a.length)return a;
  const months={'1m':1,'3m':3,'6m':6,'1y':12}[range]; if(!months)return a;
  const last=new Date(a[a.length-1].date); const cut=new Date(last.getFullYear(),last.getMonth()-months+1,1);

}

/* 前回サマリー（最新の過去セッション：最重量セット＋セット数） */
function prevSummary(client,name){
  for(const s of SDB.forClient(client)){
    const e=(s.exercises||[]).find(x=>x.name===name);
    if(e&&e.sets&&e.sets.length){let best=null;e.sets.forEach(st=>{const w=+st.w;if(!isNaN(w)&&(best==null||w>+best.w))best=st;});
      if(!best)e.sets.forEach(st=>{const r=+st.r;if(!isNaN(r)&&(best==null||r>+best.r))best=st;}); // 重量なし種目は回/秒/分の最大セット
      return{date:s.date,w:best?best.w:null,r:best?best.r:null,sets:e.sets.length};}
  }
  return null;
}
/* 推定1RM（Epley式）＝重量×(1+回数/30) */
function est1RM(w,r){w=+w;r=+r;if(isNaN(w)||w<=0)return null;if(isNaN(r)||r<=1)return Math.round(w);return Math.round(w*(1+r/30));}
/* 種目の推定1RM推移（過去セッションの最高1RM・昇順） */
function exerciseRMHistory(client,name){
  const out=[];
  SDB.forClient(client).slice().reverse().forEach(s=>{
    const e=(s.exercises||[]).find(x=>x.name===name);
    if(e&&e.sets){let best=null;e.sets.forEach(st=>{const rm=est1RM(st.w,st.r);if(rm!=null&&(best==null||rm>best))best=rm;});
      if(best!=null)out.push({date:s.date,rm:best});}
  });
  return out;
}
/* このクライアントがセッションで行った種目の一覧（頻度順） */
function loggedExercises(client){
  const cnt={};
  SDB.forClient(client).forEach(s=>(s.exercises||[]).forEach(e=>{cnt[e.name]=(cnt[e.name]||0)+1;}));
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
}

/* Bodyverse Score（0-100）：体組成バランス＋目標達成度 */
function bodyverseScore(c){
  const r=sorted(c)[0]; if(!r)return null;
  const clamp=v=>Math.max(0,Math.min(100,v));
  let sc=null;
  if(r.muscleMass!=null&&r.bodyFatPct!=null){
    const muscle=clamp((r.muscleMass-25)/(45-25)*100), fat=clamp((30-r.bodyFatPct)/(30-10)*100);
    sc=(muscle+fat)/2;
  }
  const op=overallProgress(c);
  if(op) sc = sc!=null ? sc*0.6+op.pct*0.4 : op.pct;
  return sc!=null?Math.round(sc):null;
}

      if(!best)e.sets.forEach(st=>{const r=+st.r; if(!isNaN(r)&&(best==null||r>+best.r))best=st;}); // 重量なし種目は回/秒/分の最大セット
      if(best)return{date:s.date,w:best.w,r:best.r};}

}

const CARDIO_MET={'トレッドミル(ランニング)':8.0,'ウォーキング':3.5,'エアロバイク':7.0,'クロストレーナー':5.0,'ローイングマシン':7.0,'ステアクライマー':8.0,'縄跳び':11.0,'水泳':8.0,'HIIT':8.0};

function isCardio(e){return (e&&(e.part||partOfExercise(e.name)))==='有酸素';}
function minutesOf(unit,r){const v=+r; if(isNaN(v))return null; return unit==='秒'?v/60:(unit==='分'?v:null);}

function exKcalTotal(e,bodyKg){ if(!isCardio(e)||!bodyKg)return null; let kc=0,has=false;

    const add=el('button','note-tag note-add','＋'); add.type='button';
    add.onclick=()=>{ const inp=el('input','inp'); inp.placeholder='タグ名'; inp.style.cssText='width:7.5rem;padding:.25rem .5rem;font-size:.82rem';

/* インラインの細いスパークライン（SVG） */
function sparkSVG(vals,color){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg'); svg.setAttribute('class','spark'); svg.setAttribute('viewBox','0 0 100 30'); svg.setAttribute('preserveAspectRatio','none');
  const pts=(vals||[]).filter(v=>v!=null); if(pts.length<2)return svg;
  const mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),rng=(mx-mn)||1,step=100/(pts.length-1);
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)} ${(28-(v-mn)/rng*24-2).toFixed(1)}`).join(' ');
  const path=document.createElementNS(ns,'path'); path.setAttribute('d',d); path.setAttribute('fill','none');
  path.setAttribute('stroke',color); path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round'); path.setAttribute('vector-effect','non-scaling-stroke');
  svg.appendChild(path); return svg;
}

/* カレンダーに載せる4種別（セッション・体組成・写真・メモ）の色定義。dayTypesFor で日別に集計 */
const CAL_KINDS=[
  {key:'session',lbl:'セッション',col:'#2f7de0'},
  {key:'reserve',lbl:'予約',      col:'#e0567a'},
  {key:'body',   lbl:'体組成',    col:'#17a34a'},
  {key:'photo',  lbl:'写真',      col:'#f0812f'},
  {key:'note',   lbl:'メモ',      col:'#7c5cff'},
];
function buildCalendar(c,all){
  const wrap=el('div','s-cal');
  const head=el('div','s-cal-head');
  const prev=el('button','s-cal-nav','‹'); prev.onclick=()=>{S.calMonth=shiftMonth(S.calMonth,-1);renderMenu();};
  const next=el('button','s-cal-nav','›'); next.onclick=()=>{S.calMonth=shiftMonth(S.calMonth,1);renderMenu();};
  const y=+S.calMonth.split('-')[0], m=+S.calMonth.split('-')[1];
  head.appendChild(prev); head.appendChild(el('div','s-cal-title',`${y}年${m}月`)); head.appendChild(next); wrap.appendChild(head);
  const grid=el('div','s-cal-grid');
  ['日','月','火','水','木','金','土'].forEach(w=>grid.appendChild(el('div','s-cal-w',w)));
  const startDow=new Date(y,m-1,1).getDay(), daysIn=new Date(y,m,0).getDate();
  // 日別に「その日に存在する記録種別」の集合を作る（当月分のみ）
  const inMonth=s=>String(s).slice(0,7)===S.calMonth, dayNo=s=>+String(s).slice(8,10);
  const setS=new Set(all.filter(s=>inMonth(s.date)).map(s=>dayNo(s.date)));                        // セッション
  const setR=new Set(SCHED.forClient(c.name).filter(x=>inMonth(x.date)).map(x=>dayNo(x.date)));    // 予約
  const setB=new Set((c.records||[]).filter(r=>inMonth(r.date)).map(r=>dayNo(r.date)));            // 体組成
  const setP=new Set(PHDB.forClient(c.name).filter(p=>inMonth(p.date)).map(p=>dayNo(p.date)));     // 写真
  const setN=new Set(NDB.forClient(c.name).filter(n=>inMonth(n.date)).map(n=>dayNo(n.date)));      // メモ
  const dayKinds=d=>CAL_KINDS.filter(k=>({session:setS,reserve:setR,body:setB,photo:setP,note:setN}[k.key]).has(d));
  const todayStr=new Date().toISOString().slice(0,10);
  for(let i=0;i<startDow;i++)grid.appendChild(el('div','s-cal-day other','.'));
  for(let d=1;d<=daysIn;d++){
    const ds=`${S.calMonth}-${String(d).padStart(2,'0')}`;
    const cell=el('div','s-cal-day',String(d));
    if(ds===todayStr)cell.classList.add('today');
    if(S.calDay===ds)cell.classList.add('sel');
    const kinds=dayKinds(d);
    if(kinds.length){cell.classList.add('has');
      const dots=el('div','s-cal-dots');
      kinds.forEach(k=>{const dot=el('span','s-cal-dot'); dot.style.background=k.col; dots.appendChild(dot);});
      cell.appendChild(dots);
    }
    cell.onclick=()=>{S.calDay=(S.calDay===ds?null:ds);renderMenu();}; // 日付を選択（再タップで解除）
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  // 凡例（画像①）
  const leg=el('div','s-cal-legend');
  CAL_KINDS.forEach(k=>{const it=el('span','s-cal-leg'); const dot=el('span','s-cal-dot'); dot.style.background=k.col; it.appendChild(dot); it.appendChild(document.createTextNode(k.lbl)); leg.appendChild(it);});
  wrap.appendChild(leg);
  return wrap;
}
function totalSets(s){let n=0;(s.exercises||[]).forEach(e=>n+=(e.sets||[]).length);return n;}
function exSummary(e){const sets=e.sets||[];if(!sets.length)return'—';
  let bw=null,br=null;
  sets.forEach(st=>{const w=+st.w,r=+st.r; if(!isNaN(w)&&(bw==null||w>bw))bw=w; if(!isNaN(r)&&(br==null||r>br))br=r;});
  let s=setLine(bw,br,uOf(e),sets.length);
  const kc=exKcalTotal(e,clientWeight()); if(kc!=null)s+=` ・ 約${kc}kcal`;   // 有酸素は消費カロリー目安を付記
  return s;}

function duplicateSessionToToday(s){
  const c=activeCust(); if(!c)return;
  if(!SESS||SESS.client!==c.name)initSession(c);
  const proceed=()=>{
    SESS.editId=null; SESS.template=s.template||''; SESS.part=s.part||''; SESS.date=new Date().toISOString().slice(0,10);
    SESS.exercises=(s.exercises||[]).map(e=>{
      const src=(e.sets||[]);
      // 前回完了した（✓が付いて記録された）セット数ぶんを前回の重量・回数で復元＝そのセット数から再開。記録が無ければ前回ベストで1セット
      const sets=src.length?src.map(st=>({w:st.w!=null?String(st.w):'',r:st.r!=null?String(st.r):'',done:false})):[setFromPrev(c.name,e.name)];
      return {name:e.name,part:e.part||partOfExercise(e.name),unit:e.unit||defaultUnitFor(e.name),sets};
    });
    S.sessView='today'; closeSheet(); toast('メニューを読み込みました'); renderMenu();
  };
  const hasData=(SESS.exercises||[]).some(e=>(e.sets||[]).some(x=>String(x.w).trim()!==''||String(x.r).trim()!==''));
  if(hasData){ uiConfirm('今日の入力内容を破棄してこのメニューを読み込みますか？',proceed,{title:'メニューを読み込み',ok:'読み込む'}); return; }
  proceed();
}

/* セッションの内容を日時指定で予約＝SCHEDに登録。カレンダーに表示され、当日「本日の予定」に出る */
function openSessionReserve(c){
  const s=SESS; if(!s){toast('セッションがありません');return;}
  const box=el('div');
  box.appendChild(Object.assign(el('h3'),{textContent:'セッションを予約'}));
  box.appendChild(el('div','mform-hint','予約日と時間を設定すると、カレンダーに表示され、当日になると「本日の予定」に並びます。'));
  const exist=SCHED.forClient(c.name).find(x=>x.date>=todayISO());   // 既存の直近予約があれば初期値に
  let d=(exist&&exist.date)||todayISO(), t=(exist&&exist.time)||'';
  const dInp=inputEl('date','sr_date',d); dInp.max='2100-12-31'; dInp.min=todayISO(); dInp.onchange=e=>{d=e.target.value||todayISO();};
  box.appendChild(field('予約日', dInp));
  const tInp=inputEl('time','sr_time',t); tInp.step='900'; tInp.onchange=e=>{t=e.target.value||'';};   // 15分刻み
  box.appendChild(field('時間（任意）', tInp));
  const save=el('button','btn green'); save.innerHTML=ic('calendar')+'この日時で予約する';
  save.onclick=()=>{
    if(!d){toast('予約日を選んでください');return;}
    // 現在のメニュー/種目を予約プランとして保存（done は落とす＝これから実施する予定）
    const exercises=(s.exercises||[]).map(e=>({name:e.name,part:e.part||partOfExercise(e.name),unit:uOf(e),
      sets:(e.sets||[]).map(x=>({w:x.w,r:x.r,done:false})),plan:e.plan||null}));
    SCHED.upsert(c.name,d,{template:s.template||'',part:s.part||'',exercises,memo:'',time:t||''});
    logInfo('セッションを予約',c.name+' / '+d+(t?' '+t:''));
    closeSheet();
    toast(c.name+' を'+(d===todayISO()?'本日':jpDate(d))+(t?' '+t:'')+'に予約しました');
    if(S.tab==='hub')renderHub();
  };
  box.appendChild(save);
  box.appendChild(optRow('キャンセル',closeSheet));
  openSheetNode(box);
}

/* 部位ラベル→淡色バッジ（文字列ハッシュで色を振り分け） */
const PART_BADGE_PAL=[['#dbe7ff','#2f6fe0'],['#d9f3e4','#17a34a'],['#e7ddff','#7c5cff'],['#ffe0e6','#e0486b'],['#fff2cf','#c98a00'],['#d7f0f7','#1899b8']];
function partBadge(label){let h=0;const s=String(label);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;const p=PART_BADGE_PAL[h%PART_BADGE_PAL.length];return{bg:p[0],fg:p[1]};}

/* 日付を「M/D（曜）」に */
function jpShort(d){const t=new Date(d); if(isNaN(t))return String(d); const w=['日','月','火','水','木','金','土'][t.getDay()]; return `${t.getMonth()+1}/${t.getDate()}（${w}）`;}
/* 何日前かのバッジ文言 */
function agoLabel(date,isPrev){ if(isPrev)return '前回';
  const d=Math.floor((Date.now()-new Date(date).getTime())/86400000);
  if(d<=0)return '今日'; if(d<7)return d+'日前'; if(d<30)return Math.floor(d/7)+'週間前'; return Math.floor(d/30)+'ヶ月前'; }
/* メニューを選択（画像右：タブ＋選択→下部ボタンで開始） */
/* ══ メニュー選択：検索・カテゴリ・絞り込み・並び替えで多件数でも探しやすく ══ */
let pickState={type:'all',part:'all',purpose:'all',q:'',sort:'used'};   // シート横断で保持（モーダル往復で消えない）
const MENU_SORTS=[
  ['used','よく使う順','最終使用が新しい順'],
  ['new','新しい順','作成日が新しい順'],
  ['old','古い順','作成日が古い順'],
  ['name_asc','メニュー名昇順','あいうえお順（昇順）'],
  ['name_desc','メニュー名降順','あいうえお順（降順）'],
];
function menuUsedMs(m){return MENU_USE.get(m.id);}
function fmtYmdMs(ms){if(!ms)return null;const d=new Date(ms);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate());}
function menuTypeBadgeNode(m){const b=el('span','mtype '+(m.client?'own':'shared')); b.textContent=m.client?'専用':'全顧客'; return b;}
function menuSubText(m){return [m.purpose||'',m.part||''].filter(Boolean).join('・')||((m.exercises||[]).length+'種目');}
function menuMetaText(m,sortKey){ if(sortKey==='new'||sortKey==='old')return m.createdAt?('作成：'+String(m.createdAt).replace(/-/g,'/')):null;
  const u=fmtYmdMs(menuUsedMs(m)); return u?('最終使用：'+u):'未使用'; }
function sortMenus(arr,key){const a=arr.slice();
  const cr=m=>String(m.createdAt||''),use=m=>menuUsedMs(m),nm=m=>String(m.name||'');
  if(key==='new')a.sort((x,y)=>cr(y).localeCompare(cr(x))||use(y)-use(x));
  else if(key==='old')a.sort((x,y)=>cr(x).localeCompare(cr(y))||use(x)-use(y));
  else if(key==='name_asc')a.sort((x,y)=>nm(x).localeCompare(nm(y),'ja'));
  else if(key==='name_desc')a.sort((x,y)=>nm(y).localeCompare(nm(x),'ja'));
  else a.sort((x,y)=>use(y)-use(x)||cr(y).localeCompare(cr(x)));   // used＝よく使う順（最終使用が新しい順）
  return a;}
function pickPassFilter(m){
  if(pickState.type==='own'&&!m.client)return false;
  if(pickState.type==='shared'&&m.client)return false;
  if(pickState.part!=='all'&&(m.part||'')!==pickState.part)return false;
  if(pickState.purpose!=='all'&&(m.purpose||'')!==pickState.purpose)return false;
  if(pickState.q){const q=pickState.q.toLowerCase(); if(!(((m.name||'')+' '+(m.purpose||'')+' '+(m.part||'')).toLowerCase().includes(q)))return false;}
  return true;
}
function pickFilterActive(){return !!pickState.q||pickState.type!=='all'||pickState.part!=='all'||pickState.purpose!=='all';}   // 並び替え(sort)は畳まず「すべて」内に反映

    // カテゴリチップ（件数付き）：すべて／専用／全顧客／実在する部位

    const activeChipKey=()=>{
      if(pickState.purpose!=='all')return null;
      if(pickState.type==='all'&&pickState.part==='all')return 'all';
      if(pickState.type==='own'&&pickState.part==='all')return 'own';
      if(pickState.type==='shared'&&pickState.part==='all')return 'shared';

const PRESET_SEED_KEY='bodyvis_presets_seeded_v1';
function seedPresetMenus(){
  if(localStorage.getItem(PRESET_SEED_KEY))return;
  const cur=MDB.all(); const today=new Date().toISOString().slice(0,10); const add=[];
  SESSION_TEMPLATES.forEach((t,i)=>{
    if(cur.some(m=>m.name===t.name))return;   // 同名メニューが既にあれば重複させない
    add.push({id:'preset_'+i+'_'+Date.now().toString(36),name:t.name,purpose:PURPOSES[0],level:LEVELS[1],part:t.part,
      exercises:(t.ex||[]).map(n=>({name:n,sets:3,reps:null,rest:60,unit:defaultUnitFor(n)})),createdAt:today});
  });
  if(add.length)MDB.save(cur.concat(add));    // ユーザーの既存メニューを優先し、プリセットは末尾に追加
  localStorage.setItem(PRESET_SEED_KEY,'1');

function applyTemplate(t,exNames,part){
  const hasData=(SESS.exercises||[]).some(e=>(e.sets||[]).some(s=>String(s.w).trim()!==''||String(s.r).trim()!==''));
  if(hasData){ uiConfirm('現在の入力内容を破棄してテンプレートを読み込みますか？',()=>applyTemplate_do(t,exNames,part),{title:'テンプレート読み込み',ok:'読み込む'}); return; }
  applyTemplate_do(t,exNames,part);

function applyTemplate_do(t,exNames,part){
  if(t&&t.id)MENU_USE.touch(t.id);   // 「よく使う順／最近使用」用に最終使用日時を記録
  SESS.editId=null; SESS.template=t.name; SESS.part=part||'';
  SESS.exercises=(exNames||[]).filter(Boolean).map(n=>{
    const ex=exFromName(SESS.client,n);
    const src=((t&&t.exercises)||[]).find(e=>e.name===n);   // 保存メニューの単位・目標(セット/回/休憩)を引き継ぐ
    if(src){
      if(src.unit)ex.unit=src.unit;
      ex.plan={sets:src.sets??null, reps:src.reps??null, rest:src.rest??null};   // 手順表示用の目標
      const nSets=(src.sets!=null&&+src.sets>0)?Math.min(+src.sets,12):1;
      const base=ex.sets[0]||{w:'',r:'',done:false};
      ex.sets=Array.from({length:nSets},()=>({w:base.w,r:'',done:false}));      // 目標セット数ぶんの記入欄を用意
    }

let _dragFrom=null;
function attachDrag(handle,row,index,listEl){
  handle.addEventListener('pointerdown',ev=>{
    ev.preventDefault(); _dragFrom=index; row.classList.add('dragging');
    try{handle.setPointerCapture(ev.pointerId);}catch(e){}
    const move=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);const over=t&&t.closest('.s-card');
      listEl.querySelectorAll('.s-card').forEach(x=>x.classList.remove('dragover'));
      if(over&&over!==row)over.classList.add('dragover');};
    const up=e=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);
      const t=document.elementFromPoint(e.clientX,e.clientY);const over=t&&t.closest('.s-card');
      row.classList.remove('dragging');
      const to=over?+over.dataset.exi:_dragFrom;
      if(to!=null&&!isNaN(to)&&to!==_dragFrom){const it=SESS.exercises.splice(_dragFrom,1)[0];SESS.exercises.splice(to,0,it);}
      _dragFrom=null; renderMenu();};
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up);
  });
}

// 今のセッションの種目を、そのクライアントの本日のボード（予定）に登録する
// ＝入力済みのセット（重量・回数・完了）をそのまま反映（setPlanFromNamesだと前回実績で作り直されて消えるため直接upsert）
function addSessionToBoard(c){
  if(!c){toast('クライアント未選択');return;}
  const exs=(SESS&&SESS.exercises)||[];
  const names=exs.map(e=>e&&e.name).filter(Boolean);
  if(!names.length){toast('種目がありません。先に種目を追加してください');return;}
  const d=todayISO(); const cur=SCHED.getFor(c.name,d);
  SCHED.upsert(c.name,d,{template:SESS.template||'',part:SESS.part||sessionPartLabel(),
    exercises:exs.map(e=>({name:e.name,part:e.part||partOfExercise(e.name),unit:uOf(e),
      sets:(e.sets||[]).map(x=>({w:x.w,r:x.r,done:!!x.done})),plan:e.plan||null})),
    memo:SESS.memo||'',time:cur?cur.time||'':''});
  logInfo('セッションをボードに追加', c.name+'（'+names.length+'種目）');
  toast(c.name+' の本日のボードに追加しました');
  if(S.tab==='hub')renderHub();
}
// 今のセッションの種目・セット構成を、メニュー保存用の exercises 配列に変換する
// exist（上書き対象メニュー）があれば同名種目の休憩(rest)を引き継ぐ
function menuExercisesFromSession(exist){
  return (SESS.exercises||[]).map(e=>{
    const sets=(e.sets||[]).length||3;
    const firstR=(e.sets||[]).map(s=>s.r).find(r=>r!=null&&String(r).trim()!=='');
    const prev=exist?(exist.exercises||[]).find(x=>x.name===e.name):null;
    return {name:e.name, sets, reps:firstR!=null?String(firstR):null, rest:(prev&&prev.rest!=null)?prev.rest:60, unit:uOf(e)};
  });
}

function completeSession(){
  const c=activeCust(); if(!c){toast('クライアント未選択');return;}
  if(!SESS.exercises.length){toast('種目がありません');return;}
  const exercises=SESS.exercises
    .filter(e=>(e.sets||[]).some(s=>!!s.done))   // ✓が付いた＝実施した種目だけ記録（チェックが入らず未実施の種目は除外）
    .map(e=>({name:e.name,part:e.part,unit:uOf(e),
      sets:(e.sets||[]).filter(s=>String(s.w).trim()!==''||String(s.r).trim()!=='').map(s=>({
        w:(String(s.w).trim()!==''&&!isNaN(+s.w))?+s.w:null, r:(String(s.r).trim()!==''&&!isNaN(+s.r))?+s.r:null}))
    })).filter(e=>e.sets.length);
  if(!exercises.length){toast('実施した種目のセットに✓を付けてください');return;}
  const entry={id:SESS.editId||('s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
    date:SESS.date, template:SESS.template||'', part:SESS.part||sessionPartLabel(), exercises, memo:(SESS.memo||'').trim()};
  const wasNew=!SESS.editId, cname=c.name, cdate=SESS.date;   // 完了後メモ入力の判定用に控える
  if(SESS.editId){ SDB.update(c.name,entry); toast('セッションを更新しました'); }
  else{ SDB.add(c.name,entry); toast('セッションを保存しました'); }
  PDB.del(c.name);   // 本日のプランは完了したので消化（ボードでは✓完了表示に）
  DDB.del(c.name);   // 下書きも完了したのでクリア
  SESS=null; renderMenu();
  if(wasNew)openPostSessionNote(cname,cdate);   // 新規完了時のみ、任意のメモ・日誌入力を促す（画像④）
}

function buildMenuForm(box){

    const nInp=inputEl('text','mf_name',menuDraft.name); nInp.placeholder='例 上半身プッシュトレーニング'; nInp.oninput=e=>menuDraft.name=e.target.value;
    box.appendChild(field('メニュー名', nInp));

    box.appendChild(chipPicker('レベル',LEVELS,menuDraft.level,val=>{menuDraft.level=val;buildMenuForm(box);}));
    box.appendChild(chipPicker('部位',PARTS,menuDraft.part,val=>{menuDraft.part=val;buildMenuForm(box);}));
  }
  else if(step===1){   // ── 種目を追加：部位を選び、縦型リストからタップで追加/解除 ──
    box.appendChild(chipPicker('部位を選ぶ',allParts(),menuDraft.libPart,val=>{menuDraft.libPart=val;buildMenuForm(box);},p=>XPART_LABEL[p]||p));
    const libItems=[...(EXERCISE_LIB[menuDraft.libPart]||[])];
    XDB.all().forEach(x=>{ if((x.part||'')===menuDraft.libPart && !libItems.some(e=>e.name===x.name))
      libItems.push({name:x.name, reps:x.unit==='分'?'20分':x.unit==='秒'?'30秒':'10'}); });
    box.appendChild(el('div','mform-hint','タップで追加、もう一度タップで解除できます'));
    const list=el('div','ex-picklist');
    if(!libItems.length)list.appendChild(Object.assign(el('div','mform-hint'),{textContent:'この部位の種目はありません'}));
    libItems.forEach(ex=>{
      const added=(menuDraft.exercises||[]).some(e=>(e.name||'').trim()===ex.name);
      const row=el('button','ex-pickrow'+(added?' added':''));
      row.appendChild(el('span','epn',ex.name));
      const a=el('span','epa'); a.innerHTML=added?ic('check'):ic('plus'); row.appendChild(a);
      row.onclick=()=>{
        if(added){menuDraft.exercises=menuDraft.exercises.filter(e=>(e.name||'').trim()!==ex.name);}
        else{menuDraft.exercises=(menuDraft.exercises||[]).filter(e=>(e.name||'').trim());
          menuDraft.exercises.push({name:ex.name,sets:'3',reps:ex.reps||'10',rest:'60'});}
        buildMenuForm(box);
      };
      list.appendChild(row);
    });
    box.appendChild(list);
  }

  const save=el('button','btn green'); save.innerHTML=ic('save')+'保存する'; save.style.marginTop='.9rem'; save.onclick=saveMenu; box.appendChild(save);
  if(menuDraft.editing){   // 編集中は削除も可能に

    delBtn.style.cssText='margin-top:.5rem;color:var(--red);border-color:var(--red)';
    delBtn.onclick=()=>delMenu(menuDraft.id); box.appendChild(delBtn);
  }
}
function saveMenu(){

/* プランの部位ラベル：template由来の部位があれば優先、なければ種目から導出 */
function planPartLabel(p){
  if(p&&p.part)return p.part;
  const set=[]; (p&&p.exercises||[]).forEach(e=>{const pt=e.part||partOfExercise(e.name); if(pt&&!set.includes(pt))set.push(pt);});
  return set.join('・');
}

// 自前の確認モーダル（standalone PWAでは window.confirm が無効なため必須）。OKでonOkを実行。
function uiConfirm(message,onOk,opts){
  opts=opts||{};

// ── アプリ更新通知 ─────────────────────────────
// 新しいSW（＝新バージョン）が待機状態になったら、変更点つきの案内を出す。
// 「更新する」で待機SWを起動→controllerchangeで自動リロード。
let _swReloading=false;
function showUpdateBanner(worker){
  if(!worker)return;
  if($('updOv')||$('lockOv')||$('obOv'))return;   // 施錠中/オンボ中/二重表示は避ける（次回起動時に再提示）
  let done=false;
  // 新SWに「今回の変更点」を問い合わせ、応答が来たら（or 1.2秒で見切り発車で）描画
  try{
    const ch=new MessageChannel();
    ch.port1.onmessage=e=>render(e.data);
    worker.postMessage({type:'GET_VERSION_INFO'},[ch.port2]);
  }catch(_){}
  setTimeout(()=>render(null),1200);
  function render(info){
    if(done)return; done=true;
    if($('updOv')||$('lockOv')||$('obOv'))return;
    const ov=el('div','ob-ov'); ov.id='updOv';
    const card=el('div','ob-card');
    const icd=el('div','ob-ic'); icd.innerHTML=ic('refresh'); icd.style.color='var(--blue)'; card.appendChild(icd);
    card.appendChild(el('div','ob-title','アップデートがあります'));
    const notes=(info&&Array.isArray(info.notes))?info.notes.filter(n=>n&&String(n).trim()):[];
    // 変更点をベルのお知らせにも記録（後で読み返せるように・バージョン単位で重複防止）
    if(notes.length){ try{ if(News.add({ id:'update-'+((info&&info.version)||Date.now()),
      title:'アプリを更新できます'+((info&&info.version)?'（'+info.version+'）':''), body:notes })) refreshBellBadge(); }catch(_){} }
    if(notes.length){
      card.appendChild(el('div','ob-text','今回の変更点：'));
      const ul=el('ul','upd-notes');
      notes.forEach(n=>{ const li=el('li'); li.textContent=String(n); ul.appendChild(li); });
      card.appendChild(ul);
    }else{
      card.appendChild(el('div','ob-text','新しいバージョンが利用できます。'));
    }
    const foot=el('div','ob-foot');
    const later=el('button','btn ghost','後で'); later.type='button'; later.onclick=()=>ov.remove();
    const go=el('button','btn','更新する'); go.type='button';
    go.onclick=()=>{
      go.disabled=true; go.textContent='更新中…';
      try{ worker.postMessage({type:'SKIP_WAITING'}); }catch(_){ forceReload(); }
      setTimeout(forceReload,2500);   // controllerchangeが来ない環境の保険
    };
    foot.appendChild(later); foot.appendChild(go); card.appendChild(foot);
    ov.appendChild(card); document.body.appendChild(ov);
  }
}
function forceReload(){ if(_swReloading)return; _swReloading=true; location.reload(); }

// ── お知らせ（ベルマーク）────────────────────────
// アプリからのお知らせを蓄積し、マイページ右上のベルに一覧表示＋未読バッジを出す。
const NEWS_KEY='bodyvis_news_v1';
const NEWS_READ_KEY='bodyvis_news_read_v1';
const News={
  all(){ try{ const a=JSON.parse(dbGet(NEWS_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(_){ return []; } },
  add(item){                       // {id,title,body:[...行],ts}
    const list=News.all();
    if(item.id && list.some(n=>n.id===item.id))return false;   // 同一IDは重複追加しない
    list.unshift({ id:item.id||('n'+Date.now()), title:item.title||'お知らせ',
      body:Array.isArray(item.body)?item.body.map(String):[String(item.body||'')], ts:item.ts||Date.now() });
    if(list.length>50)list.length=50;
    dbSet(NEWS_KEY,JSON.stringify(list)); return true;
  },
  lastRead(){ return Number(localStorage.getItem(NEWS_READ_KEY)||0); },
  markRead(){ try{ localStorage.setItem(NEWS_READ_KEY,String(Date.now())); }catch(_){} },
  unread(){ const lr=News.lastRead(); return News.all().filter(n=>Number(n.ts)>lr).length; }
};
function newsDate(ts){ const d=new Date(Number(ts)||Date.now()); return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function refreshBellBadge(){ const b=document.querySelector('.mp-bell'); if(b)b.classList.toggle('has-unread',News.unread()>0); }
function openNewsSheet(){
  const lr=News.lastRead();
  const list=News.all();
  const box=el('div');
  box.appendChild(Object.assign(el('h3'),{textContent:'お知らせ'}));
  if(!list.length){
    box.appendChild(el('div','news-empty','現在お知らせはありません。'));
  }else{
    const wrap=el('div','news-list');
    list.forEach(n=>{
      const card=el('div','news-item'+(Number(n.ts)>lr?' unread':''));
      card.appendChild(el('div','news-date',newsDate(n.ts)));
      card.appendChild(el('div','news-title',n.title||'お知らせ'));
      (n.body||[]).forEach(line=>{ const t=String(line||'').trim(); if(t)card.appendChild(el('div','news-line',t)); });
      wrap.appendChild(card);
    });
    box.appendChild(wrap);
  }
  box.appendChild(optRow('閉じる',closeSheet));
  openSheetNode(box);
  News.markRead(); refreshBellBadge();
}

const BOARD_OPEN_KEY='bodyvis_board_open_v1';
function saveBoardOpen(){ try{ localStorage.setItem(BOARD_OPEN_KEY,JSON.stringify({sel:S.boardSel,date:S.boardDate,time:S.boardTime})); }catch(e){} }
function clearBoardOpen(){ try{ localStorage.removeItem(BOARD_OPEN_KEY); }catch(e){} }
function restoreBoardOpen(){
  let st; try{ st=JSON.parse(localStorage.getItem(BOARD_OPEN_KEY)||'null'); }catch(e){ st=null; }

// 中央に来ているカードに合わせて上部タブの強調を更新（何名中の誰を見ているか常に分かるように）
function updateBoardActiveTab(scroll){
  const tabs=$('boardTabs'); if(!tabs)return;
  const cards=[...scroll.querySelectorAll('.board-card')]; if(!cards.length)return;
  const scRect=scroll.getBoundingClientRect(); const center=scRect.left+scRect.width/2;
  let best=0,bestD=Infinity;
  cards.forEach((c,i)=>{ const r=c.getBoundingClientRect(); const mid=r.left+r.width/2; const d=Math.abs(mid-center); if(d<bestD){bestD=d;best=i;} });
  [...tabs.children].forEach((t,i)=>t.classList.toggle('on',i===best));
  const at=tabs.children[best]; if(at)at.scrollIntoView({inline:'nearest',block:'nearest'});
}

// ボードから当日のセッションを完了＝そのクライアントの履歴（カレンダー）に保存し、本日のプランを消化
function boardComplete(name){
  const bd=S.boardDate||todayISO();
  const plan=SCHED.getFor(name,bd);
  if(!plan||!(plan.exercises||[]).length){toast('メニューが未設定です');return;}
  const exercises=(plan.exercises||[])
    .filter(e=>(e.sets||[]).some(s=>!!s.done))   // ✓が付いた＝実施した種目だけ記録（チェックが入らず未実施の種目は除外）
    .map(e=>({name:e.name,part:e.part||partOfExercise(e.name),unit:uOf(e),
      sets:(e.sets||[]).map(s=>({w:(s&&s.w!=null&&String(s.w).trim()!==''&&!isNaN(+s.w))?+s.w:null,
                                 r:(s&&s.r!=null&&String(s.r).trim()!==''&&!isNaN(+s.r))?+s.r:null}))}));
  if(!exercises.length){toast('実施した種目に✓を付けてください');return;}
  const entry={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    date:bd, template:plan.template||'', part:plan.part||planPartLabel(plan), exercises, memo:(plan.memo||'').trim()};
  SDB.add(name,entry); SCHED.delFor(name,bd); DDB.del(name);
  logInfo('セッション完了（ボード）',name+' / '+bd);
  toast(name+' を完了しました（カレンダーに保存）'); renderBoard();

}

function setPlanFromNames(name,tplName,exList,part,date,time){
  const d=date||todayISO();

  const t=(time!=null)?time:(ex?ex.time||'':'');   // 時間帯未指定なら既存の時間帯を維持（ボード上の編集で消えないように）
  const exercises=(exList||[]).map(it=>{
    const nm=typeof it==='string'?it:(it&&it.name); if(!nm)return null;
    const e=exFromName(name,nm);
    if(it&&typeof it==='object'&&(it.sets!=null||it.reps!=null||it.rest!=null))e.plan={sets:it.sets??null,reps:it.reps??null,rest:it.rest??null};   // メニューの目標(セット×回・休憩)を引き継ぐ＝セッション画面の「目標」表示用

}

// 五十音の行判定（名前の先頭文字→あ〜わ行 / 英字 / その他）
const KANA_ROWS=[[0x3041,0x304A,'あ'],[0x304B,0x3054,'か'],[0x3055,0x305E,'さ'],[0x305F,0x3069,'た'],
  [0x306A,0x306E,'な'],[0x306F,0x307D,'は'],[0x307E,0x3082,'ま'],[0x3083,0x3088,'や'],[0x3089,0x308D,'ら'],[0x308E,0x3093,'わ']];
function kanaGroup(name){
  const s=(name||'').trim(); if(!s)return {ord:99,label:'#'};
  const ch=s[0]; if(/[A-Za-z]/.test(ch))return {ord:90,label:'A-Z'}; if(/[0-9]/.test(ch))return {ord:95,label:'#'};
  let cp=s.codePointAt(0); if(cp>=0x30A1&&cp<=0x30F6)cp-=0x60;   // カタカナ→ひらがなに寄せて判定
  for(let i=0;i<KANA_ROWS.length;i++){const r=KANA_ROWS[i]; if(cp>=r[0]&&cp<=r[1])return {ord:i,label:r[2]};}
  return {ord:98,label:'#'};   // 漢字・記号など
}
// 名前の行 → 五十音インデックスバーのバケット
function railKey(g){ return g.ord<90 ? g.label : (g.ord===90?'A':'#'); }
const RAIL_ORDER=['あ','か','さ','た','な','は','ま','や','ら','わ','A','#'];
let custGroupKeys=[];
function idxDisplay(g){ return g.ord<90 ? g.label+'行' : (g.label==='A-Z'?'A-Z':'その他'); }
function setAllCollapsed(v){ custGroupKeys.forEach(k=>{S.custCollapsed[k]=v;}); renderCustList(); }
function jumpToIdx(key){ const h=$('custList')&&$('custList').querySelector('.cust-idx[data-idx="'+key+'"]'); if(h)h.scrollIntoView({block:'start',behavior:'smooth'}); }
function buildKanaRail(present){
  const host=$('vCust'); const old=host.querySelector('#kanaRail'); if(old)old.remove();
  const wrap=$('custList');
  if(present.size<3){ if(wrap)wrap.style.paddingRight=''; return; }
  if(wrap)wrap.style.paddingRight='16px';
  const rail=el('div','kana-rail'); rail.id='kanaRail';
  RAIL_ORDER.forEach(k=>{ const b=el('button',null,k);
    if(!present.has(k))b.disabled=true; else b.onclick=()=>jumpToIdx(k);
    rail.appendChild(b); });
  host.appendChild(rail);
}
function renderCustList(){
  const wrap=$('custList'); if(!wrap)return; wrap.innerHTML='';
  const all=CDB.all(); let names=Object.keys(all);
  // フリガナがあればそれを五十音の基準に、無ければ名前を使う
  const rd=n=>{const c=all[n]; return (c&&c.kana&&c.kana.trim())||n;};
  const f=custFilter.trim().toLowerCase(); if(f)names=names.filter(n=>n.toLowerCase().includes(f)||rd(n).toLowerCase().includes(f));
  // 行→フリガナ順でソート（グループ見出しを付けられるように）
  names.sort((a,b)=>{const ga=kanaGroup(rd(a)),gb=kanaGroup(rd(b));
    if(ga.ord!==gb.ord)return ga.ord-gb.ord; if(ga.label!==gb.label)return ga.label<gb.label?-1:1; return rd(a).localeCompare(rd(b),'ja');});
  if(!names.length){wrap.style.paddingRight=''; const r=$('vCust').querySelector('#kanaRail'); if(r)r.remove();
    wrap.appendChild(emptyState(custFilter?'該当するクライアントがいません':'クライアントがいません','上のボタンから追加できます'));return;}
  // グループ分割
  const groups=[]; let cur=null;
  names.forEach(n=>{const g=kanaGroup(rd(n)); const key=railKey(g);
    if(!cur||cur.key!==key){cur={key,g,items:[]}; groups.push(cur);} cur.items.push(n);});
  custGroupKeys=groups.map(gr=>gr.key);
  const present=new Set(custGroupKeys);
  const searching=!!f;
  groups.forEach(gr=>{
    const collapsed=!searching&&!!S.custCollapsed[gr.key];
    const h=el('div','cust-idx'+(collapsed?' collapsed':'')); h.dataset.idx=gr.key;
    const cv=el('span','cv','▾'); h.appendChild(cv);
    h.appendChild(document.createTextNode(idxDisplay(gr.g)));
    const ct=el('span','ct',gr.items.length+'名'); h.appendChild(ct);
    if(!searching)h.onclick=()=>{S.custCollapsed[gr.key]=!S.custCollapsed[gr.key]; renderCustList();};
    wrap.appendChild(h);
    if(collapsed)return;
    gr.items.forEach(n=>custRow(n,all,wrap));
  });
  buildKanaRail(present);
}

// 1名分のデータを全ストアから消す（単体削除と同じカスケード）
function purgeCust(name){
  CDB.del(name); TDB.remove(name); SDB.remove(name); SCHED.removeClient(name); DDB.del(name); PHDB.removeClient(name); NDB.removeClient(name); PCUST.removeClient(name); MDB.removeClient(name); KDB.remove(name);
  const bi=S.boardSel.indexOf(name); if(bi>=0)S.boardSel.splice(bi,1);
  if(S.active===name)S.active=null;
}
function deleteSelectedCusts(){
  const list=S.delPick.slice(); if(!list.length){toast('削除するクライアントを選択してください');return;}
  const total=list.reduce((s,n)=>{const c=CDB.get(n); return s+((c&&c.records||[]).length);},0);
  const allCount=Object.keys(CDB.all()).length;
  const isAll=list.length>=allCount;
  const title=isAll?'全クライアントを削除':'選択したクライアントを削除';
  const msg=(isAll?`すべてのクライアント ${list.length}名`:`選択した ${list.length}名`)+`を削除します（記録${total}件も消えます）。\n⚠️ 元に戻せません。よろしいですか？`;
  uiConfirm(msg,()=>{
    list.forEach(purgeCust);
    logWarn('クライアント一括削除', list.length+'名（記録'+total+'件）');
    ensureActive(); syncTop();
    S.delMode=false; S.delPick=[];
    toast(list.length+'名を削除しました'); renderCust();
  },{title,ok:'削除する',danger:true,icon:'trash'});
}
function updateSelBar(){
  const bar=$('selbar'); if(!bar)return; const nav=document.querySelector('.botnav');
  if(S.delMode&&S.delPick.length){
    bar.innerHTML='';
    const cnt=el('div','cnt'); cnt.appendChild(document.createTextNode('削除対象 ')); cnt.appendChild(Object.assign(el('b'),{textContent:S.delPick.length+'名'}));
    const clr=el('button','ghost','クリア'); clr.onclick=()=>{S.delPick=[];renderCustList();updateSelBar();};
    const del=el('button'); del.style.cssText='background:var(--red);border-color:var(--red);color:#fff'; del.innerHTML=ic('trash')+'削除'; del.onclick=deleteSelectedCusts;
    bar.appendChild(cnt); bar.appendChild(clr); bar.appendChild(del);
    bar.classList.add('on'); nav&&nav.classList.add('tucked');
  }else if(S.multiSel&&S.boardSel.length){
    bar.innerHTML='';
    const cnt=el('div','cnt'); cnt.appendChild(document.createTextNode('選択中 ')); cnt.appendChild(Object.assign(el('b'),{textContent:S.boardSel.length+'名'}));
    const clr=el('button','ghost','クリア'); clr.onclick=()=>{S.boardSel=[];renderCustList();updateSelBar();};
    const go=el('button'); go.innerHTML=ic('play')+'ボードを開く'; go.onclick=()=>openBoard();
    bar.appendChild(cnt); bar.appendChild(clr); bar.appendChild(go);
    bar.classList.add('on'); nav&&nav.classList.add('tucked');   // ナビを隠して重なり防止
  }else{
    bar.classList.remove('on'); nav&&nav.classList.remove('tucked');
  }
}
function selectCust(n){S.active=n;localStorage.setItem(ACT_KEY,n);S.viewDate=null;pushRecentCust(n);syncTop();}
/* 最近選択したクライアント（クイックアクセス用・最大8件・新しい順） */
const RECENT_CUST_KEY='bodyvis_recent_custs_v1';
function recentCusts(){try{return JSON.parse(localStorage.getItem(RECENT_CUST_KEY)||'[]')}catch(e){return[]}}
function pushRecentCust(n){let a=recentCusts().filter(x=>x!==n); a.unshift(n); a=a.slice(0,8); try{localStorage.setItem(RECENT_CUST_KEY,JSON.stringify(a))}catch(e){}}

function openSheet(html){const s=$('sheet'); s.innerHTML='<div class="grip"></div>'+html; $('scrim').classList.add('on'); s.classList.add('on'); s.scrollTop=0;}
function openSheetNode(node){const s=$('sheet'); s.innerHTML='<div class="grip"></div>'; s.appendChild(node); $('scrim').classList.add('on'); s.classList.add('on'); s.scrollTop=0;}
