.s-tlrow{display:flex;align-items:center;gap:.7rem;width:100%;padding:.8rem .9rem;background:none;border:none;border-top:1px solid var(--s-line);font-family:inherit;text-align:left;color:var(--s-text)}
.s-tlrow:first-child{border-top:none}
.s-tl-ic{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.s-tl-ic svg{width:1.15em;height:1.15em;margin:0}
.s-tl-body{flex:1;min-width:0}
.s-tl-t{font-weight:700;font-size:.94rem;display:flex;align-items:baseline;gap:.5rem}
.s-tl-t .tm{font-size:.72rem;color:var(--s-sub);font-weight:600;font-variant-numeric:tabular-nums}
.s-tl-s{font-size:.78rem;color:var(--s-sub);margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.s-tl-go{flex:0 0 auto;color:var(--s-sub);font-size:1.1rem}
.s-tl-tap{flex:1;min-width:0;background:none;border:none;font-family:inherit;text-align:left;color:var(--s-text);padding:0;cursor:pointer}
.s-tl-cancel{flex:0 0 auto;background:var(--surf2);border:1px solid var(--s-line);color:var(--red);font-family:inherit;font-size:.72rem;font-weight:700;padding:.3rem .6rem;border-radius:8px}
.s-tl-cancel:active{background:var(--s-line)}
.s-addnote{display:block;width:auto;margin:.55rem 1.25rem 0;background:var(--blue);border:none;color:#fff;border-radius:12px;padding:.9rem;font-size:.95rem;font-weight:700;font-family:inherit;text-align:center}
/* メモ・日誌セクション（種目別パフォーマンス置換） */
.s-notesec{margin:1.4rem 1.25rem 0}
.s-notesec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.s-notesec-h .t{font-size:.82rem;font-weight:700;color:var(--s-sub)}
.s-notesec-h .more{background:none;border:none;color:var(--blue);font-weight:700;font-size:.8rem;font-family:inherit}
.s-notecard{width:100%;text-align:left;background:var(--surf);border:1px solid var(--s-line);border-left:3px solid #7c5cff;border-radius:12px;padding:.75rem .85rem;font-family:inherit;color:var(--s-text);margin-top:.5rem;display:block}
.s-notecard-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;flex-wrap:wrap}
.s-notecard-d{font-size:.74rem;color:var(--s-sub);font-weight:700;font-variant-numeric:tabular-nums}
.s-notecard-tx{font-size:.85rem;line-height:1.5;color:var(--s-text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* メモ詳細/入力シート */
.note-detail-d{font-size:.86rem;color:var(--muted);font-weight:700;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.note-detail-tx{white-space:pre-wrap;line-height:1.65;font-size:.95rem;background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.85rem;margin:.3rem 0 .9rem}
.note-link{display:block;width:100%;text-align:center;background:var(--surf2);border:1px solid var(--border);color:var(--blue);border-radius:12px;padding:.8rem;font-weight:700;font-family:inherit;margin-top:.2rem}
.note-ta{width:100%;min-height:120px;background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.75rem .85rem;font-size:16px;color:var(--text);font-family:inherit;resize:vertical;line-height:1.55}
.note-ta:focus{outline:none;border-color:var(--blue)}
.note-pick{display:flex;flex-wrap:wrap;gap:.4rem}
.note-pick .note-tag{cursor:pointer;opacity:.5;border:1px solid transparent}
.note-pick .note-tag.on{opacity:1;box-shadow:inset 0 0 0 1.5px currentColor}
.note-pick .note-add{opacity:1;background:var(--surf2);color:var(--muted);border:1px dashed var(--border)}
.note-empty{text-align:center;color:var(--s-sub);font-size:.86rem;padding:1.3rem;line-height:1.6}
/* 選択日パネル */
.s-selday{margin:1.1rem 1.25rem 0}
.s-selday-h{font-size:.92rem;font-weight:700;color:var(--s-text)}
.s-newday{display:block;width:auto;margin:.6rem 1.25rem 0;background:var(--s-fill);border:1px dashed var(--s-accent);color:var(--s-accent);border-radius:12px;padding:.85rem;font-size:.92rem;font-weight:700;font-family:inherit;text-align:center}
/* 選択日の記録：1枠にまとめ、各種目を線で区切る */
.s-daybox{background:var(--surf);border:1px solid var(--s-line);border-radius:14px;margin:.55rem 1.25rem 0;overflow:hidden}
.s-daysess+.s-daysess{border-top:6px solid var(--s-bg)}
.s-dayhead{display:flex;align-items:center;gap:.5rem;width:100%;padding:.75rem .9rem;background:none;border:none;font-family:inherit;text-align:left;color:var(--s-text)}
.s-dayhead .nm{flex:1;min-width:0;font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-dayhead .tag{flex:0 0 auto;font-size:.7rem;color:var(--s-sub);font-weight:600}
.s-dayex{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;padding:.6rem .9rem;border-top:1px solid var(--s-line);font-size:.84rem}
.s-dayex .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--s-text);font-weight:500}
.s-dayex .val{flex:0 0 auto;color:var(--s-sub);font-variant-numeric:tabular-nums}
.s-daymemo{font-size:.76rem;color:var(--s-sub);padding:.55rem .9rem;border-top:1px solid var(--s-line);background:var(--s-fill)}
/* 詳細：種目別ブロック */
.s-detex{border-top:1px solid var(--border);padding:.6rem 0 .3rem}
.s-detex:first-of-type{border-top:none}
.s-detex-n{font-weight:700;font-size:.96rem}
.s-detex-n .pt{font-size:.68rem;color:var(--muted);font-weight:600;margin-left:.4rem}
.s-detset{display:flex;justify-content:space-between;gap:.8rem;font-size:.86rem;color:var(--text);padding:.22rem 0;font-variant-numeric:tabular-nums}
.s-detset .si{color:var(--muted)}
/* 履歴リスト */
.s-hist{margin:1.2rem 0 0}
.s-hrow{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--s-line);text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;color:var(--s-text)}
.s-hrow .d{flex:0 0 auto;width:3rem;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.1}
.s-hrow .d small{display:block;font-size:.64rem;color:var(--s-sub);font-weight:500}
.s-hrow .info{flex:1;min-width:0}
.s-hrow .p{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hrow .sub{font-size:.76rem;color:var(--s-sub);margin-top:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hrow .go{color:var(--s-sub);flex:0 0 auto;font-size:1.1rem}
.s-dup{display:block;width:100%;border:none;border-radius:12px;padding:.95rem;font-size:.95rem;font-weight:700;color:#fff;background:var(--blue);font-family:inherit;margin-top:.6rem}
.s-quick{display:flex;align-items:center;gap:.6rem;margin:.2rem 1.25rem 0}
.s-quick .s-tpl{background:var(--s-accent-soft);color:var(--s-accent);border:1px solid var(--s-accent)}
/* ヘッダー テンプレ ドロップダウン */
.s-tplsel{display:inline-flex;align-items:center;gap:.35rem;background:none;border:none;color:var(--s-text);font-size:1.02rem;font-weight:700;font-family:inherit;padding:0;letter-spacing:-.01em}
.s-tplsel .ar{color:var(--s-sub);font-size:.75rem}
/* 今日のコンディション */
.s-cond{margin:1.2rem 1.25rem 0}
.s-cond-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.s-cond-h .t{font-size:.8rem;font-weight:600;color:var(--s-sub)}
.s-cond textarea{width:100%;min-height:50px;background:var(--surf);border:1px solid var(--s-line);border-radius:12px;padding:.7rem .8rem;font-size:16px;color:var(--s-text);font-family:inherit;resize:vertical;line-height:1.5}
.s-cond textarea:focus{outline:none;border-color:var(--s-accent)}
/* ④ 種目カード（参考デザイン） */
.s-card{background:var(--surf);border:1px solid var(--s-line);border-radius:16px;margin:.7rem 1.25rem 0;padding:.85rem .95rem}
.s-card.dragging{opacity:.5}
.s-card.dragover{box-shadow:0 -2px 0 0 var(--s-accent)}
.s-card.undone{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset;background:color-mix(in srgb,var(--red) 5%,var(--surf))}   /* ✓未チェック＝完了記録に入らない種目の目印 */
.s-card-head{display:flex;align-items:center;gap:.65rem}
.s-thumb{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.02rem;color:#fff;font-weight:800}
.s-num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--s-accent);color:#fff;
  font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.s-plan{display:flex;align-items:center;margin-top:.55rem;font-size:.8rem;font-weight:700;color:var(--s-accent);
  background:var(--s-fill);border-radius:9px;padding:.4rem .6rem;cursor:pointer}
.s-plan:active{filter:brightness(.95)}
.s-plan.empty{color:var(--muted);opacity:.9}
.s-plan svg{width:1.05em;height:1.05em;margin-right:.15rem}
.s-plan-pen{margin-left:auto;display:inline-flex;align-items:center;opacity:.7}
.s-plan-pen svg{width:.95em;height:.95em;margin-right:0}
/* この人向け設定（顧客別 種目カスタマイズ） */
.s-pcust{margin-top:.5rem;border-radius:10px;padding:.55rem .7rem;font-size:.8rem;background:var(--s-fill);border:1px solid var(--s-line)}
.s-pcust:active{filter:brightness(.97)}
.s-pcust.empty{display:flex;align-items:center;gap:.2rem;color:var(--muted);font-weight:600;background:none;border:1px dashed var(--s-line)}
.s-pcust.empty svg{width:1.05em;height:1.05em;color:var(--s-sub)}
.s-pcust-hd{display:flex;align-items:center;gap:.3rem;font-weight:800;color:var(--s-accent);margin-bottom:.35rem}
.s-pcust-hd svg{width:1.05em;height:1.05em}
.s-pcust-t{flex:1;min-width:0}
.s-pcust-pen{display:inline-flex;color:var(--s-sub)}
.s-pcust-pen svg{width:.95em;height:.95em}
.s-pcust-row{display:flex;gap:.4rem;line-height:1.5;color:var(--s-text)}
.s-pcust-row+.s-pcust-row{margin-top:.15rem}
.s-pcust-lbl{flex:0 0 auto;font-weight:700;color:var(--s-sub);min-width:3.4em}
.s-pcust-val{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.ec-sub{font-size:.9rem;color:var(--s-text);margin:-.3rem 0 .4rem}
.ec-hint{font-size:.76rem;color:var(--s-sub);line-height:1.5;margin-bottom:.6rem;background:var(--s-accent-soft);border-radius:8px;padding:.5rem .6rem}
.ec-ta{min-height:3.4rem;resize:vertical;line-height:1.5;font-family:inherit}
.plan-edit{display:flex;flex-direction:column;gap:.6rem;margin:.3rem 0 .2rem}
.pe-row{display:flex;align-items:center;gap:.6rem}
.pe-lbl{flex:0 0 6.2rem;font-size:.85rem;font-weight:700;color:var(--text)}
.pe-row .inp{flex:1;min-width:0}
.pe-toggle{display:flex;align-items:center;gap:.55rem;margin-top:.7rem;font-size:.86rem;color:var(--text);cursor:pointer}
.pe-cb{width:1.15rem;height:1.15rem;flex:0 0 auto}
.s-card-tt{flex:1;min-width:0}
.s-card-name{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-card-prev{font-size:.73rem;color:var(--s-sub);margin-top:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-card-prev b{color:var(--s-text);font-weight:600;font-variant-numeric:tabular-nums}
.s-drag{flex:0 0 auto;background:none;border:none;color:var(--s-sub);opacity:.6;font-size:1rem;padding:.2rem .1rem;font-family:inherit;cursor:grab;touch-action:none}
.s-dots{flex:0 0 auto;background:none;border:none;color:var(--s-sub);font-size:1.2rem;padding:.2rem .35rem;font-family:inherit;line-height:1}
.s-setgrid{margin-top:.6rem}
.s-set2{display:flex;align-items:center;gap:.45rem;padding:.28rem 0}
.s-set2 .n{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--surf2);color:var(--s-sub);font-size:.74rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.s-set2 .win{flex:1;min-width:0}
.s-set2 input{width:100%;background:var(--surf2);border:1px solid transparent;border-radius:9px;padding:.5rem;font-size:16px;text-align:center;color:var(--s-text);font-variant-numeric:tabular-nums;font-family:inherit}
.s-set2 input:focus{outline:none;border-color:var(--s-accent);background:var(--surf)}
.s-set2 .u{color:var(--s-sub);font-size:.78rem;flex:0 0 auto}
.s-set2 .chk{flex:0 0 auto;width:1.7rem;height:1.7rem;border-radius:50%;border:1.5px solid var(--s-line);background:none;color:transparent;font-size:.85rem;display:flex;align-items:center;justify-content:center;font-family:inherit}
.s-set2 .chk.on{background:var(--s-accent);border-color:var(--s-accent);color:#fff}
.s-addset2{background:none;border:none;color:var(--s-accent);font-size:.84rem;font-weight:600;padding:.45rem 0 .1rem;font-family:inherit;margin-top:.15rem}
/* 回数 / 時間(秒) 切替スイッチ（種目カード内） */
.s-utog{display:inline-flex;gap:2px;background:var(--s-fill);border-radius:9px;padding:2px;margin:.55rem 0 .1rem}
.s-utog button{border:none;background:none;color:var(--s-sub);font-size:.74rem;font-weight:700;padding:.3rem .7rem;border-radius:7px;font-family:inherit}
.s-utog button.on{background:var(--s-accent);color:#fff}
/* 有酸素の推定消費カロリー */
.s-kcal{font-size:.8rem;color:var(--s-accent);font-weight:700;margin:.6rem 0 0;padding:0 .1rem}
/* 履歴：日付ヘッダー＋セッションカード（枠に収めて横並び表示） */
.s-hdate{font-size:.8rem;font-weight:700;color:var(--s-sub);margin:1rem 1.25rem .1rem;font-variant-numeric:tabular-nums}
.s-hcard{display:block;width:auto;background:var(--surf);border:1px solid var(--s-line);border-radius:14px;margin:.5rem 1.25rem 0;padding:.8rem .9rem;text-align:left;font-family:inherit;color:var(--s-text)}
.s-hcard-h{display:flex;align-items:center;gap:.5rem}
.s-hcard-name{flex:1;min-width:0;font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hcard-tag{flex:0 0 auto;font-size:.7rem;color:var(--s-sub);font-weight:600}
.s-hcard-ex{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;margin-top:.4rem;font-size:.82rem}
.s-hcard-ex .nm{min-width:0;color:var(--s-text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hcard-ex .val{flex:0 0 auto;color:var(--s-sub);font-variant-numeric:tabular-nums}
.s-hcard-memo{margin-top:.55rem;font-size:.76rem;color:var(--s-sub);background:var(--surf2);border-radius:9px;padding:.4rem .55rem;line-height:1.5}
/* 種目別パフォーマンス（成長） */
.s-perf{background:var(--surf);border:1px solid var(--s-line);border-radius:16px;margin:.7rem 1.25rem 0;padding:.9rem 1rem}
.s-perf-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.s-perf-name{font-size:1rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-perf-r{flex:0 0 auto;text-align:right}
.s-perf-val{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.s-perf-val small{font-size:.64rem;color:var(--s-sub);font-weight:600;margin-left:.12rem}
.s-perf-badge{font-size:.72rem;font-weight:700;color:var(--green);margin-left:.4rem}
.s-perf-badge.down{color:var(--red)}
.s-perf-chart{height:118px;position:relative;margin-top:.5rem}
.s-perf-sub{font-size:.66rem;color:var(--s-sub);font-weight:600;margin-bottom:.2rem}
/* 種目別パフォーマンス＝コンパクトリスト（種目が増えても見やすい） */
.s-perflist{margin:.5rem 1.25rem 0;background:var(--surf);border:1px solid var(--s-line);border-radius:14px;overflow:hidden}
.s-perfrow{display:flex;align-items:center;gap:.7rem;width:100%;padding:.75rem .9rem;background:none;border:none;border-top:1px solid var(--s-line);font-family:inherit;text-align:left;color:var(--s-text)}
.s-perfrow:first-child{border-top:none}
.s-perfrow .info{flex:0 0 auto;max-width:42%;min-width:0}
.s-perfrow .info .nm{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-perfrow .info .sub{font-size:.62rem;color:var(--s-sub);font-weight:600}
.s-perfrow .spark{flex:1;height:30px;min-width:24px}
.s-perfrow .rt{flex:0 0 auto;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.s-perfrow .rt .val{font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums}
.s-perfrow .rt .val small{font-size:.6rem;color:var(--s-sub);font-weight:600;margin-left:.08rem}
.s-perfrow .rt .bd{font-size:.68rem;font-weight:700;color:var(--green)}
.s-perfrow .rt .bd.down{color:var(--red)}
.s-perfrow .go{color:var(--s-sub);flex:0 0 auto;font-size:1.05rem}
/* 種目追加シート（テーマ追従） */
.s-sheet{--s-text:var(--text);--s-sub:var(--muted);--s-line:var(--border);--s-accent:var(--blue);--s-fill:var(--surf2);--s-accent-soft:color-mix(in srgb,var(--blue) 16%,transparent);--s-bg:var(--surf)}
.s-search{width:100%;background:var(--s-fill);border:none;border-radius:11px;padding:.75rem .9rem;font-size:16px;font-family:inherit;margin:.2rem 0 .7rem;color:var(--s-text)}
.s-search::placeholder{color:var(--s-sub)}
.s-cats{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:.6rem;scrollbar-width:none}
.s-cats::-webkit-scrollbar{display:none}
.s-cat{flex:0 0 auto;background:var(--s-fill);border:none;color:var(--s-text);border-radius:999px;padding:.4rem .85rem;font-size:.84rem;font-weight:600;font-family:inherit}
.s-cat.on{background:var(--s-accent);color:#fff}
.s-optlist{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.s-opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.85rem .2rem;border-bottom:1px solid var(--s-line);font-weight:600;color:var(--s-text)}
.s-opt .p{font-size:.72rem;color:var(--s-sub);font-weight:600}
.s-opt:active{background:var(--s-fill)}

/* ── 種目を追加ピッカー（部位カード＋一覧） ── */
.xa-search{margin-bottom:1rem}
.xa-label{font-size:.86rem;font-weight:800;color:var(--s-text);margin:.4rem 0 .6rem}
.xa-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:.5rem;margin-bottom:1rem}
.xa-part{display:flex;flex-direction:column;align-items:center;gap:.35rem;position:relative;
  background:var(--s-fill);border:1.5px solid transparent;border-radius:14px;padding:.7rem .2rem .55rem;font-family:inherit}
.xa-part.on{border-color:var(--s-accent);background:var(--s-accent-soft)}
.xa-part:active{filter:brightness(.97)}
.xa-part-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.xa-part-ic svg{width:24px;height:24px}
.xa-part-l{font-size:.8rem;font-weight:800;color:var(--s-text);line-height:1.2;text-align:center}
.xa-part-en{font-size:.6rem;color:var(--s-sub);font-weight:600;line-height:1.1}
.xa-part-del{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:var(--s-sub);
  color:#fff;font-size:.8rem;line-height:19px;text-align:center;font-weight:800}
.xa-part-add{justify-content:center;border:1.5px dashed var(--s-line)}
.xa-part-add .xa-part-ic{background:var(--s-fill);color:var(--s-sub)}
.xa-favs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.xa-fav{background:var(--s-accent-soft);color:var(--s-accent);border:none;border-radius:999px;
  padding:.42rem .8rem;font-size:.82rem;font-weight:700;font-family:inherit}
.xa-fav:active{filter:brightness(.96)}
.xa-listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem}
.xa-listtitle{font-size:.86rem;font-weight:800;color:var(--s-text)}
.xa-sort{background:none;border:none;color:var(--s-accent);font-size:.8rem;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:.15rem}
.xa-sort svg{width:14px;height:14px}
.xa-list{max-height:44vh}
.xa-row{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--s-line);padding:.75rem .1rem;font-family:inherit}
.xa-row:active{background:var(--s-fill)}
.xa-row.added{opacity:.55}
.xa-row-ic{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.xa-row-ic svg{width:20px;height:20px}
.xa-row-ic.img{overflow:hidden;background:var(--s-fill)}
.xa-row-img{width:100%;height:100%;object-fit:cover}
/* 種目作成フォームの画像追加（任意） */
.ef-imgadd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;width:100%;
  background:var(--surf2);border:1.5px dashed var(--border);border-radius:12px;padding:1.2rem;font-family:inherit;color:var(--muted);margin-bottom:.3rem}
.ef-imgic{color:var(--s-accent)}.ef-imgic svg{width:26px;height:26px}
.ef-imgl{font-weight:700;color:var(--s-text);font-size:.9rem}
.ef-imgs{font-size:.72rem;color:var(--s-sub)}
.ef-imgwrap{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.3rem}
.ef-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
.ef-imgrm{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;background:none;border:none;
  color:var(--red);font-weight:700;font-size:.84rem;font-family:inherit}
.ef-imgrm svg{width:16px;height:16px}
.xa-row-mid{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.xa-row-name{font-size:.94rem;font-weight:700;color:var(--s-text)}
.xa-badge{font-size:.64rem;font-weight:800;border-radius:6px;padding:.1rem .4rem}
.xa-row-del{flex:0 0 auto;color:var(--s-sub);display:inline-flex}
.xa-row-del svg{width:17px;height:17px}
.xa-row-plus{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--s-accent-soft);color:var(--s-accent);display:flex;align-items:center;justify-content:center}
.xa-row-plus svg{width:18px;height:18px}
.xa-row-plus.on{background:color-mix(in srgb,#16a34a 16%,transparent);color:#16a34a}
.xa-row-add .xa-row-name{color:var(--s-accent);font-weight:800}
.xa-req{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;
  background:var(--s-accent-soft);border:none;border-radius:12px;padding:.8rem .9rem;margin-top:.9rem;font-family:inherit}
.xa-req-l{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--s-text);font-weight:600;min-width:0}
.xa-req-l svg{width:17px;height:17px;color:var(--s-accent);flex:0 0 auto}
.xa-req-b{flex:0 0 auto;color:var(--s-accent);font-weight:800;font-size:.84rem}
.xa-newcat{display:inline-flex;align-items:center;gap:.3rem;background:none;border:none;color:var(--s-accent);
  font-weight:700;font-size:.82rem;font-family:inherit;margin:.1rem 0 .5rem}
.xa-newcat svg{width:16px;height:16px}
.xa-colors{display:flex;flex-wrap:wrap;gap:.5rem}
.xa-color{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.xa-color.on{border-color:var(--s-text);box-shadow:0 0 0 2px var(--s-bg) inset}
.xa-catrow{display:flex;align-items:center;gap:.6rem;padding:.6rem .1rem;border-bottom:1px solid var(--s-line)}
.xa-catdot{flex:0 0 auto;width:16px;height:16px;border-radius:50%}
.xa-catname{flex:1;min-width:0;font-weight:700;color:var(--s-text)}
.xa-catdel{background:none;border:none;color:var(--s-sub);display:inline-flex;padding:.2rem}
.xa-catdel svg{width:18px;height:18px}

/* ── メニュー適用シート（一覧＋対象選択） ── */
.am-sec-head{display:flex;align-items:center;justify-content:space-between;margin:1rem 0 .6rem}
.am-sec-t{font-size:.86rem;font-weight:800;color:var(--s-text)}
.am-newbtn{display:inline-flex;align-items:center;gap:.2rem;background:var(--s-fill);border:1px solid var(--s-line);
  color:var(--s-accent);border-radius:999px;padding:.42rem .85rem;font-size:.82rem;font-weight:800;font-family:inherit}
.am-newbtn .mi{width:15px;height:15px;margin:0}
.am-card{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;cursor:pointer;
  background:var(--s-bg);border:1.5px solid var(--s-line);border-radius:14px;padding:.7rem .75rem;margin-bottom:.6rem}
.am-card:active{border-color:var(--s-accent);background:var(--s-accent-soft)}
.am-av{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.am-av svg{width:24px;height:24px}
.am-main{flex:1;min-width:0}
.am-name{font-size:.98rem;font-weight:800;color:var(--s-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am-sub{font-size:.74rem;color:var(--s-sub);font-weight:600;margin-top:.12rem}
.am-acts{flex:0 0 auto;display:flex;align-items:center;gap:.3rem}
.am-iconbtn{width:36px;height:36px;border-radius:9px;background:var(--s-fill);border:none;color:var(--s-sub);
  display:flex;align-items:center;justify-content:center;padding:0}
.am-iconbtn .mi{width:17px;height:17px;margin:0}
.am-chev{color:var(--s-sub);display:inline-flex;padding-left:.05rem}
.am-chev svg{width:18px;height:18px}
.am-tip{display:flex;gap:.55rem;align-items:flex-start;background:var(--s-accent-soft);border-radius:12px;padding:.75rem .85rem;margin:.5rem 0 .9rem}
.am-tip>span{flex:0 0 auto;display:inline-flex;color:var(--s-accent)}
.am-tip>span svg{width:20px;height:20px}
.am-tip-t{font-size:.8rem;color:var(--s-text);font-weight:600;line-height:1.5}
.am-close{width:100%;background:var(--s-fill);border:none;color:var(--s-text);border-radius:12px;padding:.95rem;font-weight:800;font-family:inherit;font-size:.95rem}
.am-close:active{filter:brightness(.96)}
/* 適用対象シート */
.am-back{background:none;border:none;color:var(--s-sub);padding:.1rem 0 .2rem;display:inline-flex;font-family:inherit}
.am-back svg{width:24px;height:24px}
.am-flabel{display:flex;align-items:center;gap:.4rem;font-size:.84rem;font-weight:800;color:var(--s-text);margin:1rem 0 .45rem}
.am-flabel svg{width:18px;height:18px;color:var(--s-sub)}
.am-input{width:100%;background:var(--s-bg);border:1px solid var(--s-line);border-radius:12px;padding:.85rem .9rem;
  font-size:16px;font-family:inherit;color:var(--s-text)}
.am-cli-head{display:flex;align-items:center;justify-content:space-between;margin:1.2rem 0 .5rem}
.am-cli-h{display:flex;align-items:center;gap:.4rem;font-size:.84rem;font-weight:800;color:var(--s-text)}
.am-cli-h svg{width:18px;height:18px;color:var(--s-sub)}
.am-alllink{background:none;border:none;color:var(--s-accent);font-weight:800;font-size:.84rem;font-family:inherit}
.am-clist{border:1px solid var(--s-line);border-radius:12px;overflow:hidden;max-height:40vh;overflow-y:auto}
.am-crow{display:flex;align-items:center;gap:.75rem;padding:.9rem;border-bottom:1px solid var(--s-line);cursor:pointer}
.am-crow:last-child{border-bottom:none}
.am-crow.master{background:var(--s-fill)}
.am-crow:active{background:var(--s-accent-soft)}
.am-cbox{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--s-line);
  display:flex;align-items:center;justify-content:center;color:#fff}
.am-crow.on .am-cbox{background:var(--s-accent);border-color:var(--s-accent)}
.am-cbox svg{width:15px;height:15px}
.am-cname{flex:1;min-width:0;font-weight:700;color:var(--s-text);font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am-submit{width:100%;background:var(--s-accent);border:none;color:#fff;border-radius:12px;padding:1rem;font-weight:800;font-size:1rem;font-family:inherit;margin-top:1.1rem}
.am-submit:disabled{opacity:.45}
.am-submit:active:not(:disabled){filter:brightness(.95)}
.am-cancel{width:100%;background:none;border:none;color:var(--s-accent);font-weight:800;font-size:.95rem;font-family:inherit;padding:.9rem .9rem .3rem}

/* ══════════ セッションボード（複数クライアント同時把握） ══════════ */
/* 複数選択モードのチェックボックス */
.cust-row .cbox{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.6px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:.8rem;font-weight:800}
.cust-row.picked .cbox{background:var(--blue);border-color:var(--blue);color:#fff}
.cust-row.picked{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.cust-row.picked.del .cbox{background:var(--red);border-color:var(--red);color:#fff}
.cust-row.picked.del{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
/* 複数選択トグル */
.sheet-board-bar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:.6rem;
  margin:.4rem -1rem 0;padding:.55rem 1rem;
  background:var(--surf);border-top:1px solid var(--border);box-shadow:0 -6px 16px rgba(0,0,0,.14)}
.sheet-board-bar .sbb-cnt{font-size:.82rem;font-weight:800;color:var(--text);flex:0 0 auto;white-space:nowrap}
.sheet-board-bar .btn{padding:.66rem .3rem}
.multi-tog{width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:.75rem;font-size:.9rem;font-weight:700;margin-top:.6rem}
/* クライアントタブ上部の操作トグルを横並びでコンパクトに（片方だけ表示時は自動で全幅） */
.cust-act-row{display:flex;gap:.5rem;margin-top:.55rem}
.cust-act-row .multi-tog{margin-top:0;flex:1;padding:.62rem .4rem;font-size:.82rem}
.multi-tog.on{background:var(--blue);border-color:var(--blue);color:#fff}
.multi-tog.del{color:var(--red)}
.multi-tog.del.on{background:var(--red);border-color:var(--red);color:#fff}
/* 選択バー（クライアントタブ下部・ボトムナビの上） */
/* 選択バーは最下部に置き、表示中はボトムナビを隠す（重なり防止） */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:var(--bar);backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;align-items:center;
  transform:translateY(130%);transition:transform .24s}
.selbar.on{transform:translateY(0)}
.botnav.tucked{display:none}
.selbar .cnt{font-size:.88rem;font-weight:700;color:var(--text);flex:1}
.selbar .cnt b{color:var(--blue)}
.selbar button{width:auto;flex:0 0 auto;padding:.7rem 1rem;font-size:.88rem;font-weight:800;border-radius:11px;border:none;color:#fff;background:var(--blue)}
.selbar button.ghost{background:var(--surf2);color:var(--text);border:1px solid var(--border)}

/* ボードオーバーレイ（全画面・ボトムナビの上／シートより下） */
.board-ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.board-ov.on{display:flex}
.board-top{display:flex;align-items:center;gap:.6rem;flex:0 0 auto;
  padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.board-top .bt-t{font-size:1.05rem;font-weight:800;line-height:1.15}
.board-top .bt-d{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:.1rem}
.board-hint{flex:0 0 auto;font-size:.72rem;color:var(--muted);text-align:center;padding:.5rem .9rem 0}
/* 複数セッションのクライアント切替タブ（現在表示中を強調・何名中の誰かを明示） */
.board-tabs{flex:0 0 auto;display:flex;gap:.4rem;overflow-x:auto;padding:.55rem .9rem .1rem;-webkit-overflow-scrolling:touch}
.board-tabs::-webkit-scrollbar{display:none}
.board-tab{flex:0 0 auto;font-size:.78rem;font-weight:700;padding:.34rem .72rem;border-radius:999px;
  background:var(--surf2);border:1px solid var(--border);color:var(--muted);max-width:9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s,color .15s}
.board-tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.board-tab .bt-i{opacity:.7;font-weight:800;margin-right:.28rem}
.board-tab.on .bt-i{opacity:.9}
.board-scroll{flex:1;display:flex;gap:.75rem;overflow-x:auto;overflow-y:hidden;
  padding:.9rem;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.board-scroll::-webkit-scrollbar{display:none}
.board-card{flex:0 0 84%;max-width:330px;scroll-snap-align:center;display:flex;flex-direction:column;
  background:var(--surf);border:1px solid var(--border);border-radius:18px;padding:1rem;overflow:hidden}
.board-card.done{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.bc-name{font-size:1.22rem;font-weight:800;display:flex;align-items:center;gap:.5rem;min-width:0}
.bc-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bc-badge{flex:0 0 auto;font-size:.64rem;font-weight:800;padding:.14rem .5rem;border-radius:999px;
  background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.bc-now{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin:.85rem 0 .3rem}
.bc-nm{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.55rem .35rem;text-align:center}
.bc-nm .l{font-size:.62rem;color:var(--muted);font-weight:700}
.bc-nm .v{font-size:1.08rem;font-weight:800;margin-top:.12rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bc-nm .v .u{font-size:.58rem;color:var(--muted);font-weight:600;margin-left:.05rem}
.bc-nm .d{font-size:.62rem;font-weight:800;margin-top:.08rem;font-variant-numeric:tabular-nums}
.bc-menu-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin:.7rem 0 .1rem}
.bc-menu-t{font-size:.92rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-menu-part{flex:0 0 auto;font-size:.68rem;color:var(--muted);font-weight:700}
.bc-exlist{flex:1;min-height:0;overflow-y:auto;margin-top:.35rem}
.bc-ex{padding:.5rem 0;border-top:1px solid var(--border);font-size:.86rem}
.bc-ex:first-child{border-top:none}
.bc-ex-h{display:flex;align-items:center;gap:.55rem}
.bc-ex-h .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bc-ex.done .bc-ex-h .n{text-decoration:line-through;color:var(--muted)}
.bc-ex.undone{border:1px solid var(--red);border-radius:10px;padding:.5rem .55rem;margin-top:.4rem;background:color-mix(in srgb,var(--red) 6%,transparent)}   /* ✓未チェック＝完了記録に入らない種目の目印 */
.bc-ex.undone:first-child{border-top:1px solid var(--red)}
.bc-ex-h .s{flex:0 0 auto;color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
.bc-sets{margin:.4rem 0 .1rem}
.bc-set{display:flex;align-items:center;gap:.34rem;padding:.18rem 0}
.bc-set .n{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--surf2);color:var(--muted);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bc-win{flex:1;min-width:0}
.bc-set input{width:100%;background:var(--surf2);border:1px solid transparent;border-radius:8px;padding:.42rem;font-size:16px;text-align:center;color:var(--text);font-variant-numeric:tabular-nums;font-family:inherit}
.bc-set input:focus{outline:none;border-color:var(--blue);background:var(--surf)}
.bc-set .u{color:var(--muted);font-size:.72rem;flex:0 0 auto}
.bc-setchk{flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;border:1.5px solid var(--border);background:none;color:transparent;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.bc-setchk.on{background:var(--green);border-color:var(--green);color:#fff}
.bc-setchk .mi{width:12px;height:12px}
.bc-setrm{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:1.05rem;padding:.1rem .25rem;cursor:pointer;font-family:inherit}
.bc-addset{background:none;border:none;color:var(--blue);font-size:.8rem;font-weight:700;padding:.3rem 0;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:.2rem}
.bc-addset .mi{width:13px;height:13px}
.bc-ex .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bc-ex.done .n{text-decoration:line-through;color:var(--muted)}
.bc-ex .s{flex:0 0 auto;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.bc-prog{flex:0 0 auto;font-size:.72rem;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.bc-empty{color:var(--muted);font-size:.82rem;text-align:center;padding:1.5rem .5rem;line-height:1.6;white-space:pre-line}
.bc-acts{display:flex;gap:.35rem;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--border);flex:0 0 auto}
.bc-acts button{flex:1;min-width:0;border:1px solid var(--border);background:var(--surf2);color:var(--text);
  border-radius:11px;padding:.62rem .15rem;font-size:.78rem;font-weight:800}
.bc-acts button.prim{background:var(--blue);border-color:var(--blue);color:#fff}
.bc-acts button.done-btn{background:var(--green);border-color:var(--green);color:#06281c}
.bc-acts button:disabled{opacity:.45}
/* ── アプリロック (PIN) ── */
body.locked{overflow:hidden}
.lock-ov{position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.lock-box{width:100%;max-width:320px;text-align:center}
.lock-box.shake{animation:lockshake .38s}
@keyframes lockshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lock-ic{color:var(--blue);margin-bottom:.6rem}
.lock-ic .mi{width:2.4rem;height:2.4rem}
.lock-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:1.1rem}
.lock-dots{display:flex;gap:.7rem;justify-content:center;margin-bottom:.5rem;min-height:16px}
.lock-dot{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--muted);transition:.15s}
.lock-dot.on{background:var(--blue);border-color:var(--blue)}
.lock-err{color:var(--red);font-size:.8rem;font-weight:700;min-height:1.1rem;margin-bottom:.6rem}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:270px;margin:0 auto}
.lock-key{background:var(--surf2);border:1px solid var(--border);color:var(--text);
  font-size:1.4rem;font-weight:700;border-radius:14px;padding:.85rem 0;cursor:pointer;font-family:inherit}
.lock-key:active{background:var(--surf3)}
/* ── ログ表示 ── */
.log-lv{font-weight:700;flex:0 0 auto}
/* ── 使い方オンボーディング ── */
.ob-ov{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:1.2rem}
.ob-card{width:100%;max-width:420px;max-height:calc(100vh - 2.4rem);overflow-y:auto;background:var(--surf);border-radius:20px;
  padding:1.3rem;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:obUp .26s ease}
@keyframes obUp{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.ob-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.ob-step{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.ob-skip{background:none;border:none;color:var(--muted);font-size:.84rem;font-weight:700;font-family:inherit;padding:.25rem .35rem;cursor:pointer}
.ob-ic{width:58px;height:58px;border-radius:16px;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--blue);margin:.2rem auto .8rem}
.ob-ic .mi{width:2rem;height:2rem}
.ob-title{font-size:1.15rem;font-weight:800;text-align:center;color:var(--text);margin-bottom:.5rem}
.ob-text{font-size:.9rem;line-height:1.65;color:var(--muted);text-align:center;margin-bottom:1rem;min-height:3.3em}
.ob-dots{display:flex;gap:.4rem;justify-content:center;margin-bottom:1rem}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:.2s}
.ob-dot.on{background:var(--blue);width:20px;border-radius:4px}
.ob-check{display:flex;align-items:center;gap:.5rem;justify-content:center;font-size:.83rem;color:var(--muted);margin-bottom:.9rem;cursor:pointer}
.ob-check input{width:17px;height:17px;accent-color:var(--blue)}
.ob-foot{display:flex;gap:.6rem}
.ob-foot .btn{margin-top:0}
.ob-foot .btn.ghost{flex:0 0 38%}
/* ── ホーム画面追加ガイド（初回・端末別） ── */
.ig-tabs{display:flex;gap:.35rem;background:var(--surf2);border-radius:12px;padding:.3rem;margin:.2rem 0 1rem}
.ig-tab{flex:1;border:none;background:none;font-family:inherit;font-size:.9rem;font-weight:700;color:var(--muted);padding:.55rem;border-radius:9px;cursor:pointer}
.ig-tab.on{background:var(--surf);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.ig-steps{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1rem;text-align:left}
.ig-step{display:flex;align-items:flex-start;gap:.7rem}
.ig-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:.05rem}
.ig-body{flex:1;font-size:.9rem;line-height:1.55;color:var(--text)}
.ig-em{display:inline-flex;align-items:center;gap:.22rem;font-weight:700;color:var(--blue);background:var(--surf2);border-radius:6px;padding:.02rem .32rem;margin:0 .08rem;vertical-align:middle}
.ig-em .mi{width:1rem;height:1rem}
.ig-note{font-size:.78rem;line-height:1.55;color:var(--muted);background:var(--surf2);border-radius:10px;padding:.6rem .7rem;margin-bottom:1rem;text-align:left}
/* ── 設定ページ（専用ページ） ── */
/* 入場アニメはスクロールコンテナ(.settings-page)自身には掛けない＝transformアニメ中にタッチスクロールが一時停止するのを防ぐ。中身(head/body)を同じ動きでスライドさせて演出は維持 */
.settings-page{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
@keyframes setIn{from{transform:translateX(22px);opacity:.4}to{transform:translateX(0);opacity:1}}
.set-head{position:sticky;top:0;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;z-index:2;animation:setIn .22s ease}
.set-back{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.set-back:active{background:var(--surf3)}
.set-title{font-size:1.05rem;font-weight:800;color:var(--text)}
.set-body{padding:1rem 1rem calc(5.5rem + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:setIn .22s ease}
/* 画面下部の固定「戻る」バー（PWAで別ページから片手で戻りやすく） */
.set-botbar{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom))}
.set-botback{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;max-width:560px;margin:0 auto;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:12px;font-family:inherit;font-size:1rem;font-weight:800;padding:.85rem;cursor:pointer}
.set-botback:active{background:var(--surf3)}
.set-botback .mi{width:1.2rem;height:1.2rem}
/* ── ヒアリングカルテ ── */
.kt-savebtn{margin-left:auto;background:var(--blue);border:none;color:#fff;border-radius:10px;font-family:inherit;font-size:.9rem;font-weight:800;padding:.5rem .95rem;cursor:pointer;flex:0 0 auto}
.kt-savebtn:active{opacity:.85}
.kt-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:.9rem 1rem;margin-bottom:.8rem}
.kt-h{font-size:.98rem;font-weight:800;color:var(--text);margin-bottom:.7rem}
.kt-field{margin-bottom:.7rem}
.kt-field:last-child{margin-bottom:0}
.kt-field>label{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.kt-ro{font-size:.92rem;color:var(--text);padding:.15rem 0}
.kt-note-sm{font-size:.76rem;color:var(--muted);margin-bottom:.55rem}
.kt-seg{display:flex;flex-wrap:wrap;gap:.4rem}
.kt-segb{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:999px;font-family:inherit;font-size:.82rem;font-weight:700;padding:.4rem .8rem;cursor:pointer}
.kt-segb.on{background:var(--blue);border-color:transparent;color:#fff}
.kt-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.kt-chip{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-family:inherit;font-size:.82rem;font-weight:600;padding:.4rem .7rem;cursor:pointer}
.kt-chip.on{background:var(--blue);border-color:transparent;color:#fff}
.kt-motwrap{display:flex;align-items:center;gap:.7rem}
.kt-motwrap input[type=range]{flex:1;accent-color:var(--blue)}
.kt-motval{min-width:2.2rem;text-align:center;font-weight:800;color:var(--blue);font-size:1.1rem}
.kt-savewide{width:100%;margin-top:.2rem}
.kt-sumcard{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.55rem .8rem;margin:.15rem 0 .35rem}
.kt-sumrow{display:flex;justify-content:space-between;gap:.8rem;padding:.16rem 0;font-size:.82rem}
.kt-suml{color:var(--muted);font-weight:700;flex:0 0 auto}
.kt-sumv{color:var(--text);text-align:right}
/* ── ヒアリングカルテ 横断一覧（表） ── */
.klist-count{font-size:.82rem;color:var(--muted);margin-bottom:.6rem}
.klist-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:14px}
.klist{border-collapse:collapse;width:100%;min-width:720px;font-size:.8rem}
.klist th,.klist td{padding:.55rem .65rem;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);vertical-align:middle}
.klist th{background:var(--surf2);color:var(--muted);font-weight:700;position:sticky;top:0;z-index:1}
.klist tbody tr{cursor:pointer}
.klist tbody tr:active{background:var(--surf2)}
.klist tbody tr:last-child td{border-bottom:none}
.klist-name{font-weight:800;color:var(--text)}
.klist-mot{display:flex;align-items:center;gap:.4rem}
.klist-motbar{width:54px;height:6px;border-radius:3px;background:var(--surf3);overflow:hidden;flex:0 0 auto}
.klist-motfill{height:100%;background:var(--blue)}
/* ── ヒアリングカルテ プロファイル表示（概要カード・読み取り専用） ── */
.kv-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:.9rem 1rem;margin-bottom:.7rem}
/* 1枚のカードに集約し、各セクションを枠線で区切る */
.kv-sheet{background:var(--surf);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:.8rem}
.kv-block{padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.kv-block:last-child{border-bottom:none}
.kv-goalrow{display:flex}
.kv-goal2{flex:1;text-align:center;padding:.15rem .35rem}
.kv-goal2 + .kv-goal2{border-left:1px solid var(--border)}
.kv-accb .kv-acc-head{padding:0}
.kv-accb .kv-acc-body{display:none;padding:.55rem 0 0}
.kv-accb.open .kv-acc-body{display:block}
.kv-accb.open .kv-acc-p{white-space:normal}
.kv-accb.open .kv-acc-ar{transform:rotate(90deg)}
.kv-sec-t{font-size:.76rem;font-weight:800;color:var(--muted);margin-bottom:.55rem;letter-spacing:.03em}
/* プロフィール */
.kv-prof{display:flex;gap:.85rem;align-items:flex-start}
.kv-av{width:60px;height:60px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--surf2)}
.kv-av svg{width:100%;height:100%;display:block}
.kv-prof-i{flex:1;min-width:0}
.kv-prof-nm{display:flex;align-items:baseline;gap:.15rem}
.kv-prof-nmt{font-size:1.12rem;font-weight:800;color:var(--text)}
.kv-prof-sama{font-size:.82rem;color:var(--muted);font-weight:700}
.kv-badges{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 .5rem}
.kv-badge{background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:7px;font-size:.72rem;font-weight:700;padding:.16rem .5rem}
.kv-prof-line{font-size:.84rem;color:var(--text);font-weight:600;margin-top:.2rem}
.kv-prof-line.kv-muted{color:var(--muted);font-weight:600;font-size:.78rem}
/* モチベーション＋主な目的 */
.kv-motrow{display:flex;align-items:center;gap:1rem}
.kv-ring{position:relative;width:66px;height:66px;flex:0 0 auto}
.kv-ring-svg{width:66px;height:66px;display:block}
.kv-ring-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px}
.kv-ring-num{font-size:1.2rem;font-weight:800;color:var(--text);line-height:1}
.kv-ring-den{font-size:.66rem;color:var(--muted);font-weight:700}
.kv-motmain{flex:1;min-width:0}
.kv-motmain-l{font-size:.74rem;color:var(--muted);font-weight:700;margin-bottom:.2rem}
.kv-motmain-v{font-size:.98rem;font-weight:800;color:var(--text);line-height:1.4}
/* 目標スタッツ */
.kv-goals{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.7rem}
.kv-goal{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:.7rem .45rem;text-align:center}
.kv-goal-h{display:flex;align-items:center;justify-content:center;gap:.22rem;color:var(--muted);margin-bottom:.35rem}
.kv-goal-ic{display:inline-flex}.kv-goal-ic .mi{width:.85rem;height:.85rem}
.kv-goal-l{font-size:.68rem;font-weight:700}
.kv-goal-v{color:var(--text)}
.kv-goal-num{font-size:1.16rem;font-weight:800}
.kv-goal-u{font-size:.72rem;font-weight:700;color:var(--muted)}
.kv-goal-sub{font-size:.68rem;color:var(--muted);margin-top:.25rem;font-weight:600}
/* ピル */
.kv-pills{display:flex;flex-wrap:wrap;gap:.4rem}
.kv-pill{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:.82rem;font-weight:700;padding:.32rem .7rem}
.kv-pill.pink{background:#fdeef2;border-color:#f6d0dc;color:#c73b63}
/* 情報行アコーディオン */
.kv-acc{background:var(--surf);border:1px solid var(--border);border-radius:14px;margin-bottom:.6rem;overflow:hidden}
.kv-acc-head{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:none;font-family:inherit;text-align:left;padding:.75rem .9rem;cursor:pointer;color:var(--text)}
.kv-acc-head:active{background:var(--surf2)}
.kv-acc-tx{flex:1;min-width:0}
.kv-acc-t{font-size:.9rem;font-weight:800;color:var(--text)}
.kv-acc-p{font-size:.78rem;color:var(--muted);margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv-acc-ar{flex:0 0 auto;color:var(--muted);transform:rotate(-90deg);transition:transform .2s ease;display:inline-flex}
.kv-acc-ar .mi{width:1rem;height:1rem}
.kv-acc.open .kv-acc-ar{transform:rotate(90deg)}
.kv-acc.open .kv-acc-p{white-space:normal}
.kv-acc-body{display:none;padding:0 .9rem .8rem}
.kv-acc.open .kv-acc-body{display:block}
.kv-row{display:flex;gap:.8rem;justify-content:space-between;align-items:baseline;padding:.32rem 0;border-bottom:1px solid var(--border)}
.kv-row:last-child{border-bottom:none}
.kv-row-l{color:var(--muted);font-weight:700;font-size:.8rem;flex:0 0 auto}
.kv-row-v{color:var(--text);text-align:right;font-size:.86rem;line-height:1.5}
.kv-note{font-size:.86rem;line-height:1.65;color:var(--text);white-space:pre-wrap}
.kv-foot{text-align:center;font-size:.74rem;color:var(--muted);margin:.4rem 0 .2rem}
/* ── トレーニング記録 一覧表・記録詳細 ── */
.tl-filters{margin-bottom:.5rem}
.tl-sel{width:100%;display:block}
.tl-daterow{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem}
.tl-date{flex:1;min-width:0}
.tl-dsep{color:var(--muted);font-weight:700;flex:0 0 auto}
.klist.tl-table{min-width:0}
.tl-table .tl-rm{color:var(--blue);font-weight:800}
.tl-csv{width:100%;margin-top:.7rem}
.td-sheet .td-date{color:var(--blue);font-weight:700;font-size:.86rem;margin:-.35rem 0 .7rem}
.td-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-bottom:.8rem}
.td-stat{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.55rem .3rem;text-align:center}
.td-stat-v{font-size:.94rem;font-weight:800;color:var(--text);line-height:1.2}
.td-stat-l{font-size:.66rem;color:var(--muted);margin-top:.22rem;font-weight:700}
.klist.td-settable{min-width:0}
.klist.td-settable tbody tr{cursor:default}
.td-best{background:#fdeef2}
.td-best td{color:#c73b63;font-weight:800}
.td-memo{margin-top:.8rem}
.td-hist{margin-top:.9rem}
.td-hrow{display:flex;align-items:baseline;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.8rem}
.td-hrow:last-child{border-bottom:none}
.td-hd{color:var(--muted);font-weight:700;flex:0 0 auto;min-width:4.2em}
.td-hv{color:var(--text);flex:1}
.td-hrm{color:var(--blue);font-weight:700;flex:0 0 auto}
/* トレーニング記録サマリー */
.tl-openbtn{display:block;width:auto;max-width:280px;margin:.9rem auto 0;padding:.6rem 1.1rem;font-size:.86rem}
.tl-tabs{display:flex;gap:.35rem;margin-bottom:.8rem;background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.25rem}
.tl-tab{flex:1;background:none;border:none;font-family:inherit;font-weight:800;font-size:.86rem;color:var(--muted);padding:.5rem;border-radius:9px;cursor:pointer}
.tl-tab.on{background:var(--surf);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tl-sum-h{font-size:.92rem;font-weight:800;color:var(--text);margin:.5rem 0 .55rem}
.tl-sumstats .td-stat{position:relative;padding-bottom:1.5rem}
.tl-delta{position:absolute;left:0;right:0;bottom:.42rem;font-size:.66rem;font-weight:800}
.tl-delta.up{color:#1a9d5a}
.tl-delta.down{color:#c73b63}
.tl-chart-t{font-size:.78rem;font-weight:800;color:var(--muted);margin:.55rem 0 .15rem}
.tl-chartwrap{position:relative;height:180px;margin:.15rem 0 .55rem}
.tl-note{font-size:.82rem;color:var(--muted);text-align:center;padding:1rem 0}
.tl-onepoint{background:#fdeef2;border:1px solid #f6d0dc;border-radius:14px;padding:.75rem .9rem;margin-top:.6rem}
.tl-op-t{font-size:.78rem;font-weight:800;color:#c73b63;margin-bottom:.3rem}
.tl-op-b{font-size:.82rem;line-height:1.6;color:#5f3a44}
/* ── 使い方ガイド（別ページ・項目別） ── */
.ug-intro{font-size:.86rem;line-height:1.6;color:var(--muted);margin:.1rem 0 1rem;text-align:center}
.ug-sec{background:var(--surf);border:1px solid var(--border);border-radius:16px;margin-bottom:.7rem;overflow:hidden}
.ug-sec-head{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:none;font-family:inherit;text-align:left;padding:.85rem 1rem;cursor:pointer;color:var(--text)}
.ug-sec-head:active{background:var(--surf2)}
.ug-sec-ic{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:var(--surf2);color:var(--blue);display:flex;align-items:center;justify-content:center}
.ug-sec-ic .mi{width:1.25rem;height:1.25rem}
.ug-sec-title{flex:1;min-width:0;font-size:1rem;font-weight:800;color:var(--text)}
.ug-sec-ar{flex:0 0 auto;color:var(--muted);display:flex;transform:rotate(-90deg);transition:transform .2s}
.ug-sec-ar .mi{width:1.1rem;height:1.1rem}
.ug-sec.open .ug-sec-ar{transform:rotate(90deg)}
.ug-sec-body{display:none;padding:.1rem 1.05rem 1rem}
.ug-sec.open .ug-sec-body{display:block}
.ug-p{font-size:.9rem;line-height:1.65;color:var(--muted);margin:.3rem 0}
.ug-steps{display:flex;flex-direction:column;gap:.5rem;margin:.55rem 0}
.ug-step{display:flex;align-items:flex-start;gap:.6rem}
.ug-num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:.02rem}
.ug-step-tx{flex:1;min-width:0;font-size:.9rem;line-height:1.55;color:var(--text)}
.ug-tip{font-size:.82rem;line-height:1.55;color:var(--text);background:color-mix(in srgb,var(--blue) 8%,var(--surf2));border-left:3px solid var(--blue);border-radius:8px;padding:.55rem .7rem;margin:.55rem 0 .2rem}
/* ── バックアップ督促バナー＆データ管理 ── */
.bk-reminder{display:flex;align-items:center;gap:.45rem;margin:.55rem 1.25rem 0;padding:.34rem .5rem .34rem .6rem;
  background:color-mix(in srgb,var(--blue) 10%,var(--surf));border:1px solid color-mix(in srgb,var(--blue) 35%,transparent);border-radius:10px}
.bk-reminder.overdue{background:color-mix(in srgb,var(--red) 10%,var(--surf));border-color:color-mix(in srgb,var(--red) 38%,transparent)}
.bk-reminder .bk-ic{flex:0 0 auto;color:var(--blue);display:flex}
.bk-reminder.overdue .bk-ic{color:var(--red)}
.bk-reminder .bk-ic svg{width:1.05em;height:1.05em}
.bk-tx{flex:1;min-width:0}
.bk-tx .bk-t{font-weight:700;font-size:.78rem;color:var(--text);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-tx .bk-s{font-size:.66rem;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-btn{flex:0 0 auto;display:flex;align-items:center;gap:.25rem;background:var(--blue);color:#fff;border:none;
  border-radius:8px;padding:.32rem .6rem;font-size:.76rem;font-weight:700;font-family:inherit;cursor:pointer}
.bk-reminder.overdue .bk-btn{background:var(--red)}
.bk-btn svg{width:1em;height:1em}
.bk-close{flex:0 0 auto;width:1.45rem;height:1.45rem;display:flex;align-items:center;justify-content:center;
  background:none;border:none;color:var(--muted);font-size:1.05rem;line-height:1;cursor:pointer;border-radius:6px;padding:0}
.bk-close:active{background:color-mix(in srgb,var(--muted) 18%,transparent)}
/* アップデート通知の変更点リスト */
.upd-notes{list-style:none;margin:.35rem 0 .1rem;padding:0;text-align:left;display:flex;flex-direction:column;gap:.5rem}
.upd-notes li{position:relative;padding-left:1.35rem;font-size:.9rem;line-height:1.5;color:var(--txt)}
.upd-notes li::before{content:"";position:absolute;left:.35rem;top:.6em;width:.42rem;height:.42rem;border-radius:50%;background:var(--blue)}
/* ベルのお知らせ（未読バッジ＋一覧） */
.mp-bell{position:relative}
.mp-bell.has-unread::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--surf2)}
.news-list{display:flex;flex-direction:column;gap:.7rem;margin-top:.6rem}
.news-item{padding:.75rem .85rem;border:1px solid var(--border);border-radius:12px;background:var(--surf)}
.news-item.unread{border-color:color-mix(in srgb,var(--blue) 45%,var(--border));background:color-mix(in srgb,var(--blue) 5%,var(--surf))}
.news-date{font-size:.74rem;color:var(--muted)}
.news-title{font-weight:700;font-size:.95rem;margin:.12rem 0 .35rem}
.news-line{font-size:.88rem;line-height:1.55;color:var(--txt);position:relative;padding-left:1rem}
.news-line::before{content:"・";position:absolute;left:0;color:var(--blue)}
.news-empty{color:var(--muted);text-align:center;padding:1.6rem 0}
/* 保存容量とデータ整理シート */
.sm-usage{font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:.4rem}
.sm-bar{height:8px;border-radius:99px;background:var(--surf);border:1px solid var(--border);overflow:hidden}
.sm-fill{height:100%;width:0;background:var(--blue);transition:width .3s}
.sm-note{font-size:.78rem;line-height:1.5;color:var(--muted);margin:.7rem 0 .2rem}
.sm-note.warn{color:var(--red);font-weight:600}
.sm-sec{font-size:.82rem;font-weight:800;color:var(--text);margin:1.1rem 0 .2rem}
.sm-sec .sm-sub{display:block;font-weight:600;font-size:.72rem;color:var(--muted);margin-top:.15rem}
.sm-row{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-top:1px solid var(--border)}
.sm-row .sm-l{flex:1;min-width:0}
.sm-row .sm-nm{font-weight:700;font-size:.88rem;color:var(--text)}
.sm-row .sm-sz{font-size:.73rem;color:var(--muted);margin-top:.12rem;line-height:1.4}
.sm-row .sm-b{flex:0 0 auto;font-size:.78rem;font-weight:700;padding:.42rem .72rem;border-radius:9px;background:var(--surf);border:1px solid var(--border);color:var(--text);font-family:inherit;cursor:pointer;white-space:nowrap}
.sm-row .sm-b.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.bk-info{font-size:.72rem;color:var(--muted);line-height:1.7;margin-top:.6rem}
/* ── ホームの本日のセッション予定 ── */
.home-sched .hs-row,.sched-day .hs-row{display:flex;align-items:center;gap:.6rem;padding:.65rem .3rem;border-bottom:1px solid var(--border)}
.home-sched .hs-row:last-child,.sched-day .hs-row:last-child{border-bottom:none}
.home-sched .hs-name,.sched-day .hs-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-sched .hs-sub,.sched-day .hs-sub{font-size:.72rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.05rem}
.home-sched .hs-badge,.sched-day .hs-badge{flex:0 0 auto;font-size:.7rem;font-weight:800;padding:.2rem .55rem;border-radius:999px;background:var(--surf3);color:var(--muted)}
.home-sched .hs-badge.done,.sched-day .hs-badge.done{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.home-sched .hs-del,.sched-day .hs-del{flex:0 0 auto;background:var(--surf2);border:1px solid var(--border);color:var(--muted);
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.home-sched .hs-del .mi,.sched-day .hs-del .mi{width:15px;height:15px}
.home-sched .hs-del:active,.sched-day .hs-del:active{color:var(--red);border-color:var(--red)}
.sched-day .sd-cnt{flex:0 0 auto;font-size:.72rem;font-weight:800;color:var(--muted);background:var(--surf3);padding:.15rem .5rem;border-radius:999px}
.sched-day .sd-slot{color:var(--blue)}
.sched-day .hs-time{flex:0 0 auto;font-size:.72rem;font-weight:800;padding:.28rem .55rem;border-radius:8px;cursor:pointer;
  background:var(--surf2);border:1px solid var(--border);color:var(--muted)}
.sched-day .hs-time.set{background:color-mix(in srgb,var(--blue) 15%,transparent);border-color:var(--blue);color:var(--blue)}
/* ── 料金プラン（表示のみ） ── */
.plan-card{background:linear-gradient(160deg,var(--surf2),var(--surf));border:1.5px solid var(--blue);
  border-radius:18px;padding:1.2rem;position:relative;overflow:hidden}
.plan-badge{display:inline-block;background:var(--blue);color:#fff;font-size:.7rem;font-weight:800;padding:.22rem .62rem;border-radius:999px;letter-spacing:.03em}
.plan-name{font-size:1.15rem;font-weight:800;color:var(--text);margin:.6rem 0 .15rem}
.plan-price{display:flex;align-items:baseline;gap:.15rem;margin:.2rem 0 .1rem}
.plan-price .cur{font-size:1.15rem;font-weight:800;color:var(--text)}
.plan-price b{font-size:2.15rem;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1}
.plan-price .per{font-size:.85rem;color:var(--muted);font-weight:700;margin-left:.15rem}
.plan-sub{font-size:.82rem;color:var(--muted);margin-bottom:.7rem}
.plan-feats{list-style:none;padding:0;margin:.7rem 0 0;display:flex;flex-direction:column;gap:.6rem}
.plan-feat{display:flex;gap:.55rem;align-items:flex-start;font-size:.88rem;color:var(--text);line-height:1.45}
.plan-feat .fi{flex:0 0 auto;color:var(--green);margin-top:.02rem}
.plan-feat .fi .mi{width:1.15rem;height:1.15rem}
.plan-feat b{font-weight:800}
.plan-cta{margin-top:1.1rem}
.plan-cta .btn[disabled]{opacity:.55}
.plan-note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:.55rem;line-height:1.55}
.plan-free{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:.85rem .95rem;margin-bottom:.75rem;display:flex;gap:.6rem;align-items:flex-start}
.plan-free .fi{flex:0 0 auto;color:var(--blue);margin-top:.05rem}
.plan-free .fi .mi{width:1.2rem;height:1.2rem}
.plan-free .ft{font-size:.86rem;line-height:1.5;color:var(--text)}
.plan-free .ft b{font-weight:800}
.plan-free .ft .lbl{display:block;font-size:.72rem;color:var(--muted);font-weight:800;letter-spacing:.03em;margin-bottom:.12rem}
.plan-trial{display:inline-flex;align-items:center;gap:.35rem;background:rgba(25,211,144,.16);color:var(--green);
  font-size:.8rem;font-weight:800;padding:.32rem .7rem;border-radius:999px;margin-top:.6rem}
.plan-trial .mi{width:1rem;height:1rem}
/* ── ビフォーアフター写真 ── */
.ph-hint{color:var(--muted);font-size:.82rem;line-height:1.55;margin:.1rem 0 .9rem}
.ph-add{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.85rem;
  border:1.5px dashed var(--line);border-radius:14px;background:var(--surf2);color:var(--blue);
  font-weight:800;font-size:.92rem;cursor:pointer;transition:filter .12s ease,transform .12s ease}
.ph-add:active{transform:scale(.98);filter:brightness(.95)}
.ph-add .mi{width:1.15rem;height:1.15rem}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.ph-cell{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surf3);
  cursor:pointer;border:1px solid var(--line)}
.ph-cell.picked{outline:3px solid var(--blue);outline-offset:-3px}
.ph-cell img{width:100%;height:100%;object-fit:cover;display:block}
.ph-cell .ph-date{position:absolute;left:0;right:0;bottom:0;padding:.5rem .4rem .3rem;font-size:.68rem;
  font-weight:800;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.7));
  font-variant-numeric:tabular-nums}
.ph-cell .ph-pick{position:absolute;top:.35rem;left:.35rem;width:1.35rem;height:1.35rem;border-radius:50%;
  background:var(--blue);color:#fff;font-size:.72rem;font-weight:800;display:none;align-items:center;justify-content:center}
.ph-cell.picked .ph-pick{display:flex}
.ph-empty{text-align:center;color:var(--muted);font-size:.88rem;padding:2rem .6rem;line-height:1.6}
.ph-cmpbar{display:flex;gap:.5rem;margin-top:1rem}
.ph-cmpbar .btn{margin-top:0}
/* 比較ビュー */
.ph-cmp-pair{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.3rem 0 .8rem}
.ph-cmp-side{background:var(--surf3);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ph-cmp-tag{font-size:.72rem;font-weight:800;text-align:center;padding:.4rem;letter-spacing:.04em}
.ph-cmp-tag.before{background:rgba(110,120,135,.2);color:var(--muted)}
.ph-cmp-tag.after{background:rgba(41,121,255,.18);color:var(--blue)}
.ph-cmp-side img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.ph-cmp-d{text-align:center;font-size:.74rem;font-weight:700;color:var(--muted);padding:.4rem;font-variant-numeric:tabular-nums}
.ph-elapsed{text-align:center;background:var(--surf2);border-radius:12px;padding:.7rem;margin-bottom:.9rem}
.ph-elapsed .n{font-size:1.4rem;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.ph-elapsed .l{font-size:.76rem;color:var(--muted);font-weight:700;margin-top:.15rem}
.ph-view-img{width:100%;border-radius:14px;display:block;max-height:60vh;object-fit:contain;background:#000}

/* ══ iPad / タブレット幅の最適化（幅 ≥ 768px） ══
   スマホ表示(<768px)は一切変更しない＝この @media 内のみで分岐（JS/HTML無変更）。
   ボトムナビ→左サイドレール化 + コンテンツ中央寄せで横間延びを解消し、幅を活用する。 */
@media (min-width:768px){
  :root{--rail-w:92px}

  /* 本体：下ナビ分の余白を撤去し、左レール幅ぶんを確保。コンテンツは中央寄せ */
  .app{padding-bottom:1.6rem;padding-left:var(--rail-w)}
  .view{max-width:900px;width:100%;margin:0 auto;padding:1.3rem 1.6rem 2.2rem}
  .topbar{padding-left:1.6rem;padding-right:1.6rem}

  /* ボトムナビ → 左サイドレール（縦並び・全高固定） */
  .botnav{top:0;bottom:0;left:0;right:auto;width:var(--rail-w);height:100dvh;
    flex-direction:column;justify-content:flex-start;gap:.15rem;
    padding:calc(1rem + env(safe-area-inset-top)) 0 1rem;
    border-top:none;border-right:1px solid var(--border)}
  .botnav.tucked{display:flex}                 /* iPadではレールを常時表示（隠さない） */
  .botnav button{flex:0 0 auto;width:100%;padding:.7rem 0;font-size:.66rem;gap:.25rem}
  .botnav button .ic svg{width:26px;height:26px}
  /* 選択中インジケータ：上端の横バー → 左端の縦バー */
  .botnav button.on::before{top:50%;left:0;transform:translateY(-50%);
    width:3px;height:26px;border-radius:0 3px 3px 0}

  /* 下部・側部の固定要素をレール基準へ補正 */
  .selbar{left:var(--rail-w)}
  .kana-rail{bottom:1.2rem}
  .toast{left:calc(50% + var(--rail-w) / 2);bottom:1.4rem}

  /* ボトムシート：全幅 → 中央寄せ・最大幅（iPadで横に広がり過ぎない） */
  .sheet{left:var(--rail-w);max-width:620px;margin-left:auto;margin-right:auto}

  /* 幅を活かすグリッド多列化（サマリー4指標を横1列に） */
  .metric-grid{grid-template-columns:repeat(4,1fr)}
  .sum-grid{grid-template-columns:repeat(4,1fr)}

  /* チャートを一回り大きく */
  .chart-wrap,.s-chart-wrap{height:240px}
}

/* ══ PC / デスクトップ最適化（幅 ≥ 1100px） ══
   タブレット(≥768px)の細いアイコンレールを「ラベル付き本格サイドバー」に格上げし、
   マウス操作(hover)・広い横幅・大きめチャートを活かす。JS/HTML は一切変更せず、
   この @media 内のみで分岐する（既存の --rail-w 変数を太らせると app/selbar/toast/sheet が追従）。 */
@media (min-width:1100px){
  :root{--rail-w:236px}

  /* コンテンツ：横幅を活かしつつ間延びしない上限＋ゆったり余白 */
  .view{max-width:1120px;padding:1.6rem 2rem 2.6rem}
  .topbar{padding:calc(.6rem + env(safe-area-inset-top)) 2rem .7rem}
  /* 選択中クライアントのカードをコンテンツ幅に合わせて中央寄せ（横いっぱいに伸ばさない） */
  .cust-card{max-width:1120px;margin-left:auto;margin-right:auto}

  /* 左サイドレール → ラベル付きサイドバー（アイコン＋文字を横並び・左寄せ・当たり判定拡大） */
  .botnav{padding:1.1rem .6rem 1.1rem;gap:.18rem;align-items:stretch;
    background:var(--surf);border-right:1px solid var(--border)}
  .botnav button{flex-direction:row;justify-content:flex-start;gap:.7rem;
    width:100%;padding:.72rem .8rem;border-radius:12px;font-size:.92rem;font-weight:700;
    text-align:left;transition:background .14s ease,color .14s ease}
  .botnav button .ic svg{width:22px;height:22px}
  .botnav button:not(.on):hover{background:var(--surf2);color:var(--text)}
  .botnav button.on{background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--blue)}
  .botnav button.on .ic{transform:none}                    /* サイドバーでは拡大アニメを抑制 */
  .botnav button.on::before{display:none}                  /* 縦バー印は塗りピルに置き換え */

  /* 幅を活かした多列化 */
  .sub-grid{grid-template-columns:repeat(3,1fr)}
  .ph-grid{grid-template-columns:repeat(4,1fr)}
  .mr-boxes{grid-template-columns:repeat(4,1fr)}

  /* チャートをさらに大きく（PCモニタで読みやすく） */
  .chart-wrap,.s-chart-wrap{height:300px}

  /* ボトムシート：レール基準で中央寄せ・PC向けにやや広め */
  .sheet{max-width:680px}
}
</style>
</head>
<body>
<!-- 起動スプラッシュ：アプリアイコンを中央表示→初期化完了でフェードアウト -->
<div id="splash"><img src="./icons/trekaru.png" alt="トレカル" decoding="async"></div>
<div class="app">
  <div class="topbar">
    <div class="cust-card">
      <button class="cc-main" id="custPick" onclick="openCustSheet()">
        <span class="cc-lbl">選択中のクライアント</span>
        <span class="cc-name"><span id="custName">クライアント未選択</span><span class="cc-sama" id="custSama"> 様</span></span>
      </button>
      <div class="cc-acts">
        <button class="cc-list" onclick="openCustSheet()" aria-label="クライアント一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg><span class="cc-list-t">クライアント一覧</span></button>
      </div>
    </div>
  </div>

  <!-- ホーム -->
  <div class="view on" id="vHub"></div>
  <!-- サマリー -->
  <div class="view" id="vSummary"></div>
  <!-- メニュー -->
  <div class="view" id="vMenu"></div>
