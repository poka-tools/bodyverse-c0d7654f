  openSheet(`<h3>${editing?'クライアントを編集':'新しいクライアント'}</h3>
    <div style="display:flex;gap:.55rem">
      <div class="field" style="flex:1"><label>苗字 <span class="req">*</span></label><input class="inp" id="nf_last" placeholder="山田"></div>
      <div class="field" style="flex:1"><label>名前</label><input class="inp" id="nf_first" placeholder="花子"></div>
    </div>
    <div style="display:flex;gap:.55rem">
      <div class="field" style="flex:1"><label>苗字フリガナ</label><input class="inp" id="nf_klast" placeholder="ヤマダ"></div>
      <div class="field" style="flex:1"><label>名前フリガナ</label><input class="inp" id="nf_kfirst" placeholder="ハナコ"></div>
    </div>
    <div class="field" style="margin-top:-.3rem"><label style="color:var(--muted);font-weight:400;font-size:.72rem">フリガナはあいうえお順の並び替えに使用します</label></div>
    <div class="field"><label>性別</label><div class="unit-tog" id="nf_gender">
      <button class="${(!c||c.gender==='female')?'on':''}" data-g="female">女性</button>
      <button class="${c&&c.gender==='male'?'on':''}" data-g="male">男性</button></div></div>
    <div class="field"><label>生年月日</label><input class="inp" id="nf_dob" type="date" max="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>年齢 <span style="color:var(--muted);font-weight:400">(生年月日から自動計算)</span></label>
      <input class="inp" id="nf_age" type="number" inputmode="numeric" placeholder="生年月日を入れると自動、無ければ手入力"></div>
    <button class="btn green" id="cf_save">${editing?'保存':'追加して測定へ'}</button>`);
  if(editing){                                         // 値はDOM代入＝XSS回避。旧データ(name/kana一体)は空白で分割
    const sp=s=>{const t=(s||'').trim(); const i=t.search(/[\s　]/); return i<0?[t,'']:[t.slice(0,i),t.slice(i+1).trim()];};
    const [ln,fn]=c&&c.lastName!=null?[c.lastName,c.firstName||'']:sp(name);
    const [kl,kf]=c&&c.kanaLast!=null?[c.kanaLast,c.kanaFirst||'']:sp(c&&c.kana);
    $('nf_last').value=ln; $('nf_first').value=fn; $('nf_klast').value=kl; $('nf_kfirst').value=kf;
  }
  if(c&&c.dob)$('nf_dob').value=c.dob;
  if(c&&c.age!=null&&!c.dob)$('nf_age').value=c.age;   // dobがあれば下で自動計算
  const gt=$('nf_gender'); gt.querySelectorAll('button').forEach(b=>b.onclick=()=>{gt.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
  // 生年月日→年齢を自動反映（dob入力中はage欄を読み取り専用にして自動値を表示）
  const dobEl=$('nf_dob'), ageEl=$('nf_age');
  function syncAge(){
    const a=ageFromDob(dobEl.value);
    if(a!=null){ ageEl.value=a; ageEl.readOnly=true; ageEl.style.opacity='.7'; }
    else{ ageEl.readOnly=false; ageEl.style.opacity=''; }
  }
  dobEl.oninput=syncAge; syncAge();
  $('cf_save').onclick=()=>saveCust(editing?name:null);
}
window.saveCust=function(orig){
  const lastName=$('nf_last').value.trim(), firstName=$('nf_first').value.trim();
  const kanaLast=$('nf_klast').value.trim(), kanaFirst=$('nf_kfirst').value.trim();
  if(!lastName){toast('苗字を入力してください');return;}
  const name=(lastName+' '+firstName).trim();          // 表示名＝苗字 名前（キーにも使用）
  const kana=(kanaLast+' '+kanaFirst).trim();
  const gender=$('nf_gender').querySelector('.on')?.dataset.g||'female';
  const dobV=$('nf_dob').value||null;
  const derived=ageFromDob(dobV);
  const ageV=$('nf_age').value;
  const age=derived!=null?derived:(ageV!==''?+ageV:undefined);   // 生年月日優先、無ければ手入力
  const all=CDB.all();
  if(orig){ // edit
    if(name!==orig){ if(all[name]){toast('同名の顧客が既にいます');return;} CDB.rename(orig,name); TDB.rename(orig,name); SDB.rename(orig,name); PDB.rename(orig,name); DDB.rename(orig,name); PHDB.rename(orig,name);
      if(SESS&&SESS.client===orig)SESS.client=name;
      const bi=S.boardSel.indexOf(orig); if(bi>=0)S.boardSel[bi]=name; }
    const c=CDB.get(name); c.gender=gender; c.dob=dobV; c.lastName=lastName; c.firstName=firstName;
    if(kana)c.kana=kana; else delete c.kana; c.kanaLast=kanaLast; c.kanaFirst=kanaFirst;
    if(age!=null)c.age=age; else delete c.age; CDB.set(c);
    closeSheet(); toast('保存しました'); selectCust(name); renderCust();
  }else{ // new
    if(all[name]){toast('同名の顧客が既にいます');return;}
    CDB.set({name,lastName,firstName,kana:kana||undefined,kanaLast,kanaFirst,gender,dob:dobV,age,createdAt:new Date().toISOString().slice(0,10),goal:null,records:[]});
    selectCust(name); closeSheet(); toast(name+' を追加しました'); setTab('body'); openRecordSheet(todayISO());
  }
};

/* ══ ビフォーアフター写真（撮影・保存・経過比較） ══ */
function openProgressPhotos(name){
  let view='gallery';        // gallery | compare | detail | addmeta
  let pick=[];               // 比較で選択中の写真id（最大2）
  let detailId=null;         // 詳細表示中の写真id
  let pending=null;          // 追加待ちの圧縮済み画像 {data,w,h}
  const box=el('div');
  // 撮影/選択用の隠しinput（スマホでは capture でカメラ起動、PCではファイル選択）
  const fileInput=el('input'); fileInput.type='file'; fileInput.accept='image/*';
  fileInput.setAttribute('capture','environment'); fileInput.style.display='none';
  fileInput.onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value='';
    if(!f)return;
    try{ toast('画像を処理中…'); pending=await compressImageFile(f,1280,0.82); view='addmeta'; render(); }
    catch(err){ logError('写真の読込に失敗',err&&err.message);
      showInfoModal({icon:'warn',title:'写真を追加できません',text:(err&&err.message)||'別の画像でお試しください。',btn:'OK'}); }
  };
  box.appendChild(fileInput);
  const content=el('div'); box.appendChild(content);

  const pad=n=>String(n).padStart(2,'0');
  const fmtShort=d=>{const p=String(d||'').split('-'); return p.length===3?(p[0].slice(2)+'/'+(+p[1])+'/'+(+p[2])):d;};
  const fmtFull=d=>{const p=String(d||'').split('-'); return p.length===3?(p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'):d;};
  const daysBetween=(a,b)=>{const t1=Date.parse(a+'T00:00:00'),t2=Date.parse(b+'T00:00:00');
    return (isNaN(t1)||isNaN(t2))?null:Math.round(Math.abs(t2-t1)/86400000);};
  // 指定日にもっとも近い体組成記録を返す（比較時に体重差などを添える）
  function nearestRecord(date){
    const recs=(CDB.get(name)?.records)||[]; if(!recs.length)return null;
    const t=Date.parse(date+'T00:00:00'); if(isNaN(t))return null;
    let best=null,bd=Infinity;
    recs.forEach(r=>{const rt=Date.parse((r.date||'')+'T00:00:00'); if(isNaN(rt))return;
      const d=Math.abs(rt-t); if(d<bd){bd=d;best=r;}});
    return best;
  }

  function render(){
    content.innerHTML='';
    if(view==='addmeta'){ renderAddMeta(); return; }
    if(view==='detail'){ renderDetail(); return; }
    if(view==='compare'){ renderCompareResult(); return; }
    renderGallery();
  }

  function renderGallery(){
    const head=el('div'); head.style.cssText='display:flex;align-items:baseline;gap:.5rem;margin:.3rem 0 .2rem';
    head.appendChild(Object.assign(el('h3'),{textContent:'ビフォーアフター',style:'margin:0'}));
    head.appendChild(Object.assign(el('span'),{textContent:name,style:'font-size:.82rem;color:var(--muted);font-weight:700'}));
    content.appendChild(head);
    content.appendChild(el('div','ph-hint','同じ角度・明るさで撮ると変化が分かりやすくなります。撮影日を選んで保存でき、2枚を選ぶと経過を並べて比較できます。'));

    const add=el('div','ph-add'); add.innerHTML=ic('camera')+'<span>写真を撮る / 選ぶ</span>';
    add.onclick=()=>fileInput.click(); content.appendChild(add);

    const photos=PHDB.forClient(name);
    if(!photos.length){
      content.appendChild(Object.assign(el('div','ph-empty'),{textContent:'まだ写真がありません。上のボタンから最初の1枚を追加しましょう。'}));
    }else{
      const grid=el('div','ph-grid');
      photos.forEach(p=>{
        const cell=el('div','ph-cell'+(pick.includes(p.id)?' picked':''));
        const img=el('img'); img.src=p.data; img.alt=fmtShort(p.date); img.loading='lazy'; cell.appendChild(img);
        cell.appendChild(Object.assign(el('div','ph-date'),{textContent:fmtShort(p.date)}));
        const badge=el('div','ph-pick'); badge.textContent=(pick.indexOf(p.id)+1)||''; cell.appendChild(badge);
        cell.onclick=()=>{
          if(pick.length||selecting){ togglePick(p.id); }
          else { detailId=p.id; view='detail'; render(); }
        };
        grid.appendChild(cell);
      });
      content.appendChild(grid);

      // 比較ツールバー
      const bar=el('div','ph-cmpbar');
      if(!selecting && photos.length>=2){
        const cmp=el('button','btn ghost','2枚を選んで比較'); cmp.onclick=()=>{selecting=true;pick=[];render();}; bar.appendChild(cmp);
        const auto=el('button','btn','最古↔最新を比較'); auto.onclick=()=>{
          const sorted=photos.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
          pick=[sorted[0].id,sorted[sorted.length-1].id]; view='compare'; render();
        }; bar.appendChild(auto);
      }else if(selecting){
        const go=el('button','btn'+(pick.length===2?'':' ghost'),pick.length===2?'比較を表示':'2枚選んでください');
        go.disabled=pick.length!==2; go.onclick=()=>{ if(pick.length===2){view='compare';render();} }; bar.appendChild(go);
        const cancel=el('button','btn ghost','やめる'); cancel.onclick=()=>{selecting=false;pick=[];render();}; bar.appendChild(cancel);
      }
      if(bar.childNodes.length)content.appendChild(bar);
    }
    const close=el('button','btn ghost','閉じる'); close.style.marginTop='1rem'; close.onclick=closeSheet; content.appendChild(close);
  }
  let selecting=false;
  function togglePick(id){
    const i=pick.indexOf(id);
    if(i>=0)pick.splice(i,1);
    else{ if(pick.length>=2)pick.shift(); pick.push(id); }
    render();
  }

  function renderAddMeta(){
    content.appendChild(Object.assign(el('h3'),{textContent:'写真を保存',style:'margin:.2rem 0 .8rem'}));
    const prev=el('img','ph-view-img'); prev.src=pending.data; prev.style.maxHeight='42vh'; content.appendChild(prev);
    const lab1=el('div',null,'撮影日'); lab1.style.cssText='font-size:.82rem;font-weight:800;color:var(--muted);margin:1rem 0 .35rem';
    content.appendChild(lab1);
    const dateI=el('input','inp'); dateI.type='date'; dateI.max=todayISO(); dateI.value=todayISO(); content.appendChild(dateI);
    const lab2=el('div',null,'メモ（任意）'); lab2.style.cssText='font-size:.82rem;font-weight:800;color:var(--muted);margin:.9rem 0 .35rem';
    content.appendChild(lab2);
    const noteI=el('input','inp'); noteI.type='text'; noteI.placeholder='例）正面・減量開始時'; noteI.maxLength=60; content.appendChild(noteI);
    const row=el('div'); row.style.cssText='display:flex;gap:.5rem;margin-top:1.1rem';
    const save=el('button','btn','保存する'); save.onclick=()=>{
      const date=dateI.value||todayISO();
      const p={id:'ph'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
        date, data:pending.data, note:(noteI.value||'').trim(), w:pending.w, h:pending.h, createdAt:Date.now()};
      PHDB.add(name,p); pending=null; logInfo('写真を追加', name+' '+date);
      view='gallery'; selecting=false; pick=[]; render(); toast('写真を保存しました');
    };
    const cancel=el('button','btn ghost','キャンセル'); cancel.onclick=()=>{pending=null;view='gallery';render();};
    row.appendChild(save); row.appendChild(cancel); content.appendChild(row);
  }

  function renderDetail(){
    const p=PHDB.forClient(name).find(x=>x.id===detailId);
    if(!p){view='gallery';render();return;}
    const head=el('div'); head.style.cssText='display:flex;align-items:center;gap:.5rem;margin:.2rem 0 .7rem';
    const back=el('button','icon-btn'); back.innerHTML=ic('back'); back.onclick=()=>{view='gallery';render();}; head.appendChild(back);
    head.appendChild(Object.assign(el('h3'),{textContent:fmtFull(p.date),style:'margin:0;font-size:1rem'}));
    content.appendChild(head);
    const img=el('img','ph-view-img'); img.src=p.data; content.appendChild(img);
    if(p.note){const n=el('div',null,p.note); n.style.cssText='margin-top:.7rem;font-size:.9rem;color:var(--text);line-height:1.5'; content.appendChild(n);}
    const rec=nearestRecord(p.date);
    if(rec&&rec.weight!=null){const m=el('div',null,'この頃の体重: '+rec.weight+'kg'+(rec.bodyFatPct!=null?' ・ 体脂肪率 '+rec.bodyFatPct+'%':''));
      m.style.cssText='margin-top:.5rem;font-size:.82rem;color:var(--muted);font-weight:700'; content.appendChild(m);}
    const del=el('button','btn ghost','この写真を削除'); del.style.cssText='margin-top:1.2rem;color:var(--red)';
    del.onclick=()=>uiConfirm('この写真（'+fmtFull(p.date)+'）を削除します。\n⚠️ 元に戻せません。よろしいですか？',()=>{
      PHDB.del(name,p.id); logWarn('写真を削除', name+' '+p.date);
      pick=pick.filter(id=>id!==p.id); view='gallery'; render(); toast('削除しました');
    });
    content.appendChild(del);
  }

  function renderCompareResult(){
    const all=PHDB.forClient(name);
    const two=pick.map(id=>all.find(x=>x.id===id)).filter(Boolean);
    if(two.length!==2){view='gallery';render();return;}
    // 古い方=ビフォー、新しい方=アフター
    two.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const [before,after]=two;
    const head=el('div'); head.style.cssText='display:flex;align-items:center;gap:.5rem;margin:.2rem 0 .8rem';
    const back=el('button','icon-btn'); back.innerHTML=ic('back'); back.onclick=()=>{view='gallery';render();}; head.appendChild(back);
    head.appendChild(Object.assign(el('h3'),{textContent:'ビフォーアフター',style:'margin:0'}));
    content.appendChild(head);

    const days=daysBetween(before.date,after.date);
    if(days!=null){
      const el2=el('div','ph-elapsed');
      el2.appendChild(Object.assign(el('span','n'),{textContent:days+'日'}));
      el2.appendChild(Object.assign(el('div','l'),{textContent:'の経過'}));
      content.appendChild(el2);
    }
    const pair=el('div','ph-cmp-pair');
    [['before','ビフォー',before],['after','アフター',after]].forEach(([cls,tag,p])=>{
      const side=el('div','ph-cmp-side');
      side.appendChild(Object.assign(el('div','ph-cmp-tag '+cls),{textContent:tag}));
      const img=el('img'); img.src=p.data; side.appendChild(img);
      side.appendChild(Object.assign(el('div','ph-cmp-d'),{textContent:fmtShort(p.date)}));
      pair.appendChild(side);
    });
    content.appendChild(pair);

    // 体組成の差（近い記録があれば）
    const rB=nearestRecord(before.date), rA=nearestRecord(after.date);
    if(rB&&rA){
      const rows=[];
      if(rB.weight!=null&&rA.weight!=null)rows.push(['体重',rA.weight-rB.weight,'kg']);
      if(rB.bodyFatPct!=null&&rA.bodyFatPct!=null)rows.push(['体脂肪率',rA.bodyFatPct-rB.bodyFatPct,'%']);
      if(rows.length){
        const tbl=el('div'); tbl.style.cssText='background:var(--surf2);border-radius:12px;padding:.6rem .9rem;margin-bottom:.9rem';
        rows.forEach(([lbl,diff,u])=>{
          const r=el('div'); r.style.cssText='display:flex;justify-content:space-between;align-items:baseline;padding:.3rem 0;font-size:.88rem;font-weight:700';
          r.appendChild(Object.assign(el('span'),{textContent:lbl})); const d=+diff.toFixed(1);
          const good=d<0; const col=d===0?'var(--muted)':(good?'var(--green)':'var(--red)');
          const v=el('span',null,(d>0?'+':'')+d+u); v.style.cssText='color:'+col+';font-variant-numeric:tabular-nums';
          r.appendChild(v); tbl.appendChild(r);
        });
        const note=el('div',null,'※撮影日に最も近い体組成記録から算出'); note.style.cssText='font-size:.68rem;color:var(--muted);margin-top:.25rem';
        tbl.appendChild(note); content.appendChild(tbl);
      }
    }
    const again=el('button','btn ghost','別の2枚を選ぶ'); again.onclick=()=>{selecting=true;pick=[];view='gallery';render();}; content.appendChild(again);
    const close=el('button','btn ghost','閉じる'); close.style.marginTop='.5rem'; close.onclick=closeSheet; content.appendChild(close);
  }

  render(); openSheetNode(box);
}

/* ══ 顧客の部位別トレーニング配分（完了セッションを集計） ══ */
function openPartDistribution(name){
  let period='all';                                   // all / 3m / 1m
  const box=el('div');
  function render(){
    box.innerHTML='';
    box.appendChild(Object.assign(el('h3'),{textContent:name+' の部位別配分'}));
    box.appendChild(el('div','mform-hint','完了したセッションの種目を部位ごとに集計しています。'));
    const chips=el('div','chips'); chips.style.margin='.2rem 0 1rem';
    [['all','全期間'],['3m','直近3ヶ月'],['1m','直近1ヶ月']].forEach(([k,l])=>{
      const b=el('button','chip'+(period===k?' on':''),l); b.onclick=()=>{period=k;render();}; chips.appendChild(b);
    });
    box.appendChild(chips);

    const sessions=SDB.forClient(name);                // 完了セッション（新しい順）
    let cutoff=null;
    if(period!=='all'){const d=new Date(); d.setMonth(d.getMonth()-(period==='3m'?3:1)); cutoff=d.toISOString().slice(0,10);}
    const inRange=sessions.filter(s=>!cutoff||(s.date||'')>=cutoff);
    const counts={}; let total=0;
    inRange.forEach(s=>(s.exercises||[]).forEach(e=>{
      const p=e.part||EX_TO_PART[e.name]||'その他'; counts[p]=(counts[p]||0)+1; total++;
    }));

    if(!total){
      const empty=el('div',null, sessions.length?'この期間の完了セッションがありません。':'完了セッションがまだありません。セッションを記録すると集計されます。');
      empty.style.cssText='color:var(--muted);text-align:center;padding:1.6rem .4rem;font-size:.9rem';
      box.appendChild(empty);
    }else{
      const meta=el('div',null,inRange.length+' セッション ・ 種目実施 '+total+' 回');
      meta.style.cssText='color:var(--muted);font-size:.82rem;font-weight:600;margin-bottom:.8rem';
      box.appendChild(meta);
      Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).forEach(p=>{
        const pct=Math.round(counts[p]/total*100);
        const row=el('div'); row.style.marginBottom='.75rem';
        const head=el('div'); head.style.cssText='display:flex;justify-content:space-between;align-items:baseline;font-size:.88rem;font-weight:700;margin-bottom:.28rem';
        const lft=el('span',null,p);
        const rgt=el('span',null,counts[p]+'回 ・ '+pct+'%'); rgt.style.cssText='color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums';
        head.appendChild(lft); head.appendChild(rgt); row.appendChild(head);
        const track=el('div'); track.style.cssText='height:10px;background:var(--surf3);border-radius:6px;overflow:hidden';
        const fill=el('div'); fill.style.cssText='height:100%;border-radius:6px;transition:width .4s ease;width:'+Math.max(pct,3)+'%;background:'+partColor(p);
        track.appendChild(fill); row.appendChild(track);
        box.appendChild(row);
      });
    }
    const close=el('button','btn ghost','閉じる'); close.style.marginTop='1.1rem'; close.onclick=closeSheet; box.appendChild(close);
  }
  render(); openSheetNode(box);
}

/* ════════ import / export ════════ */
function exportJSON(){
  const data=CDB.all(); if(!Object.keys(data).length){toast('書き出す顧客がいません');return;}
  const out=Object.assign({},data);
  const tr=TDB.load(); if(Object.keys(tr).length)out.__training_v1=tr;   // トレーニング記録も同梱（顧客扱いされない特殊キー）
  const ss=SDB.load(); if(Object.keys(ss).length)out.__sessions_v1=ss;   // セッション履歴も同梱
  const sc=SCHED.all(); if(sc.length)out.__schedule_v1=sc;              // スケジュール（予約・本日＋今後の予定）も同梱
  const cx=XDB.all(); if(cx.length)out.__custom_ex_v1=cx;               // カスタム種目も同梱
  const dr=DDB.load(); if(Object.keys(dr).length)out.__drafts_v1=dr;    // 進行中の下書きも同梱
  const ph=PHDB.load(); if(Object.keys(ph).length)out.__photos_v1=ph;   // ビフォーアフター写真も同梱
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`bodyvis_customers_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  closeSheet(); toast('書き出しました'); logInfo('バックアップ書き出し', Object.keys(data).length+'名');
}
function importJSON(e){
  const file=e.target.files?.[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const incoming=JSON.parse(r.result);
    if(typeof incoming!=='object'||!incoming||Array.isArray(incoming))throw new Error('JSON形式が不正です');
    // トレーニング記録の同梱分を取り出してマージ（顧客ループの前に分離）
    const trIn=incoming.__training_v1; if(trIn&&typeof trIn==='object'){delete incoming.__training_v1;
      const t=TDB.load(); for(const nm in trIn){ if(!Array.isArray(trIn[nm]))continue;
        const ex={}; [...(Array.isArray(t[nm])?t[nm]:[]),...trIn[nm]].forEach(x=>{if(x&&x.id)ex[x.id]=x;}); t[nm]=Object.values(ex); }
      TDB.save(t); }
    const ssIn=incoming.__sessions_v1; if(ssIn&&typeof ssIn==='object'){delete incoming.__sessions_v1;
      const sm=SDB.load(); for(const nm in ssIn){ if(!Array.isArray(ssIn[nm]))continue;
        const byId={}; [...(Array.isArray(sm[nm])?sm[nm]:[]),...ssIn[nm]].forEach(x=>{if(x&&x.id)byId[x.id]=x;});
        sm[nm]=Object.values(byId).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }
      SDB.save(sm); }
    const plIn=incoming.__plans_v1; if(plIn&&typeof plIn==='object'&&!Array.isArray(plIn)){delete incoming.__plans_v1;
      for(const nm in plIn){ const p=plIn[nm]; if(p&&typeof p==='object')SCHED.upsert(nm,p.date||todayISO(),p); } }   // 旧バックアップ互換
    const scIn=incoming.__schedule_v1; if(Array.isArray(scIn)){delete incoming.__schedule_v1;
      const cur=SCHED.load(); scIn.forEach(x=>{ if(x&&x.client&&x.date){ const i=cur.findIndex(y=>y.client===x.client&&y.date===x.date); if(i>=0)cur[i]=x; else cur.push(x); } }); SCHED.save(cur); }
    const cxIn=incoming.__custom_ex_v1; if(Array.isArray(cxIn)){delete incoming.__custom_ex_v1;
      const ex=XDB.all(); cxIn.forEach(it=>{if(it&&it.name&&!ex.some(x=>x.name===it.name))ex.push({name:String(it.name),part:it.part||'',unit:it.unit==='秒'?'秒':'回'});}); XDB.save(ex); }
    const drIn=incoming.__drafts_v1; if(drIn&&typeof drIn==='object'&&!Array.isArray(drIn)){delete incoming.__drafts_v1;
      const dm=DDB.load(); for(const nm in drIn){ if(drIn[nm]&&typeof drIn[nm]==='object')dm[nm]=drIn[nm]; } DDB.save(dm); }
    const phIn=incoming.__photos_v1; if(phIn&&typeof phIn==='object'&&!Array.isArray(phIn)){delete incoming.__photos_v1;
      const pm=PHDB.load(); for(const nm in phIn){ if(!Array.isArray(phIn[nm]))continue;
        const byId={}; [...(Array.isArray(pm[nm])?pm[nm]:[]),...phIn[nm]].forEach(x=>{if(x&&x.id&&x.data)byId[x.id]=x;});
        pm[nm]=Object.values(byId); } PHDB.save(pm); }
    const cur=CDB.all(); let added=0,merged=0;
    Object.values(incoming).forEach(c=>{if(!c||!c.name)return; c.records=Array.isArray(c.records)?c.records:[];
      // 取込データの目標値を数値へ強制（不正値の混入＝XSS/破損を防ぐ）
      if(c.goal&&typeof c.goal==='object'){for(const k of ['weight','bodyFatPct','muscleMass','visceralFat','armM','armF','legM','legF','trunkM','trunkF']){
        if(c.goal[k]!=null){const n=Number(c.goal[k]); c.goal[k]=isNaN(n)?null:n;}}}
      if(cur[c.name]){const byD={};[...(cur[c.name].records||[]),...c.records].forEach(x=>{if(x&&x.date)byD[x.date]=x;});
        cur[c.name].records=Object.values(byD).sort((a,b)=>b.date.localeCompare(a.date));
        if(c.goal)cur[c.name].goal=c.goal; if(c.age!=null&&cur[c.name].age==null)cur[c.name].age=c.age;
        if(c.dob&&!cur[c.name].dob)cur[c.name].dob=c.dob; merged++;}
      else{cur[c.name]=c;added++;}});
    CDB.save(cur); ensureActive(); syncTop();
    showInfoModal({icon:'down',title:'取込完了',text:'新規 '+added+' 名 / 更新 '+merged+' 名 を取り込みました。',btn:'OK'}); logInfo('取込完了','新規'+added+' / 更新'+merged); renderCust(); refreshSettings();
  }catch(err){logError('取込に失敗',err&&err.message); showInfoModal({icon:'warn',title:'取込に失敗しました',text:(err&&err.message)||'ファイル形式をご確認ください。',btn:'OK'});} e.target.value='';};
  r.readAsText(file);
}

  // 1) どこで開いているか（オリジン違いが「名前は出るが数値が空」の主因）
  b.appendChild(row('現在のURL', location.href));

  b.appendChild(row('オリジン', isFile?'file://（共有されません）':location.origin, isFile));

  // 2) 保存キーの中身
  const raw=dbGet(DB_KEY);
  b.appendChild(row('保存先', _idb?'IndexedDB（大容量・自動削除防止）':'localStorage（約5MB上限）', !_idb));
  b.appendChild(row('保存キー', DB_KEY));
  b.appendChild(row('保存サイズ', raw?raw.length.toLocaleString()+'文字':'なし', !raw));

  // 3) bodyvis_ で始まる他キーも一覧（別キーに入っていないか確認）
  const otherKeys=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k!==DB_KEY&&/bodyvis/i.test(k))otherKeys.push(k);}
  if(otherKeys.length)b.appendChild(row('その他のキー', otherKeys.join(', ')));

  // 4) 顧客ごとの記録件数
  const all=CDB.all(), names=Object.keys(all);
  b.appendChild(row('顧客数', names.length+'名', !names.length));
  const noRec=names.filter(n=>!(all[n].records||[]).length);
  b.appendChild(row('記録0件の顧客', noRec.length+'名', noRec.length>0&&noRec.length===names.length));

  const list=el('div'); list.style.cssText='margin-top:.5rem;font-size:.78rem';
  if(!names.length){list.appendChild(el('div',null,'（このオリジンには顧客データがありません）'));}
  names.forEach(n=>{const r=(all[n].records||[]); const line=el('div');
    line.style.cssText='padding:.25rem 0;display:flex;justify-content:space-between;gap:.5rem';
    line.appendChild(el('span',null,n));
    const info=el('span',null, r.length?`記録${r.length}件 / 最新 ${r[0]?.date||'?'} ${fmt(r[0]?.weight)}kg`:'記録0件');
    info.style.cssText='color:'+(r.length?'var(--green)':'var(--red)')+';font-weight:700;text-align:right;white-space:nowrap';
    line.appendChild(info); list.appendChild(line);});
  b.appendChild(list);

  // 5) 判定メッセージ
  const verdict=el('div'); verdict.style.cssText='margin-top:.7rem;padding:.6rem .7rem;border-radius:10px;font-size:.8rem;line-height:1.5;background:var(--surf2);border:1px solid var(--border)';
  let msg;
  if(!names.length) msg='このオリジンに顧客がいません。index-3d側と別オリジンで開いている可能性大。下の「取り込む(JSON)」でこの画面に直接JSONを読み込んでください。';
  else if(noRec.length===names.length) msg='顧客はいるが全員が記録0件。名前だけの顧客が残り、記録付きデータは未取込です。「取り込む(JSON)」でJSONを読み込めば記録が入ります。';
  else if(noRec.length) msg=`一部（${noRec.length}名）が記録0件です。残りは正常に記録が入っています。`;
  else msg='全顧客に記録が入っています。表示は正常な状態です。';
  verdict.textContent=msg; b.appendChild(verdict);

  det.appendChild(b); return det;
}

const getCss=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ════════ charts ════════ */
Chart.defaults.font.family="'Hiragino Kaku Gothic ProN','Segoe UI',sans-serif";
function drawLine(canvasId,labels,series,goal){
  if(charts[canvasId]){charts[canvasId].destroy();}
  const ctx=$(canvasId); if(!ctx)return;
  const multi=series.length>1;   // 複数系列（まとめグラフ）は塗り無し＝線が重なっても見やすい
  // 完全な日付(YYYY-MM-DD)なら「時間軸(linear)」で実際の測定間隔を反映＝毎日/週数回など不定期でも正しい間隔に。
  // 月のみの旧データ等はカテゴリ軸にフォールバック（等間隔）。
  const isDate=labels.length>0&&labels.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  const xs=isDate?labels.map(d=>new Date(d+'T00:00:00').getTime()):null;
  const mk=data=>isDate?data.map((y,i)=>({x:xs[i],y})):data;
  // ネイティブの点描画は 0 にして、ワイプ先端を通過した点だけを revealPlugin が自前でフル描画する
  // （矩形クリップの端が点を横切って「点が半分だけ描かれる」ちらつきを防ぐ）。ホバー/ツールチップは pointHitRadius で維持。
  const ds=series.map(s=>({label:s.label,data:mk(s.data),borderColor:s.color,backgroundColor:multi?'transparent':s.color+'22',
    borderWidth:2.4,tension:.35,pointRadius:0,pointHoverRadius:multi?4:5,pointHitRadius:14,_pr:multi?2:3,pointBackgroundColor:s.color,pointBorderWidth:0,fill:!multi,spanGaps:true}));
  if(goal!=null){const gd=isDate?[{x:xs[0],y:goal},{x:xs[xs.length-1],y:goal}]:labels.map(()=>goal);
    ds.push({label:'目標',data:gd,borderColor:getCss('--gold'),borderWidth:1.4,borderDash:[5,4],pointRadius:0,fill:false});}
  // 縦軸の上に約 +3 の余白を持たせる（グラフ上端に線が張り付かないように）
  const yVals=[]; series.forEach(s=>(s.data||[]).forEach(v=>{if(v!=null&&!isNaN(v))yVals.push(+v);}));
  if(goal!=null&&!isNaN(goal))yVals.push(+goal);
  const yTop=yVals.length?Math.max(...yVals)+3:undefined;
  const shortT=ms=>{const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()}`;};
  const xScale=isDate
    ?{type:'linear',min:xs[0],max:xs[xs.length-1],grid:{display:false},
      ticks:{color:getCss('--muted'),font:{size:10},maxTicksLimit:6,autoSkipPadding:12,callback:v=>shortT(v)}}
    :{grid:{display:false},ticks:{color:getCss('--muted'),font:{size:10},maxTicksLimit:6}};
  charts[canvasId]=new Chart(ctx,{type:'line',
    data:{labels:isDate?undefined:labels.map(d=>chartDateLabel(d)),datasets:ds},
    plugins:[revealPlugin],
    options:{responsive:true,maintainAspectRatio:false,animation:false,   // 描画は下の連続ワイプで滑らかに行う
      parsing:isDate?false:undefined,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:items=>{if(!items.length)return''; return isDate?ymdLabel(new Date(items[0].parsed.x).toISOString().slice(0,10)):items[0].label;}}}},
      scales:{x:xScale,
              y:{suggestedMax:yTop,grid:{color:getCss('--grid')},ticks:{color:getCss('--muted'),font:{size:10}},border:{display:false}}}}});
  startReveal(canvasId,charts[canvasId]);   // 左→右へ滑らかにワイプ表示
}
/* 折れ線を左→右へ連続的に「ワイプ表示」するプラグイン＋駆動関数（点ごとの段階描画より滑らか） */
const revealPlugin={id:'reveal',
  beforeDatasetsDraw(chart){const p=chart.$reveal==null?0:chart.$reveal; chart._revClip=false; if(p>=1)return;   // 未開始(null)は0=非表示にして初期フラッシュを防ぐ
    const a=chart.chartArea, c=chart.ctx; c.save(); c.beginPath();
    c.rect(a.left,a.top,Math.max(0,(a.right-a.left)*p),a.bottom-a.top); c.clip(); chart._revClip=true;},
  afterDatasetsDraw(chart){const c=chart.ctx;
    if(chart._revClip){c.restore(); chart._revClip=false;}   // 折れ線のワイプ用クリップを解除してから点を描く（点はクリップしない＝半分描画を防ぐ）
    const p=chart.$reveal==null?0:chart.$reveal, a=chart.chartArea;
    const front=p>=1?a.right+1e6:a.left+(a.right-a.left)*p;   // ワイプ先端。ここを通過した点だけをフル描画
    chart.data.datasets.forEach((ds,di)=>{const r=ds&&ds._pr; if(!r)return;   // _pr が無い系列（目標線）は点を描かない
      const meta=chart.getDatasetMeta(di); if(!meta||meta.hidden||!meta.data)return;
      const col=ds.pointBackgroundColor||ds.borderColor||'#4f9fff';
      meta.data.forEach(pt=>{if(!pt||pt.x==null||pt.x>front+0.5)return;   // 先端より右の点はまだ出さない
        c.save(); c.beginPath(); c.fillStyle=col; c.arc(pt.x,pt.y,r,0,Math.PI*2); c.fill(); c.restore();});});}};
const revealTokens={};
function startReveal(id,chart){
  if(!chart||typeof requestAnimationFrame!=='function'){if(chart){chart.$reveal=1;try{chart.draw();}catch(e){}}return;}
  const tok=Symbol(); revealTokens[id]=tok; chart.$reveal=0;
  const dur=1100, t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   // easeInOutCubic＝ゆっくり→速く→ゆっくり
  (function frame(now){
    if(revealTokens[id]!==tok)return;                  // 再描画で置き換わったら停止
    const p=Math.min(1,(now-t0)/dur); chart.$reveal=ease(p);
    try{chart.draw();}catch(e){return;}
    if(p<1)requestAnimationFrame(frame); else chart.$reveal=1;
  })(t0);
}

function buildMReport(c){

/* ════════ レポートを直接PDFダウンロード（jsPDF + html2canvas・遅延読込） ════════ */
function loadScriptOnce(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s);});
}
function loadPdfLibs(){
  const need=[];
  if(!window.html2canvas) need.push(loadScriptOnce('./vendor/html2canvas/html2canvas.min.js'));
  if(!(window.jspdf&&window.jspdf.jsPDF)) need.push(loadScriptOnce('./vendor/jspdf/jspdf.umd.min.js'));
  return Promise.all(need);
}
let _pdfBusy=false;
/* レポートPDFを生成してダウンロード（トレーナー用・共有用で共通コア）。Promiseを返す。 */
function _reportToPDF(c){
  if(_pdfBusy)return Promise.resolve(false); _pdfBusy=true;
  closeSheet();
  return loadQR().catch(()=>null).then(()=>{   // QRを先読みしてレポート内に埋め込む（失敗しても続行）
  if(!buildMReport(c)){ _pdfBusy=false; return Promise.resolve(false); }
  toast('PDFを作成しています…');
  const root=$('mReport'); root.classList.add('pdfgen');
  return loadPdfLibs()
    .then(()=>(document.fonts&&document.fonts.ready)||Promise.resolve())
    .then(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))) // レイアウト・チャート描画確定待ち
    .then(()=>window.html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:root.scrollWidth}))
    .then(canvas=>{
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
      const margin=7, availW=pageW-margin*2, availH=pageH-margin*2;
      // レポート全体を A4 1ページに収める（アスペクト比を保って availW×availH にフィット・高いときは縮小）
      let imgW=availW, imgH=availW*canvas.height/canvas.width;
      if(imgH>availH){ imgH=availH; imgW=availH*canvas.width/canvas.height; }
      const x=(pageW-imgW)/2, y=margin;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',x,y,imgW,imgH,undefined,'FAST');
      pdf.save('BODYVERSE_'+repSan(c.name)+'.pdf');
      toast('PDFを保存しました');
      return true;
    })
    .catch(()=>{ // ライブラリ未読込/生成失敗時は印刷ダイアログへフォールバック
      toast('直接保存に失敗しました。印刷から保存してください');
      try{window.print();}catch(e){}
      return false;
    })
    .finally(()=>{ root.classList.remove('pdfgen'); _pdfBusy=false; });
  });
}
window.downloadReportPDF=function(name){
  const c=CDB.get(name||S.active);
  if(!c){toast('クライアントを選択してください');return;}
  if(!(c.records||[]).length){toast('記録がありません');return;}
  return _reportToPDF(c);
};

/* QR共有ペイロード → 顧客オブジェクトを復元し、トレーナーと同じフルレポートをPDF化。 */
function buildCustomerFromShare(p){
  const rd=x=>(x==null||x===''||isNaN(+x))?null:+x;
  const L=p.L||[], S=p.S||[], G=p.G||[], T=p.T||[];
  const records=[];
  T.forEach(r=>{ const ym=String(r[0]); if(ym.length<4)return;   // 'YYMM' → 20YY-MM-01
    records.push({date:'20'+ym.slice(0,2)+'-'+ym.slice(2,4)+'-01', weight:rd(r[1]), bodyFatPct:rd(r[2]), muscleMass:rd(r[3])}); });
  const latestDate = p.d ? (String(p.d).length>=7?String(p.d).slice(0,7)+'-01':String(p.d)) : (records.length?records[records.length-1].date:null);
  if(latestDate){
    const latest={date:latestDate, weight:rd(L[0]), bodyFatPct:rd(L[1]), muscleMass:rd(L[2]),
      visceralFat:rd(L[3]), bmi:rd(L[4]), bodyAge:rd(L[5]), bmr:rd(L[6]),
      armM:rd(S[0]),armF:rd(S[1]),legM:rd(S[2]),legF:rd(S[3]),trunkM:rd(S[4]),trunkF:rd(S[5])};
    const i=records.findIndex(r=>r.date.slice(0,7)===latest.date.slice(0,7));
    if(i>=0)Object.assign(records[i],latest); else records.push(latest);
  }
  records.sort((a,b)=>b.date.localeCompare(a.date)); // 新しい順（CDB慣習）
  return {
    name: p.n||'ゲスト', gender: p.g||'', age: (p.a!=null&&!isNaN(+p.a))?+p.a:null,
    goal: G.some(g=>rd(g)!=null)?{weight:rd(G[0]),bodyFatPct:rd(G[1]),muscleMass:rd(G[2])}:null,
    records, __gym: p.b||'', __trainer: p.tn||'', __trainerMsg: p.msg||''
  };
}
window.downloadSharedReportPDF=function(payload){
  const c=buildCustomerFromShare(payload||{});
  if(!c.records.length){ try{toast('レポートを作成できるデータがありません');}catch(e){} return Promise.resolve(false); }
  return _reportToPDF(c);
};

/* ════════ QR共有 ════════
   QR = 公開URL + '#share=<圧縮ペイロード>'。スキャンで読み取り専用の結果ビュー
   （このページ冒頭の早期スクリプト）が開く。データはURLフラグメントにのみ含まれ
   サーバー送信されない（オフライン・プライバシー配慮）。 */
const SHARE_PUBLIC_URL='https://poka-tools.github.io/bodyverse-c0d7654f/m.html';
function loadQR(){
  if(window.qrcode)return Promise.resolve(window.qrcode);
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src='./vendor/qrcode/qrcode.js';
    s.onload=()=>window.qrcode?resolve(window.qrcode):reject(new Error('QR初期化に失敗しました'));
    s.onerror=()=>reject(new Error('QRライブラリの読み込みに失敗しました'));
    document.head.appendChild(s);
  });
}
// 共有リンク/QRは相手のスマホで開くため、常に公開URLを基点にする（localhost等では届かないため）。
// 共有データはURLフラグメント(#share=)に全て含まれ、公開版m.htmlがどこでも描画できる。
function shareBaseURL(){ return SHARE_PUBLIC_URL; }
/* URLセーフな base64url（percentエンコード不使用＝QRを小さく保つ・UTF-8対応）。結果ビューの b64urlDecode と対。 */
function b64urlEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

/* 顧客→コンパクト共有ペイロード。形式は冒頭の結果ビュー render() と一致必須。 */
function buildSharePayload(c,opt){
  const anon=opt&&opt.anon; const rd=(x,p=1)=>(x==null||x===''||isNaN(+x))?null:+(+x).toFixed(p);
  const recs=(c.records||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)); // 昇順
  const latest=recs[recs.length-1]||{};
  const prevRec=recs[recs.length-2]||null;   // 前回比の算出用
  // T列: [YYMM, 体重, 体脂肪率, 骨格筋率, BMI]（BMIはWeb版の合成グラフ用に追加。旧リンクは4列＝BMIはnull扱い）
  const trend=recs.slice(-18).map(r=>[r.date.slice(2).replace('-',''),rd(r.weight),rd(r.bodyFatPct),rd(r.muscleMass),rd(bmiOf(r))]);
  const brand=getBrand();
  const gym=(brand.gymName||'').trim(), trainer=(brand.trainerName||'').trim(), tmsg=(brand.trainerMsg||'').trim();
  const p={v:1,d:latest.date||'',
    L:[rd(latest.weight),rd(latest.bodyFatPct),rd(latest.muscleMass),rd(latest.visceralFat),rd(latest.bmi),rd(latest.bodyAge,0),rd(latest.bmr,0)],
    P:prevRec?[rd(prevRec.weight),rd(prevRec.bodyFatPct),rd(prevRec.muscleMass),rd(prevRec.visceralFat),rd(bmiOf(prevRec)),rd(prevRec.bodyAge,0)]:null,
    S:[rd(latest.armM),rd(latest.armF),rd(latest.legM),rd(latest.legF),rd(latest.trunkM),rd(latest.trunkF)],
    G:[rd(c.goal&&c.goal.weight),rd(c.goal&&c.goal.bodyFatPct),rd(c.goal&&c.goal.muscleMass)],
    T:trend};
  if(!anon&&c.name)p.n=c.name;
  if(c.gender)p.g=c.gender;                 // 性別・年齢はレポート表紙用（識別情報ではないので匿名時も含める）
  const _shareAge=custAge(c); if(_shareAge!=null)p.a=_shareAge;   // 共有時点の年齢（生年月日から自動計算）
  if(gym)p.b=gym;
  if(trainer)p.tn=trainer;                  // 担当名（表紙用）
  if(tmsg)p.msg=tmsg;                        // トレーナーからのメッセージ（テキストのみ＝QRに載せられる。画像は載せない）
  return p;
}
function shareLink(c,opt){ return shareBaseURL()+'#share='+b64urlEncode(JSON.stringify(buildSharePayload(c,opt))); }

/* QRモデルを canvas に描画（innerHTML不使用・PNG保存にも使う）。 */
function qrToCanvas(qr,px){
  px=px||560; const n=qr.getModuleCount(),margin=4,total=n+margin*2;
  const cv=document.createElement('canvas'); cv.width=cv.height=px;
  const ctx=cv.getContext('2d'),cell=px/total;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(qr.isDark(r,cc))
    ctx.fillRect(Math.round((cc+margin)*cell),Math.round((r+margin)*cell),Math.ceil(cell),Math.ceil(cell));
  return cv;
}

  let curQR=null,curLink='';

    curLink=shareLink(c,{anon:anonChk.checked});

    for(let t=1;t<=40;t++){ try{const q=window.qrcode(t,'M');q.addData(curLink,'Byte');q.make();curQR=q;break;}catch(e){} }
    link.value=curLink; host.textContent='';

    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(curLink).then(done,()=>{link.select();document.execCommand('copy');done();});
    }else{link.select();document.execCommand('copy');done();}
  };
  previewBtn.onclick=()=>{

    window.open(curLink,'_blank');   // 結果ページを新しいタブで開く＝PDF保存ボタンを確認できる
  };
  saveBtn.onclick=()=>{
    if(!curQR){toast('QRを生成できていません');return;}
    const a=el('a'); a.href=qrToCanvas(curQR,720).toDataURL('image/png');
    a.download=`BODYVERSE_QR_${repSan(c.name)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  anonChk.onchange=refresh;
  openSheetNode(box);

}

/* ════════ アプリロック (A1: PIN) ════════ */
const LOCK_KEY='bodyvis_lock_v1';
function lockConf(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')}catch{return null}}
function lockEnabled(){const c=lockConf();return !!(c&&c.hash);}
function randSalt(){const a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function hashPin(salt,pin){
  const data=salt+':'+pin;
  if(window.crypto&&crypto.subtle){
    try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){/* 非secure環境等はフォールバック */}
  }
  let h=5381; for(let i=0;i<data.length;i++)h=((h*33)^data.charCodeAt(i))>>>0; return 'f'+h.toString(16);
}
async function setPin(pin,autolockMin){
  const salt=randSalt(); const hash=await hashPin(salt,pin);
  lsSet(LOCK_KEY,JSON.stringify({salt,hash,len:pin.length,autolockMin:autolockMin==null?3:autolockMin}));
  logInfo('PINロックを設定/変更');
}
function clearPinLock(){try{localStorage.removeItem(LOCK_KEY)}catch(e){} logInfo('PINロックを解除');}
async function verifyPin(pin){const c=lockConf(); if(!c)return true; return (await hashPin(c.salt,pin))===c.hash;}

let _lockBuf='', _lastHidden=0;
function showLock(){
  if(!lockEnabled()||$('lockOv'))return;
  document.body.classList.add('locked');
  const ov=el('div','lock-ov'); ov.id='lockOv';
  const box=el('div','lock-box');
  const icd=el('div','lock-ic'); icd.innerHTML=ic('lock'); box.appendChild(icd);   // innerHTMLは静的アイコンのみ＝安全
  box.appendChild(el('div','lock-title','ロックを解除'));
  const dots=el('div','lock-dots'); dots.id='lockDots'; box.appendChild(dots);
  const err=el('div','lock-err'); err.id='lockErr'; box.appendChild(err);
  const pad=el('div','lock-pad');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    if(k===''){pad.appendChild(el('span'));return;}
    const b=el('button','lock-key',k); b.type='button'; b.onclick=()=>lockKey(k); pad.appendChild(b);
  });
  box.appendChild(pad); ov.appendChild(box); document.body.appendChild(ov);
  _lockBuf=''; renderLockDots();
}
function renderLockDots(){
  const d=$('lockDots'); if(!d)return; const len=(lockConf()||{}).len||4; d.innerHTML='';
  for(let i=0;i<len;i++)d.appendChild(el('span','lock-dot'+(i<_lockBuf.length?' on':'')));
}
async function lockKey(k){
  const len=(lockConf()||{}).len||4; const err=$('lockErr'); if(err)err.textContent='';
  if(k==='⌫'){_lockBuf=_lockBuf.slice(0,-1);renderLockDots();return;}
  if(_lockBuf.length>=len)return;
  _lockBuf+=k; renderLockDots();
  if(_lockBuf.length>=len){
    if(await verifyPin(_lockBuf)){logInfo('ロック解除');hideLock();}
    else{ if(err)err.textContent='PINが違います'; logWarn('PIN不一致');
      const box=document.querySelector('.lock-box'); if(box){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
      _lockBuf=''; setTimeout(renderLockDots,120); }
  }
}
function hideLock(){const ov=$('lockOv'); if(ov)ov.remove(); document.body.classList.remove('locked'); _lockBuf=''; _lastHidden=0; maybeOnboarding();}
// 物理キーボード（PC）でも入力可
document.addEventListener('keydown',e=>{
  if(!$('lockOv'))return;
  if(/^[0-9]$/.test(e.key))lockKey(e.key);
  else if(e.key==='Backspace'){e.preventDefault();lockKey('⌫');}
});
// 自動ロック: バックグラウンド滞在が設定分を超えたら再ロック
document.addEventListener('visibilitychange',()=>{
  if(!lockEnabled())return;
  if(document.hidden){_lastHidden=Date.now();}
  else{const min=(lockConf()||{}).autolockMin; const m=(min==null?3:min);
    if(m>=0 && _lastHidden && (Date.now()-_lastHidden)>=m*60000)showLock();}
});

}
function renderOnboard(){
  const card=$('obCard'); if(!card)return; card.innerHTML='';   // 中身は下で全てtextContent/静的アイコンで再構築＝安全
  const s=OB_STEPS[_obStep], last=_obStep===OB_STEPS.length-1;
  const top=el('div','ob-top');
  top.appendChild(el('span','ob-step',(_obStep+1)+' / '+OB_STEPS.length));
  const skip=el('button','ob-skip','スキップ'); skip.type='button'; skip.onclick=closeOnboarding;
  top.appendChild(skip); card.appendChild(top);
  const icd=el('div','ob-ic'); icd.innerHTML=ic(s.ic); card.appendChild(icd);   // 静的アイコンSVGのみ
  card.appendChild(el('div','ob-title',s.title));
  card.appendChild(el('div','ob-text',s.text));
  const dots=el('div','ob-dots');
  OB_STEPS.forEach((_,i)=>dots.appendChild(el('span','ob-dot'+(i===_obStep?' on':''))));
  card.appendChild(dots);
  const chk=el('label','ob-check');
  const cb=document.createElement('input'); cb.type='checkbox'; cb.id='obNoShow'; cb.checked=_obNoShow;
  cb.onchange=()=>{_obNoShow=cb.checked;};
  chk.appendChild(cb); chk.appendChild(document.createTextNode('今後この案内を表示しない'));
  card.appendChild(chk);
  const foot=el('div','ob-foot');
  if(_obStep>0){const back=el('button','btn ghost','戻る'); back.type='button'; back.onclick=()=>{_obStep--;renderOnboard();}; foot.appendChild(back);}
  const next=el('button','btn',last?'始める':'次へ'); next.type='button';
  next.onclick=()=>{ if(last)closeOnboarding(); else {_obStep++;renderOnboard();} };
  foot.appendChild(next); card.appendChild(foot);
}
function closeOnboarding(){
  if(_obNoShow){ lsSet(ONBOARD_KEY,'1'); logInfo('使い方案内を今後非表示に設定'); }
  const ov=$('obOv'); if(ov)ov.remove();
}
// 初回のみ自動表示（PIN解除後 or 未ロック起動時に1回だけ）
function maybeOnboarding(){
  if(_obShown)return; if(localStorage.getItem(ONBOARD_KEY)==='1')return;
  _obShown=true; showOnboarding();
}
// 「もう一度見る」用（手動・フラグ無視で必ず表示）
function openHelpGuide(){
  // 各機能の初回説明フラグもリセットして、もう一度出るようにする
  try{ for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i); if(k&&k.indexOf('bodyvis_hint_')===0)localStorage.removeItem(k);} }catch(e){}
  _obNoShow=false; showOnboarding();
}

/* ════════ boot ════════ */
(async function boot(){
  applyThemeVisual(effectiveTheme());   // 早期にテーマ適用（チラつき防止・無料は常にホワイト）
  const _imp=$('importFile'); if(_imp)_imp.onchange=importJSON;   // 取込ファイル入力（常設）を配線
  await hydrateStore();          // IndexedDBを開き、未移行データを移行＆メモリへ読込（データ操作前に完了させる）
  migrateRecDatesToDay();        // 旧・月単位の体組成記録(YYYY-MM)を日付(YYYY-MM-01)へ寄せて、日単位の任意記録と互換に
  migratePlansToSchedule();      // 旧・本日プランを日付つきスケジュール(SCHED)へ移行
  dedupeSchedule();              // 予定の重複(同一クライアント＋同一日)を整理＝人数が二重に見える不具合の保険
  seedPresetMenus();             // 定番メニューを編集可能な形(MDB)へ初回だけ取り込む
  ensureActive(); syncTop();
  setTab('hub');   // 起動時はホーム（メニュー管理ハブ）を表示
  restoreBoardOpen();   // ブラウザ更新(リロード)前に開いていたセッションボードを開き直す＝リセットされない
  if(lockEnabled())showLock();   // ロック設定済みなら起動時に施錠画面を表示（解除後にオンボーディング）
  else maybeOnboarding();        // 未ロックなら起動時に初回案内
  logInfo('起動', location.origin+' / '+(_idb?'IndexedDB':'localStorage'));
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
