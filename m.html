function loggedExercises(client){
  const cnt={};
  SDB.forClient(client).forEach(s=>(s.exercises||[]).forEach(e=>{cnt[e.name]=(cnt[e.name]||0)+1;}));
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
}

/* Bodyverse Score（0-100）：体組成バランス＋目標達成度 */
function bodyverseScore(c){
  const r=sorted(c)[0]; if(!r)return null;
  const clamp=v=>Math.max(0,Math.min(100,v));
  let sc=null;
  if(r.muscleMass!=null&&r.bodyFatPct!=null){
    const muscle=clamp((r.muscleMass-25)/(45-25)*100), fat=clamp((30-r.bodyFatPct)/(30-10)*100);
    sc=(muscle+fat)/2;
  }
  const op=overallProgress(c);
  if(op) sc = sc!=null ? sc*0.6+op.pct*0.4 : op.pct;
  return sc!=null?Math.round(sc):null;
}
/* 種目の前回実績（過去セッションの最重量セット） */
function prevBest(clientName,exName){

    if(e&&e.sets&&e.sets.length){let best=null;
      e.sets.forEach(st=>{const w=+st.w; if(!isNaN(w)&&(best==null||w>+best.w))best=st;});
      if(!best)e.sets.forEach(st=>{const r=+st.r; if(!isNaN(r)&&(best==null||r>+best.r))best=st;}); // 重量なし種目は回/秒/分の最大セット
      if(best)return{date:s.date,w:best.w,r:best.r};}
  }
  return null;
}
/* 種目の重量推移（過去セッションの日毎最重量・昇順） */
function exerciseHistory(clientName,exName){

let SESS=null; // 進行中セッション {client,date,template,part,exercises:[{name,part,sets:[{w,r}]}],memo}
function initSession(c){ SESS={client:c.name,date:new Date().toISOString().slice(0,10),template:'',part:'',exercises:[],memo:'',editId:null}; }
function setFromPrev(client,name){const pb=prevBest(client,name);return{w:pb&&pb.w!=null?String(pb.w):'',r:pb&&pb.r!=null?String(pb.r):'',done:false};}
/* 種目の計測単位：'回'(reps) か '秒'(time)。種目に保存され、無ければ '回'。 */
const uOf=e=>{const u=e&&e.unit; return (u==='秒'||u==='分')?u:'回';};
/* ライブラリ/カスタムの reps 文字列から既定単位を推定（分＝有酸素/秒＝プランク等） */
function defaultUnitFor(name){
  for(const p in EXERCISE_LIB){const e=EXERCISE_LIB[p].find(x=>x.name===name); if(e){const rp=e.reps||''; if(/分/.test(rp))return '分'; if(/秒/.test(rp))return '秒'; return '回';}}
  const cx=XDB.all().find(x=>x.name===name); if(cx&&cx.unit)return cx.unit;
  return '回';
}
/* セット表示行を組み立て（重量が無い自重種目では kg を省く。unit は 回/秒） */
function setLine(w,r,unit,sets){
  const parts=[];
  if(w!=null&&w!==''&&+w>0)parts.push(fmt(w)+'kg');
  parts.push((r!=null&&r!=='')?(r+(unit||'回')):'—');
  let s=parts.join(' × ');
  if(sets!=null)s+=' × '+sets+'セット';
  return s;
}
/* ── 有酸素の消費カロリー（MET法：kcal ≒ MET × 体重kg × 時間h） ── */
const CARDIO_MET={'トレッドミル(ランニング)':8.0,'ウォーキング':3.5,'エアロバイク':7.0,'クロストレーナー':5.0,'ローイングマシン':7.0,'ステアクライマー':8.0,'縄跳び':11.0,'水泳':8.0,'HIIT':8.0};
function metFor(name){return CARDIO_MET[name]||6.0;}          // 未知の有酸素は中強度6.0で概算
function isCardio(e){return (e&&(e.part||partOfExercise(e.name)))==='有酸素';}
function minutesOf(unit,r){const v=+r; if(isNaN(v))return null; return unit==='秒'?v/60:(unit==='分'?v:null);}
/* 進行中セッションのクライアントの最新体重（kg）。無ければ null。 */
function clientWeight(){const c=activeCust(); const rr=c?sorted(c)[0]:null; return rr&&rr.weight!=null?+rr.weight:null;}
function cardioKcal(name,unit,r,bodyKg){const min=minutesOf(unit,r); if(min==null||!bodyKg)return null; return Math.round(metFor(name)*bodyKg*(min/60));}
/* 種目の合計推定消費カロリー（有酸素のみ）。体重未取得なら null。 */
function exKcalTotal(e,bodyKg){ if(!isCardio(e)||!bodyKg)return null; let kc=0,has=false;

/* インラインの細いスパークライン（SVG） */
function sparkSVG(vals,color){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg'); svg.setAttribute('class','spark'); svg.setAttribute('viewBox','0 0 100 30'); svg.setAttribute('preserveAspectRatio','none');
  const pts=(vals||[]).filter(v=>v!=null); if(pts.length<2)return svg;
  const mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),rng=(mx-mn)||1,step=100/(pts.length-1);
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)} ${(28-(v-mn)/rng*24-2).toFixed(1)}`).join(' ');
  const path=document.createElementNS(ns,'path'); path.setAttribute('d',d); path.setAttribute('fill','none');
  path.setAttribute('stroke',color); path.setAttribute('stroke-width','2'); path.setAttribute('stroke-linecap','round'); path.setAttribute('stroke-linejoin','round'); path.setAttribute('vector-effect','non-scaling-stroke');
  svg.appendChild(path); return svg;
}

function buildCalendar(c,all){

function applyTemplate(t,exNames,part){
  const hasData=(SESS.exercises||[]).some(e=>(e.sets||[]).some(s=>String(s.w).trim()!==''||String(s.r).trim()!==''));
  if(hasData&&!confirm('現在の入力内容を破棄してテンプレートを読み込みますか？'))return;
  SESS.editId=null; SESS.template=t.name; SESS.part=part||'';
  SESS.exercises=(exNames||[]).filter(Boolean).map(n=>{
    const ex=exFromName(SESS.client,n);
    const src=((t&&t.exercises)||[]).find(e=>e.name===n);   // 保存メニューの単位・目標(セット/回/休憩)を引き継ぐ
    if(src){
      if(src.unit)ex.unit=src.unit;
      ex.plan={sets:src.sets??null, reps:src.reps??null, rest:src.rest??null};   // 手順表示用の目標
      const nSets=(src.sets!=null&&+src.sets>0)?Math.min(+src.sets,12):1;
      const base=ex.sets[0]||{w:'',r:'',done:false};
      ex.sets=Array.from({length:nSets},()=>({w:base.w,r:'',done:false}));      // 目標セット数ぶんの記入欄を用意

let _dragFrom=null;
function attachDrag(handle,row,index,listEl){
  handle.addEventListener('pointerdown',ev=>{
    ev.preventDefault(); _dragFrom=index; row.classList.add('dragging');
    try{handle.setPointerCapture(ev.pointerId);}catch(e){}
    const move=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);const over=t&&t.closest('.s-card');
      listEl.querySelectorAll('.s-card').forEach(x=>x.classList.remove('dragover'));
      if(over&&over!==row)over.classList.add('dragover');};
    const up=e=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);
      const t=document.elementFromPoint(e.clientX,e.clientY);const over=t&&t.closest('.s-card');
      row.classList.remove('dragging');
      const to=over?+over.dataset.exi:_dragFrom;
      if(to!=null&&!isNaN(to)&&to!==_dragFrom){const it=SESS.exercises.splice(_dragFrom,1)[0];SESS.exercises.splice(to,0,it);}
      _dragFrom=null; renderMenu();};
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up);
  });
}

function buildMenuForm(box){
  box.innerHTML='';

  box.appendChild(seg);

  if(step===0){   // ── 基本情報：名前・目的・レベル・部位を一緒に ──
    const nInp=inputEl('text','mf_name',menuDraft.name); nInp.placeholder='例 上半身プッシュトレーニング'; nInp.oninput=e=>menuDraft.name=e.target.value;

    box.appendChild(chipPicker('レベル',LEVELS,menuDraft.level,val=>{menuDraft.level=val;buildMenuForm(box);}));
    box.appendChild(chipPicker('部位',PARTS,menuDraft.part,val=>{menuDraft.part=val;buildMenuForm(box);}));

  card.appendChild(acts);

// 五十音の行判定（名前の先頭文字→あ〜わ行 / 英字 / その他）
const KANA_ROWS=[[0x3041,0x304A,'あ'],[0x304B,0x3054,'か'],[0x3055,0x305E,'さ'],[0x305F,0x3069,'た'],
  [0x306A,0x306E,'な'],[0x306F,0x307D,'は'],[0x307E,0x3082,'ま'],[0x3083,0x3088,'や'],[0x3089,0x308D,'ら'],[0x308E,0x3093,'わ']];
function kanaGroup(name){
  const s=(name||'').trim(); if(!s)return {ord:99,label:'#'};
  const ch=s[0]; if(/[A-Za-z]/.test(ch))return {ord:90,label:'A-Z'}; if(/[0-9]/.test(ch))return {ord:95,label:'#'};
  let cp=s.codePointAt(0); if(cp>=0x30A1&&cp<=0x30F6)cp-=0x60;   // カタカナ→ひらがなに寄せて判定
  for(let i=0;i<KANA_ROWS.length;i++){const r=KANA_ROWS[i]; if(cp>=r[0]&&cp<=r[1])return {ord:i,label:r[2]};}
  return {ord:98,label:'#'};   // 漢字・記号など
}
// 名前の行 → 五十音インデックスバーのバケット
function railKey(g){ return g.ord<90 ? g.label : (g.ord===90?'A':'#'); }
const RAIL_ORDER=['あ','か','さ','た','な','は','ま','や','ら','わ','A','#'];
let custGroupKeys=[];
function idxDisplay(g){ return g.ord<90 ? g.label+'行' : (g.label==='A-Z'?'A-Z':'その他'); }
function setAllCollapsed(v){ custGroupKeys.forEach(k=>{S.custCollapsed[k]=v;}); renderCustList(); }
function jumpToIdx(key){ const h=$('custList')&&$('custList').querySelector('.cust-idx[data-idx="'+key+'"]'); if(h)h.scrollIntoView({block:'start',behavior:'smooth'}); }
function buildKanaRail(present){
  const host=$('vCust'); const old=host.querySelector('#kanaRail'); if(old)old.remove();
  const wrap=$('custList');
  if(present.size<3){ if(wrap)wrap.style.paddingRight=''; return; }
  if(wrap)wrap.style.paddingRight='16px';
  const rail=el('div','kana-rail'); rail.id='kanaRail';
  RAIL_ORDER.forEach(k=>{ const b=el('button',null,k);
    if(!present.has(k))b.disabled=true; else b.onclick=()=>jumpToIdx(k);
    rail.appendChild(b); });
  host.appendChild(rail);
}
function renderCustList(){
  const wrap=$('custList'); if(!wrap)return; wrap.innerHTML='';
  const all=CDB.all(); let names=Object.keys(all);
  // フリガナがあればそれを五十音の基準に、無ければ名前を使う
  const rd=n=>{const c=all[n]; return (c&&c.kana&&c.kana.trim())||n;};
  const f=custFilter.trim().toLowerCase(); if(f)names=names.filter(n=>n.toLowerCase().includes(f)||rd(n).toLowerCase().includes(f));
  // 行→フリガナ順でソート（グループ見出しを付けられるように）
  names.sort((a,b)=>{const ga=kanaGroup(rd(a)),gb=kanaGroup(rd(b));
    if(ga.ord!==gb.ord)return ga.ord-gb.ord; if(ga.label!==gb.label)return ga.label<gb.label?-1:1; return rd(a).localeCompare(rd(b),'ja');});
  if(!names.length){wrap.style.paddingRight=''; const r=$('vCust').querySelector('#kanaRail'); if(r)r.remove();
    wrap.appendChild(emptyState(custFilter?'該当するクライアントがいません':'クライアントがいません','上のボタンから追加できます'));return;}
  // グループ分割
  const groups=[]; let cur=null;
  names.forEach(n=>{const g=kanaGroup(rd(n)); const key=railKey(g);
    if(!cur||cur.key!==key){cur={key,g,items:[]}; groups.push(cur);} cur.items.push(n);});
  custGroupKeys=groups.map(gr=>gr.key);
  const present=new Set(custGroupKeys);
  const searching=!!f;
  groups.forEach(gr=>{
    const collapsed=!searching&&!!S.custCollapsed[gr.key];
    const h=el('div','cust-idx'+(collapsed?' collapsed':'')); h.dataset.idx=gr.key;
    const cv=el('span','cv','▾'); h.appendChild(cv);
    h.appendChild(document.createTextNode(idxDisplay(gr.g)));
    const ct=el('span','ct',gr.items.length+'名'); h.appendChild(ct);
    if(!searching)h.onclick=()=>{S.custCollapsed[gr.key]=!S.custCollapsed[gr.key]; renderCustList();};
    wrap.appendChild(h);
    if(collapsed)return;
    gr.items.forEach(n=>custRow(n,all,wrap));
  });
  buildKanaRail(present);
}
function custRow(n,all,wrap){

    if(S.multiSel){const cb=el('div','cbox','✓'); row.appendChild(cb);}

      (latest?` ・ 最新 ${fmt(latest.weight)}kg`:'');
    ci.appendChild(cs);
    if(c.goal){const cg=el('div','cg'); const op=overallProgress(c); cg.innerHTML=ic('target')+'目標達成 '+(op?op.pct+'%':'設定済'); ci.appendChild(cg);}
    row.appendChild(ci);
    if(S.multiSel){
      row.onclick=()=>toggleBoardSel(n);
    }else{

      row.onclick=()=>{selectCust(n);setTab('home');};
    }
    wrap.appendChild(row);
}

function toggleMultiSel(){ S.multiSel=!S.multiSel; if(!S.multiSel)S.boardSel=[]; else maybeMultiSessHint(); renderCust(); }

// ドロップダウンの名簿リスト：フリガナ＋五十音見出し＋性別/年齢/記録数/最新体重（クライアント一覧タブと同じ見やすさ）
// ＋五十音ジャンプバー・グループ折りたたみ・最近選択のクイックアクセスで、多人数でもスクロールを最小化
function renderCustSheetList(wrap){
  wrap.innerHTML='';
  const all=CDB.all();
  const rd=n=>{const c=all[n]; return (c&&c.kana&&c.kana.trim())||n;};
  const f=custSheetFilter.trim().toLowerCase();
  const searching=!!f;
  let names=Object.keys(all);
  if(searching)names=names.filter(n=>n.toLowerCase().includes(f)||rd(n).toLowerCase().includes(f));
  names.sort((a,b)=>{const ga=kanaGroup(rd(a)),gb=kanaGroup(rd(b));
    if(ga.ord!==gb.ord)return ga.ord-gb.ord; if(ga.label!==gb.label)return ga.label<gb.label?-1:1; return rd(a).localeCompare(rd(b),'ja');});
  // 行の描画
  const custRowNode=n=>{const c=all[n], recs=sorted(c), latest=recs[0], _age=custAge(c);
    const picked=custSheetMulti&&S.boardSel.includes(n);
    const row=el('div','cust-row'+(picked?' picked':(!custSheetMulti&&n===S.active?' sel':''))); row.style.cursor='pointer';
    let cb=null;
    if(custSheetMulti){ cb=el('div','cbox'); if(picked)cb.textContent='✓'; row.appendChild(cb); }
    const ci=el('div','ci');
    if(c.kana&&c.kana.trim())ci.appendChild(el('div','ck',c.kana.trim()));
    ci.appendChild(el('div','cn',n));
    ci.appendChild(el('div','cs',`${c.gender==='male'?'男性':'女性'}${_age!=null?'・'+_age+'歳':''} ・ 記録${recs.length}件`+(latest?` ・ 最新 ${fmt(latest.weight)}kg`:'')));
    row.appendChild(ci);
    if(!custSheetMulti && n===S.active){ const chk=iconEl('check'); chk.style.color='var(--blue)'; row.appendChild(chk); }
    if(custSheetMulti){
      row.onclick=()=>{ const i=S.boardSel.indexOf(n); if(i>=0)S.boardSel.splice(i,1); else S.boardSel.push(n);
        const on=S.boardSel.includes(n); row.classList.toggle('picked',on); if(cb)cb.textContent=on?'✓':''; updateSheetBoardBar(); };
    } else {
      row.onclick=()=>{selectCust(n);closeSheet();setTab(S.tab);};
    }
    return row;};
  // グループ分割（railKeyごと）
  const groups=[]; let cur=null;
  names.forEach(n=>{const g=kanaGroup(rd(n)), key=railKey(g);
    if(!cur||cur.key!==key){cur={key,g,items:[]}; groups.push(cur);} cur.items.push(n);});
  const present=new Set(groups.map(gr=>gr.key));

  // ①「最近選択」ブロックは廃止（要望により削除）
  // ② 一括開閉ツール（グループが複数・検索していないとき）
  if(!searching&&groups.length>1){
    const tw=el('div','cust-sheet-tools');
    const bClose=el('button',null,'すべて閉じる'); bClose.onclick=()=>{groups.forEach(gr=>custSheetCollapsed[gr.key]=true); renderCustSheetList(wrap);};
    const bOpen=el('button',null,'すべて開く'); bOpen.onclick=()=>{custSheetCollapsed={}; renderCustSheetList(wrap);};
    tw.appendChild(bClose); tw.appendChild(bOpen); wrap.appendChild(tw);
  }
  // ③ スクロール領域（リスト＋ジャンプバー）
  const scroll=el('div','cust-sheet-scroll');
  const list=el('div','cust-sheet-list'); scroll.appendChild(list); wrap.appendChild(scroll);
  if(!names.length){ list.appendChild(emptyState('該当するクライアントがいません','別のキーワードでお試しください')); return; }
  groups.forEach(gr=>{
    const collapsed=!searching&&!!custSheetCollapsed[gr.key];
    const h=el('div','cust-idx'+(collapsed?' collapsed':'')); h.dataset.idx=gr.key;
    if(!searching){const cv=el('span','cv','▾'); h.appendChild(cv);}
    h.appendChild(document.createTextNode(idxDisplay(gr.g)));
    const ct=el('span','ct',gr.items.length+'名'); h.appendChild(ct);
    if(!searching)h.onclick=()=>{custSheetCollapsed[gr.key]=!custSheetCollapsed[gr.key]; renderCustSheetList(wrap);};
    list.appendChild(h);
    if(collapsed)return;
    gr.items.forEach(n=>list.appendChild(custRowNode(n)));
  });
  // ④ 五十音ジャンプバー（3グループ以上・検索していないとき）
  if(!searching&&present.size>=3){
    list.style.paddingRight='20px';
    const rail=el('div','cust-sheet-rail');
    RAIL_ORDER.forEach(k=>{const b=el('button',null,k);
      if(!present.has(k))b.disabled=true;
      else b.onclick=()=>{ custSheetCollapsed[k]=false; renderCustSheetList(wrap);
        const h=wrap.querySelector('.cust-sheet-list .cust-idx[data-idx="'+k+'"]'); if(h)h.scrollIntoView({block:'start'}); };
      rail.appendChild(b);});
    scroll.appendChild(rail);
  }else{ list.style.paddingRight=''; }
  // ⑤ 複数選択中はフッターに「セッションボードを開く」
  if(custSheetMulti){
    const bar=el('div','sheet-board-bar');
    const cnt=el('span','sbb-cnt'); cnt.id='sbbCnt'; cnt.textContent='選択 '+S.boardSel.length+'名';
    const open=el('button','btn'); open.id='sbbOpen'; open.style.margin='0'; open.style.flex='1';
    open.innerHTML=ic('play')+'セッションボードを開く'; open.disabled=!S.boardSel.length;
    open.onclick=()=>{ if(!S.boardSel.length){toast('クライアントを選択してください');return;} closeSheet(); openBoard(); };
    bar.appendChild(cnt); bar.appendChild(open); wrap.appendChild(bar);
  }
}

}

function exportJSON(){
  const data=CDB.all(); if(!Object.keys(data).length){toast('書き出す顧客がいません');return;}
  const out=Object.assign({},data);
  const tr=TDB.load(); if(Object.keys(tr).length)out.__training_v1=tr;   // トレーニング記録も同梱（顧客扱いされない特殊キー）
  const ss=SDB.load(); if(Object.keys(ss).length)out.__sessions_v1=ss;   // セッション履歴も同梱
  const pl=PDB.load(); if(Object.keys(pl).length)out.__plans_v1=pl;      // 本日のプランも同梱
  const cx=XDB.all(); if(cx.length)out.__custom_ex_v1=cx;               // カスタム種目も同梱
  const dr=DDB.load(); if(Object.keys(dr).length)out.__drafts_v1=dr;    // 進行中の下書きも同梱
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`bodyvis_customers_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  closeSheet(); toast('書き出しました'); logInfo('バックアップ書き出し', Object.keys(data).length+'名');
}
function importJSON(e){
  const file=e.target.files?.[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const incoming=JSON.parse(r.result);
    if(typeof incoming!=='object'||!incoming||Array.isArray(incoming))throw new Error('JSON形式が不正です');
    // トレーニング記録の同梱分を取り出してマージ（顧客ループの前に分離）
    const trIn=incoming.__training_v1; if(trIn&&typeof trIn==='object'){delete incoming.__training_v1;
      const t=TDB.load(); for(const nm in trIn){ if(!Array.isArray(trIn[nm]))continue;
        const ex={}; [...(Array.isArray(t[nm])?t[nm]:[]),...trIn[nm]].forEach(x=>{if(x&&x.id)ex[x.id]=x;}); t[nm]=Object.values(ex); }
      TDB.save(t); }
    const ssIn=incoming.__sessions_v1; if(ssIn&&typeof ssIn==='object'){delete incoming.__sessions_v1;
      const sm=SDB.load(); for(const nm in ssIn){ if(!Array.isArray(ssIn[nm]))continue;
        const byId={}; [...(Array.isArray(sm[nm])?sm[nm]:[]),...ssIn[nm]].forEach(x=>{if(x&&x.id)byId[x.id]=x;});
        sm[nm]=Object.values(byId).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }
      SDB.save(sm); }
    const plIn=incoming.__plans_v1; if(plIn&&typeof plIn==='object'&&!Array.isArray(plIn)){delete incoming.__plans_v1;
      const pm=PDB.load(); for(const nm in plIn){ if(plIn[nm]&&typeof plIn[nm]==='object')pm[nm]=plIn[nm]; } PDB.save(pm); }
    const cxIn=incoming.__custom_ex_v1; if(Array.isArray(cxIn)){delete incoming.__custom_ex_v1;
      const ex=XDB.all(); cxIn.forEach(it=>{if(it&&it.name&&!ex.some(x=>x.name===it.name))ex.push({name:String(it.name),part:it.part||'',unit:it.unit==='秒'?'秒':'回'});}); XDB.save(ex); }
    const drIn=incoming.__drafts_v1; if(drIn&&typeof drIn==='object'&&!Array.isArray(drIn)){delete incoming.__drafts_v1;
      const dm=DDB.load(); for(const nm in drIn){ if(drIn[nm]&&typeof drIn[nm]==='object')dm[nm]=drIn[nm]; } DDB.save(dm); }
    const cur=CDB.all(); let added=0,merged=0;
    Object.values(incoming).forEach(c=>{if(!c||!c.name)return; c.records=Array.isArray(c.records)?c.records:[];
      // 取込データの目標値を数値へ強制（不正値の混入＝XSS/破損を防ぐ）
      if(c.goal&&typeof c.goal==='object'){for(const k of ['weight','bodyFatPct','muscleMass','visceralFat','armM','armF','legM','legF','trunkM','trunkF']){
        if(c.goal[k]!=null){const n=Number(c.goal[k]); c.goal[k]=isNaN(n)?null:n;}}}
      if(cur[c.name]){const byD={};[...(cur[c.name].records||[]),...c.records].forEach(x=>{if(x&&x.date)byD[x.date]=x;});
        cur[c.name].records=Object.values(byD).sort((a,b)=>b.date.localeCompare(a.date));
        if(c.goal)cur[c.name].goal=c.goal; if(c.age!=null&&cur[c.name].age==null)cur[c.name].age=c.age;
        if(c.dob&&!cur[c.name].dob)cur[c.name].dob=c.dob; merged++;}
      else{cur[c.name]=c;added++;}});
    CDB.save(cur); ensureActive(); syncTop();
    alert(`取込完了：新規 ${added} 名 / 更新 ${merged} 名`); logInfo('取込完了','新規'+added+' / 更新'+merged); renderCust(); refreshSettings();
  }catch(err){logError('取込に失敗',err&&err.message); alert('取込に失敗しました：'+err.message);} e.target.value='';};
  r.readAsText(file);
}

  const otherKeys=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k!==DB_KEY&&/bodyvis/i.test(k))otherKeys.push(k);}
  if(otherKeys.length)b.appendChild(row('その他のキー', otherKeys.join(', ')));

  // 4) 顧客ごとの記録件数
  const all=CDB.all(), names=Object.keys(all);
  b.appendChild(row('顧客数', names.length+'名', !names.length));
  const noRec=names.filter(n=>!(all[n].records||[]).length);

  const list=el('div'); list.style.cssText='margin-top:.5rem;font-size:.78rem';

    line.style.cssText='padding:.25rem 0;display:flex;justify-content:space-between;gap:.5rem';
    line.appendChild(el('span',null,n));
    const info=el('span',null, r.length?`記録${r.length}件 / 最新 ${r[0]?.date||'?'} ${fmt(r[0]?.weight)}kg`:'記録0件');
    info.style.cssText='color:'+(r.length?'var(--green)':'var(--red)')+';font-weight:700;text-align:right;white-space:nowrap';
    line.appendChild(info); list.appendChild(line);});
  b.appendChild(list);

  // 5) 判定メッセージ
  const verdict=el('div'); verdict.style.cssText='margin-top:.7rem;padding:.6rem .7rem;border-radius:10px;font-size:.8rem;line-height:1.5;background:var(--surf2);border:1px solid var(--border)';
  let msg;
  if(!names.length) msg='このオリジンに顧客がいません。index-3d側と別オリジンで開いている可能性大。下の「取り込む(JSON)」でこの画面に直接JSONを読み込んでください。';
  else if(noRec.length===names.length) msg='顧客はいるが全員が記録0件。名前だけの顧客が残り、記録付きデータは未取込です。「取り込む(JSON)」でJSONを読み込めば記録が入ります。';
  else if(noRec.length) msg=`一部（${noRec.length}名）が記録0件です。残りは正常に記録が入っています。`;
  else msg='全顧客に記録が入っています。表示は正常な状態です。';
  verdict.textContent=msg; b.appendChild(verdict);

  det.appendChild(b); return det;
}

/* ════════ charts ════════ */
Chart.defaults.font.family="'Hiragino Kaku Gothic ProN','Segoe UI',sans-serif";
function drawLine(canvasId,labels,series,goal){
  if(charts[canvasId]){charts[canvasId].destroy();}
  const ctx=$(canvasId); if(!ctx)return;
  const multi=series.length>1;   // 複数系列（まとめグラフ）は塗り無し＝線が重なっても見やすい
  // 完全な日付(YYYY-MM-DD)なら「時間軸(linear)」で実際の測定間隔を反映＝毎日/週数回など不定期でも正しい間隔に。
  // 月のみの旧データ等はカテゴリ軸にフォールバック（等間隔）。
  const isDate=labels.length>0&&labels.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  const xs=isDate?labels.map(d=>new Date(d+'T00:00:00').getTime()):null;
  const mk=data=>isDate?data.map((y,i)=>({x:xs[i],y})):data;
  const ds=series.map(s=>({label:s.label,data:mk(s.data),borderColor:s.color,backgroundColor:multi?'transparent':s.color+'22',
    borderWidth:2.4,tension:.35,pointRadius:multi?2:3,pointBackgroundColor:s.color,pointBorderWidth:0,fill:!multi,spanGaps:true}));
  if(goal!=null){const gd=isDate?[{x:xs[0],y:goal},{x:xs[xs.length-1],y:goal}]:labels.map(()=>goal);
    ds.push({label:'目標',data:gd,borderColor:getCss('--gold'),borderWidth:1.4,borderDash:[5,4],pointRadius:0,fill:false});}
  const shortT=ms=>{const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()}`;};
  const xScale=isDate
    ?{type:'linear',min:xs[0],max:xs[xs.length-1],grid:{display:false},
      ticks:{color:getCss('--muted'),font:{size:10},maxTicksLimit:6,autoSkipPadding:12,callback:v=>shortT(v)}}
    :{grid:{display:false},ticks:{color:getCss('--muted'),font:{size:10},maxTicksLimit:6}};
  charts[canvasId]=new Chart(ctx,{type:'line',
    data:{labels:isDate?undefined:labels.map(d=>chartDateLabel(d)),datasets:ds},
    plugins:[revealPlugin],
    options:{responsive:true,maintainAspectRatio:false,animation:false,   // 描画は下の連続ワイプで滑らかに行う
      parsing:isDate?false:undefined,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:items=>{if(!items.length)return''; return isDate?ymdLabel(new Date(items[0].parsed.x).toISOString().slice(0,10)):items[0].label;}}}},
      scales:{x:xScale,
              y:{grid:{color:getCss('--grid')},ticks:{color:getCss('--muted'),font:{size:10}},border:{display:false}}}}});
  startReveal(canvasId,charts[canvasId]);   // 左→右へ滑らかにワイプ表示
}
/* 折れ線を左→右へ連続的に「ワイプ表示」するプラグイン＋駆動関数（点ごとの段階描画より滑らか） */
const revealPlugin={id:'reveal',
  beforeDatasetsDraw(chart){const p=chart.$reveal==null?0:chart.$reveal; if(p>=1)return;   // 未開始(null)は0=非表示にして初期フラッシュを防ぐ
    const a=chart.chartArea, c=chart.ctx; c.save(); c.beginPath();
    c.rect(a.left,a.top,Math.max(0,(a.right-a.left)*p),a.bottom-a.top); c.clip();},
  afterDatasetsDraw(chart){const p=chart.$reveal==null?0:chart.$reveal; if(p>=1)return; chart.ctx.restore();}};
const revealTokens={};
function startReveal(id,chart){
  if(!chart||typeof requestAnimationFrame!=='function'){if(chart){chart.$reveal=1;try{chart.draw();}catch(e){}}return;}
  const tok=Symbol(); revealTokens[id]=tok; chart.$reveal=0;
  const dur=1100, t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   // easeInOutCubic＝ゆっくり→速く→ゆっくり
  (function frame(now){
    if(revealTokens[id]!==tok)return;                  // 再描画で置き換わったら停止
    const p=Math.min(1,(now-t0)/dur); chart.$reveal=ease(p);
    try{chart.draw();}catch(e){return;}
    if(p<1)requestAnimationFrame(frame); else chart.$reveal=1;
  })(t0);
}

function buildMReport(c){
  const root=$('mReport'); root.innerHTML='';
  Object.keys(repCharts).forEach(k=>{repCharts[k].destroy();delete repCharts[k];});
  const a=asc(c); if(!a.length)return false;
  const recs=sorted(c), latest=recs[0], prev=recs[1]||null, first=a[0];
  const brand=getBrand();
  const gymName=c.__gym||brand.gymName, trainerName=c.__trainer||brand.trainerName; // 共有レポートはペイロード由来を優先

  /* ── 表紙 ── */
  const cover=el('div','mr-cover'), ctop=el('div','mr-cover-top'), cl=el('div');
  if(gymName)cl.appendChild(el('div','mr-gym',gymName));
  cl.appendChild(el('div','mr-title','BODY COMPOSITION REPORT'));
  const meta=el('div','mr-meta');
  const _age=custAge(c);

  meta.appendChild(el('div',null,`対象期間: ${ymdLabel(first.date)} 〜 ${ymdLabel(latest.date)}　/　${a.length} 件の測定`));
  if(trainerName)meta.appendChild(el('div',null,`担当: ${trainerName}`));
  meta.appendChild(el('div',null,`発行日: ${new Date().toLocaleDateString('ja-JP')}`));
  cl.appendChild(meta); ctop.appendChild(cl);
  const op=overallProgress(c);
  if(op){const col=op.pct>=100?'#1e8e5a':op.pct>=50?'#2563c0':'#c08a00';
    const ab=el('div','mr-ach');
    ab.appendChild(el('div','mr-ach-lbl',first.date===latest.date?'達成度（初回）':'総合達成度'));
    const big=el('div','mr-ach-pct',op.pct+'%'); big.style.color=col; ab.appendChild(big);
    ctop.appendChild(ab);}
  cover.appendChild(ctop); root.appendChild(cover);

  /* ── Before → After（初回 → 最新） ── */
  if(first.date!==latest.date){
    root.appendChild(el('h2',null,'Before → After'));
    const t=document.createElement('table');
    const thead=document.createElement('thead'),hr=document.createElement('tr');
    ['指標',`初回（${ymdLabel(first.date)}）`,`最新（${ymdLabel(latest.date)}）`,'変化'].forEach(h=>hr.appendChild(el('th',null,h)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb=document.createElement('tbody');
    [['weight','kg'],['bodyFatPct','%'],['muscleMass','%']].forEach(([k,u])=>{
      const m=METRICS[k],tr=document.createElement('tr');
      tr.appendChild(el('td',null,m.lbl));
      tr.appendChild(el('td',null,first[k]!=null?fmt(first[k])+u:'—'));
      tr.appendChild(el('td',null,latest[k]!=null?fmt(latest[k])+u:'—'));
      let txt='—',cls=null;
      if(first[k]!=null&&latest[k]!=null){const d=latest[k]-first[k];
        txt=(d>0?'+':'')+fmt(d)+u;
        cls=Math.abs(d)<1e-9?null:((d<0)===(m.dir==='down')?'mr-down':'mr-up');}
      tr.appendChild(el('td',cls,txt)); tb.appendChild(tr);});
    t.appendChild(tb); root.appendChild(t);
  }

  /* ── 測定サマリー（最新・前回比） ── */
  root.appendChild(el('h2',null,'測定サマリー'));
  const boxes=el('div','mr-boxes');
  const mkBox=(lbl,key,unit,val,base)=>{
    const b=el('div','mr-box'); b.appendChild(el('small',null,lbl));
    const line=el('div'); line.appendChild(Object.assign(el('b'),{textContent:val!=null?fmt(val)+unit:'—'}));
    if(val!=null&&base!=null){const d=val-base;
      if(Math.abs(d)>=0.05){const[cls,arw]=deltaClass(key,d);
        const sp=el('span','mr-d '+(cls==='up'?'mr-down':cls==='down'?'mr-up':''),`${arw}${fmt(Math.abs(d))}${unit}`);
        // deltaClass: 'up'=good(緑) 'down'=bad(赤)。印刷では mr-down=緑/mr-up=赤に合わせる
        line.appendChild(sp);}}
    b.appendChild(line); return b;};
  boxes.appendChild(mkBox('体重','weight','kg',latest.weight,prev?.weight));
  boxes.appendChild(mkBox('体脂肪率','bodyFatPct','%',latest.bodyFatPct,prev?.bodyFatPct));
  boxes.appendChild(mkBox('骨格筋率','muscleMass','%',latest.muscleMass,prev?.muscleMass));
  boxes.appendChild(mkBox('BMI','weight','',bmiOf(latest),bmiOf(prev||{})));
  root.appendChild(boxes);

  /* ── 部位別の前月比較（腕・脚・体幹） ── */
  if(prev){
    const PARTS=[['両腕','arm'],['両脚','leg'],['体幹','trunk']];
    const SEGM=[['骨格筋率','M','%','up'],['皮下脂肪率','F','%','down']];
    const has=PARTS.some(([,p])=>SEGM.some(([,mk])=>prev[p+mk]!=null||latest[p+mk]!=null));
    if(has){
      root.appendChild(el('h2',null,'部位別の前月比較（腕・脚・体幹）'));
      const t=document.createElement('table');

      thead.appendChild(hr); t.appendChild(thead);
      const tb=document.createElement('tbody');
      PARTS.forEach(([pl,p])=>SEGM.forEach(([ml,mk,u,dir])=>{
        const pv=prev[p+mk],cv=latest[p+mk],tr=document.createElement('tr');
        tr.appendChild(el('td',null,pl)); tr.appendChild(el('td',null,ml));
        tr.appendChild(el('td',null,pv!=null?fmt(pv)+u:'—'));
        tr.appendChild(el('td',null,cv!=null?fmt(cv)+u:'—'));
        let txt='—',cls=null;
        if(pv!=null&&cv!=null){const d=cv-pv; txt=(d>0?'+':'')+fmt(d)+u;
          cls=Math.abs(d)<1e-9?null:((d<0)===(dir==='down')?'mr-down':'mr-up');}
        tr.appendChild(el('td',cls,txt)); tb.appendChild(tr);}));
      t.appendChild(tb); root.appendChild(t);
    }
  }

  /* ── 目標と達成度 ── */
  if(c.goal&&['weight','bodyFatPct','muscleMass'].some(k=>c.goal[k]!=null)){
    root.appendChild(el('h2',null,'目標と達成度'));
    root.appendChild(el('div','mr-legend','青＝現在　／　緑＝目標'));
    const gb=el('div','mr-boxes mr-boxes-3');
    [['体重','weight','kg'],['体脂肪率','bodyFatPct','%'],['骨格筋率','muscleMass','%']].forEach(([lbl,k,u])=>{
      const g=c.goal[k]; if(g==null)return; const cur=latest[k];
      const box=el('div','mr-box'); box.appendChild(el('small',null,lbl));
      const row=el('div','mr-gb-row');
      row.appendChild(el('span','mr-gb-cur',cur!=null?fmt(cur)+u:'—'));
      row.appendChild(el('span','mr-gb-arrow','→'));
      row.appendChild(el('span','mr-gb-tgt',fmt(g)+u));
      box.appendChild(row);
      if(cur!=null){const rem=g-cur; box.appendChild(el('small','mr-gb-rem',Math.abs(rem)<0.05?'✓ 達成':`あと ${rem>0?'+':''}${fmt(rem)}${u}`));}
      gb.appendChild(box);});
    root.appendChild(gb);
  }

  /* ── 推移グラフ（体重・体脂肪率・骨格筋率・BMI を1つにまとめて表示） ── */
  if(a.length>=2){
    root.appendChild(el('h2',null,'推移グラフ'));
    const labels=a.map(r=>r.date.slice(0,7));
    const defs=[['weight','体重 (kg)','#4f9fff'],['bodyFatPct','体脂肪率 (%)','#ff8a5b'],
                ['muscleMass','骨格筋率 (%)','#19c39a'],['bmi','BMI','#e0a52e']];
    const series=defs.filter(([k])=>k==='bmi'?a.some(r=>bmiOf(r)!=null):a.some(r=>r[k]!=null))
      .map(([k,cap,col])=>({label:cap,data:a.map(r=>k==='bmi'?bmiOf(r):(r[k]??null)),color:col}));
    if(series.length){
      const fig=el('figure','mr-chart'); const cv=repCanvas('mrc_all'); fig.appendChild(cv);
      fig.appendChild(el('figcaption',null,'体重・体脂肪率・骨格筋率・BMI の推移')); root.appendChild(fig);
      repLineMulti(cv,labels,series);
    }
  }

  /* ── 月次推移テーブル ── */
  if(a.length){
    root.appendChild(el('h2',null,'月次推移'));
    const t=document.createElement('table');
    const thead=document.createElement('thead'),hr=document.createElement('tr');
    ['測定日','体重','体脂肪率','骨格筋率','BMI','前回比(体重)'].forEach(h=>hr.appendChild(el('th',null,h)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb=document.createElement('tbody');
    a.forEach((r,i)=>{const p=i>0?a[i-1]:null,tr=document.createElement('tr'),bmi=bmiOf(r);
      tr.appendChild(el('td',null,r.date&&r.date.length>7?String(r.date).replace(/-/g,'/'):ymLabel(r.date)));
      tr.appendChild(el('td',null,r.weight!=null?fmt(r.weight):'—'));
      tr.appendChild(el('td',null,r.bodyFatPct!=null?fmt(r.bodyFatPct):'—'));
      tr.appendChild(el('td',null,r.muscleMass!=null?fmt(r.muscleMass):'—'));
      tr.appendChild(el('td',null,bmi!=null?fmt(bmi):'—'));
      let txt='—',cls=null;
      if(p&&r.weight!=null&&p.weight!=null){const d=r.weight-p.weight; txt=(d>0?'+':'')+fmt(d)+'kg';
        cls=Math.abs(d)<1e-9?null:(d<0?'mr-down':'mr-up');}
      tr.appendChild(el('td',cls,txt)); tb.appendChild(tr);});
    t.appendChild(tb); root.appendChild(t);
  }

  root.appendChild(el('div','mr-disc','※ 本レポートは体組成データに基づく一般的な目安であり、医療診断ではありません。'));
  return true;
}

/* ════════ レポートを直接PDFダウンロード（jsPDF + html2canvas・遅延読込） ════════ */
function loadScriptOnce(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s);});
}
function loadPdfLibs(){
  const need=[];
  if(!window.html2canvas) need.push(loadScriptOnce('./vendor/html2canvas/html2canvas.min.js'));
  if(!(window.jspdf&&window.jspdf.jsPDF)) need.push(loadScriptOnce('./vendor/jspdf/jspdf.umd.min.js'));
  return Promise.all(need);
}
let _pdfBusy=false;
/* レポートPDFを生成してダウンロード（トレーナー用・共有用で共通コア）。Promiseを返す。 */
function _reportToPDF(c){
  if(_pdfBusy)return Promise.resolve(false); _pdfBusy=true;
  closeSheet();
  if(!buildMReport(c)){ _pdfBusy=false; return Promise.resolve(false); }
  toast('PDFを作成しています…');
  const root=$('mReport'); root.classList.add('pdfgen');
  return loadPdfLibs()
    .then(()=>(document.fonts&&document.fonts.ready)||Promise.resolve())
    .then(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))) // レイアウト・チャート描画確定待ち
    .then(()=>window.html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:root.scrollWidth}))
    .then(canvas=>{
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
      const margin=8, imgW=pageW-margin*2;
      const pageHeightPx=(pageH-margin*2)/imgW*canvas.width;   // 1ページ分の画像高さ(px)
      const ratio=canvas.height/(root.scrollHeight||canvas.height); // CSS px → キャンバスpx
      // ブロック境界（見出し/表/グラフを跨がない切れ目）
      const blocks=[...root.children];
      const tops=blocks.map(b=>Math.round(b.offsetTop*ratio));
      const cuts=[]; let start=0, guard=0;
      while(start < canvas.height-1 && guard++<200){
        let end=Math.min(start+pageHeightPx, canvas.height);
        if(end<canvas.height){
          let idx=-1;
          for(let i=0;i<tops.length;i++){ if(tops[i]>start+4 && tops[i]<=end+0.5) idx=i; }
          if(idx>=0){
            if(idx>0 && blocks[idx-1] && blocks[idx-1].tagName==='H2' && tops[idx-1]>start+4) idx--; // 見出しは内容と同ページへ
            if(tops[idx]>start+4) end=tops[idx];  // ブロック先頭で改ページ
          }
          // 1ブロックがページより高い場合は end 据え置き＝やむを得ずハードカット
        }
        end=Math.round(end); if(end<=start+2)end=Math.min(start+pageHeightPx,canvas.height);
        cuts.push([start,end]); start=end;
      }
      cuts.forEach((seg,i)=>{
        const s=seg[0], h=seg[1]-seg[0]; if(h<=0)return;
        const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=h;
        tmp.getContext('2d').drawImage(canvas,0,s,canvas.width,h,0,0,canvas.width,h);
        if(i>0)pdf.addPage();
        pdf.addImage(tmp.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,imgW,h*imgW/canvas.width,undefined,'FAST');
      });
      pdf.save('BODYVERSE_'+repSan(c.name)+'.pdf');
      toast('PDFを保存しました');
      return true;
    })
    .catch(()=>{ // ライブラリ未読込/生成失敗時は印刷ダイアログへフォールバック
      toast('直接保存に失敗しました。印刷から保存してください');
      try{window.print();}catch(e){}
      return false;
    })
    .finally(()=>{ root.classList.remove('pdfgen'); _pdfBusy=false; });
}
window.downloadReportPDF=function(name){
  const c=CDB.get(name||S.active);
  if(!c){toast('クライアントを選択してください');return;}

/* QR共有ペイロード → 顧客オブジェクトを復元し、トレーナーと同じフルレポートをPDF化。 */
function buildCustomerFromShare(p){
  const rd=x=>(x==null||x===''||isNaN(+x))?null:+x;
  const L=p.L||[], S=p.S||[], G=p.G||[], T=p.T||[];
  const records=[];
  T.forEach(r=>{ const ym=String(r[0]); if(ym.length<4)return;   // 'YYMM' → 20YY-MM-01
    records.push({date:'20'+ym.slice(0,2)+'-'+ym.slice(2,4)+'-01', weight:rd(r[1]), bodyFatPct:rd(r[2]), muscleMass:rd(r[3])}); });
  const latestDate = p.d ? (String(p.d).length>=7?String(p.d).slice(0,7)+'-01':String(p.d)) : (records.length?records[records.length-1].date:null);
  if(latestDate){
    const latest={date:latestDate, weight:rd(L[0]), bodyFatPct:rd(L[1]), muscleMass:rd(L[2]),
      visceralFat:rd(L[3]), bmi:rd(L[4]), bodyAge:rd(L[5]), bmr:rd(L[6]),
      armM:rd(S[0]),armF:rd(S[1]),legM:rd(S[2]),legF:rd(S[3]),trunkM:rd(S[4]),trunkF:rd(S[5])};
    const i=records.findIndex(r=>r.date.slice(0,7)===latest.date.slice(0,7));
    if(i>=0)Object.assign(records[i],latest); else records.push(latest);
  }
  records.sort((a,b)=>b.date.localeCompare(a.date)); // 新しい順（CDB慣習）
  return {
    name: p.n||'ゲスト', gender: p.g||'', age: (p.a!=null&&!isNaN(+p.a))?+p.a:null,
    goal: G.some(g=>rd(g)!=null)?{weight:rd(G[0]),bodyFatPct:rd(G[1]),muscleMass:rd(G[2])}:null,
    records, __gym: p.b||'', __trainer: p.tn||''
  };
}
window.downloadSharedReportPDF=function(payload){
  const c=buildCustomerFromShare(payload||{});
  if(!c.records.length){ try{alert('レポートを作成できるデータがありません');}catch(e){} return Promise.resolve(false); }
  return _reportToPDF(c);
};

/* ════════ QR共有 ════════
   QR = 公開URL + '#share=<圧縮ペイロード>'。スキャンで読み取り専用の結果ビュー
   （このページ冒頭の早期スクリプト）が開く。データはURLフラグメントにのみ含まれ
   サーバー送信されない（オフライン・プライバシー配慮）。 */
const SHARE_PUBLIC_URL='https://poka-tools.github.io/bodyverse-c0d7654f/m.html';
function loadQR(){
  if(window.qrcode)return Promise.resolve(window.qrcode);
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src='./vendor/qrcode/qrcode.js';
    s.onload=()=>window.qrcode?resolve(window.qrcode):reject(new Error('QR初期化に失敗しました'));
    s.onerror=()=>reject(new Error('QRライブラリの読み込みに失敗しました'));
    document.head.appendChild(s);
  });
}
// 共有リンク/QRは相手のスマホで開くため、常に公開URLを基点にする（localhost等では届かないため）。
// 共有データはURLフラグメント(#share=)に全て含まれ、公開版m.htmlがどこでも描画できる。
function shareBaseURL(){ return SHARE_PUBLIC_URL; }
/* URLセーフな base64url（percentエンコード不使用＝QRを小さく保つ・UTF-8対応）。結果ビューの b64urlDecode と対。 */
function b64urlEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

/* 顧客→コンパクト共有ペイロード。形式は冒頭の結果ビュー render() と一致必須。 */
function buildSharePayload(c,opt){
  const anon=opt&&opt.anon; const rd=(x,p=1)=>(x==null||x===''||isNaN(+x))?null:+(+x).toFixed(p);
  const recs=(c.records||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)); // 昇順
  const latest=recs[recs.length-1]||{};
  const trend=recs.slice(-18).map(r=>[r.date.slice(2).replace('-',''),rd(r.weight),rd(r.bodyFatPct),rd(r.muscleMass)]);
  const brand=getBrand();
  const gym=(brand.gymName||'').trim(), trainer=(brand.trainerName||'').trim();
  const p={v:1,d:latest.date||'',
    L:[rd(latest.weight),rd(latest.bodyFatPct),rd(latest.muscleMass),rd(latest.visceralFat),rd(latest.bmi),rd(latest.bodyAge,0),rd(latest.bmr,0)],
    S:[rd(latest.armM),rd(latest.armF),rd(latest.legM),rd(latest.legF),rd(latest.trunkM),rd(latest.trunkF)],
    G:[rd(c.goal&&c.goal.weight),rd(c.goal&&c.goal.bodyFatPct),rd(c.goal&&c.goal.muscleMass)],
    T:trend};
  if(!anon&&c.name)p.n=c.name;
  if(c.gender)p.g=c.gender;                 // 性別・年齢はレポート表紙用（識別情報ではないので匿名時も含める）
  const _shareAge=custAge(c); if(_shareAge!=null)p.a=_shareAge;   // 共有時点の年齢（生年月日から自動計算）
  if(gym)p.b=gym;
  if(trainer)p.tn=trainer;                  // 担当名（表紙用）
  return p;
}
function shareLink(c,opt){ return shareBaseURL()+'#share='+b64urlEncode(JSON.stringify(buildSharePayload(c,opt))); }

/* QRモデルを canvas に描画（innerHTML不使用・PNG保存にも使う）。 */
function qrToCanvas(qr,px){
  px=px||560; const n=qr.getModuleCount(),margin=4,total=n+margin*2;
  const cv=document.createElement('canvas'); cv.width=cv.height=px;
  const ctx=cv.getContext('2d'),cell=px/total;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(qr.isDark(r,cc))
    ctx.fillRect(Math.round((cc+margin)*cell),Math.round((r+margin)*cell),Math.ceil(cell),Math.ceil(cell));
  return cv;
}

function buildQRSheet(c){
  const box=el('div','qr-sheet');
  box.appendChild(el('div','qr-name',c.name));         // 先頭に名前（textContent = 安全）

  const host=el('div','qr-host'); box.appendChild(host);

  const note=el('div','qr-note','スキャンすると結果画面が開きます。相手はその画面から「PDFで保存」できます。データはリンク内にのみ含まれ、サーバーには送信されません（オンライン環境で開けます）。');
  box.appendChild(note);

  const anonLbl=el('label','qr-anon');
  const anonChk=el('input'); anonChk.type='checkbox';
  anonLbl.appendChild(anonChk); anonLbl.appendChild(document.createTextNode('名前を含めない（匿名で共有）'));
  box.appendChild(anonLbl);

  const linkRow=el('div','qr-linkrow');
  const link=el('input','qr-link'); link.readOnly=true;
  const copyBtn=el('button','btn'); copyBtn.textContent='コピー';
  linkRow.appendChild(link); linkRow.appendChild(copyBtn); box.appendChild(linkRow);

  // 結果ページを開く（トレーナーがPDF保存ボタンを確認・自分でPDF保存もできる）
  const previewBtn=el('button','btn ghost qr-preview'); previewBtn.innerHTML=ic('link')+'結果ページを開く（PDFで保存を確認）';
  box.appendChild(previewBtn);

  const actions=el('div','qr-actions');
  const saveBtn=el('button','btn green'); saveBtn.textContent='画像を保存';
  const closeBtn=el('button','btn'); closeBtn.textContent='閉じる'; closeBtn.onclick=closeSheet;
  actions.appendChild(saveBtn); actions.appendChild(closeBtn); box.appendChild(actions);

  let curQR=null,curLink='';
  function refresh(){
    curLink=shareLink(c,{anon:anonChk.checked});
    curQR=null;
    // QRには「完全なURL」を入れる（スキャンで結果ページが開く）。Byteモード・ECC=M。
    for(let t=1;t<=40;t++){ try{const q=window.qrcode(t,'M');q.addData(curLink,'Byte');q.make();curQR=q;break;}catch(e){} }
    link.value=curLink; host.textContent='';
    if(!curQR){ const w=el('div',null,'記録が多すぎてQRに収まりません。リンクをコピーして共有してください。');
      w.style.cssText='color:var(--red);font-size:.74rem;text-align:center'; host.appendChild(w); return; }
    host.appendChild(qrToCanvas(curQR,560));   // innerHTML不使用
  }
  copyBtn.onclick=()=>{
    const done=()=>toast('リンクをコピーしました');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(curLink).then(done,()=>{link.select();document.execCommand('copy');done();});
    }else{link.select();document.execCommand('copy');done();}
  };
  previewBtn.onclick=()=>{
    if(!curLink){toast('リンクを生成できていません');return;}
    window.open(curLink,'_blank');   // 結果ページを新しいタブで開く＝PDF保存ボタンを確認できる
  };
  saveBtn.onclick=()=>{
    if(!curQR){toast('QRを生成できていません');return;}
    const a=el('a'); a.href=qrToCanvas(curQR,720).toDataURL('image/png');
    a.download=`BODYVERSE_QR_${repSan(c.name)}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  anonChk.onchange=refresh;
  openSheetNode(box);
  refresh();
}

/* ════════ アプリロック (A1: PIN) ════════ */
const LOCK_KEY='bodyvis_lock_v1';
function lockConf(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')}catch{return null}}
function lockEnabled(){const c=lockConf();return !!(c&&c.hash);}
function randSalt(){const a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function hashPin(salt,pin){
  const data=salt+':'+pin;
  if(window.crypto&&crypto.subtle){
    try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){/* 非secure環境等はフォールバック */}
  }
  let h=5381; for(let i=0;i<data.length;i++)h=((h*33)^data.charCodeAt(i))>>>0; return 'f'+h.toString(16);
}
async function setPin(pin,autolockMin){
  const salt=randSalt(); const hash=await hashPin(salt,pin);
  lsSet(LOCK_KEY,JSON.stringify({salt,hash,len:pin.length,autolockMin:autolockMin==null?3:autolockMin}));
  logInfo('PINロックを設定/変更');
}
function clearPinLock(){try{localStorage.removeItem(LOCK_KEY)}catch(e){} logInfo('PINロックを解除');}
async function verifyPin(pin){const c=lockConf(); if(!c)return true; return (await hashPin(c.salt,pin))===c.hash;}

let _lockBuf='', _lastHidden=0;
function showLock(){
  if(!lockEnabled()||$('lockOv'))return;
  document.body.classList.add('locked');
  const ov=el('div','lock-ov'); ov.id='lockOv';
  const box=el('div','lock-box');
  const icd=el('div','lock-ic'); icd.innerHTML=ic('lock'); box.appendChild(icd);   // innerHTMLは静的アイコンのみ＝安全
  box.appendChild(el('div','lock-title','ロックを解除'));
  const dots=el('div','lock-dots'); dots.id='lockDots'; box.appendChild(dots);
  const err=el('div','lock-err'); err.id='lockErr'; box.appendChild(err);
  const pad=el('div','lock-pad');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    if(k===''){pad.appendChild(el('span'));return;}
    const b=el('button','lock-key',k); b.type='button'; b.onclick=()=>lockKey(k); pad.appendChild(b);
  });
  box.appendChild(pad); ov.appendChild(box); document.body.appendChild(ov);
  _lockBuf=''; renderLockDots();
}
function renderLockDots(){
  const d=$('lockDots'); if(!d)return; const len=(lockConf()||{}).len||4; d.innerHTML='';
  for(let i=0;i<len;i++)d.appendChild(el('span','lock-dot'+(i<_lockBuf.length?' on':'')));
}
async function lockKey(k){
  const len=(lockConf()||{}).len||4; const err=$('lockErr'); if(err)err.textContent='';
  if(k==='⌫'){_lockBuf=_lockBuf.slice(0,-1);renderLockDots();return;}
  if(_lockBuf.length>=len)return;
  _lockBuf+=k; renderLockDots();
  if(_lockBuf.length>=len){
    if(await verifyPin(_lockBuf)){logInfo('ロック解除');hideLock();}
    else{ if(err)err.textContent='PINが違います'; logWarn('PIN不一致');
      const box=document.querySelector('.lock-box'); if(box){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
      _lockBuf=''; setTimeout(renderLockDots,120); }
  }
}
function hideLock(){const ov=$('lockOv'); if(ov)ov.remove(); document.body.classList.remove('locked'); _lockBuf=''; _lastHidden=0; maybeOnboarding();}
// 物理キーボード（PC）でも入力可
document.addEventListener('keydown',e=>{
  if(!$('lockOv'))return;
  if(/^[0-9]$/.test(e.key))lockKey(e.key);
  else if(e.key==='Backspace'){e.preventDefault();lockKey('⌫');}
});
// 自動ロック: バックグラウンド滞在が設定分を超えたら再ロック
document.addEventListener('visibilitychange',()=>{
  if(!lockEnabled())return;
  if(document.hidden){_lastHidden=Date.now();}
  else{const min=(lockConf()||{}).autolockMin; const m=(min==null?3:min);
    if(m>=0 && _lastHidden && (Date.now()-_lastHidden)>=m*60000)showLock();}
});

// PIN設定シート（新規設定・変更）
function openPinSheet(){
  const box=el('div'); box.appendChild(Object.assign(el('h3'),{textContent:lockEnabled()?'PINを変更':'PINロックを設定'}));
  const hint=el('div','mform-hint'); hint.textContent='4〜6桁の数字。端末を触れる人から顧客情報を守ります。'; box.appendChild(hint);
  const f1=el('div','field'); f1.appendChild(Object.assign(el('label'),{textContent:'新しいPIN（4〜6桁）'}));
  const i1=inputEl('tel','pinNew'); i1.setAttribute('inputmode','numeric'); i1.maxLength=6; i1.autocomplete='off'; f1.appendChild(i1); box.appendChild(f1);
  const f2=el('div','field'); f2.appendChild(Object.assign(el('label'),{textContent:'確認のためもう一度'}));
  const i2=inputEl('tel','pinNew2'); i2.setAttribute('inputmode','numeric'); i2.maxLength=6; i2.autocomplete='off'; f2.appendChild(i2); box.appendChild(f2);
  const f3=el('div','field'); f3.appendChild(Object.assign(el('label'),{textContent:'自動ロック（この時間バックグラウンドで再ロック）'}));
  const sel=document.createElement('select'); sel.className='inp'; sel.id='pinAuto';
  [['0','すぐ'],['1','1分'],['3','3分'],['5','5分'],['10','10分'],['-1','しない']].forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];if(o[0]==='3')op.selected=true;sel.appendChild(op);});
  f3.appendChild(sel); box.appendChild(f3);
  const save=el('button','btn green'); save.innerHTML=ic('lock')+'この内容で設定';
  save.onclick=async()=>{
    const p=(i1.value||'').trim(), p2=(i2.value||'').trim();
    if(!/^[0-9]{4,6}$/.test(p)){toast('PINは4〜6桁の数字で入力してください');return;}
    if(p!==p2){toast('確認用PINが一致しません');return;}
    await setPin(p,parseInt(sel.value,10)); closeSheet(); toast('PINロックを設定しました'); refreshSettings();
  };
  box.appendChild(save);
  openSheetNode(box);
}

/* セキュリティ設定セクション（クライアント画面のデータ管理内） */
function buildSecurity(){
  const wrap=el('div'); wrap.style.marginTop='1.2rem';
  wrap.appendChild(sec('セキュリティ'));
  if(!lockEnabled()){
    const b=el('button','btn ghost'); b.innerHTML=ic('lock')+'PINロックを設定'; b.onclick=openPinSheet; wrap.appendChild(b);
    const note=el('div','mform-hint'); note.textContent='端末を紛失・共有しても、PINを知らない人は顧客情報を開けません。'; wrap.appendChild(note);
  }else{
    const c=lockConf();
    const st=el('div'); st.style.cssText='display:flex;align-items:center;gap:.5rem;color:var(--green);font-weight:700;font-size:.9rem;margin:.2rem 0 .6rem';
    st.innerHTML=ic('shield'); st.appendChild(document.createTextNode('PINロック：有効'+(c&&c.autolockMin===-1?'（自動ロックなし）':(c&&c.autolockMin===0?'（即ロック）':'（'+((c&&c.autolockMin)||3)+'分で自動ロック）')))); wrap.appendChild(st);
    const chg=el('button','btn ghost'); chg.innerHTML=ic('edit')+'PIN・自動ロックを変更'; chg.onclick=openPinSheet; wrap.appendChild(chg);
    const off=el('button','btn ghost'); off.innerHTML=ic('trash')+'PINロックを解除（無効化）';
    off.onclick=()=>{ if(confirm('PINロックを解除します。誰でもアプリを開けるようになります。よろしいですか？')){clearPinLock();toast('PINロックを解除しました');refreshSettings();} };
    wrap.appendChild(off);
  }
  return wrap;
}

/* ログ閲覧（A2: 動作・エラー履歴） */
function buildLogView(){
  const det=el('details','more'); det.innerHTML='<summary>'+ic('doc')+'ログ（動作・エラー履歴）</summary>';
  const b=el('div','more-body');
  const bar=el('div'); bar.style.cssText='display:flex;gap:.5rem;margin:.2rem 0 .6rem';
  const exp=el('button','btn ghost'); exp.style.margin='0'; exp.innerHTML=ic('up')+'書き出す';
  exp.onclick=()=>{const blob=new Blob([JSON.stringify(LOG.load(),null,2)],{type:'application/json'});
    const a=el('a'); a.href=URL.createObjectURL(blob); a.download='bodyvis_log_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
  const clr=el('button','btn ghost'); clr.style.margin='0'; clr.innerHTML=ic('trash')+'消去';
  clr.onclick=()=>{ if(confirm('ログをすべて消去します。よろしいですか？（顧客データには影響しません）')){LOG.clear();toast('ログを消去しました');const nv=buildLogView();nv.open=true;det.replaceWith(nv);} };
  bar.appendChild(exp); bar.appendChild(clr); b.appendChild(bar);
  const entries=LOG.load().slice().reverse();
  if(!entries.length){b.appendChild(el('div',null,'ログはまだありません'));}
  entries.forEach(e=>{
    const r=el('div'); r.style.cssText='padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.76rem';
    const top=el('div'); top.style.cssText='display:flex;justify-content:space-between;gap:.5rem';
    const lv=el('span','log-lv',(e.lv||'info').toUpperCase());
    lv.style.color=e.lv==='error'?'var(--red)':(e.lv==='warn'?'var(--gold)':'var(--green)');
    const tm=el('span',null,(e.t||'').replace('T',' ').slice(0,19)); tm.style.cssText='color:var(--muted);font-size:.7rem';
    top.appendChild(lv); top.appendChild(tm); r.appendChild(top);
    r.appendChild(el('div',null,e.m));
    if(e.d){const d=el('div',null,e.d); d.style.cssText='color:var(--muted);font-size:.68rem;word-break:break-all;margin-top:.1rem'; r.appendChild(d);}
    b.appendChild(r);
  });
  det.appendChild(b); return det;
}

/* ════════ 使い方オンボーディング（初回起動の案内・スキップ/今後非表示） ════════ */
const ONBOARD_KEY='bodyvis_onboarded_v1';
let _obShown=false, _obStep=0, _obNoShow=false;
const OB_STEPS=[
  {ic:'shield',title:'BODYVERSE へようこそ',text:'トレーナーのためのクライアント管理アプリです。データは外部に送信されず、この端末の中だけに安全に保存されます。'},
  {ic:'plus',  title:'① クライアントを追加',text:'画面下の「クライアント」タブ →「新しいクライアントを追加」から、担当する方を登録します。'},
  {ic:'edit',  title:'② 体組成を記録',text:'「体組成」タブの「測定を記録」で、体重・体脂肪率・筋肉量などをその日の日付で記録できます。'},
  {ic:'chart', title:'③ セッションとメニュー',text:'「セッション」タブでトレーニングメニューを作り、当日の重量・回数を記録。前回との比較も見られます。'},
  {ic:'doc',   title:'④ 推移の確認と共有',text:'「サマリー」で変化のグラフを確認。レポートはPDF保存やQRコードでクライアントへ共有できます。'},
  {ic:'lock',  title:'⑤ 保護とバックアップ',text:'右上の歯車（設定）からPINロックを設定できます。機種変更・紛失に備え、JSONバックアップの書き出しも設定ページから。'},
];
function showOnboarding(){
  if($('obOv'))return; _obStep=0;
  const ov=el('div','ob-ov'); ov.id='obOv';
  const card=el('div','ob-card'); card.id='obCard';
  ov.appendChild(card); document.body.appendChild(ov);
  renderOnboard();
}
function renderOnboard(){
  const card=$('obCard'); if(!card)return; card.innerHTML='';   // 中身は下で全てtextContent/静的アイコンで再構築＝安全
  const s=OB_STEPS[_obStep], last=_obStep===OB_STEPS.length-1;
  const top=el('div','ob-top');
  top.appendChild(el('span','ob-step',(_obStep+1)+' / '+OB_STEPS.length));
  const skip=el('button','ob-skip','スキップ'); skip.type='button'; skip.onclick=closeOnboarding;
  top.appendChild(skip); card.appendChild(top);
  const icd=el('div','ob-ic'); icd.innerHTML=ic(s.ic); card.appendChild(icd);   // 静的アイコンSVGのみ
  card.appendChild(el('div','ob-title',s.title));
  card.appendChild(el('div','ob-text',s.text));
  const dots=el('div','ob-dots');
  OB_STEPS.forEach((_,i)=>dots.appendChild(el('span','ob-dot'+(i===_obStep?' on':''))));
  card.appendChild(dots);
  const chk=el('label','ob-check');
  const cb=document.createElement('input'); cb.type='checkbox'; cb.id='obNoShow'; cb.checked=_obNoShow;
  cb.onchange=()=>{_obNoShow=cb.checked;};
  chk.appendChild(cb); chk.appendChild(document.createTextNode('今後この案内を表示しない'));
  card.appendChild(chk);
  const foot=el('div','ob-foot');
  if(_obStep>0){const back=el('button','btn ghost','戻る'); back.type='button'; back.onclick=()=>{_obStep--;renderOnboard();}; foot.appendChild(back);}
  const next=el('button','btn',last?'始める':'次へ'); next.type='button';
  next.onclick=()=>{ if(last)closeOnboarding(); else {_obStep++;renderOnboard();} };
  foot.appendChild(next); card.appendChild(foot);
}
function closeOnboarding(){
  if(_obNoShow){ lsSet(ONBOARD_KEY,'1'); logInfo('使い方案内を今後非表示に設定'); }
  const ov=$('obOv'); if(ov)ov.remove();
}
// 初回のみ自動表示（PIN解除後 or 未ロック起動時に1回だけ）
function maybeOnboarding(){
  if(_obShown)return; if(localStorage.getItem(ONBOARD_KEY)==='1')return;
  _obShown=true; showOnboarding();
}
// 「もう一度見る」用（手動・フラグ無視で必ず表示）
function openHelpGuide(){ _obNoShow=false; showOnboarding(); }

/* ════════ boot ════════ */
(async function boot(){
  applyThemeVisual(effectiveTheme());   // 早期にテーマ適用（チラつき防止・無料は常にホワイト）
  const _imp=$('importFile'); if(_imp)_imp.onchange=importJSON;   // 取込ファイル入力（常設）を配線
  await hydrateStore();          // IndexedDBを開き、未移行データを移行＆メモリへ読込（データ操作前に完了させる）
  migrateRecDatesToDay();        // 旧・月単位の体組成記録(YYYY-MM)を日付(YYYY-MM-01)へ寄せて、日単位の任意記録と互換に
  seedPresetMenus();             // 定番メニューを編集可能な形(MDB)へ初回だけ取り込む
  ensureActive(); syncTop();
  setTab('hub');   // 起動時はホーム（メニュー管理ハブ）を表示
  if(lockEnabled())showLock();   // ロック設定済みなら起動時に施錠画面を表示（解除後にオンボーディング）
  else maybeOnboarding();        // 未ロックなら起動時に初回案内
  logInfo('起動', location.origin+' / '+(_idb?'IndexedDB':'localStorage'));
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
