<!DOCTYPE html>
<html lang="ja" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BODYVERSE</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BODYVERSE">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/favicon-192.png">
<script src="./vendor/chartjs/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#15171a;--surf:#1e2024;--surf2:#2a2d33;--surf3:#33373e;
  --text:#e6e8ec;--muted:#9aa0aa;--border:#3a3f46;
  --blue:#4f9fff;--green:#19d390;--gold:#ffd060;--red:#ff6b6b;
  --purple:#b085ff;
  --bar:rgba(21,23,26,.92);--grid:rgba(120,135,160,.12);
  --nav-h:60px;
}
html.light{
  --bg:#f4f6f9;--surf:#ffffff;--surf2:#eef1f5;--surf3:#e2e6ec;
  --text:#1a1c1e;--muted:#6b7280;--border:#dde2e8;
  --blue:#2f7de0;--green:#12a870;--gold:#c9860a;--red:#e2483d;
  --purple:#7c53d6;
  --bar:rgba(255,255,255,.92);--grid:rgba(60,80,110,.10);
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'Hiragino Kaku Gothic ProN','Segoe UI',system-ui,sans-serif;
  -webkit-text-size-adjust:100%;font-size:16px;line-height:1.45}
body{overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
.app{min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}

/* ── top bar ── */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding:calc(.5rem + env(safe-area-inset-top)) .9rem .5rem;
  display:flex;align-items:center;gap:.6rem}
.topbar .logo{height:30px;width:auto}
.cust-pick{flex:1;min-width:0;display:flex;align-items:center;gap:.35rem;
  background:var(--surf2);border:1px solid var(--border);border-radius:10px;
  padding:.5rem .7rem;color:var(--text);font-weight:700;font-size:.98rem}
.cust-pick .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.cust-pick .ar{color:var(--muted);font-size:.7rem}
.icon-btn{background:var(--surf2);border:1px solid var(--border);color:var(--muted);
  border-radius:10px;width:42px;height:42px;font-size:1.15rem;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}

/* ── content ── */
.view{display:none;flex:1;padding:.9rem .9rem 1.4rem;overflow-y:auto}
.view.on{display:block}
.section-t{font-size:.74rem;font-weight:700;letter-spacing:.05em;color:var(--muted);
  text-transform:uppercase;margin:1.1rem .15rem .5rem}
.section-t:first-child{margin-top:.2rem}

/* ── cards ── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:1rem}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.metric{background:var(--surf);border:1px solid var(--border);border-radius:16px;
  padding:.9rem 1rem;position:relative;overflow:hidden}
.metric .lbl{font-size:.78rem;color:var(--muted);font-weight:600}
.metric .val{font-size:2rem;font-weight:800;line-height:1.15;margin-top:.15rem;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.metric .val .u{font-size:.95rem;font-weight:600;color:var(--muted);margin-left:.15rem}
.metric .dl{font-size:.8rem;font-weight:700;margin-top:.25rem;font-variant-numeric:tabular-nums}
.metric.big{grid-column:1 / -1}
.metric.big .val{font-size:2.7rem}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--muted)}
.metric .spark{position:absolute;right:.5rem;bottom:.4rem;opacity:.5}

.sub-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.55rem}
.subm{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.6rem .55rem;text-align:center}
.subm .l{font-size:.66rem;color:var(--muted);font-weight:600}
.subm .v{font-size:1.05rem;font-weight:800;margin-top:.1rem;font-variant-numeric:tabular-nums}

/* ── goal ── */
.goal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.goal-head h3{font-size:.95rem}
.goal-pct{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.gbar{margin:.55rem 0}
.gbar .gl{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.22rem}
.gbar .gl b{font-variant-numeric:tabular-nums}
.gtrack{height:8px;background:var(--surf3);border-radius:6px;overflow:hidden}
.gfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .5s}

/* ── chips / pills ── */
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{background:var(--surf2);border:1px solid var(--border);color:var(--muted);
  border-radius:999px;padding:.4rem .9rem;font-size:.84rem;font-weight:600}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── form ── */
.field{margin-bottom:.85rem}
.field label{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:.3rem}
.field .req{color:var(--gold)}
.inp{width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);
  border-radius:11px;padding:.7rem .8rem;font-size:16px}
.inp::placeholder{color:#6b7280}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.unit-tog{display:flex;gap:.3rem}
.unit-tog button{flex:1;background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:.4rem;font-size:.8rem;font-weight:700}
.unit-tog button.on{background:var(--blue);border-color:var(--blue);color:#fff}
details.more{margin:.4rem 0 .9rem;border:1px solid var(--border);border-radius:12px;background:var(--surf);overflow:hidden}
details.more>summary{padding:.75rem .9rem;font-weight:700;font-size:.9rem;color:var(--text);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋ 詳細";float:right;color:var(--muted);font-size:.82rem;font-weight:600}
details.more[open]>summary::after{content:"－ 閉じる"}
details.more .more-body{padding:0 .9rem .9rem}

.btn{display:block;width:100%;border:none;border-radius:12px;padding:.95rem;
  font-size:1rem;font-weight:800;color:#fff;background:var(--blue)}
.btn.green{background:var(--green);color:#06281c}
.btn.ghost{background:var(--surf2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn+.btn{margin-top:.6rem}

/* ── list rows ── */
.rec-row{display:flex;align-items:center;gap:.5rem;background:var(--surf);border:1px solid var(--border);
  border-radius:13px;padding:.75rem .7rem;margin-bottom:.55rem}
.rec-row .rd{font-weight:800;font-size:.88rem;min-width:4.2em;white-space:nowrap;flex:0 0 auto}
.rec-row .rv{flex:1;min-width:0;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-row .rv b{color:var(--text);font-variant-numeric:tabular-nums}
.rec-row .x{color:var(--muted);background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;width:32px;height:32px;flex:0 0 auto;font-size:.95rem}

.cust-row{display:flex;align-items:center;gap:.6rem;background:var(--surf);border:1px solid var(--border);
  border-radius:13px;padding:.8rem .85rem;margin-bottom:.5rem}
.cust-row.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.cust-idx{position:sticky;top:0;z-index:2;font-weight:800;font-size:.82rem;color:var(--blue);
  background:var(--bg);padding:.4rem .3rem;margin:.4rem 0 .35rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.45rem;cursor:pointer;user-select:none;scroll-margin-top:2px}
.cust-idx .cv{font-size:.7rem;color:var(--muted);transition:transform .15s;width:.9em;text-align:center}
.cust-idx.collapsed .cv{transform:rotate(-90deg)}
.cust-idx .ct{margin-left:auto;font-size:.68rem;color:var(--muted);font-weight:700}
.cust-tools{display:flex;gap:.5rem;align-items:center;margin:.2rem 0 .5rem}
.cust-tools button{flex:0 0 auto;background:var(--surf2);border:1px solid var(--border);color:var(--muted);
  font-size:.72rem;font-weight:700;padding:.3rem .6rem;border-radius:8px}
.kana-rail{position:fixed;right:1px;top:calc(56px + env(safe-area-inset-top));
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px);z-index:22;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:2px 1px;pointer-events:auto}
.kana-rail button{background:none;border:none;color:var(--blue);font-size:.6rem;font-weight:800;
  line-height:1;padding:1px 3px;border-radius:5px}
.kana-rail button:disabled{color:var(--border);opacity:.55}
.kana-rail button:active:not(:disabled){background:var(--blue);color:#fff}
/* ── クライアント選択シート（名簿ドロップダウン）：ジャンプ・折りたたみ・最近 ── */
.cust-sheet-tools{display:flex;gap:.5rem;margin:.1rem 0 .5rem}
.cust-sheet-tools button{flex:1;background:var(--surf2);border:1px solid var(--border);color:var(--muted);
  border-radius:9px;padding:.5rem;font-size:.78rem;font-weight:700}
.recent-block{margin:.1rem 0 .7rem}
.recent-block .rl{font-size:.72rem;color:var(--muted);font-weight:700;margin:0 0 .35rem}
.recent-row{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;-webkit-overflow-scrolling:touch}
.recent-chip{flex:0 0 auto;background:var(--surf2);border:1px solid var(--border);color:var(--text);
  border-radius:999px;padding:.42rem .85rem;font-size:.82rem;font-weight:700;white-space:nowrap}
.recent-chip.sel{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.cust-sheet-scroll{position:relative}
.cust-sheet-list{max-height:52vh;overflow-y:auto;padding-right:20px;-webkit-overflow-scrolling:touch}
.cust-sheet-rail{position:absolute;right:0;top:0;bottom:0;width:18px;z-index:2;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;padding:2px 0}
.cust-sheet-rail button{background:none;border:none;color:var(--blue);font-size:.6rem;font-weight:800;
  line-height:1;padding:1px 3px;border-radius:5px}
.cust-sheet-rail button:disabled{color:var(--border);opacity:.55}
.cust-sheet-rail button:active:not(:disabled){background:var(--blue);color:#fff}
.cust-sheet-list .cust-idx{background:var(--surf);cursor:pointer}
.cust-row .ci{flex:1;min-width:0}
.cust-row .ck{font-size:.66rem;color:var(--muted);font-weight:600;line-height:1;margin-bottom:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-row .cn{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust-row .cs{font-size:.76rem;color:var(--muted);margin-top:.1rem}
.cust-row .cg{font-size:.72rem;color:var(--gold);font-weight:700}

.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem;font-size:.92rem}
.empty .big{font-size:1.05rem;color:var(--text);font-weight:700;margin-bottom:.4rem}

.chart-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:.9rem .8rem;margin-bottom:.8rem}
.chart-card h4{font-size:.84rem;color:var(--muted);font-weight:700;margin:0 0 .5rem .3rem}
.chart-wrap{position:relative;height:180px}

/* ── bottom nav ── */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--bar);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex}
.botnav button{flex:1;background:none;border:none;color:var(--muted);font-size:.74rem;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;padding-top:.3rem}
.botnav button .ic{font-size:1.25rem;line-height:0;display:flex;align-items:center;justify-content:center}
.botnav button .ic svg{width:24px;height:24px;display:block;fill:currentColor}
.botnav button:not(.on){color:#aeb4bf}
html.light .botnav button:not(.on){color:#6b7280}
.botnav button.on{color:var(--blue)}

/* ── sheet / modal ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surf);
  border-radius:20px 20px 0 0;border-top:1px solid var(--border);
  max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .26s ease;
  padding:.4rem 1rem calc(1.2rem + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .grip{width:42px;height:4px;background:var(--border);border-radius:3px;margin:.6rem auto .3rem}
.sheet h3{font-size:1.05rem;margin:.4rem 0 .9rem}
.opt{display:flex;align-items:center;gap:.6rem;padding:.85rem .3rem;border-bottom:1px solid var(--border);font-weight:600}
.opt:last-child{border-bottom:none}
.opt.sel{color:var(--blue)}
.opt .ox{margin-left:auto;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
/* ライン系アイコン（絵文字の置き換え・ボトムナビと同系のミニマル） */
.mi{width:1.2em;height:1.2em;flex:none;display:inline-block;vertical-align:-.22em;margin-right:.4rem}
.opt .mi{margin-right:0}                       /* .opt は gap で間隔を取る */
.icon-btn .mi,.s-dots .mi,.s-drag .mi,.x .mi{margin-right:0}   /* アイコンのみのボタン */
.opt.sel .mi{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 1.2rem);transform:translateX(-50%);
  background:#000;color:#fff;padding:.65rem 1.1rem;border-radius:999px;font-size:.86rem;font-weight:700;
  z-index:80;opacity:0;transition:opacity .25s;border:1px solid var(--border);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.pclink{display:block;text-align:center;color:var(--muted);font-size:.8rem;margin-top:1.4rem;text-decoration:none}

/* ── summary head ── */
.sum-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin:.1rem .1rem .6rem}
.sum-head .t{font-size:1.02rem;font-weight:800}
.sum-head .d{font-size:.72rem;color:var(--muted);font-weight:600}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.sum-card{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:.85rem .9rem}
.sum-card .l{font-size:.74rem;color:var(--muted);font-weight:700}
.sum-card .v{font-size:1.7rem;font-weight:800;line-height:1.2;margin-top:.2rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sum-card .v .u{font-size:.82rem;font-weight:600;color:var(--muted);margin-left:.12rem}
.sum-card .dl{font-size:.78rem;font-weight:800;margin-top:.2rem;font-variant-numeric:tabular-nums}

/* ── segmented control ── */
.seg{display:flex;gap:.25rem;background:var(--surf2);border:1px solid var(--border);border-radius:11px;padding:.2rem}
.seg button{flex:1;background:none;border:none;color:var(--muted);border-radius:8px;padding:.42rem .3rem;font-size:.82rem;font-weight:700}
.seg button.on{background:var(--blue);color:#fff}

/* ── combined chart legend ── */
.leg{display:flex;flex-wrap:wrap;gap:.5rem .9rem;justify-content:center;margin-top:.55rem}
.leg .lg{display:flex;align-items:center;gap:.32rem;font-size:.74rem;color:var(--muted);font-weight:600}
.leg .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ── data summary table ── */
.dtable{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--surf);
  border:1px solid var(--border);border-radius:14px;overflow:hidden}
.dtable th,.dtable td{padding:.55rem .5rem;text-align:center;font-variant-numeric:tabular-nums}
.dtable thead th{background:var(--surf2);color:var(--muted);font-size:.72rem;font-weight:700}
.dtable td:first-child,.dtable th:first-child{text-align:left;font-weight:700}
.dtable tbody tr+tr td{border-top:1px solid var(--border)}
.dtable .up{color:var(--green)} .dtable .down{color:var(--red)}

/* ── menu cards ── */
.menu-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:.85rem .9rem;margin-bottom:.6rem}
.menu-card .mh{display:flex;align-items:flex-start;gap:.5rem}
.menu-card .mt{flex:1;min-width:0}
.menu-card .mn{font-weight:800;font-size:1rem}
.menu-card .mtags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.35rem}
.tag{font-size:.68rem;font-weight:700;padding:.14rem .5rem;border-radius:999px;background:var(--surf2);color:var(--muted);border:1px solid var(--border)}
.tag.p{color:var(--green);border-color:transparent;background:color-mix(in srgb,var(--green) 16%,transparent)}
.menu-card .mcount{font-size:.74rem;color:var(--muted);margin-top:.5rem;font-weight:600}
.menu-card .mex{margin-top:.5rem;border-top:1px solid var(--border);padding-top:.5rem}
.ex-row{display:flex;align-items:center;gap:.6rem;padding:.28rem 0;font-size:.82rem}
.ex-row .exi{width:1.5em;color:var(--muted);font-weight:700;flex:0 0 auto}
.ex-row .exn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-row .exs{color:var(--muted);font-size:.76rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex-edit{display:flex;gap:.4rem;align-items:center;margin-bottom:.5rem}
.ex-edit input{flex:1;min-width:0}
.ex-edit .exsmall{flex:0 0 3.4em}
.ex-edit .x{color:var(--muted);background:var(--surf2);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;flex:0 0 auto}
.mi-actions{display:flex;gap:.5rem;margin-top:.3rem}
.mi-actions .btn{flex:1}

/* ════════ レポート（印刷専用・画面では非表示） ════════ */
/* レポートの視覚スタイルは通常CSSに置き（#mReportはdisplay:noneなので画面には出ない）、
   印刷(@media print)とPDF生成キャプチャ(#mReport.pdfgen)の両方で共用する。 */
#mReport{display:none;background:#fff;font-family:'Hiragino Kaku Gothic ProN','Segoe UI',sans-serif;font-size:12px;line-height:1.5;color:#1a1c1e}
#mReport h2{font-size:14px;color:#1a265a;border-left:5px solid #4f9fff;padding-left:6px;margin:7mm 0 2.5mm;break-after:avoid;page-break-after:avoid}
#mReport .mr-cover{border-bottom:2px solid #1a265a;padding-bottom:4mm;margin-bottom:2mm}
#mReport .mr-cover-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm}
#mReport .mr-gym{font-size:14px;font-weight:700;color:#1a265a;margin-bottom:1.5mm}
#mReport .mr-title{font-size:18px;font-weight:800;color:#1a265a;letter-spacing:.04em}
#mReport .mr-meta{margin-top:3mm;font-size:12px;color:#445}
#mReport .mr-meta>div{margin:.6mm 0}
#mReport .mr-ach{text-align:right;white-space:nowrap}
#mReport .mr-ach-lbl{font-size:12px;color:#778;font-weight:600}
#mReport .mr-ach-pct{font-size:46px;font-weight:800;line-height:.95}
#mReport .mr-boxes{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;margin:2mm 0;break-inside:avoid;page-break-inside:avoid}
#mReport .mr-boxes-3{grid-template-columns:repeat(3,1fr)}
#mReport .mr-box{border:1px solid #d4dae3;border-radius:5px;padding:2.5mm 3mm;background:#fbfcfe}
#mReport .mr-box small{display:block;font-size:11px;color:#778;margin-bottom:1mm}
#mReport .mr-box b{font-size:17px;color:#1a265a}
#mReport .mr-box .mr-d{font-size:11px;font-weight:700;margin-left:1.5mm}
#mReport .mr-gb-row{display:flex;align-items:baseline;gap:1.5mm;font-weight:700}
#mReport .mr-gb-cur{color:#2563c0;font-size:15px}
#mReport .mr-gb-arrow{color:#9aa3ad}
#mReport .mr-gb-tgt{color:#1e8e5a;font-size:15px}
#mReport .mr-gb-rem{display:block;font-size:11px;color:#667;margin-top:.8mm}
#mReport .mr-legend{font-size:11px;color:#778;margin:1mm 0 2mm}
#mReport table{width:100%;border-collapse:collapse;font-size:12px;margin-top:2mm}
#mReport thead{display:table-header-group}
#mReport tr{break-inside:avoid;page-break-inside:avoid}
#mReport th{background:#1a265a;color:#fff;padding:2mm;text-align:center;font-weight:600}
#mReport td{border:1px solid #e3e7f0;padding:1.8mm;text-align:center}
#mReport tbody tr:nth-child(even){background:#f5f8ff}
#mReport .mr-up{color:#c0392b}
#mReport .mr-down{color:#1e8e5a}
#mReport .mr-chart{break-inside:avoid;page-break-inside:avoid;margin:2mm 0 3mm}
#mReport .mr-chart figcaption{font-size:11px;color:#556;text-align:center;margin-top:1mm}
#mReport .mr-chart canvas{width:100%!important;height:auto!important;border:1px solid #ddd}
#mReport .mr-disc{margin-top:6mm;font-size:9px;color:#778;border-top:1px solid #ddd;padding-top:2mm}
/* PDF生成キャプチャ用：画面外にA4相当幅で実描画してhtml2canvasで撮る */
#mReport.pdfgen,html.share-mode #mReport.pdfgen{display:block!important;position:fixed;left:-10000px;top:0;width:720px;padding:18px;z-index:-1;overflow:visible}
@media print{
  @page{size:A4;margin:13mm}
  html,body{background:#fff!important;color:#1a1c1e!important;height:auto!important;overflow:visible!important}
  body>*:not(#mReport){display:none!important}
  #mReport{display:block!important}
  #mReport.pdfgen{position:static!important;left:auto!important;width:auto!important;padding:0!important}
}

/* ══ QR共有シート ══ */
.qr-sheet{display:flex;flex-direction:column;gap:.7rem;align-items:stretch}
.qr-sheet .qr-name{text-align:center;font-weight:800;font-size:1.15rem;color:var(--text);
  margin:.3rem 0 .1rem;padding:0 .5rem;line-height:1.3;word-break:break-word}
.qr-host{background:#fff;border-radius:12px;padding:14px;align-self:center;
  width:min(72vw,260px);height:min(72vw,260px);display:flex;align-items:center;justify-content:center}
.qr-host canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.qr-note{font-size:.7rem;color:var(--muted);line-height:1.5;text-align:center}
.qr-anon{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--text);
  justify-content:center;padding:.4rem;user-select:none}
.qr-anon input{width:18px;height:18px}
.qr-linkrow{display:flex;gap:.4rem}
.qr-link{flex:1;min-width:0;background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;color:var(--muted);font-size:.7rem;padding:.55rem .6rem}
.qr-actions{display:flex;gap:.5rem}
.qr-actions .btn{flex:1}
.qr-linkrow .btn{width:auto;flex:0 0 auto;padding:.6rem 1.1rem;font-size:.9rem}
.qr-preview{width:100%}

/* ══ 結果ビュー（QRスキャンで開く読み取り専用画面） ══ */
html.share-mode body{overflow:auto;background:var(--bg)}
html.share-mode .app,html.share-mode .botnav,html.share-mode .scrim,
html.share-mode .sheet,html.share-mode .toast,html.share-mode #mReport{display:none!important}
.share-view{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:100;
  padding:1.4rem 1rem calc(2.4rem + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sv-wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.sv-brand{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center}
.sv-brand img{height:40px;width:auto;object-fit:contain}
.sv-wordmark{font-size:1.1rem;font-weight:900;letter-spacing:.12em;color:var(--blue)}
.sv-gym{font-size:.84rem;font-weight:700;color:var(--blue)}
.sv-title{text-align:center}
.sv-name{font-size:1.4rem;font-weight:800;color:var(--text)}
.sv-date{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.sv-sec{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:.9rem}
.sv-sec-h{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:.7rem}
.sv-metrics{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.sv-mc{background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:.6rem}
.sv-mc .l{font-size:.68rem;color:var(--muted);display:block}
.sv-mc .v{font-size:1.16rem;font-weight:800;color:var(--text)}
.sv-mc .u{font-size:.66rem;color:var(--muted);font-weight:600;margin-left:.15rem}
.sv-goal{margin-bottom:.7rem}
.sv-goal:last-child{margin-bottom:0}
.sv-goal-top{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;margin-bottom:.32rem}
.sv-goal-lbl{color:var(--text);font-weight:700}
.sv-goal-val{color:var(--muted);font-variant-numeric:tabular-nums}
.sv-goal-val b{color:var(--green);font-weight:800}
.sv-bar{height:9px;border-radius:5px;background:var(--surf2);overflow:hidden}
.sv-bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--green))}
.sv-spark{display:flex;flex-direction:column;gap:.6rem}
.sv-sp-row{display:flex;align-items:center;gap:.6rem}
.sv-sp-lbl{font-size:.74rem;color:var(--muted);width:70px;flex-shrink:0}
.sv-sp-svg{flex:1;height:36px}
.sv-sp-val{font-size:.82rem;font-weight:700;color:var(--text);width:56px;text-align:right;flex-shrink:0}
.sv-chart{margin-bottom:1rem}
.sv-chart:last-child{margin-bottom:0}
.sv-chart-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:.4rem}
.sv-chart-cur{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.sv-chart-box{height:148px;position:relative}
.sv-foot{text-align:center;font-size:.68rem;color:var(--muted);line-height:1.6;margin-top:.4rem}
.sv-foot a{color:var(--blue);text-decoration:none}
.sv-actions{display:flex}
.sv-pdf{width:100%;border:none;border-radius:12px;padding:.9rem;font-size:1rem;font-weight:800;
  color:#fff;background:var(--blue);cursor:pointer;font-family:inherit}
.sv-pdf-note{text-align:center;font-size:.66rem;color:var(--muted);margin-top:-.4rem}

/* ══ 共有ビューを顧客がPDF保存/印刷する時のレイアウト（白基調・全文フロー） ══ */
@media print{
  html.share-mode,html.share-mode body{background:#fff!important;height:auto!important;overflow:visible!important}
  html.share-mode body>*:not(#shareView){display:none!important}
  html.share-mode #shareView{display:block!important;position:static!important;inset:auto!important;
    background:#fff!important;padding:6mm 0 0!important;overflow:visible!important;color:#1a1c1e}
  html.share-mode .sv-wrap{max-width:none!important;gap:3mm!important}
  html.share-mode .sv-name{color:#1a265a!important}
  html.share-mode .sv-wordmark,html.share-mode .sv-gym{color:#1a265a!important}
  html.share-mode .sv-date,html.share-mode .sv-sec-h,html.share-mode .sv-mc .l,html.share-mode .sv-mc .u,
  html.share-mode .sv-sp-lbl,html.share-mode .sv-chart-cur,html.share-mode .sv-goal-val,html.share-mode .sv-foot{color:#667!important}
  html.share-mode .sv-sec{background:#fbfcfe!important;border:1px solid #d4dae3!important;break-inside:avoid;page-break-inside:avoid}
  html.share-mode .sv-mc{background:#fff!important;border:1px solid #d4dae3!important}
  html.share-mode .sv-mc .v,html.share-mode .sv-goal-lbl{color:#1a265a!important}
  html.share-mode .sv-goal-val b{color:#1e8e5a!important}
  html.share-mode .sv-bar{background:#e3e7f0!important}
  html.share-mode .sv-actions,html.share-mode .sv-pdf-note,html.share-mode .sv-foot a{display:none!important}
}

/* ══════════ セッション・ワークスペース（ミニマル・テーマ追従＝設定のダーク/ホワイトに従う） ══════════ */
.sess{--s-bg:var(--bg);--s-text:var(--text);--s-sub:var(--muted);--s-line:var(--border);
  --s-accent:var(--blue);--s-accent-soft:color-mix(in srgb,var(--blue) 16%,transparent);--s-fill:var(--surf2);
  margin:calc(-1 * .9rem) calc(-1 * .9rem) calc(-1 * 1.4rem);min-height:calc(100dvh - var(--nav-h));
  background:var(--s-bg);color:var(--s-text);
  font-family:-apple-system,'SF Pro Text','Hiragino Kaku Gothic ProN','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 0 6rem;letter-spacing:.01em}
.sess *{box-sizing:border-box}
.sess .s-pad{padding:0 1.25rem}
/* ① ヘッダー */
.s-head{padding:1.5rem 1.25rem 1rem}
.s-head .s-name{font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.s-head .s-sub{margin-top:.35rem;font-size:.9rem;color:var(--s-sub);font-weight:500}
.s-head .s-sub b{color:var(--s-accent);font-weight:600}
/* ② 成長サマリー */
.s-sec-label{font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--s-sub);text-transform:uppercase;margin:2rem 1.25rem .7rem}
.s-metrics{display:flex;gap:0;padding:0 1.25rem}
.s-metric{flex:1;text-align:left}
.s-metric+.s-metric{border-left:1px solid var(--s-line);padding-left:.9rem}
.s-metric .l{font-size:.68rem;color:var(--s-sub);font-weight:500}
.s-metric .v{font-size:1.32rem;font-weight:700;letter-spacing:-.02em;margin-top:.15rem;font-variant-numeric:tabular-nums}
.s-metric .v span{font-size:.7rem;color:var(--s-sub);font-weight:500;margin-left:.1rem}
.s-chart-wrap{margin:1.1rem 1.25rem 0;height:180px;position:relative}
.s-segrow{display:flex;gap:.4rem;overflow-x:auto;padding:.9rem 1.25rem .2rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.s-segrow::-webkit-scrollbar{display:none}
.s-pill{flex:0 0 auto;background:none;border:none;color:var(--s-sub);font-size:.86rem;font-weight:500;
  padding:.35rem .2rem;position:relative;font-family:inherit;white-space:nowrap}
.s-pill.on{color:var(--s-text);font-weight:600}
.s-pill.on::after{content:'';position:absolute;left:.2rem;right:.2rem;bottom:-.15rem;height:2px;background:var(--s-accent);border-radius:2px}
.s-period{display:flex;gap:.4rem;padding:.5rem 1.25rem 0}
.s-period button{flex:1;background:var(--s-fill);border:none;color:var(--s-sub);border-radius:9px;padding:.4rem;
  font-size:.8rem;font-weight:600;font-family:inherit}
.s-period button.on{background:var(--s-accent);color:#fff}
/* 区切り */
.s-hr{height:1px;background:var(--s-line);margin:1.6rem 0 0}
/* ③ テンプレ */
.s-templates{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 1.25rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.s-templates::-webkit-scrollbar{display:none}
.s-tpl{flex:0 0 auto;background:var(--s-fill);border:1px solid transparent;color:var(--s-text);border-radius:999px;
  padding:.5rem 1rem;font-size:.88rem;font-weight:600;font-family:inherit}
.s-tpl.on{background:var(--s-accent-soft);border-color:var(--s-accent);color:var(--s-accent)}
/* ④ 種目リスト */
.s-ex{padding:1.15rem 1.25rem;border-bottom:1px solid var(--s-line);background:var(--s-bg)}
.s-ex.dragging{opacity:.5;background:var(--s-fill)}
.s-ex.dragover{border-top:2px solid var(--s-accent)}
.s-ex-top{display:flex;align-items:center;gap:.6rem}
.s-ex-name{flex:1;min-width:0;font-size:1.05rem;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-ex-act{background:none;border:none;color:var(--s-sub);font-size:1rem;padding:.2rem .3rem;font-family:inherit;flex:0 0 auto}
.s-ex-handle{touch-action:none;cursor:grab;color:var(--s-sub);font-size:1.05rem;padding:.2rem .1rem;flex:0 0 auto}
.s-ex-prev{font-size:.8rem;color:var(--s-sub);margin:.25rem 0 .6rem;font-weight:500}
.s-ex-prev b{color:var(--s-text);font-weight:600;font-variant-numeric:tabular-nums}
.s-set{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.s-set .idx{width:1.3rem;color:var(--s-sub);font-size:.8rem;font-weight:600;flex:0 0 auto}
.s-set input{width:100%;background:var(--s-fill);border:1px solid transparent;border-radius:10px;padding:.6rem .5rem;
  font-size:16px;text-align:center;color:var(--s-text);font-variant-numeric:tabular-nums;font-family:inherit}
.s-set input:focus{outline:none;border-color:var(--s-accent);background:var(--surf)}
.s-set .unit{color:var(--s-sub);font-size:.82rem;flex:0 0 auto}
.s-set .rm{background:none;border:none;color:var(--s-sub);font-size:1.1rem;flex:0 0 auto;padding:.2rem;font-family:inherit}
.s-addset{background:none;border:none;color:var(--s-accent);font-size:.86rem;font-weight:600;padding:.35rem 0;font-family:inherit;margin-top:.1rem}
/* ⑤/⑦ ボタン */
.s-add-ex{display:block;width:calc(100% - 2.5rem);margin:1.3rem 1.25rem 0;background:var(--s-fill);border:none;
  color:var(--s-accent);border-radius:12px;padding:.95rem;font-size:.95rem;font-weight:600;font-family:inherit}
.s-memo{margin:1.6rem 1.25rem 0}
.s-memo textarea{width:100%;min-height:80px;background:var(--s-fill);border:1px solid transparent;border-radius:12px;
  padding:.8rem .9rem;font-size:16px;color:var(--s-text);font-family:inherit;resize:vertical;line-height:1.5}
.s-memo textarea:focus{outline:none;border-color:var(--s-accent);background:var(--surf)}
.s-save{display:block;width:calc(100% - 2.5rem);margin:1.8rem 1.25rem .5rem;background:var(--s-accent);border:none;
  color:#fff;border-radius:14px;padding:1.1rem;font-size:1.05rem;font-weight:700;font-family:inherit;
  box-shadow:0 4px 16px rgba(0,113,227,.28)}
.s-empty{text-align:center;color:var(--s-sub);font-size:.9rem;padding:2rem 1.25rem;line-height:1.6}
/* 今日/履歴 切替 */
.s-viewtog{display:flex;gap:.4rem;margin:.4rem 1.25rem 0}
.s-viewtog button{flex:1;background:var(--s-fill);border:none;color:var(--s-sub);border-radius:10px;padding:.55rem;font-size:.9rem;font-weight:600;font-family:inherit}
.s-viewtog button.on{background:var(--s-accent);color:#fff}
.menu-list{padding:0 1.25rem .5rem}
.menu-row{display:flex;align-items:center;gap:.4rem;background:var(--s-fill);border-radius:12px;padding:.7rem .5rem .7rem .85rem;margin-bottom:.5rem}
.menu-row .mr-info{flex:1;min-width:0}
.menu-row .mr-name{font-weight:700;font-size:1rem;color:var(--s-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-row .mr-sub{font-size:.76rem;color:var(--s-sub);margin-top:.12rem}
.menu-row .mr-ic{flex:0 0 auto;background:none;border:none;color:var(--s-sub);padding:.4rem;border-radius:8px;font-family:inherit}
.menu-row .mr-ic svg{width:1.3em;height:1.3em;display:block}
.menu-row .mr-load{color:var(--s-accent)}
.menu-row .mr-del{color:var(--red)}
/* メニュー作成フォームのステップ切替＋縦型種目ピッカー */
.mform-seg{display:flex;gap:.4rem;margin:.2rem 0 .9rem}
.mform-seg button{flex:1;background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:.5rem .2rem;font-size:.79rem;font-weight:700;font-family:inherit}
.mform-seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mform-hint{color:var(--muted);font-size:.8rem;margin:.2rem 0 .6rem;line-height:1.5}
.ex-picklist{display:flex;flex-direction:column;gap:.4rem}
.ex-pickrow{display:flex;align-items:center;gap:.6rem;width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:.75rem .85rem;font-size:.95rem;font-weight:600;font-family:inherit;text-align:left}
.ex-pickrow .epn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-pickrow .epa{flex:0 0 auto;color:var(--blue);display:flex;align-items:center}
.ex-pickrow .epa svg{width:1.25em;height:1.25em}
.ex-pickrow.added{border-color:var(--blue);background:var(--surf3)}
.ex-pickrow.added .epa{color:#19c37d}
/* カレンダー */
.s-cal{margin:1.1rem 1.25rem 0;background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:1rem .9rem}
.s-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.s-cal-title{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.s-cal-nav{background:var(--s-fill);border:none;color:var(--s-text);width:34px;height:34px;border-radius:9px;font-size:1.1rem;font-family:inherit}
.s-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.15rem}
.s-cal-w{text-align:center;font-size:.66rem;color:var(--s-sub);padding:.2rem 0;font-weight:600}
.s-cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:.84rem;color:var(--s-text);border-radius:9px;font-variant-numeric:tabular-nums;cursor:pointer}
.s-cal-day.other{opacity:0;pointer-events:none}
.s-cal-day.today{outline:1.5px solid var(--s-accent);outline-offset:-1.5px;font-weight:700}
.s-cal-day.has{font-weight:700}
.s-cal-day.has::after{content:'';position:absolute;bottom:.26rem;width:5px;height:5px;border-radius:50%;background:var(--s-accent)}
.s-cal-day.sel{background:var(--s-accent);color:#fff;outline:none}
.s-cal-day.sel.has::after{background:#fff}
/* 選択日パネル */
.s-selday{margin:1.1rem 1.25rem 0}
.s-selday-h{font-size:.92rem;font-weight:700;color:var(--s-text)}
.s-newday{display:block;width:auto;margin:.6rem 1.25rem 0;background:var(--s-fill);border:1px dashed var(--s-accent);color:var(--s-accent);border-radius:12px;padding:.85rem;font-size:.92rem;font-weight:700;font-family:inherit;text-align:center}
/* 選択日の記録：1枠にまとめ、各種目を線で区切る */
.s-daybox{background:var(--surf);border:1px solid var(--s-line);border-radius:14px;margin:.55rem 1.25rem 0;overflow:hidden}
.s-daysess+.s-daysess{border-top:6px solid var(--s-bg)}
.s-dayhead{display:flex;align-items:center;gap:.5rem;width:100%;padding:.75rem .9rem;background:none;border:none;font-family:inherit;text-align:left;color:var(--s-text)}
.s-dayhead .nm{flex:1;min-width:0;font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-dayhead .tag{flex:0 0 auto;font-size:.7rem;color:var(--s-sub);font-weight:600}
.s-dayex{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;padding:.6rem .9rem;border-top:1px solid var(--s-line);font-size:.84rem}
.s-dayex .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--s-text);font-weight:500}
.s-dayex .val{flex:0 0 auto;color:var(--s-sub);font-variant-numeric:tabular-nums}
.s-daymemo{font-size:.76rem;color:var(--s-sub);padding:.55rem .9rem;border-top:1px solid var(--s-line);background:var(--s-fill)}
/* 詳細：種目別ブロック */
.s-detex{border-top:1px solid var(--border);padding:.6rem 0 .3rem}
.s-detex:first-of-type{border-top:none}
.s-detex-n{font-weight:700;font-size:.96rem}
.s-detex-n .pt{font-size:.68rem;color:var(--muted);font-weight:600;margin-left:.4rem}
.s-detset{display:flex;justify-content:space-between;gap:.8rem;font-size:.86rem;color:var(--text);padding:.22rem 0;font-variant-numeric:tabular-nums}
.s-detset .si{color:var(--muted)}
/* 履歴リスト */
.s-hist{margin:1.2rem 0 0}
.s-hrow{display:flex;align-items:center;gap:.8rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--s-line);text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;color:var(--s-text)}
.s-hrow .d{flex:0 0 auto;width:3rem;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.1}
.s-hrow .d small{display:block;font-size:.64rem;color:var(--s-sub);font-weight:500}
.s-hrow .info{flex:1;min-width:0}
.s-hrow .p{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hrow .sub{font-size:.76rem;color:var(--s-sub);margin-top:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hrow .go{color:var(--s-sub);flex:0 0 auto;font-size:1.1rem}
.s-dup{display:block;width:100%;border:none;border-radius:12px;padding:.95rem;font-size:.95rem;font-weight:700;color:#fff;background:var(--blue);font-family:inherit;margin-top:.6rem}
.s-quick{display:flex;align-items:center;gap:.6rem;margin:.2rem 1.25rem 0}
.s-quick .s-tpl{background:var(--s-accent-soft);color:var(--s-accent);border:1px solid var(--s-accent)}
/* ヘッダー テンプレ ドロップダウン */
.s-tplsel{display:inline-flex;align-items:center;gap:.35rem;background:none;border:none;color:var(--s-text);font-size:1.02rem;font-weight:700;font-family:inherit;padding:0;letter-spacing:-.01em}
.s-tplsel .ar{color:var(--s-sub);font-size:.75rem}
/* 今日のコンディション */
.s-cond{margin:1.2rem 1.25rem 0}
.s-cond-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.s-cond-h .t{font-size:.8rem;font-weight:600;color:var(--s-sub)}
.s-cond textarea{width:100%;min-height:50px;background:var(--surf);border:1px solid var(--s-line);border-radius:12px;padding:.7rem .8rem;font-size:16px;color:var(--s-text);font-family:inherit;resize:vertical;line-height:1.5}
.s-cond textarea:focus{outline:none;border-color:var(--s-accent)}
/* ④ 種目カード（参考デザイン） */
.s-card{background:var(--surf);border:1px solid var(--s-line);border-radius:16px;margin:.7rem 1.25rem 0;padding:.85rem .95rem}
.s-card.dragging{opacity:.5}
.s-card.dragover{box-shadow:0 -2px 0 0 var(--s-accent)}
.s-card-head{display:flex;align-items:center;gap:.65rem}
.s-thumb{flex:0 0 auto;width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.02rem;color:#fff;font-weight:800}
.s-num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--s-accent);color:#fff;
  font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.s-plan{display:flex;align-items:center;margin-top:.55rem;font-size:.8rem;font-weight:700;color:var(--s-accent);
  background:var(--s-fill);border-radius:9px;padding:.4rem .6rem}
.s-plan svg{width:1.05em;height:1.05em;margin-right:.15rem}
.s-card-tt{flex:1;min-width:0}
.s-card-name{font-size:1.02rem;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-card-prev{font-size:.73rem;color:var(--s-sub);margin-top:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-card-prev b{color:var(--s-text);font-weight:600;font-variant-numeric:tabular-nums}
.s-drag{flex:0 0 auto;background:none;border:none;color:var(--s-sub);opacity:.6;font-size:1rem;padding:.2rem .1rem;font-family:inherit;cursor:grab;touch-action:none}
.s-dots{flex:0 0 auto;background:none;border:none;color:var(--s-sub);font-size:1.2rem;padding:.2rem .35rem;font-family:inherit;line-height:1}
.s-setgrid{margin-top:.6rem}
.s-set2{display:flex;align-items:center;gap:.45rem;padding:.28rem 0}
.s-set2 .n{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--surf2);color:var(--s-sub);font-size:.74rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.s-set2 .win{flex:1;min-width:0}
.s-set2 input{width:100%;background:var(--surf2);border:1px solid transparent;border-radius:9px;padding:.5rem;font-size:16px;text-align:center;color:var(--s-text);font-variant-numeric:tabular-nums;font-family:inherit}
.s-set2 input:focus{outline:none;border-color:var(--s-accent);background:var(--surf)}
.s-set2 .u{color:var(--s-sub);font-size:.78rem;flex:0 0 auto}
.s-set2 .chk{flex:0 0 auto;width:1.7rem;height:1.7rem;border-radius:50%;border:1.5px solid var(--s-line);background:none;color:transparent;font-size:.85rem;display:flex;align-items:center;justify-content:center;font-family:inherit}
.s-set2 .chk.on{background:var(--s-accent);border-color:var(--s-accent);color:#fff}
.s-addset2{background:none;border:none;color:var(--s-accent);font-size:.84rem;font-weight:600;padding:.45rem 0 .1rem;font-family:inherit;margin-top:.15rem}
/* 回数 / 時間(秒) 切替スイッチ（種目カード内） */
.s-utog{display:inline-flex;gap:2px;background:var(--s-fill);border-radius:9px;padding:2px;margin:.55rem 0 .1rem}
.s-utog button{border:none;background:none;color:var(--s-sub);font-size:.74rem;font-weight:700;padding:.3rem .7rem;border-radius:7px;font-family:inherit}
.s-utog button.on{background:var(--s-accent);color:#fff}
/* 有酸素の推定消費カロリー */
.s-kcal{font-size:.8rem;color:var(--s-accent);font-weight:700;margin:.6rem 0 0;padding:0 .1rem}
/* 履歴：日付ヘッダー＋セッションカード（枠に収めて横並び表示） */
.s-hdate{font-size:.8rem;font-weight:700;color:var(--s-sub);margin:1rem 1.25rem .1rem;font-variant-numeric:tabular-nums}
.s-hcard{display:block;width:auto;background:var(--surf);border:1px solid var(--s-line);border-radius:14px;margin:.5rem 1.25rem 0;padding:.8rem .9rem;text-align:left;font-family:inherit;color:var(--s-text)}
.s-hcard-h{display:flex;align-items:center;gap:.5rem}
.s-hcard-name{flex:1;min-width:0;font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hcard-tag{flex:0 0 auto;font-size:.7rem;color:var(--s-sub);font-weight:600}
.s-hcard-ex{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;margin-top:.4rem;font-size:.82rem}
.s-hcard-ex .nm{min-width:0;color:var(--s-text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hcard-ex .val{flex:0 0 auto;color:var(--s-sub);font-variant-numeric:tabular-nums}
.s-hcard-memo{margin-top:.55rem;font-size:.76rem;color:var(--s-sub);background:var(--surf2);border-radius:9px;padding:.4rem .55rem;line-height:1.5}
/* 種目別パフォーマンス（成長） */
.s-perf{background:var(--surf);border:1px solid var(--s-line);border-radius:16px;margin:.7rem 1.25rem 0;padding:.9rem 1rem}
.s-perf-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.s-perf-name{font-size:1rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-perf-r{flex:0 0 auto;text-align:right}
.s-perf-val{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.s-perf-val small{font-size:.64rem;color:var(--s-sub);font-weight:600;margin-left:.12rem}
.s-perf-badge{font-size:.72rem;font-weight:700;color:var(--green);margin-left:.4rem}
.s-perf-badge.down{color:var(--red)}
.s-perf-chart{height:118px;position:relative;margin-top:.5rem}
.s-perf-sub{font-size:.66rem;color:var(--s-sub);font-weight:600;margin-bottom:.2rem}
/* 種目別パフォーマンス＝コンパクトリスト（種目が増えても見やすい） */
.s-perflist{margin:.5rem 1.25rem 0;background:var(--surf);border:1px solid var(--s-line);border-radius:14px;overflow:hidden}
.s-perfrow{display:flex;align-items:center;gap:.7rem;width:100%;padding:.75rem .9rem;background:none;border:none;border-top:1px solid var(--s-line);font-family:inherit;text-align:left;color:var(--s-text)}
.s-perfrow:first-child{border-top:none}
.s-perfrow .info{flex:0 0 auto;max-width:42%;min-width:0}
.s-perfrow .info .nm{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-perfrow .info .sub{font-size:.62rem;color:var(--s-sub);font-weight:600}
.s-perfrow .spark{flex:1;height:30px;min-width:24px}
.s-perfrow .rt{flex:0 0 auto;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.s-perfrow .rt .val{font-size:1.02rem;font-weight:800;font-variant-numeric:tabular-nums}
.s-perfrow .rt .val small{font-size:.6rem;color:var(--s-sub);font-weight:600;margin-left:.08rem}
.s-perfrow .rt .bd{font-size:.68rem;font-weight:700;color:var(--green)}
.s-perfrow .rt .bd.down{color:var(--red)}
.s-perfrow .go{color:var(--s-sub);flex:0 0 auto;font-size:1.05rem}
/* 種目追加シート（テーマ追従） */
.s-sheet{--s-text:var(--text);--s-sub:var(--muted);--s-line:var(--border);--s-accent:var(--blue);--s-fill:var(--surf2)}
.s-search{width:100%;background:var(--s-fill);border:none;border-radius:11px;padding:.75rem .9rem;font-size:16px;font-family:inherit;margin:.2rem 0 .7rem;color:var(--s-text)}
.s-search::placeholder{color:var(--s-sub)}
.s-cats{display:flex;gap:.4rem;overflow-x:auto;margin-bottom:.6rem;scrollbar-width:none}
.s-cats::-webkit-scrollbar{display:none}
.s-cat{flex:0 0 auto;background:var(--s-fill);border:none;color:var(--s-text);border-radius:999px;padding:.4rem .85rem;font-size:.84rem;font-weight:600;font-family:inherit}
.s-cat.on{background:var(--s-accent);color:#fff}
.s-optlist{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.s-opt{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.85rem .2rem;border-bottom:1px solid var(--s-line);font-weight:600;color:var(--s-text)}
.s-opt .p{font-size:.72rem;color:var(--s-sub);font-weight:600}
.s-opt:active{background:var(--s-fill)}

/* ══════════ セッションボード（複数クライアント同時把握） ══════════ */
/* 複数選択モードのチェックボックス */
.cust-row .cbox{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.6px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:.8rem;font-weight:800}
.cust-row.picked .cbox{background:var(--blue);border-color:var(--blue);color:#fff}
.cust-row.picked{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
/* 複数選択トグル */
.sheet-board-bar{display:flex;align-items:center;gap:.7rem;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--border)}
.sheet-board-bar .sbb-cnt{font-size:.82rem;font-weight:800;color:var(--text);flex:0 0 auto;white-space:nowrap}
.multi-tog{width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:.75rem;font-size:.9rem;font-weight:700;margin-top:.6rem}
.multi-tog.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* 選択バー（クライアントタブ下部・ボトムナビの上） */
/* 選択バーは最下部に置き、表示中はボトムナビを隠す（重なり防止） */
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:35;
  background:var(--bar);backdrop-filter:blur(12px);border-top:1px solid var(--border);
  padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;align-items:center;
  transform:translateY(130%);transition:transform .24s}
.selbar.on{transform:translateY(0)}
.botnav.tucked{display:none}
.selbar .cnt{font-size:.88rem;font-weight:700;color:var(--text);flex:1}
.selbar .cnt b{color:var(--blue)}
.selbar button{width:auto;flex:0 0 auto;padding:.7rem 1rem;font-size:.88rem;font-weight:800;border-radius:11px;border:none;color:#fff;background:var(--blue)}
.selbar button.ghost{background:var(--surf2);color:var(--text);border:1px solid var(--border)}

/* ボードオーバーレイ（全画面・ボトムナビの上／シートより下） */
.board-ov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
.board-ov.on{display:flex}
.board-top{display:flex;align-items:center;gap:.6rem;flex:0 0 auto;
  padding:calc(.6rem + env(safe-area-inset-top)) .9rem .6rem;
  background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.board-top .bt-t{font-size:1.05rem;font-weight:800;line-height:1.15}
.board-top .bt-d{font-size:.7rem;color:var(--muted);font-weight:600;margin-top:.1rem}
.board-hint{flex:0 0 auto;font-size:.72rem;color:var(--muted);text-align:center;padding:.5rem .9rem 0}
.board-scroll{flex:1;display:flex;gap:.75rem;overflow-x:auto;overflow-y:hidden;
  padding:.9rem;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.board-scroll::-webkit-scrollbar{display:none}
.board-card{flex:0 0 84%;max-width:330px;scroll-snap-align:center;display:flex;flex-direction:column;
  background:var(--surf);border:1px solid var(--border);border-radius:18px;padding:1rem;overflow-y:auto}
.board-card.done{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.bc-name{font-size:1.22rem;font-weight:800;display:flex;align-items:center;gap:.5rem;min-width:0}
.bc-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bc-badge{flex:0 0 auto;font-size:.64rem;font-weight:800;padding:.14rem .5rem;border-radius:999px;
  background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.bc-now{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin:.85rem 0 .3rem}
.bc-nm{background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:.55rem .35rem;text-align:center}
.bc-nm .l{font-size:.62rem;color:var(--muted);font-weight:700}
.bc-nm .v{font-size:1.08rem;font-weight:800;margin-top:.12rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bc-nm .v .u{font-size:.58rem;color:var(--muted);font-weight:600;margin-left:.05rem}
.bc-nm .d{font-size:.62rem;font-weight:800;margin-top:.08rem;font-variant-numeric:tabular-nums}
.bc-menu-h{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin:.7rem 0 .1rem}
.bc-menu-t{font-size:.92rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-menu-part{flex:0 0 auto;font-size:.68rem;color:var(--muted);font-weight:700}
.bc-exlist{flex:1;min-height:44px;margin-top:.35rem}
.bc-ex{display:flex;align-items:center;justify-content:space-between;gap:.55rem;
  padding:.4rem 0;border-top:1px solid var(--border);font-size:.86rem}
.bc-ex:first-child{border-top:none}
.bc-ex .bc-chk{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.6px solid var(--border);
  background:var(--surf2);color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.bc-ex .bc-chk .mi{width:14px;height:14px}
.bc-ex .bc-chk.on{background:var(--green);border-color:var(--green);color:#fff}
.bc-ex .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bc-ex.done .n{text-decoration:line-through;color:var(--muted)}
.bc-ex .s{flex:0 0 auto;color:var(--muted);font-size:.74rem;font-variant-numeric:tabular-nums}
.bc-prog{flex:0 0 auto;font-size:.72rem;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
.bc-empty{color:var(--muted);font-size:.82rem;text-align:center;padding:1.5rem .5rem;line-height:1.6;white-space:pre-line}
.bc-acts{display:flex;gap:.35rem;margin-top:.85rem;flex:0 0 auto}
.bc-acts button{flex:1;min-width:0;border:1px solid var(--border);background:var(--surf2);color:var(--text);
  border-radius:11px;padding:.62rem .15rem;font-size:.78rem;font-weight:800}
.bc-acts button.prim{background:var(--blue);border-color:var(--blue);color:#fff}
.bc-acts button.done-btn{background:var(--green);border-color:var(--green);color:#06281c}
.bc-acts button:disabled{opacity:.45}
/* ── アプリロック (PIN) ── */
body.locked{overflow:hidden}
.lock-ov{position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.lock-box{width:100%;max-width:320px;text-align:center}
.lock-box.shake{animation:lockshake .38s}
@keyframes lockshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lock-ic{color:var(--blue);margin-bottom:.6rem}
.lock-ic .mi{width:2.4rem;height:2.4rem}
.lock-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:1.1rem}
.lock-dots{display:flex;gap:.7rem;justify-content:center;margin-bottom:.5rem;min-height:16px}
.lock-dot{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--muted);transition:.15s}
.lock-dot.on{background:var(--blue);border-color:var(--blue)}
.lock-err{color:var(--red);font-size:.8rem;font-weight:700;min-height:1.1rem;margin-bottom:.6rem}
.lock-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:270px;margin:0 auto}
.lock-key{background:var(--surf2);border:1px solid var(--border);color:var(--text);
  font-size:1.4rem;font-weight:700;border-radius:14px;padding:.85rem 0;cursor:pointer;font-family:inherit}
.lock-key:active{background:var(--surf3)}
/* ── ログ表示 ── */
.log-lv{font-weight:700;flex:0 0 auto}
/* ── 使い方オンボーディング ── */
.ob-ov{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:1.2rem}
.ob-card{width:100%;max-width:420px;max-height:calc(100vh - 2.4rem);overflow-y:auto;background:var(--surf);border-radius:20px;
  padding:1.3rem;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:obUp .26s ease}
@keyframes obUp{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.ob-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.ob-step{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.03em}
.ob-skip{background:none;border:none;color:var(--muted);font-size:.84rem;font-weight:700;font-family:inherit;padding:.25rem .35rem;cursor:pointer}
.ob-ic{width:58px;height:58px;border-radius:16px;background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--blue);margin:.2rem auto .8rem}
.ob-ic .mi{width:2rem;height:2rem}
.ob-title{font-size:1.15rem;font-weight:800;text-align:center;color:var(--text);margin-bottom:.5rem}
.ob-text{font-size:.9rem;line-height:1.65;color:var(--muted);text-align:center;margin-bottom:1rem;min-height:3.3em}
.ob-dots{display:flex;gap:.4rem;justify-content:center;margin-bottom:1rem}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:.2s}
.ob-dot.on{background:var(--blue);width:20px;border-radius:4px}
.ob-check{display:flex;align-items:center;gap:.5rem;justify-content:center;font-size:.83rem;color:var(--muted);margin-bottom:.9rem;cursor:pointer}
.ob-check input{width:17px;height:17px;accent-color:var(--blue)}
.ob-foot{display:flex;gap:.6rem}
.ob-foot .btn{margin-top:0}
.ob-foot .btn.ghost{flex:0 0 38%}
/* ── 設定ページ（専用ページ） ── */
.settings-page{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:setIn .22s ease}
@keyframes setIn{from{transform:translateX(22px);opacity:.4}to{transform:translateX(0);opacity:1}}
.set-head{position:sticky;top:0;background:var(--bar);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;z-index:2}
.set-back{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:10px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.set-back:active{background:var(--surf3)}
.set-title{font-size:1.05rem;font-weight:800;color:var(--text)}
.set-body{padding:1rem 1rem calc(3rem + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
/* ── ホームの本日のセッション予定 ── */
.home-sched .hs-row{display:flex;align-items:center;gap:.6rem;padding:.65rem .3rem;border-bottom:1px solid var(--border)}
.home-sched .hs-row:last-child{border-bottom:none}
.home-sched .hs-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-sched .hs-sub{font-size:.72rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.05rem}

.home-sched .hs-del{flex:0 0 auto;background:var(--surf2);border:1px solid var(--border);color:var(--muted);

.plan-sub{font-size:.82rem;color:var(--muted);margin-bottom:.7rem}
.plan-feats{list-style:none;padding:0;margin:.7rem 0 0;display:flex;flex-direction:column;gap:.6rem}

<!-- ══ 結果共有ビュー（QRスキャンで開く読み取り専用画面） ══
     location.hash が #share= のとき本体アプリを隠して結果カードを描画。
     ペイロードはURLフラグメント由来＝外部入力なので全て textContent / DOM構築で安全描画。 -->
<script>
(function () {
  var HASH_KEY = '#share=';
  var h = location.hash || '';
  if (h.indexOf(HASH_KEY) !== 0) return;
  document.documentElement.classList.add('share-mode');

  // base64url → JSON（エンコーダ b64urlEncode と対）。旧percent方式もフォールバックで許容。
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  }
  var payload = null, raw = h.slice(HASH_KEY.length);
  try { payload = JSON.parse(b64urlDecode(raw)); }
  catch (e) {
    try { payload = JSON.parse(decodeURIComponent(raw)); } catch (e2) { payload = null; }
  }

  function num(x) { return (x === '' || x == null || isNaN(+x)) ? null : +x; }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;   // textContent = 安全
    return e;
  }
  function fmt(x, dp) { var n = num(x); return n == null ? '—' : (dp != null ? n.toFixed(dp) : String(n)); }
  // アイコン（このビュー専用のローカル版）。メインスクリプトの ic() は render() 実行時点でまだ未定義のため、依存を切る。
  function ic() {
    return '<svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
      + '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'
      + '<line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>';
  }

  function metricCard(label, val, unit, dp) {
    var c = el('div', 'sv-mc');
    c.appendChild(el('span', 'l', label));
    var v = el('div', 'v', fmt(val, dp));
    if (unit) v.appendChild(el('span', 'u', unit));
    c.appendChild(v);
    return c;
  }

  function sparkline(vals) {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'sv-sp-svg');
    svg.setAttribute('viewBox', '0 0 100 34');
    svg.setAttribute('preserveAspectRatio', 'none');
    var pts = vals.map(num).filter(function (v) { return v != null; });
    if (pts.length < 2) return svg;
    var mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), rng = (mx - mn) || 1;
    var step = 100 / (pts.length - 1);
    var d = pts.map(function (v, i) {
      var x = i * step, y = 30 - ((v - mn) / rng) * 26 - 2;
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#4f9fff');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(path);
    return svg;
  }

  function hexA(hex, a) {
    var c = hex.replace('#', '');
    return 'rgba(' + parseInt(c.slice(0, 2), 16) + ',' + parseInt(c.slice(2, 4), 16) + ',' + parseInt(c.slice(4, 6), 16) + ',' + a + ')';
  }
  // レポート同様の折れ線グラフ（Chart.js）。goal!=null なら目標を金色の破線で重ねる。
  function makeLineChart(pc) {
    try {
      var ds = [{ data: pc.series, borderColor: pc.color, backgroundColor: hexA(pc.color, 0.12),
        fill: true, tension: 0.35, pointRadius: 2, pointBackgroundColor: pc.color, borderWidth: 2, spanGaps: true }];
      if (pc.goal != null) ds.push({ data: pc.labels.map(function () { return pc.goal; }),
        borderColor: '#ffd060', borderDash: [5, 4], pointRadius: 0, borderWidth: 1.5, fill: false });
      new window.Chart(pc.cv.getContext('2d'), {
        type: 'line',
        data: { labels: pc.labels, datasets: ds },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            x: { ticks: { color: '#9aa0aa', font: { size: 9 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 6 }, grid: { display: false } },
            y: { ticks: { color: '#9aa0aa', font: { size: 9 } }, grid: { color: 'rgba(120,135,160,.14)' }, grace: '8%' },
          },
        },
      });
    } catch (e) { /* Chart描画失敗時は無視（見出し・数値は残る） */ }
  }

  function render() {
    var root = el('div', 'share-view'); root.id = 'shareView';
    var wrap = el('div', 'sv-wrap'); root.appendChild(wrap);
    var pendingCharts = [];

    if (!payload || payload.v !== 1) {
      var t = el('div', 'sv-title'); t.appendChild(el('div', 'sv-name', '結果を読み込めませんでした'));
      wrap.appendChild(t);
      wrap.appendChild(el('div', 'sv-foot', 'QRリンクが不完全な可能性があります。'));
      document.body.appendChild(root); return;
    }

    // ブランド（ロゴ画像 + ジム名）
    var brand = el('div', 'sv-brand');
    var img = el('img'); img.src = './bodyverse-logo.png'; img.alt = 'BODYVERSE';
    img.onerror = function () { img.remove(); brand.insertBefore(el('div', 'sv-wordmark', 'BODYVERSE'), brand.firstChild); };
    brand.appendChild(img);
    if (payload.b) brand.appendChild(el('div', 'sv-gym', String(payload.b)));
    wrap.appendChild(brand);

    // タイトル
    var title = el('div', 'sv-title');
    title.appendChild(el('div', 'sv-name', payload.n ? String(payload.n) : 'あなたの測定結果'));
    if (payload.d) title.appendChild(el('div', 'sv-date', String(payload.d).replace('-', '年') + '月 測定'));
    wrap.appendChild(title);

    // PDF保存ボタン（顧客が自分の端末でPDF化・保存できる。印刷時はボタン自体は出力しない）
    try {
      document.title = 'BODYVERSE' + (payload.n ? ('_' + String(payload.n).replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_')) : '')
        + (payload.d ? ('_' + String(payload.d)) : '');
    } catch (e) {}
    var actions = el('div', 'sv-actions');
    var pdfBtn = el('button', 'sv-pdf'); pdfBtn.innerHTML = ic('doc')+'レポートをPDFで保存';
    pdfBtn.type = 'button';
    pdfBtn.onclick = function () {
      // メインスクリプトの downloadSharedReportPDF でトレーナーと同じフルレポートPDFを生成
      if (window.downloadSharedReportPDF) {
        var t = pdfBtn.innerHTML; pdfBtn.disabled = true; pdfBtn.innerHTML = ic('doc')+'PDFを作成中…';
        Promise.resolve(window.downloadSharedReportPDF(payload)).catch(function () {}).then(function () {
          pdfBtn.disabled = false; pdfBtn.innerHTML = t;
        });
      } else {
        try { window.print(); } catch (e) {}   // 未読込時は簡易表示の印刷にフォールバック
      }
    };
    actions.appendChild(pdfBtn);
    wrap.appendChild(actions);
    wrap.appendChild(el('div', 'sv-pdf-note', 'ボタンからレポートをPDFで保存できます'));

    // 最新の測定値
    var L = payload.L || [];
    var mSec = el('div', 'sv-sec');
    mSec.appendChild(el('div', 'sv-sec-h', '最新の測定結果'));
    var grid = el('div', 'sv-metrics');
    grid.appendChild(metricCard('体重', L[0], 'kg', 1));
    grid.appendChild(metricCard('体脂肪率', L[1], '%', 1));
    grid.appendChild(metricCard('骨格筋率', L[2], '%', 1));
    grid.appendChild(metricCard('内臓脂肪', L[3], '', 0));
    grid.appendChild(metricCard('BMI', L[4], '', 1));
    grid.appendChild(metricCard('体年齢', L[5], '歳', 0));
    mSec.appendChild(grid);
    wrap.appendChild(mSec);

    // 目標と達成度
    var G = payload.G || [], T = payload.T || [];
    if (G.some(function (g) { return num(g) != null; })) {
      var gSec = el('div', 'sv-sec');
      gSec.appendChild(el('div', 'sv-sec-h', '目標と達成度'));
      [{ i: 0, lbl: '体重', unit: 'kg', ti: 1 }, { i: 1, lbl: '体脂肪率', unit: '%', ti: 2 }, { i: 2, lbl: '骨格筋率', unit: '%', ti: 3 }].forEach(function (gd) {
        var target = num(G[gd.i]); if (target == null) return;
        var cur = num(L[gd.i]);
        var base = (T.length && T[0]) ? num(T[0][gd.ti]) : null;
        var g = el('div', 'sv-goal');
        var top = el('div', 'sv-goal-top');
        top.appendChild(el('span', 'sv-goal-lbl', gd.lbl));
        var val = el('span', 'sv-goal-val');
        val.appendChild(document.createTextNode((cur == null ? '—' : cur.toFixed(1)) + gd.unit + ' → '));
        val.appendChild(el('b', null, target.toFixed(1) + gd.unit));
        top.appendChild(val); g.appendChild(top);
        var pct = null;
        if (base != null && cur != null && (target - base) !== 0) {
          pct = ((cur - base) / (target - base)) * 100;
          pct = Math.max(0, Math.min(100, pct));
        }
        var bar = el('div', 'sv-bar'); var fill = el('i');
        fill.style.width = (pct == null ? 0 : pct.toFixed(0)) + '%';
        bar.appendChild(fill); g.appendChild(bar);
        gSec.appendChild(g);
      });
      wrap.appendChild(gSec);
    }

    // 推移グラフ（レポート同様の折れ線・Chart.js未ロード時はスパークラインにフォールバック）
    if (T.length >= 2) {
      var tSec = el('div', 'sv-sec');
      tSec.appendChild(el('div', 'sv-sec-h', 'これまでの推移'));
      var labels = T.map(function (r) { var ym = String(r[0]); return ym.length >= 4 ? ym.slice(0, 2) + '/' + ym.slice(2) : ym; });
      var defs = [
        { ti: 1, lbl: '体重', u: 'kg', color: '#4f9fff', goal: num((payload.G || [])[0]) },
        { ti: 2, lbl: '体脂肪率', u: '%', color: '#ff6b6b', goal: num((payload.G || [])[1]) },
        { ti: 3, lbl: '骨格筋率', u: '%', color: '#19d390', goal: num((payload.G || [])[2]) },
      ];
      var useChart = !!window.Chart;
      defs.forEach(function (d) {
        var series = T.map(function (r) { return num(r[d.ti]); });
        var last = series[series.length - 1];
        if (useChart) {
          var box = el('div', 'sv-chart');
          var hd = el('div', 'sv-chart-h');
          hd.appendChild(el('span', null, d.lbl));
          hd.appendChild(el('span', 'sv-chart-cur', (last == null ? '—' : last.toFixed(1)) + d.u));
          box.appendChild(hd);
          var cbox = el('div', 'sv-chart-box'); var cv = el('canvas'); cbox.appendChild(cv); box.appendChild(cbox);
          tSec.appendChild(box);
          pendingCharts.push({ cv: cv, labels: labels, series: series, color: d.color, goal: d.goal });
        } else {
          var row = el('div', 'sv-sp-row');
          row.appendChild(el('div', 'sv-sp-lbl', d.lbl));
          row.appendChild(sparkline(series));
          row.appendChild(el('div', 'sv-sp-val', (last == null ? '—' : last.toFixed(1)) + d.u));
          tSec.appendChild(row);
        }
      });
      wrap.appendChild(tSec);
    }

    var foot = el('div', 'sv-foot');
    foot.appendChild(document.createTextNode('このレポートは BODYVERSE で作成されました'));
    // 共有先はレポートのみを閲覧可能に。アプリへ入れる「BODYVERSE を開く」リンクは表示しない。
    wrap.appendChild(foot);

    document.body.appendChild(root);
    // DOM挿入後（＝コンテナが実サイズを持つ）にグラフ生成
    pendingCharts.forEach(makeLineChart);
  }

  if (document.body) render();
  else document.addEventListener('DOMContentLoaded', render);
})();
</script>

<script>
'use strict';
/* ════════ 診断ログ & 安全ストレージ (A2/A4) ════════ */
const LOG_KEY='bodyvis_log_v1', LOG_MAX=200;
const LOG={
  load(){try{const a=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');return Array.isArray(a)?a:[]}catch{return[]}},
  _save(a){try{localStorage.setItem(LOG_KEY,JSON.stringify(a.slice(-LOG_MAX)))}catch(e){/* ログ保存失敗は無視＝無限ループ防止 */}},
  add(level,msg,detail){const a=this.load();
    a.push({t:new Date().toISOString(),lv:level,m:String(msg==null?'':msg).slice(0,500),d:detail?String(detail).slice(0,500):''});
    this._save(a);},
  clear(){try{localStorage.removeItem(LOG_KEY)}catch(e){}},
};
function logInfo(m,d){LOG.add('info',m,d);}
function logWarn(m,d){LOG.add('warn',m,d);}
function logError(m,d){LOG.add('error',m,d);}

// 安全な保存: 5MB上限(QuotaExceeded)や書込失敗を捕捉し、通知＋記録してアプリを落とさない
function lsSet(key,value){
  try{localStorage.setItem(key,value);return true;}
  catch(e){
    const quota=e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014);
    logError('保存失敗'+(quota?'（容量上限）':''),(e&&e.name||'')+': '+(e&&e.message||''));
    try{toast(quota?'保存容量がいっぱいです。バックアップ後に不要データを整理してください':'保存に失敗しました');}catch(_){}
    return false;
  }
}

// グローバルエラー捕捉: 握りつぶさずログへ残す（デバッグ・ログ確認用）
window.addEventListener('error',function(ev){logError('JSエラー: '+(ev.message||ev.type||''),(ev.filename||'')+(ev.lineno?':'+ev.lineno:''));});

/* ════════ ストレージ: IndexedDB 移行（大容量・自動削除防止） ════════ */
// 大きな顧客データはIndexedDBへ保存。既存コードは同期API(load/save)前提なので、
// 起動時に一度メモリ(MEM)へ読み込み→以降は同期的にMEMを読み、保存はMEM即時＋IDBへ書き戻す(write-through)。
// IndexedDBが使えない環境（古い/プライベート等）は自動でlocalStorageへフォールバック＝従来動作。
const IDB_NAME='bodyvis_db', IDB_STORE='kv';
const MEM={};   // key -> JSON文字列（ハイドレート後の実データ）
let _idb=null;  // IDBDatabase。null＝localStorage継続
const BIG_KEYS=['bodyvis_customers_v1','bodyvis_menus_v1','bodyvis_plans_v1','bodyvis_drafts_v1','bodyvis_custom_ex_v1','bodyvis_training_v1','bodyvis_sessions_v1'];
function dbGet(key){ return (key in MEM) ? MEM[key] : localStorage.getItem(key); }
function dbSet(key,str){ str=String(str); MEM[key]=str;
  if(_idb) idbPut(key,str).catch(e=>logError('IndexedDB保存失敗（'+key+'）',e&&e.message));
  else lsSet(key,str);   // フォールバック（5MB上限あり）
  return true; }
function dbDel(key){ delete MEM[key]; if(_idb) idbDel(key).catch(()=>{}); else localStorage.removeItem(key); }
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));});}
function idbAll(){return new Promise((res,rej)=>{const out={};const tx=_idb.transaction(IDB_STORE,'readonly');
  const cur=tx.objectStore(IDB_STORE).openCursor();
  cur.onsuccess=e=>{const c=e.target.result; if(c){out[c.key]=c.value;c.continue();}else res(out);}; cur.onerror=()=>rej(cur.error);});}
function idbPut(key,val){return new Promise((res,rej)=>{const tx=_idb.transaction(IDB_STORE,'readwrite');
  tx.objectStore(IDB_STORE).put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);});}
function idbDel(key){return new Promise((res,rej)=>{const tx=_idb.transaction(IDB_STORE,'readwrite');
  tx.objectStore(IDB_STORE).delete(key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);});}
// 起動時ハイドレート: IDBを開き、未移行のlocalStorageデータを一度だけIDBへ移し、MEMへ読み込む
async function hydrateStore(){
  if(!('indexedDB' in window)){ logWarn('IndexedDB非対応のためlocalStorageを継続'); return; }
  try{
    _idb=await idbOpen();
    const existing=await idbAll(); let migrated=0;
    for(const k of BIG_KEYS){
      if(k in existing){ MEM[k]=existing[k]; }
      else { const ls=localStorage.getItem(k); if(ls!=null){ MEM[k]=ls; await idbPut(k,ls); migrated++; } }
    }
    if(migrated)logInfo('localStorage→IndexedDBへ移行完了', migrated+'件');
    if(navigator.storage&&navigator.storage.persist){try{const g=await navigator.storage.persist(); logInfo('永続化ストレージ要求', g?'許可':'保留');}catch(_){}}
  }catch(e){ _idb=null; logError('IndexedDB初期化失敗→localStorage継続', e&&e.message); }
}

/* ════════ data layer (index-3d.html と完全互換) ════════ */
const DB_KEY='bodyvis_customers_v1', ACT_KEY='bodyvis_m_active';
const CDB={
  load(){try{return JSON.parse(dbGet(DB_KEY)||'{}')}catch{return{}}},
  save(d){dbSet(DB_KEY,JSON.stringify(d))},
  all(){return this.load()},
  get(n){return this.load()[n]||null},
  set(c){const d=this.load();d[c.name]=c;this.save(d)},
  del(n){const d=this.load();delete d[n];this.save(d)},
  rename(o,n){const d=this.load();if(!d[o]||d[n])return false;const c=d[o];c.name=n;d[n]=c;delete d[o];this.save(d);return true},
  addRec(name,rec){const d=this.load();if(!d[name])return;
    // 同じ測定日（YYYY-MM-DD）があれば上書き、無ければ追加＝毎日/週数回など任意の頻度で記録できる
    d[name].records=[rec,...d[name].records.filter(r=>r.date!==rec.date)].sort((a,b)=>b.date.localeCompare(a.date));
    this.save(d)},
  delRec(name,date){const d=this.load();if(!d[name])return;d[name].records=d[name].records.filter(r=>r.date!==date);this.save(d)},
  setGoal(name,goal){const d=this.load();if(!d[name])return;d[name].goal=goal;this.save(d)},
};

/* 中身がある下書きだけ保存（空は削除してクリーンに） */
function persistDraft(s){
  if(!s||!s.client)return;
  const has=(s.exercises&&s.exercises.length)||(s.memo&&String(s.memo).trim());
  if(has)DDB.set(s.client,s); else DDB.del(s.client);
}

// 旧・月単位の体組成記録(date='YYYY-MM')を日付(YYYY-MM-01)へ一度だけ正規化。以後は日単位で任意頻度に記録できる
const REC_DATE_MIG_KEY='bodyvis_rec_dates_migrated_v1';
function migrateRecDatesToDay(){
  try{ if(localStorage.getItem(REC_DATE_MIG_KEY))return;
    const d=CDB.load(); let changed=false;
    for(const n in d){const recs=(d[n]&&d[n].records)||[];
      recs.forEach(r=>{ if(r&&typeof r.date==='string'&&/^\d{4}-\d{2}$/.test(r.date)){r.date=r.date+'-01';changed=true;} });}
    if(changed)CDB.save(d);
    localStorage.setItem(REC_DATE_MIG_KEY,'1');
  }catch(e){}
}

const fatMassOf=r=>r.weight!=null&&r.bodyFatPct!=null?+(r.weight*r.bodyFatPct/100).toFixed(1):null;      // 体脂肪量 kg

/* 生年月日(YYYY-MM-DD)→ 現在日時基準の年齢。時間が経てば自動で上がる（保存し直し不要）。 */
function ageFromDob(dob){
  if(!dob)return null; const b=new Date(dob); if(isNaN(b))return null;
  const t=new Date(); let a=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth(); if(m<0||(m===0&&t.getDate()<b.getDate()))a--;
  return (a>=0&&a<150)?a:null;
}
/* 表示用の年齢：生年月日があれば自動計算を優先、無ければ手入力のageにフォールバック。 */
function custAge(c){ if(!c)return null; const a=ageFromDob(c.dob); return a!=null?a:(c.age!=null?c.age:null); }

/* metric meta: dir = which direction is "good" (down/up) */
const METRICS={
  weight:{lbl:'体重',unit:'kg',dir:'down',d:1},
  bodyFatPct:{lbl:'体脂肪率',unit:'%',dir:'down',d:1},
  muscleMass:{lbl:'骨格筋率',unit:'%',dir:'up',d:1},
};
function deltaClass(key,diff){if(diff==null||Math.abs(diff)<0.05)return['flat','→'];
  const good=METRICS[key]?.dir==='down'?diff<0:diff>0;
  return [good?'up':'down',(diff>0?'▲':'▼')];}

function activeCust(){return S.active?CDB.get(S.active):null;}
function ensureActive(){const names=Object.keys(CDB.all());
  if(S.active&&CDB.get(S.active))return; S.active=names[0]||null;
  if(S.active)localStorage.setItem(ACT_KEY,S.active);else localStorage.removeItem(ACT_KEY);}

/* goal progress: baseline(first)→latest に対する目標到達率 */
function metricProgress(first,latest,goal,key){
  if(first==null||latest==null||goal==null)return null;
  const denom=goal-first; if(Math.abs(denom)<1e-6)return latest===goal?100:0;
  let p=(latest-first)/denom*100; return Math.max(0,Math.min(100,Math.round(p)));}
function overallProgress(c){
  const a=asc(c); if(!a.length||!c.goal)return null;
  const first=a[0],latest=a[a.length-1]; let sum=0,n=0;
  for(const k of ['weight','bodyFatPct','muscleMass']){
    if(c.goal[k]==null)continue;
    const p=metricProgress(first[k],latest[k],c.goal[k],k);
    if(p!=null){sum+=p;n++;}}
  return n?{pct:Math.round(sum/n),n}:null;}

function sumCard(label,unit,cur,prev,dir,dp){
  const card=el('div','sum-card');
  card.appendChild(el('div','l',label));
  const val=el('div','v'); val.innerHTML=(cur==null?'—':fmt(cur,dp))+`<span class="u">${unit}</span>`; card.appendChild(val);
  const diff=(cur!=null&&prev!=null)?+(cur-prev).toFixed(dp):null;
  const[cls,ar]=deltaInfo(diff,dir);
  const dl=el('div','dl '+cls);
  dl.textContent=diff==null?'前回比 —':(Math.abs(diff)<0.05?'前回比 ±0':`前回比 ${ar} ${fmt(Math.abs(diff),dp)}${unit}`);
  card.appendChild(dl); return card;
}

function saveRec(){
  const c=activeCust(); if(!c)return;
  const date=$('af_date').value||todayISO();
  const g=id=>{const e=$(id);return e&&e.value!==''?+e.value:null;};
  const weight=g('af_weight'), bf=g('af_bodyFatPct');
  let muscle=g('af_muscle');
  if(weight==null||bf==null||muscle==null){toast('体重・体脂肪率・骨格筋は必須です');return;}
  if(muscleUnit==='kg'&&weight)muscle=+(muscle/weight*100).toFixed(1); // kg→%
  const rec={date,weight,bodyFatPct:bf,muscleMass:muscle};
  const opt={height:'af_height',visceralFat:'af_visceralFat',subcutFat:'af_subcutFat',bmr:'af_bmr',bmi:'af_bmi',bodyAge:'af_bodyAge'};
  for(const k in opt){const val=g(opt[k]);if(val!=null)rec[k]=val;}
  const note=$('af_note')?.value?.trim(); if(note)rec.note=note;
  if(rec.bmi==null&&rec.height&&weight)rec.bmi=+(weight/Math.pow(rec.height/100,2)).toFixed(1);
  CDB.addRec(c.name,rec);
  closeSheet(); toast('保存しました'); S.viewDate=rec.date;
  if(S.tab==='home')renderSummary(); else renderBody();
}
function delRec(date){
  const c=activeCust(); if(!c)return;
  if(!confirm(`${ymdLabel(date)} の記録を削除します。\n⚠️ 元に戻せません。よろしいですか？`))return;
  CDB.delRec(c.name,date); if(S.viewDate===date)S.viewDate=null; toast('削除しました');
  if(S.tab==='home')renderSummary(); else renderBody();
}
function rangeFilter(a,range){
  if(range==='all'||!a.length)return a;
  const months={'1m':1,'3m':3,'6m':6,'1y':12}[range]; if(!months)return a;
  const last=new Date(a[a.length-1].date); const cut=new Date(last.getFullYear(),last.getMonth()-months+1,1);
  return a.filter(r=>new Date(r.date)>=cut);
}

const SESS_KEY='bodyvis_sessions_v1';

  load(){try{const o=JSON.parse(dbGet(SESS_KEY)||'{}');return(o&&typeof o==='object'&&!Array.isArray(o))?o:{}}catch{return{}}},
  save(o){dbSet(SESS_KEY,JSON.stringify(o))},
  forClient(n){const a=this.load()[n];return Array.isArray(a)?a:[]},         // 新しい順
  add(n,s){const o=this.load();const a=Array.isArray(o[n])?o[n]:[];a.unshift(s);o[n]=a;this.save(o)},
  rename(a,b){const o=this.load();if(o[a]){o[b]=o[a];delete o[a];this.save(o)}},
  remove(n){const o=this.load();if(o[n]){delete o[n];this.save(o)}},
  delEntry(n,id){const o=this.load();if(Array.isArray(o[n])){o[n]=o[n].filter(x=>x.id!==id);this.save(o)}},
  update(n,entry){const o=this.load();const a=Array.isArray(o[n])?o[n]:[];const i=a.findIndex(x=>x.id===entry.id);if(i>=0)a[i]=entry;else a.unshift(entry);o[n]=a;this.save(o)},
};

/* 前回サマリー（最新の過去セッション：最重量セット＋セット数） */
function prevSummary(client,name){
  for(const s of SDB.forClient(client)){
    const e=(s.exercises||[]).find(x=>x.name===name);
    if(e&&e.sets&&e.sets.length){let best=null;e.sets.forEach(st=>{const w=+st.w;if(!isNaN(w)&&(best==null||w>+best.w))best=st;});
      if(!best)e.sets.forEach(st=>{const r=+st.r;if(!isNaN(r)&&(best==null||r>+best.r))best=st;}); // 重量なし種目は回/秒/分の最大セット
      return{date:s.date,w:best?best.w:null,r:best?best.r:null,sets:e.sets.length};}
  }
  return null;
}
/* 推定1RM（Epley式）＝重量×(1+回数/30) */
function est1RM(w,r){w=+w;r=+r;if(isNaN(w)||w<=0)return null;if(isNaN(r)||r<=1)return Math.round(w);return Math.round(w*(1+r/30));}
/* 種目の推定1RM推移（過去セッションの最高1RM・昇順） */
function exerciseRMHistory(client,name){
  const out=[];
  SDB.forClient(client).slice().reverse().forEach(s=>{
    const e=(s.exercises||[]).find(x=>x.name===name);
    if(e&&e.sets){let best=null;e.sets.forEach(st=>{const rm=est1RM(st.w,st.r);if(rm!=null&&(best==null||rm>best))best=rm;});
      if(best!=null)out.push({date:s.date,rm:best});}
  });
  return out;
}
