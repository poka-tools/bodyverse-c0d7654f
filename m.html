// safe option row: 表示名は textContent、ハンドラはクロージャ（onclick文字列に名前を埋めない＝XSS回避）
function optRow(label,onTap,selected,sub,icon){const o=el('div','opt'+(selected?' sel':''));
  if(icon)o.appendChild(iconEl(icon));
  o.appendChild(document.createTextNode(label)); if(sub){const s=el('span','ox',sub);o.appendChild(s);}
  o.onclick=onTap; return o;}

let custSheetFilter='';
let custSheetCollapsed={};   // 五十音グループの折りたたみ状態（railKey→true）
let custSheetMulti=false;    // 上部ドロップダウンの複数選択モード（セッションボード用）
function openCustSheet(startMulti){
  custSheetFilter=''; custSheetCollapsed={}; custSheetMulti=!!startMulti;   // ホームの「複数セッション」から複数選択で開ける
  if(startMulti)S.boardSel=[];
  const all=CDB.all(); const total=Object.keys(all).length;
  const box=el('div');
  const head=el('div'); head.style.cssText='display:flex;align-items:baseline;gap:.5rem;margin:.15rem 0 .3rem';
  head.appendChild(Object.assign(el('h3'),{textContent:'クライアントを選択',style:'margin:0;font-size:1.02rem'}));
  if(total)head.appendChild(Object.assign(el('span'),{textContent:'全'+total+'名',style:'margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:700'}));
  box.appendChild(head);
  if(!total){ box.appendChild(emptyState('クライアントがいません','「クライアント」タブから追加してください')); openSheetNode(box); return; }
  // 「複数セッション選択」トグルは非表示（見やすさ優先）。複数選択はホームのクイックメニュー「複数セッション」から開く（startMulti）。
  // 名前検索（コンパクト・2名以上で常時表示）
  if(total>=2){
    const sf=el('input','inp'); sf.type='search'; sf.placeholder='名前・フリガナで検索';
    sf.style.cssText='padding:.5rem .75rem;margin:.15rem 0 .4rem';
    sf.oninput=e=>{custSheetFilter=e.target.value; renderCustSheetList(wrap);};
    box.appendChild(sf);
  }
  const wrap=el('div','cust-sheet-wrap'); box.appendChild(wrap);
  renderCustSheetList(wrap);
  openSheetNode(box);
}
// ドロップダウンの名簿リスト：フリガナ＋五十音見出し＋性別/年齢/記録数/最新体重（クライアント一覧タブと同じ見やすさ）
// ＋五十音ジャンプバー・グループ折りたたみ・最近選択のクイックアクセスで、多人数でもスクロールを最小化
function renderCustSheetList(wrap){
  wrap.innerHTML='';
  const all=CDB.all();
  const rd=n=>{const c=all[n]; return (c&&c.kana&&c.kana.trim())||n;};
  const f=custSheetFilter.trim().toLowerCase();
  const searching=!!f;
  let names=Object.keys(all);
  if(searching)names=names.filter(n=>n.toLowerCase().includes(f)||rd(n).toLowerCase().includes(f));
  names.sort((a,b)=>{const ga=kanaGroup(rd(a)),gb=kanaGroup(rd(b));
    if(ga.ord!==gb.ord)return ga.ord-gb.ord; if(ga.label!==gb.label)return ga.label<gb.label?-1:1; return rd(a).localeCompare(rd(b),'ja');});
  // 行の描画
  const custRowNode=n=>{const c=all[n], recs=sorted(c), latest=recs[0], _age=custAge(c);
    const picked=custSheetMulti&&S.boardSel.includes(n);
    const row=el('div','cust-row'+(picked?' picked':(!custSheetMulti&&n===S.active?' sel':''))); row.style.cursor='pointer';
    let cb=null;
    if(custSheetMulti){ cb=el('div','cbox'); if(picked)cb.textContent='✓'; row.appendChild(cb); }
    const ci=el('div','ci');
    if(c.kana&&c.kana.trim())ci.appendChild(el('div','ck',c.kana.trim()));
    ci.appendChild(el('div','cn',n));
    ci.appendChild(el('div','cs',`${c.gender==='male'?'男性':'女性'}${_age!=null?'・'+_age+'歳':''} ・ 記録${recs.length}件`+(latest?` ・ 最新 ${fmt(latest.weight)}kg`:'')));
    row.appendChild(ci);
    if(!custSheetMulti && n===S.active){ const chk=iconEl('check'); chk.style.color='var(--blue)'; row.appendChild(chk); }
    if(custSheetMulti){
      row.onclick=()=>{ const i=S.boardSel.indexOf(n); if(i>=0)S.boardSel.splice(i,1); else S.boardSel.push(n);
        const on=S.boardSel.includes(n); row.classList.toggle('picked',on); if(cb)cb.textContent=on?'✓':''; updateSheetBoardBar(); };
    } else {
      row.onclick=()=>{selectCust(n);closeSheet();setTab(S.tab);};
    }
    return row;};
  // グループ分割（railKeyごと）
  const groups=[]; let cur=null;
  names.forEach(n=>{const g=kanaGroup(rd(n)), key=railKey(g);
    if(!cur||cur.key!==key){cur={key,g,items:[]}; groups.push(cur);} cur.items.push(n);});
  const present=new Set(groups.map(gr=>gr.key));

  // ①「最近選択」ブロックは廃止（要望により削除）
  // ② 一括開閉ツール（グループが複数・検索していないとき）
  if(!searching&&groups.length>1){
    const tw=el('div','cust-sheet-tools');
    const bClose=el('button',null,'すべて閉じる'); bClose.onclick=()=>{groups.forEach(gr=>custSheetCollapsed[gr.key]=true); renderCustSheetList(wrap);};
    const bOpen=el('button',null,'すべて開く'); bOpen.onclick=()=>{custSheetCollapsed={}; renderCustSheetList(wrap);};
    tw.appendChild(bClose); tw.appendChild(bOpen); wrap.appendChild(tw);
  }
  // ③ スクロール領域（リスト＋ジャンプバー）
  const scroll=el('div','cust-sheet-scroll');
  const list=el('div','cust-sheet-list'); scroll.appendChild(list); wrap.appendChild(scroll);
  if(!names.length){ list.appendChild(emptyState('該当するクライアントがいません','別のキーワードでお試しください')); return; }
  groups.forEach(gr=>{
    const collapsed=!searching&&!!custSheetCollapsed[gr.key];
    const h=el('div','cust-idx'+(collapsed?' collapsed':'')); h.dataset.idx=gr.key;
    if(!searching){const cv=el('span','cv','▾'); h.appendChild(cv);}
    h.appendChild(document.createTextNode(idxDisplay(gr.g)));
    const ct=el('span','ct',gr.items.length+'名'); h.appendChild(ct);
    if(!searching)h.onclick=()=>{custSheetCollapsed[gr.key]=!custSheetCollapsed[gr.key]; renderCustSheetList(wrap);};
    list.appendChild(h);
    if(collapsed)return;
    gr.items.forEach(n=>list.appendChild(custRowNode(n)));
  });
  // ④ 五十音ジャンプバー（3グループ以上・検索していないとき）
  if(!searching&&present.size>=3){
    list.style.paddingRight='20px';
    const rail=el('div','cust-sheet-rail');
    RAIL_ORDER.forEach(k=>{const b=el('button',null,k);
      if(!present.has(k))b.disabled=true;
      else b.onclick=()=>{ custSheetCollapsed[k]=false; renderCustSheetList(wrap);
        const h=wrap.querySelector('.cust-sheet-list .cust-idx[data-idx="'+k+'"]'); if(h)h.scrollIntoView({block:'start'}); };
      rail.appendChild(b);});
    scroll.appendChild(rail);
  }else{ list.style.paddingRight=''; }
  // ⑤ 複数選択中はフッターに「セッションボードを開く」
  if(custSheetMulti){
    const bar=el('div','sheet-board-bar');
    const cnt=el('span','sbb-cnt'); cnt.id='sbbCnt'; cnt.textContent='選択 '+S.boardSel.length+'名';
    const open=el('button','btn'); open.id='sbbOpen'; open.style.margin='0'; open.style.flex='1';
    open.innerHTML=ic('play')+'セッションボードを開く'; open.disabled=!S.boardSel.length;
    open.onclick=()=>{ if(!S.boardSel.length){toast('クライアントを選択してください');return;} closeSheet(); openBoard(); };
    bar.appendChild(cnt); bar.appendChild(open); wrap.appendChild(bar);
  }
}
function updateSheetBoardBar(){
  const c=document.getElementById('sbbCnt'); if(c)c.textContent='選択 '+S.boardSel.length+'名';
  const o=document.getElementById('sbbOpen'); if(o)o.disabled=!S.boardSel.length;
}
function openDateSheet(){
  const c=activeCust(); if(!c)return; const recs=sorted(c);
  const box=el('div');
  const head=el('div'); head.style.cssText='display:flex;align-items:baseline;gap:.5rem;margin:.4rem 0 .2rem';
  head.appendChild(Object.assign(el('h3'),{textContent:'表示する記録',style:'margin:0'}));
  if(recs.length)head.appendChild(Object.assign(el('span'),{textContent:'全'+recs.length+'件',style:'margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:700'}));
  box.appendChild(head);
  if(!recs.length){ box.appendChild(emptyState('記録がありません','体組成タブから記録を追加してください')); openSheetNode(box); return; }
  const list=el('div','date-list');
  const multiYear=new Set(recs.map(r=>(r.date||'').slice(0,4))).size>1;   // 複数年にまたぐときだけ年見出し
  let curYr=null;
  recs.forEach(r=>{
    const yr=(r.date||'').slice(0,4);
    if(multiYear && yr!==curYr){ curYr=yr; list.appendChild(el('div','date-yr',yr+'年')); }
    const row=el('div','date-row'+(r.date===S.viewDate?' sel':''));
    row.appendChild(el('div','dr-d', r.date&&r.date.length>7?jpDate(r.date):ymLabel(r.date)));
    row.appendChild(el('div','dr-s', fmt(r.weight)+'kg / 体脂'+fmt(r.bodyFatPct)+'%'));
    row.onclick=()=>{S.viewDate=r.date;closeSheet();(S.tab==='body'?renderBody:renderSummary)();};
    list.appendChild(row);
  });
  box.appendChild(list);
  openSheetNode(box);
}

/* ════════ プラン判定（無料=3人 / スタンダード¥980=15人 / プレミアム¥1,500=無制限） ════════ */
const PREMIUM_KEY='bodyvis_premium_v1';   // 旧・後方互換用（'1'=プレミアム相当）
const USER_PLAN_KEY='bodyvis_plan_v1';    // 'free' | 'standard' | 'premium'（課金プラン。※既存のPLAN_KEY=本日プランとは別物）
const FREE_CLIENT_LIMIT=3;
const PLAN_LIMITS={free:3,standard:15,premium:Infinity};
const PLAN_RANK={free:0,standard:1,premium:2};
const PLAN_LABEL={free:'無料',standard:'スタンダード',premium:'プレミアム'};
const PLAN_PRICE={free:0,standard:980,premium:1500};
function getPlan(){
  const p=localStorage.getItem(USER_PLAN_KEY);
  if(p==='free'||p==='standard'||p==='premium')return p;
  if(localStorage.getItem(PREMIUM_KEY)==='1')return 'premium';   // 旧フラグからの移行
  return 'free';
}
function setPlan(p){
  if(!PLAN_RANK.hasOwnProperty(p))p='free';
  localStorage.setItem(USER_PLAN_KEY,p);
  if(p==='premium')localStorage.setItem(PREMIUM_KEY,'1'); else localStorage.removeItem(PREMIUM_KEY);   // 旧キーも同期
  logInfo('プランを'+PLAN_LABEL[p]+'に切替（テスト）');
}
function planRank(){return PLAN_RANK[getPlan()];}
function clientLimit(){return PLAN_LIMITS[getPlan()];}
function isPremium(){return getPlan()==='premium';}    // テーマ・写真・QR共有などプレミアム限定
function isStandardPlus(){return planRank()>=1;}        // スタンダード以上
// 課金導線ができるまでは false＝本番URLでは全機能お試し（ゲートは開発/プレビュー時のみ有効）。
// 課金開始時に true にすると全ゲートが本番でも有効化される（この1行だけで切替）。
const BILLING_LIVE=false;
function gatesActive(){ return BILLING_LIVE || showTestControls(); }   // showTestControls=開発/旧URL（オーナーのプレビュー）
// 機能ゲート（丁度いい配分：スタンダードで実務・プレミアムで共有/写真）
function canPDF(){return !gatesActive()||isStandardPlus();}       // レポートPDFの保存・共有
function canCustomMenu(){return !gatesActive()||isStandardPlus();}// 顧客専用メニュー
function canPhotos(){return !gatesActive()||isPremium();}          // ビフォーアフター写真
function canQRShare(){return !gatesActive()||isPremium();}         // QR/リンク共有
// 各機能を使おうとして権限が足りないときの案内（表示のみ・決済なし）
function requireUpgrade(feature){
  let title,body;
  if(feature==='clients'){
    const lim=clientLimit();
    const next=getPlan()==='free'
      ? 'スタンダード（月額¥980・15人）やプレミアム（無制限）'
      : 'プレミアム（月額¥1,500・無制限）';
    title='クライアントの登録上限に達しました';
    body='今のプランでは'+lim+'人まで登録できます。'+next+'にすると、さらに登録できます。';
  } else {
    const M={
      pdf:['レポートPDFはスタンダード以上で使えます','スタンダード（月額¥980）にすると、体組成レポートをPDFで保存・共有できます。'],
      'custom-menu':['顧客専用メニューはスタンダード以上で使えます','スタンダード（月額¥980）にすると、その顧客だけに登録する専用メニューを作成できます。'],
      photo:['ビフォーアフター写真はプレミアムで使えます','プレミアム（月額¥1,500）にすると、ビフォーアフター写真の撮影・保存・比較ができます。'],
      qr:['QR・リンク共有はプレミアムで使えます','プレミアム（月額¥1,500）にすると、QRコードやリンクで顧客に体組成データを共有できます。'],
    }[feature]||['アップグレードが必要です','上位プランで使える機能です。'];
    title=M[0]; body=M[1];
  }
  const box=el('div');
  box.appendChild(Object.assign(el('h3'),{textContent:title}));
  box.appendChild(Object.assign(el('p'),{textContent:body,style:'font-size:.9rem;line-height:1.65;color:var(--muted);margin:.2rem 0 1rem'}));
  const b=el('button','btn'); b.innerHTML=ic('gear')+' 料金プランを見る'; b.onclick=()=>{closeSheet();openSettings();}; box.appendChild(b);
  const cl=el('div','opt'); cl.textContent='閉じる'; cl.style.cssText='text-align:center;margin-top:.4rem'; cl.onclick=closeSheet; box.appendChild(cl);
  openSheetNode(box);
  return false;
}
function openUpgrade(){ return requireUpgrade('clients'); }   // 後方互換（人数上限）
// テスト用の設定を表示してよい環境か。販売用の本番URL(trekaru等)では出さず、
// 自分用の旧URL(bodyverse-c0d7654f)とローカル開発(localhost/file:)でのみ表示する。
// ※新旧URLは同一オリジンでlocalStorageを共有するため、旧URLでプレミアムに切り替えると
//   その状態は販売用URLにも波及する（=オーナー自身の端末のみ。顧客の端末には影響しない）。
function showTestControls(){
  try{
    if(location.protocol==='file:')return true;
    const h=location.hostname||'';
    if(h===''||h==='localhost'||h==='127.0.0.1'||h==='0.0.0.0')return true;   // ローカル開発
    if(/\/bodyverse-c0d7654f\//.test(location.pathname||''))return true;       // 自分用の旧URL
    return false;   // それ以外の公開URL(販売用trekaru等)＝本番＝非表示
  }catch(_){return false;}   // 判定不能時は安全側＝非表示
}
// テスト用: プレミアム状態のON/OFF切替（実課金とは非連動・開発時のみ）

  const wrap=el('div'); wrap.style.marginTop='1.2rem';
  wrap.appendChild(sec('テスト用（開発）'));
  const cur=getPlan();
  const seg=el('div','seg');
  ['free','standard','premium'].forEach(p=>{

    seg.appendChild(b);
  });
  wrap.appendChild(seg);
  const cnt=Object.keys(CDB.all()).length;
  const lim=clientLimit();
  const st=el('div'); st.style.cssText='font-size:.78rem;color:var(--muted);margin-top:.55rem;line-height:1.55';
  st.textContent=`現在の状態: ${PLAN_LABEL[cur]}プラン（クライアント${lim===Infinity?'無制限':lim+'人まで'}） ／ 登録済み ${cnt}人`;
  wrap.appendChild(st);

let _karteState=null;   // 開いているカルテの複数選択・ラジオの作業状態（テキストは保存時にidから読む）
// カルテ要約（openCustActionsのプレビュー用）。カルテ未作成ならnull。
function karteSummary(name){
  const k=KDB.get(name); if(!k)return null;
  const gm=Object.fromEntries(KARTE_GOALS), hm=Object.fromEntries(KARTE_HABIT);
  const goals=(k.goals||[]).map(g=> g==='other' ? (k.goalOther||'その他') : (gm[g]||g)).filter(Boolean);
  return {
    goals: goals.join('・')||'—',
    slim: (k.slimAreas||[]).slice(0,3).join('・')||'—',
    injury: (k.injuryAreas||[]).length ? (k.injuryAreas||[]).join('・') : 'なし',
    habit: hm[k.habit]||'—',
    motivation: (k.motivation!=null?k.motivation:'—'),
    goalWeight: (k.goalWeight?k.goalWeight+' kg':'—'),
  };
}

function renderKarte(name){
  const body=$('karteBody'); if(!body)return; body.innerHTML='';   // 値はDOM代入／textContentのみ＝XSS無
  const c=CDB.get(name)||{}; const recs=(typeof sorted==='function'?sorted(c):(c.records||[]))||[];
  const k=KDB.get(name)||{};
  _karteState={ habit:k.habit||'', diagnosis:k.diagnosis||'none',
    goals:[...(k.goals||[])], slimAreas:[...(k.slimAreas||[])], injuryAreas:[...(k.injuryAreas||[])], focus:[...(k.focus||[])],
    motivation:(k.motivation!=null?k.motivation:5) };
  // ── builders ──
  const card=(title)=>{ const s=el('div','kt-card'); if(title)s.appendChild(el('div','kt-h',title)); body.appendChild(s); return s; };
  const ro=(parent,label,val)=>{ const f=el('div','kt-field'); f.appendChild(el('label',null,label)); f.appendChild(el('div','kt-ro',val||'—')); parent.appendChild(f); };
  const field=(parent,label,id,val,ph,type)=>{
    const f=el('div','kt-field'); if(label)f.appendChild(el('label',null,label));
    let i; if(type==='area'){ i=el('textarea','inp'); i.rows=2; }
    else { i=el('input','inp'); i.type=(type==='number'?'number':(type==='date'?'date':'text')); if(type==='number')i.inputMode='decimal'; }
    i.id=id; if(ph)i.placeholder=ph; if(val!=null&&val!=='')i.value=val; f.appendChild(i); parent.appendChild(f); return i;
  };
  const seg=(parent,label,opts,getCur,onPick)=>{
    const f=el('div','kt-field'); if(label)f.appendChild(el('label',null,label)); const g=el('div','kt-seg');
    opts.forEach(([v,lb])=>{ const b=el('button','kt-segb'+(getCur()===v?' on':''),lb); b.type='button';
      b.onclick=()=>{ g.querySelectorAll('.kt-segb').forEach(x=>x.classList.remove('on')); b.classList.add('on'); onPick(v); }; g.appendChild(b); });
    f.appendChild(g); parent.appendChild(f);
  };
  const chips=(parent,label,opts,arr)=>{
    const f=el('div','kt-field'); if(label)f.appendChild(el('label',null,label)); const g=el('div','kt-chips');
    opts.forEach(o=>{ const v=Array.isArray(o)?o[0]:o, lb=Array.isArray(o)?o[1]:o;
      const b=el('button','kt-chip'+(arr.includes(v)?' on':''),lb); b.type='button';
      b.onclick=()=>{ const i=arr.indexOf(v); if(i<0)arr.push(v); else arr.splice(i,1); b.classList.toggle('on'); }; g.appendChild(b); });
    f.appendChild(g); parent.appendChild(f);
  };
  // ── 基本情報 ──
  const bc=card('基本情報');
  ro(bc,'お名前',name);
  const age=(typeof custAge==='function'?custAge(c):null);
  ro(bc,'生年月日',(c.dob||'—')+(age!=null?`（${age}歳）`:''));
  ro(bc,'性別',c.gender==='male'?'男性':(c.gender==='female'?'女性':'—'));
  field(bc,'職業','kt_job',k.job,'例：事務職（デスクワーク）');
  ro(bc,'身長',c.height!=null?c.height+' cm':'—');
  const oldest=recs.length?recs[recs.length-1]:null;
  field(bc,'体重（初回）','kt_fw',k.firstWeight,(oldest&&oldest.weight!=null?'記録では '+(typeof fmt==='function'?fmt(oldest.weight):oldest.weight)+' kg':'例：56.2'),'number');
  field(bc,'会員ID','kt_member',k.memberId,'例：0001');
  field(bc,'登録日','kt_regdate',k.regDate,null,'date');
  // ── 運動・トレーニング経験 ──
  const ec=card('運動・トレーニング経験');
  seg(ec,'現在の運動習慣',KARTE_HABIT,()=>_karteState.habit,v=>_karteState.habit=v);
  field(ec,'過去の運動経験','kt_past',k.pastExp,'例：ジムでのトレーニング 1年程度（1年前に中断）');
  field(ec,'得意な運動','kt_good',k.goodAt,'例：ヨガ、ウォーキング');
  field(ec,'苦手な運動','kt_weak',k.weakAt,'例：ランニング、腹筋系');
  // ── 主な目的 ──
  const gc=card('主な目的（複数選択可）');
  chips(gc,null,KARTE_GOALS,_karteState.goals);

function openProgressPhotos(name,opts){
  let view='gallery';        // gallery | compare | detail | addmeta
  let pick=[];               // 選択中の写真id（比較は最大2／削除モードは無制限）
  let delMode=!!(opts&&opts.del);   // まとめて削除モード（容量整理からの導線などで最初から有効化）
  let detailId=null;         // 詳細表示中の写真id
  let pending=null;          // 追加待ちの圧縮済み画像 {data,w,h}
  const box=el('div');
  // 撮影/選択用の隠しinput（スマホでは capture でカメラ起動、PCではファイル選択）
  const fileInput=el('input'); fileInput.type='file'; fileInput.accept='image/*';
  fileInput.setAttribute('capture','environment'); fileInput.style.display='none';
  fileInput.onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value='';
    if(!f)return;
    try{ toast('画像を処理中…'); pending=await compressImageFile(f,1280,0.82); view='addmeta'; render(); }
    catch(err){ logError('写真の読込に失敗',err&&err.message);
      showInfoModal({icon:'warn',title:'写真を追加できません',text:(err&&err.message)||'別の画像でお試しください。',btn:'OK'}); }
  };
  box.appendChild(fileInput);
  const content=el('div'); box.appendChild(content);

  const pad=n=>String(n).padStart(2,'0');
  const fmtShort=d=>{const p=String(d||'').split('-'); return p.length===3?(p[0].slice(2)+'/'+(+p[1])+'/'+(+p[2])):d;};
  const fmtFull=d=>{const p=String(d||'').split('-'); return p.length===3?(p[0]+'年'+(+p[1])+'月'+(+p[2])+'日'):d;};
  const daysBetween=(a,b)=>{const t1=Date.parse(a+'T00:00:00'),t2=Date.parse(b+'T00:00:00');
    return (isNaN(t1)||isNaN(t2))?null:Math.round(Math.abs(t2-t1)/86400000);};
  // 指定日にもっとも近い体組成記録を返す（比較時に体重差などを添える）
  function nearestRecord(date){
    const recs=(CDB.get(name)?.records)||[]; if(!recs.length)return null;
    const t=Date.parse(date+'T00:00:00'); if(isNaN(t))return null;
    let best=null,bd=Infinity;
    recs.forEach(r=>{const rt=Date.parse((r.date||'')+'T00:00:00'); if(isNaN(rt))return;
      const d=Math.abs(rt-t); if(d<bd){bd=d;best=r;}});
    return best;
  }

  function render(){
    content.innerHTML='';
    if(view==='addmeta'){ renderAddMeta(); return; }
    if(view==='detail'){ renderDetail(); return; }
    if(view==='compare'){ renderCompareResult(); return; }
    renderGallery();
  }

  function renderGallery(){
    const head=el('div'); head.style.cssText='display:flex;align-items:baseline;gap:.5rem;margin:.3rem 0 .2rem';
    head.appendChild(Object.assign(el('h3'),{textContent:'ビフォーアフター',style:'margin:0'}));

/* ══ 顧客の部位別トレーニング配分（完了セッションを集計） ══ */
function openPartDistribution(name){
  let period='all';                                   // all / 3m / 1m
  const box=el('div');
  function render(){
    box.innerHTML='';
    box.appendChild(Object.assign(el('h3'),{textContent:name+' の部位別配分'}));
    box.appendChild(el('div','mform-hint','完了したセッションの種目を部位ごとに集計しています。'));
    const chips=el('div','chips'); chips.style.margin='.2rem 0 1rem';
    [['all','全期間'],['3m','直近3ヶ月'],['1m','直近1ヶ月']].forEach(([k,l])=>{
      const b=el('button','chip'+(period===k?' on':''),l); b.onclick=()=>{period=k;render();}; chips.appendChild(b);
    });
    box.appendChild(chips);

    const sessions=SDB.forClient(name);                // 完了セッション（新しい順）
    let cutoff=null;
    if(period!=='all'){const d=new Date(); d.setMonth(d.getMonth()-(period==='3m'?3:1)); cutoff=d.toISOString().slice(0,10);}
    const inRange=sessions.filter(s=>!cutoff||(s.date||'')>=cutoff);
    const counts={}; let total=0;
    inRange.forEach(s=>(s.exercises||[]).forEach(e=>{
      const p=e.part||EX_TO_PART[e.name]||'その他'; counts[p]=(counts[p]||0)+1; total++;
    }));

    if(!total){
      const empty=el('div',null, sessions.length?'この期間の完了セッションがありません。':'完了セッションがまだありません。セッションを記録すると集計されます。');
      empty.style.cssText='color:var(--muted);text-align:center;padding:1.6rem .4rem;font-size:.9rem';
      box.appendChild(empty);
    }else{
      const meta=el('div',null,inRange.length+' セッション ・ 種目実施 '+total+' 回');
      meta.style.cssText='color:var(--muted);font-size:.82rem;font-weight:600;margin-bottom:.8rem';
      box.appendChild(meta);
      Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).forEach(p=>{
        const pct=Math.round(counts[p]/total*100);
        const row=el('div'); row.style.marginBottom='.75rem';
        const head=el('div'); head.style.cssText='display:flex;justify-content:space-between;align-items:baseline;font-size:.88rem;font-weight:700;margin-bottom:.28rem';
        const lft=el('span',null,p);
        const rgt=el('span',null,counts[p]+'回 ・ '+pct+'%'); rgt.style.cssText='color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums';
        head.appendChild(lft); head.appendChild(rgt); row.appendChild(head);
        const track=el('div'); track.style.cssText='height:10px;background:var(--surf3);border-radius:6px;overflow:hidden';
        const fill=el('div'); fill.style.cssText='height:100%;border-radius:6px;transition:width .4s ease;width:'+Math.max(pct,3)+'%;background:'+partColor(p);
        track.appendChild(fill); row.appendChild(track);
        box.appendChild(row);
      });
    }
    const close=el('button','btn ghost','閉じる'); close.style.marginTop='1.1rem'; close.onclick=closeSheet; box.appendChild(close);
  }
  render(); openSheetNode(box);
}

/* ════════ import / export ════════ */
/* バックアップ最終日時（ローカル完結のため消失対策の要）。localStorageに小さなタイムスタンプで保持。 */
const BACKUP_TS_KEY='bodyvis_last_backup_v1';
function lastBackupAt(){ try{const v=localStorage.getItem(BACKUP_TS_KEY);return v?+v:0;}catch(_){return 0;} }
function markBackupDone(){ try{localStorage.setItem(BACKUP_TS_KEY,String(Date.now()));}catch(_){} }
function daysSinceBackup(){ const t=lastBackupAt(); if(!t)return null; return Math.floor((Date.now()-t)/86400000); }
function refreshBackupUI(){ if(S.tab==='hub')renderHub(); }   // バナーを最新化

/* 全データ領域を1つのJSONにまとめる（書き出し・共有で共用） */
function buildBackupObject(){
  const data=CDB.all(); if(!Object.keys(data).length)return null;
  const out=Object.assign({},data);
  const tr=TDB.load(); if(Object.keys(tr).length)out.__training_v1=tr;   // トレーニング記録も同梱（顧客扱いされない特殊キー）
  const ss=SDB.load(); if(Object.keys(ss).length)out.__sessions_v1=ss;   // セッション履歴も同梱
  const sc=SCHED.all(); if(sc.length)out.__schedule_v1=sc;              // スケジュール（予約・本日＋今後の予定）も同梱
  const cx=XDB.all(); if(cx.length)out.__custom_ex_v1=cx;               // カスタム種目も同梱
  const dr=DDB.load(); if(Object.keys(dr).length)out.__drafts_v1=dr;    // 進行中の下書きも同梱
  const ph=PHDB.load(); if(Object.keys(ph).length)out.__photos_v1=ph;   // ビフォーアフター写真も同梱
  const nt=NDB.load(); if(Object.keys(nt).length)out.__notes_v1=nt;     // メモ・日誌も同梱
  const ec=PCUST.load(); if(Object.keys(ec).length)out.__ex_custom_v1=ec; // 顧客別 種目カスタマイズも同梱
  return {out,count:Object.keys(data).length};
}
function backupFilename(){ return `bodyvis_customers_${new Date().toISOString().slice(0,10)}.json`; }
function backupBlob(o){ return new Blob([JSON.stringify(o,null,2)],{type:'application/json'}); }

function exportJSON(){   // 端末へダウンロード保存（フォールバックにも使う）
  const b=buildBackupObject(); if(!b){toast('書き出す顧客がいません');return;}
  const a=document.createElement('a'); a.href=URL.createObjectURL(backupBlob(b.out));
  a.download=backupFilename();
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  markBackupDone(); closeSheet(); toast('書き出しました'); logInfo('バックアップ書き出し', b.count+'名'); refreshBackupUI();
}
/* 端末の共有シート（AirDrop / LINE / iCloud / Googleドライブ / ファイル…）へバックアップを渡す。
   ＝サーバー不要のまま「自分のクラウドや相手」に控えを逃がせる。非対応端末はダウンロードにフォールバック。 */
async function shareBackup(){
  const b=buildBackupObject(); if(!b){toast('書き出す顧客がいません');return;}
  const file=new File([backupBlob(b.out)],backupFilename(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:'トレカル バックアップ',text:'顧客データのバックアップ（'+b.count+'名）'});
      markBackupDone(); logInfo('バックアップ共有', b.count+'名'); toast('共有しました'); refreshBackupUI();
    }catch(err){ if(err&&err.name==='AbortError')return;   // ユーザーがキャンセル＝何もしない
      toast('共有できませんでした。ファイル保存に切り替えます'); exportJSON(); }
  }else{ toast('この端末は共有に非対応です。ファイル保存します'); exportJSON(); }
}
/* ストレージ永続化を要求＝ブラウザの自動退避（データ消失）を防ぐ。 */
async function requestPersistentStorage(){
  try{ if(navigator.storage&&navigator.storage.persist){
    const already=navigator.storage.persisted?await navigator.storage.persisted():false;
    if(!already)await navigator.storage.persist();
  }}catch(_){}
}
async function storageUsageText(){
  try{ if(navigator.storage&&navigator.storage.estimate){
    const est=await navigator.storage.estimate(); const mb=(est.usage||0)/1048576;
    return '使用容量：約 '+(mb<10?mb.toFixed(1):Math.round(mb))+' MB';
  }}catch(_){}
  return '';
}
/* ── 保存容量の把握とデータ整理（クラウド不要の容量対策） ── */
function fmtBytes(n){ n=n||0; if(n<1024)return n+' B'; const kb=n/1024; if(kb<1024)return (kb<10?kb.toFixed(1):Math.round(kb))+' KB'; const mb=kb/1024; return (mb<10?mb.toFixed(1):Math.round(mb))+' MB'; }
function byteLen(s){ if(!s)return 0; try{return new Blob([s]).size;}catch(_){return String(s).length;} }
async function storageInfo(){ try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate(); const usage=e.usage||0,quota=e.quota||0; return {usage,quota,pct:quota?usage/quota:0}; } }catch(_){} return null; }
// バナーの「閉じる」＝一定日数だけ非表示にする（スヌーズ）
function isSnoozed(key,days){ try{const ts=+localStorage.getItem(key)||0; return ts>0 && (Date.now()-ts)<days*86400000;}catch(_){return false;} }
function snoozeBanner(key){ try{localStorage.setItem(key,String(Date.now()));}catch(_){} }
async function clearAppCaches(){ try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); return true; } }catch(_){} return false; }
/* ホーム上部：保存容量が上限に近いときだけ出る注意バナー（非同期で判定して埋める） */
function buildStorageWarning(){
  const box=el('div');
  storageInfo().then(info=>{
    if(!info||!info.quota||info.pct<0.75)return;   // 75%未満は出さない
    if(info.pct<0.95 && isSnoozed('bodyvis_snooze_storage',3))return;   // 「閉じる」後は3日休止（95%以上の危険域は常時表示）
    const danger=info.pct>=0.9;
    const w=el('div','bk-reminder'+(danger?' overdue':''));
    const icb=el('div','bk-ic'); icb.innerHTML=ic('warn'); w.appendChild(icb);
    const tx=el('div','bk-tx');
    tx.appendChild(el('div','bk-t','保存容量 約'+Math.round(info.pct*100)+'%'));
    tx.appendChild(el('div','bk-s','いっぱいになる前に整理を'));
    w.appendChild(tx);
    const btn=el('button','bk-btn'); btn.innerHTML=ic('gear')+'整理'; btn.onclick=openStorageManager; w.appendChild(btn);
    const cl=el('button','bk-close'); cl.type='button'; cl.textContent='×'; cl.setAttribute('aria-label','閉じる');

    box.appendChild(w);
  });
  return box;
}

function detectPlatform(){
  const ua=navigator.userAgent||'';
  if(/android/i.test(ua))return 'android';
  if(/iphone|ipad|ipod/i.test(ua))return 'ios';
  if(/macintosh/i.test(ua)&&(navigator.maxTouchPoints||0)>1)return 'ios';   // iPadOSはMac扱いのUAになる

}

function importJSON(e){
  const file=e.target.files?.[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const incoming=JSON.parse(r.result);
    if(typeof incoming!=='object'||!incoming||Array.isArray(incoming))throw new Error('JSON形式が不正です');
    // トレーニング記録の同梱分を取り出してマージ（顧客ループの前に分離）
    const trIn=incoming.__training_v1; if(trIn&&typeof trIn==='object'){delete incoming.__training_v1;
      const t=TDB.load(); for(const nm in trIn){ if(!Array.isArray(trIn[nm]))continue;
        const ex={}; [...(Array.isArray(t[nm])?t[nm]:[]),...trIn[nm]].forEach(x=>{if(x&&x.id)ex[x.id]=x;}); t[nm]=Object.values(ex); }
      TDB.save(t); }
    const ssIn=incoming.__sessions_v1; if(ssIn&&typeof ssIn==='object'){delete incoming.__sessions_v1;
      const sm=SDB.load(); for(const nm in ssIn){ if(!Array.isArray(ssIn[nm]))continue;
        const byId={}; [...(Array.isArray(sm[nm])?sm[nm]:[]),...ssIn[nm]].forEach(x=>{if(x&&x.id)byId[x.id]=x;});
        sm[nm]=Object.values(byId).sort((a,b)=>String(b.date).localeCompare(String(a.date))); }
      SDB.save(sm); }
    const plIn=incoming.__plans_v1; if(plIn&&typeof plIn==='object'&&!Array.isArray(plIn)){delete incoming.__plans_v1;
      for(const nm in plIn){ const p=plIn[nm]; if(p&&typeof p==='object')SCHED.upsert(nm,p.date||todayISO(),p); } }   // 旧バックアップ互換
    const scIn=incoming.__schedule_v1; if(Array.isArray(scIn)){delete incoming.__schedule_v1;
      const cur=SCHED.load(); scIn.forEach(x=>{ if(x&&x.client&&x.date){ const i=cur.findIndex(y=>y.client===x.client&&y.date===x.date); if(i>=0)cur[i]=x; else cur.push(x); } }); SCHED.save(cur); }
    const cxIn=incoming.__custom_ex_v1; if(Array.isArray(cxIn)){delete incoming.__custom_ex_v1;
      const ex=XDB.all(); cxIn.forEach(it=>{if(it&&it.name&&!ex.some(x=>x.name===it.name))ex.push({name:String(it.name),part:it.part||'',unit:(it.unit==='秒'||it.unit==='分')?it.unit:'回',image:it.image||''});}); XDB.save(ex); }
    const drIn=incoming.__drafts_v1; if(drIn&&typeof drIn==='object'&&!Array.isArray(drIn)){delete incoming.__drafts_v1;
      const dm=DDB.load(); for(const nm in drIn){ if(drIn[nm]&&typeof drIn[nm]==='object')dm[nm]=drIn[nm]; } DDB.save(dm); }
    const phIn=incoming.__photos_v1; if(phIn&&typeof phIn==='object'&&!Array.isArray(phIn)){delete incoming.__photos_v1;
      const pm=PHDB.load(); for(const nm in phIn){ if(!Array.isArray(phIn[nm]))continue;
        const byId={}; [...(Array.isArray(pm[nm])?pm[nm]:[]),...phIn[nm]].forEach(x=>{if(x&&x.id&&x.data)byId[x.id]=x;});
        pm[nm]=Object.values(byId); } PHDB.save(pm); }
    const ntIn=incoming.__notes_v1; if(ntIn&&typeof ntIn==='object'&&!Array.isArray(ntIn)){delete incoming.__notes_v1;
      const nm2=NDB.load(); for(const nm in ntIn){ if(!Array.isArray(ntIn[nm]))continue;
        const byId={}; [...(Array.isArray(nm2[nm])?nm2[nm]:[]),...ntIn[nm]].forEach(x=>{if(x&&x.id)byId[x.id]=x;});
        nm2[nm]=Object.values(byId); } NDB.save(nm2); }
    const ecIn=incoming.__ex_custom_v1; if(ecIn&&typeof ecIn==='object'&&!Array.isArray(ecIn)){delete incoming.__ex_custom_v1;
      const ec2=PCUST.load(); for(const nm in ecIn){ const src=ecIn[nm]; if(!src||typeof src!=='object'||Array.isArray(src))continue;
        ec2[nm]=Object.assign({}, ec2[nm]||{}, src); } PCUST.save(ec2); }
    const cur=CDB.all(); let added=0,merged=0;
    Object.values(incoming).forEach(c=>{if(!c||!c.name)return; c.records=Array.isArray(c.records)?c.records:[];
      // 取込データの目標値を数値へ強制（不正値の混入＝XSS/破損を防ぐ）
      if(c.goal&&typeof c.goal==='object'){for(const k of ['weight','bodyFatPct','muscleMass','visceralFat','armM','armF','legM','legF','trunkM','trunkF']){
        if(c.goal[k]!=null){const n=Number(c.goal[k]); c.goal[k]=isNaN(n)?null:n;}}}
      if(cur[c.name]){const byD={};[...(cur[c.name].records||[]),...c.records].forEach(x=>{if(x&&x.date)byD[x.date]=x;});
        cur[c.name].records=Object.values(byD).sort((a,b)=>b.date.localeCompare(a.date));
        if(c.goal)cur[c.name].goal=c.goal; if(c.age!=null&&cur[c.name].age==null)cur[c.name].age=c.age;
        if(c.dob&&!cur[c.name].dob)cur[c.name].dob=c.dob; merged++;}
      else{cur[c.name]=c;added++;}});
    CDB.save(cur); ensureActive(); syncTop();
    showInfoModal({icon:'down',title:'取込完了',text:'新規 '+added+' 名 / 更新 '+merged+' 名 を取り込みました。',btn:'OK'}); logInfo('取込完了','新規'+added+' / 更新'+merged); renderCust(); refreshSettings();
  }catch(err){logError('取込に失敗',err&&err.message); showInfoModal({icon:'warn',title:'取込に失敗しました',text:(err&&err.message)||'ファイル形式をご確認ください。',btn:'OK'});} e.target.value='';};
  r.readAsText(file);
}

  const row=(k,val,warn)=>{const r=el('div'); r.style.cssText='display:flex;gap:.6rem;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.82rem';

  const isFile=location.protocol==='file:';
  b.appendChild(row('オリジン', isFile?'file://（共有されません）':location.origin, isFile));

  // 2) 保存キーの中身
  const raw=dbGet(DB_KEY);
  b.appendChild(row('保存先', _idb?'IndexedDB（大容量・自動削除防止）':'localStorage（約5MB上限）', !_idb));
  b.appendChild(row('保存キー', DB_KEY));
  b.appendChild(row('保存サイズ', raw?raw.length.toLocaleString()+'文字':'なし', !raw));

  // 3) bodyvis_ で始まる他キーも一覧（別キーに入っていないか確認）
  const otherKeys=[]; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k!==DB_KEY&&/bodyvis/i.test(k))otherKeys.push(k);}
  if(otherKeys.length)b.appendChild(row('その他のキー', otherKeys.join(', ')));

  // 4) 顧客ごとの記録件数
  const all=CDB.all(), names=Object.keys(all);
  b.appendChild(row('顧客数', names.length+'名', !names.length));
  const noRec=names.filter(n=>!(all[n].records||[]).length);
  b.appendChild(row('記録0件の顧客', noRec.length+'名', noRec.length>0&&noRec.length===names.length));

  const list=el('div'); list.style.cssText='margin-top:.5rem;font-size:.78rem';

  names.forEach(n=>{const r=(all[n].records||[]); const line=el('div');
    line.style.cssText='padding:.25rem 0;display:flex;justify-content:space-between;gap:.5rem';
    line.appendChild(el('span',null,n));
    const info=el('span',null, r.length?`記録${r.length}件 / 最新 ${r[0]?.date||'?'} ${fmt(r[0]?.weight)}kg`:'記録0件');
    info.style.cssText='color:'+(r.length?'var(--green)':'var(--red)')+';font-weight:700;text-align:right;white-space:nowrap';
    line.appendChild(info); list.appendChild(line);});
  b.appendChild(list);

  // 5) 判定メッセージ
  const verdict=el('div'); verdict.style.cssText='margin-top:.7rem;padding:.6rem .7rem;border-radius:10px;font-size:.8rem;line-height:1.5;background:var(--surf2);border:1px solid var(--border)';
  let msg;
  if(!names.length) msg='このオリジンに顧客がいません。index-3d側と別オリジンで開いている可能性大。下の「取り込む(JSON)」でこの画面に直接JSONを読み込んでください。';
  else if(noRec.length===names.length) msg='顧客はいるが全員が記録0件。名前だけの顧客が残り、記録付きデータは未取込です。「取り込む(JSON)」でJSONを読み込めば記録が入ります。';
  else if(noRec.length) msg=`一部（${noRec.length}名）が記録0件です。残りは正常に記録が入っています。`;
  else msg='全顧客に記録が入っています。表示は正常な状態です。';
  verdict.textContent=msg; b.appendChild(verdict);

  det.appendChild(b); return det;
}

Chart.defaults.font.family="'Hiragino Kaku Gothic ProN','Segoe UI',sans-serif";
function drawLine(canvasId,labels,series,goal){
  if(charts[canvasId]){charts[canvasId].destroy();}
  const ctx=$(canvasId); if(!ctx)return;
  const multi=series.length>1;   // 複数系列（まとめグラフ）は塗り無し＝線が重なっても見やすい
  // 完全な日付(YYYY-MM-DD)なら「時間軸(linear)」で実際の測定間隔を反映＝毎日/週数回など不定期でも正しい間隔に。
  // 月のみの旧データ等はカテゴリ軸にフォールバック（等間隔）。
  const isDate=labels.length>0&&labels.every(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  const xs=isDate?labels.map(d=>new Date(d+'T00:00:00').getTime()):null;
  const mk=data=>isDate?data.map((y,i)=>({x:xs[i],y})):data;
  // ネイティブの点描画は 0 にして、ワイプ先端を通過した点だけを revealPlugin が自前でフル描画する
  // （矩形クリップの端が点を横切って「点が半分だけ描かれる」ちらつきを防ぐ）。ホバー/ツールチップは pointHitRadius で維持。
  const ds=series.map(s=>({label:s.label,data:mk(s.data),borderColor:s.color,backgroundColor:multi?'transparent':s.color+'22',
    borderWidth:2.4,tension:.35,pointRadius:0,pointHoverRadius:multi?4:5,pointHitRadius:14,_pr:multi?2:3,pointBackgroundColor:s.color,pointBorderWidth:0,fill:!multi,spanGaps:true}));
  if(goal!=null){const gd=isDate?[{x:xs[0],y:goal},{x:xs[xs.length-1],y:goal}]:labels.map(()=>goal);
    ds.push({label:'目標',data:gd,borderColor:getCss('--gold'),borderWidth:1.4,borderDash:[5,4],pointRadius:0,fill:false});}
  // 縦軸の上に約 +3 の余白を持たせる（グラフ上端に線が張り付かないように）
  const yVals=[]; series.forEach(s=>(s.data||[]).forEach(v=>{if(v!=null&&!isNaN(v))yVals.push(+v);}));
  if(goal!=null&&!isNaN(goal))yVals.push(+goal);
  const yTop=yVals.length?Math.max(...yVals)+3:undefined;
  const shortT=ms=>{const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()}`;};
  const xScale=isDate
    ?{type:'linear',min:xs[0],max:xs[xs.length-1],grid:{display:false},
      ticks:{color:getCss('--muted'),font:{size:10},maxTicksLimit:6,autoSkipPadding:12,callback:v=>shortT(v)}}
    :{grid:{display:false},ticks:{color:getCss('--muted'),font:{size:10},maxTicksLimit:6}};
  charts[canvasId]=new Chart(ctx,{type:'line',
    data:{labels:isDate?undefined:labels.map(d=>chartDateLabel(d)),datasets:ds},
    plugins:[revealPlugin],
    options:{responsive:true,maintainAspectRatio:false,animation:false,   // 描画は下の連続ワイプで滑らかに行う
      parsing:isDate?false:undefined,
      plugins:{legend:{display:false},
        tooltip:{callbacks:{title:items=>{if(!items.length)return''; return isDate?ymdLabel(new Date(items[0].parsed.x).toISOString().slice(0,10)):items[0].label;}}}},
      scales:{x:xScale,
              y:{suggestedMax:yTop,grid:{color:getCss('--grid')},ticks:{color:getCss('--muted'),font:{size:10}},border:{display:false}}}}});
  startReveal(canvasId,charts[canvasId]);   // 左→右へ滑らかにワイプ表示
}
/* 折れ線を左→右へ連続的に「ワイプ表示」するプラグイン＋駆動関数（点ごとの段階描画より滑らか） */
const revealPlugin={id:'reveal',
  beforeDatasetsDraw(chart){const p=chart.$reveal==null?0:chart.$reveal; chart._revClip=false; if(p>=1)return;   // 未開始(null)は0=非表示にして初期フラッシュを防ぐ
    const a=chart.chartArea, c=chart.ctx; c.save(); c.beginPath();
    c.rect(a.left,a.top,Math.max(0,(a.right-a.left)*p),a.bottom-a.top); c.clip(); chart._revClip=true;},
  afterDatasetsDraw(chart){const c=chart.ctx;
    if(chart._revClip){c.restore(); chart._revClip=false;}   // 折れ線のワイプ用クリップを解除してから点を描く（点はクリップしない＝半分描画を防ぐ）
    const p=chart.$reveal==null?0:chart.$reveal, a=chart.chartArea;
    const front=p>=1?a.right+1e6:a.left+(a.right-a.left)*p;   // ワイプ先端。ここを通過した点だけをフル描画
    chart.data.datasets.forEach((ds,di)=>{const r=ds&&ds._pr; if(!r)return;   // _pr が無い系列（目標線）は点を描かない
      const meta=chart.getDatasetMeta(di); if(!meta||meta.hidden||!meta.data)return;
      const col=ds.pointBackgroundColor||ds.borderColor||'#4f9fff';
      meta.data.forEach(pt=>{if(!pt||pt.x==null||pt.x>front+0.5)return;   // 先端より右の点はまだ出さない
        c.save(); c.beginPath(); c.fillStyle=col; c.arc(pt.x,pt.y,r,0,Math.PI*2); c.fill(); c.restore();});});}};
const revealTokens={};
function startReveal(id,chart){
  if(!chart||typeof requestAnimationFrame!=='function'){if(chart){chart.$reveal=1;try{chart.draw();}catch(e){}}return;}
  const tok=Symbol(); revealTokens[id]=tok; chart.$reveal=0;
  const dur=1100, t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   // easeInOutCubic＝ゆっくり→速く→ゆっくり
  (function frame(now){
    if(revealTokens[id]!==tok)return;                  // 再描画で置き換わったら停止
    const p=Math.min(1,(now-t0)/dur); chart.$reveal=ease(p);
    try{chart.draw();}catch(e){return;}
    if(p<1)requestAnimationFrame(frame); else chart.$reveal=1;
  })(t0);
}

      if(Math.abs(d)>=eps){const[gc]=deltaClass(key,d); cls=(gc==='up'?'good':gc==='down'?'bad':'flat'); txt=(d>0?'+':'')+fmt(d,dp)+unit;}
      b.appendChild(el('span','mr-pill '+cls,txt));
    }else if(prev){ b.appendChild(el('span','mr-pill flat','—')); }
    return b;
  };
  boxes.appendChild(mkBox('体重','scale','#2f7de0','weight','kg',1,latest.weight,prev?.weight));
  boxes.appendChild(mkBox('体脂肪率','drop','#e2483d','bodyFatPct','%',1,latest.bodyFatPct,prev?.bodyFatPct));
  boxes.appendChild(mkBox('骨格筋率','muscle','#e0517a','muscleMass','%',1,latest.muscleMass,prev?.muscleMass));
  boxes.appendChild(mkBox('内臓脂肪','organ','#7b8494','weight','',0,latest.visceralFat,prev?.visceralFat));
  boxes.appendChild(mkBox('BMI','bmi','#2f7de0','weight','',1,bmiOf(latest),prev?bmiOf(prev):null));
  boxes.appendChild(mkBox('体年齢','age','#2f7de0','weight','歳',0,latest.bodyAge,prev?.bodyAge));
  root.appendChild(boxes);

  /* ── ② 目標と達成度（バー） ── */
  if(c.goal&&['weight','bodyFatPct','muscleMass'].some(k=>c.goal[k]!=null)){
    root.appendChild(mkH2(2,'目標と達成度',null));
    const gwrap=el('div');
    [['体重','weight','kg',1],['体脂肪率','bodyFatPct','%',1],['骨格筋率','muscleMass','%',1]].forEach(([lbl,k,u,dp])=>{
      const g=c.goal[k]; if(g==null)return; const cur=latest[k], base=first[k];
      const row=el('div','mr-goal');

      row.appendChild(el('div','mr-goal-v',(cur!=null?fmt(cur,dp)+u:'—')+' / '+fmt(g,dp)+u));
      let pct=null; if(base!=null&&cur!=null&&(g-base)!==0)pct=Math.max(0,Math.min(100,(cur-base)/(g-base)*100));
      const done=(cur!=null&&Math.abs(g-cur)<0.05), near=(!done&&pct!=null&&pct>=75);
      const bar=el('div','mr-goal-bar'+(done?' done':near?' near':'')); const fi=el('i'); fi.style.width=(done?100:(pct==null?0:Math.round(pct)))+'%'; bar.appendChild(fi); row.appendChild(bar);
      const st=el('div','mr-goal-s '+(done?'done':'rem'));
      st.textContent=done?'達成！✓':(cur!=null?'あと '+fmt(Math.abs(g-cur),dp)+u:'—'); row.appendChild(st);
      gwrap.appendChild(row);
    });
    root.appendChild(gwrap);
  }

  /* ── ③ これまでの変化（合成グラフ・凡例つき） ── */
  if(a.length>=2){
    root.appendChild(mkH2(3,'これまでの変化','グラフ'));
    const labels=a.map(r=>r.date.slice(0,7));
    const defs=[['weight','体重 (kg)','#4f9fff'],['bodyFatPct','体脂肪率 (%)','#19c39a'],
                ['muscleMass','骨格筋率 (%)','#ff6b6b'],['bmi','BMI','#e0a52e']];
    const series=defs.filter(([k])=>k==='bmi'?a.some(r=>bmiOf(r)!=null):a.some(r=>r[k]!=null))
      .map(([k,cap,col])=>({label:cap,data:a.map(r=>k==='bmi'?bmiOf(r):(r[k]??null)),color:col}));
    if(series.length){
      const fig=el('figure','mr-chart'); const cv=repCanvas('mrc_all'); fig.appendChild(cv); root.appendChild(fig);
      repLineMulti(cv,labels,series);
    }
  }

  /* ── ④ 部位別の変化（前回比・両腕/体幹/両脚） ── */
  {
    const PARTS=[['両腕','arm'],['体幹','trunk'],['両脚','leg']];
    const has=PARTS.some(([,p])=>['M','F'].some(mk=>latest[p+mk]!=null));
    if(has){
      root.appendChild(mkH2(4,'部位別の変化',prev?'前回比':null));
      const t=document.createElement('table');
      const thead=document.createElement('thead'),hr=document.createElement('tr');
      ['部位','骨格筋率','皮下脂肪率','骨格筋率の変化','皮下脂肪率の変化'].forEach(h=>hr.appendChild(el('th',null,h)));
      thead.appendChild(hr); t.appendChild(thead);
      const tb=document.createElement('tbody');
      PARTS.forEach(([pl,p])=>{
        const tr=document.createElement('tr'); tr.appendChild(el('td',null,pl));
        const cvM=latest[p+'M'], cvF=latest[p+'F'];
        tr.appendChild(el('td',null,cvM!=null?fmt(cvM)+'%':'—'));
        tr.appendChild(el('td',null,cvF!=null?fmt(cvF)+'%':'—'));
        [['M','up'],['F','down']].forEach(([mk,dir])=>{
          const pv=prev?prev[p+mk]:null, cv=latest[p+mk]; let txt='—',cls=null;
          if(pv!=null&&cv!=null){const d=cv-pv; txt=Math.abs(d)<1e-9?'±0%':(d>0?'+':'')+fmt(d)+'%'; cls=Math.abs(d)<1e-9?null:((d<0)===(dir==='down')?'mr-down':'mr-up');}
          tr.appendChild(el('td',cls,txt));
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb); root.appendChild(t);
    }
  }

  /* ── QRコード ── */
  const footRow=el('div','mr-foot-row');
  const qrLink=(()=>{try{return shareLink(c);}catch(e){return null;}})();
  const qrData=qrLink?mrMakeQR(qrLink):null;
  const qrBox=el('div','mr-qr'); qrBox.style.flex='1'; qrBox.style.width='auto';
  if(qrData){const im=el('img'); im.src=qrData; im.alt='QR'; qrBox.appendChild(im);}
  qrBox.appendChild(Object.assign(el('div','mr-qr-t'),{innerHTML:'次回の測定も<br>がんばりましょう！<br>こちらの<b>QRコード</b>から<br>レポートをいつでも確認できます。'}));
  footRow.appendChild(qrBox);
  root.appendChild(footRow);

  /* ── フッター ── */
  const foot=el('div','mr-foot');
  foot.appendChild(el('div','mr-foot-gym',displayGym));
  foot.appendChild(el('div','mr-foot-note','このレポートはトレーナーから共有されました'));
  root.appendChild(foot);

  return true;
}

/* ════════ レポートを直接PDFダウンロード（jsPDF + html2canvas・遅延読込） ════════ */
function loadScriptOnce(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('読み込み失敗: '+src)); document.head.appendChild(s);});
}
function loadPdfLibs(){
  const need=[];
  if(!window.html2canvas) need.push(loadScriptOnce('./vendor/html2canvas/html2canvas.min.js'));
  if(!(window.jspdf&&window.jspdf.jsPDF)) need.push(loadScriptOnce('./vendor/jspdf/jspdf.umd.min.js'));
  return Promise.all(need);
}
let _pdfBusy=false;
/* レポートPDFを生成（トレーナー用・共有用で共通コア）。opt.share=true で端末の共有シートへ、
   それ以外はファイル保存（ダウンロード）。Promiseを返す。 */
function _reportToPDF(c,opt){
  const share=!!(opt&&opt.share);
  if(_pdfBusy)return Promise.resolve(false); _pdfBusy=true;
  closeSheet();
  return loadQR().catch(()=>null).then(()=>{   // QRを先読みしてレポート内に埋め込む（失敗しても続行）
  if(!buildMReport(c)){ _pdfBusy=false; return Promise.resolve(false); }
  toast('PDFを作成しています…');
  const root=$('mReport'); root.classList.add('pdfgen');
  return loadPdfLibs()
    .then(()=>(document.fonts&&document.fonts.ready)||Promise.resolve())
    .then(()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))) // レイアウト・チャート描画確定待ち
    .then(()=>window.html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:root.scrollWidth}))
    .then(async canvas=>{
      const {jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
      const margin=7, availW=pageW-margin*2, availH=pageH-margin*2;
      // レポート全体を A4 1ページに収める（アスペクト比を保って availW×availH にフィット・高いときは縮小）
      let imgW=availW, imgH=availW*canvas.height/canvas.width;
      if(imgH>availH){ imgH=availH; imgW=availH*canvas.width/canvas.height; }
      const x=(pageW-imgW)/2, y=margin;
      pdf.addImage(canvas.toDataURL('image/jpeg',0.94),'JPEG',x,y,imgW,imgH,undefined,'FAST');
      const fname='トレカル_'+repSan(c.name)+'.pdf';
      if(share){   // 端末の共有シート（LINE / メール / AirDrop / ドライブ…）へPDFファイルを渡す
        try{
          const file=new File([pdf.output('blob')],fname,{type:'application/pdf'});
          if(navigator.canShare&&navigator.canShare({files:[file]})){
            await navigator.share({files:[file],title:'体組成レポート',text:(c.name?c.name+' さんの':'')+'体組成レポート'});
            toast('共有しました'); return true;
          }
          pdf.save(fname); toast('この端末は共有に非対応です。PDFを保存しました'); return true;   // 非対応→保存
        }catch(err){ if(err&&err.name==='AbortError')return false;   // ユーザーがキャンセル
          pdf.save(fname); toast('共有できなかったためPDFを保存しました'); return true; }
      }
      pdf.save(fname); toast('PDFを保存しました'); return true;
    })
    .catch(()=>{ // ライブラリ未読込/生成失敗時は印刷ダイアログへフォールバック
      toast('直接保存に失敗しました。印刷から保存してください');
      try{window.print();}catch(e){}
      return false;
    })
    .finally(()=>{ root.classList.remove('pdfgen'); _pdfBusy=false; });
  });
}

/* QR共有ペイロード → 顧客オブジェクトを復元し、トレーナーと同じフルレポートをPDF化。 */
function buildCustomerFromShare(p){
  const rd=x=>(x==null||x===''||isNaN(+x))?null:+x;
  const L=p.L||[], S=p.S||[], G=p.G||[], T=p.T||[];
  const records=[];
  T.forEach(r=>{ const ym=String(r[0]); if(ym.length<4)return;   // 'YYMM' → 20YY-MM-01
    records.push({date:'20'+ym.slice(0,2)+'-'+ym.slice(2,4)+'-01', weight:rd(r[1]), bodyFatPct:rd(r[2]), muscleMass:rd(r[3])}); });
  const latestDate = p.d ? (String(p.d).length>=7?String(p.d).slice(0,7)+'-01':String(p.d)) : (records.length?records[records.length-1].date:null);
  if(latestDate){
    const latest={date:latestDate, weight:rd(L[0]), bodyFatPct:rd(L[1]), muscleMass:rd(L[2]),
      visceralFat:rd(L[3]), bmi:rd(L[4]), bodyAge:rd(L[5]), bmr:rd(L[6]),
      armM:rd(S[0]),armF:rd(S[1]),legM:rd(S[2]),legF:rd(S[3]),trunkM:rd(S[4]),trunkF:rd(S[5])};
    const i=records.findIndex(r=>r.date.slice(0,7)===latest.date.slice(0,7));
    if(i>=0)Object.assign(records[i],latest); else records.push(latest);
  }
  records.sort((a,b)=>b.date.localeCompare(a.date)); // 新しい順（CDB慣習）
  return {
    name: p.n||'ゲスト', gender: p.g||'', age: (p.a!=null&&!isNaN(+p.a))?+p.a:null,
    goal: G.some(g=>rd(g)!=null)?{weight:rd(G[0]),bodyFatPct:rd(G[1]),muscleMass:rd(G[2])}:null,
    records, __gym: p.b||'', __trainer: p.tn||'', __trainerMsg: p.msg||''
  };
}
window.downloadSharedReportPDF=function(payload){
  const c=buildCustomerFromShare(payload||{});
  if(!c.records.length){ try{toast('レポートを作成できるデータがありません');}catch(e){} return Promise.resolve(false); }
  return _reportToPDF(c);
};

/* ════════ QR共有 ════════
   QR = 公開URL + '#share=<圧縮ペイロード>'。スキャンで読み取り専用の結果ビュー
   （このページ冒頭の早期スクリプト）が開く。データはURLフラグメントにのみ含まれ
   サーバー送信されない（オフライン・プライバシー配慮）。 */
const SHARE_PUBLIC_URL='https://poka-tools.github.io/bodyverse-c0d7654f/m.html';
function loadQR(){
  if(window.qrcode)return Promise.resolve(window.qrcode);
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src='./vendor/qrcode/qrcode.js';
    s.onload=()=>window.qrcode?resolve(window.qrcode):reject(new Error('QR初期化に失敗しました'));
    s.onerror=()=>reject(new Error('QRライブラリの読み込みに失敗しました'));
    document.head.appendChild(s);
  });
}
// 共有リンク/QRは相手のスマホで開くため、常に公開URLを基点にする（localhost等では届かないため）。
// 公開ホスト(https・非localhost)で動いていれば、その実オリジンを基点にする＝Cloudflare/独自ドメイン等へ
// 移行してもコード修正不要。開発時(localhost/file:/wrapper)のみ固定の公開URL(SHARE_PUBLIC_URL)へフォールバック。
// 共有データはURLフラグメント(#share=)に全て含まれ、公開版m.htmlがどこでも描画できる。
function shareBaseURL(){
  try{
    const o=location.origin||'';
    if(/^https:\/\//i.test(o) && !/(^https:\/\/)?(localhost|127\.0\.0\.1|0\.0\.0\.0)/i.test(o)){
      return o + location.pathname; // 例: https://xxx.pages.dev/m.html
    }
  }catch(_){}
  return SHARE_PUBLIC_URL;
}
/* URLセーフな base64url（percentエンコード不使用＝QRを小さく保つ・UTF-8対応）。結果ビューの b64urlDecode と対。 */
function b64urlEncode(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

/* 顧客→コンパクト共有ペイロード。形式は冒頭の結果ビュー render() と一致必須。 */
function buildSharePayload(c,opt){
  const anon=opt&&opt.anon; const rd=(x,p=1)=>(x==null||x===''||isNaN(+x))?null:+(+x).toFixed(p);
  const recs=(c.records||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)); // 昇順
  const latest=recs[recs.length-1]||{};
  const prevRec=recs[recs.length-2]||null;   // 前回比の算出用
  // T列: [YYMM, 体重, 体脂肪率, 骨格筋率, BMI]（BMIはWeb版の合成グラフ用に追加。旧リンクは4列＝BMIはnull扱い）
  const trend=recs.slice(-18).map(r=>[r.date.slice(2).replace('-',''),rd(r.weight),rd(r.bodyFatPct),rd(r.muscleMass),rd(bmiOf(r))]);
  const brand=getBrand();
  const gym=(brand.gymName||'').trim(), trainer=(brand.trainerName||'').trim();
  const p={v:1,d:latest.date||'',
    L:[rd(latest.weight),rd(latest.bodyFatPct),rd(latest.muscleMass),rd(latest.visceralFat),rd(latest.bmi),rd(latest.bodyAge,0),rd(latest.bmr,0)],
    P:prevRec?[rd(prevRec.weight),rd(prevRec.bodyFatPct),rd(prevRec.muscleMass),rd(prevRec.visceralFat),rd(bmiOf(prevRec)),rd(prevRec.bodyAge,0)]:null,
    S:[rd(latest.armM),rd(latest.armF),rd(latest.legM),rd(latest.legF),rd(latest.trunkM),rd(latest.trunkF)],
    G:[rd(c.goal&&c.goal.weight),rd(c.goal&&c.goal.bodyFatPct),rd(c.goal&&c.goal.muscleMass)],
    T:trend};
  if(!anon&&c.name)p.n=c.name;
  if(c.gender)p.g=c.gender;                 // 性別・年齢はレポート表紙用（識別情報ではないので匿名時も含める）
  const _shareAge=custAge(c); if(_shareAge!=null)p.a=_shareAge;   // 共有時点の年齢（生年月日から自動計算）
  if(gym)p.b=gym;
  if(trainer)p.tn=trainer;                  // 担当名（表紙用）
  return p;
}
function shareLink(c,opt){ return shareBaseURL()+'#share='+b64urlEncode(JSON.stringify(buildSharePayload(c,opt))); }

/* QRモデルを canvas に描画（innerHTML不使用・PNG保存にも使う）。 */
function qrToCanvas(qr,px){
  px=px||560; const n=qr.getModuleCount(),margin=4,total=n+margin*2;
  const cv=document.createElement('canvas'); cv.width=cv.height=px;
  const ctx=cv.getContext('2d'),cell=px/total;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(qr.isDark(r,cc))
    ctx.fillRect(Math.round((cc+margin)*cell),Math.round((r+margin)*cell),Math.ceil(cell),Math.ceil(cell));
  return cv;
}

  let curQR=null,curLink='';
  function refresh(){
    curLink=shareLink(c,{anon:anonChk.checked});
    curQR=null;
    // QRには「完全なURL」を入れる（スキャンで結果ページが開く）。Byteモード・ECC=M。
    for(let t=1;t<=40;t++){ try{const q=window.qrcode(t,'M');q.addData(curLink,'Byte');q.make();curQR=q;break;}catch(e){} }
    link.value=curLink; host.textContent='';

  };

/* ════════ アプリロック (A1: PIN) ════════ */
const LOCK_KEY='bodyvis_lock_v1';
function lockConf(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')}catch{return null}}
function lockEnabled(){const c=lockConf();return !!(c&&c.hash);}
function randSalt(){const a=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');}
async function hashPin(salt,pin){
  const data=salt+':'+pin;
  if(window.crypto&&crypto.subtle){
    try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){/* 非secure環境等はフォールバック */}
  }
  let h=5381; for(let i=0;i<data.length;i++)h=((h*33)^data.charCodeAt(i))>>>0; return 'f'+h.toString(16);
}
async function setPin(pin,autolockMin){
  const salt=randSalt(); const hash=await hashPin(salt,pin);
  lsSet(LOCK_KEY,JSON.stringify({salt,hash,len:pin.length,autolockMin:autolockMin==null?3:autolockMin}));
  logInfo('PINロックを設定/変更');
}
function clearPinLock(){try{localStorage.removeItem(LOCK_KEY)}catch(e){} logInfo('PINロックを解除');}
async function verifyPin(pin){const c=lockConf(); if(!c)return true; return (await hashPin(c.salt,pin))===c.hash;}

let _lockBuf='', _lastHidden=0;
function showLock(){
  if(!lockEnabled()||$('lockOv'))return;
  document.body.classList.add('locked');
  const ov=el('div','lock-ov'); ov.id='lockOv';
  const box=el('div','lock-box');
  const icd=el('div','lock-ic'); icd.innerHTML=ic('lock'); box.appendChild(icd);   // innerHTMLは静的アイコンのみ＝安全
  box.appendChild(el('div','lock-title','ロックを解除'));
  const dots=el('div','lock-dots'); dots.id='lockDots'; box.appendChild(dots);
  const err=el('div','lock-err'); err.id='lockErr'; box.appendChild(err);
  const pad=el('div','lock-pad');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k=>{
    if(k===''){pad.appendChild(el('span'));return;}
    const b=el('button','lock-key',k); b.type='button'; b.onclick=()=>lockKey(k); pad.appendChild(b);
  });
  box.appendChild(pad); ov.appendChild(box); document.body.appendChild(ov);
  _lockBuf=''; renderLockDots();
}
function renderLockDots(){
  const d=$('lockDots'); if(!d)return; const len=(lockConf()||{}).len||4; d.innerHTML='';
  for(let i=0;i<len;i++)d.appendChild(el('span','lock-dot'+(i<_lockBuf.length?' on':'')));
}
async function lockKey(k){
  const len=(lockConf()||{}).len||4; const err=$('lockErr'); if(err)err.textContent='';
  if(k==='⌫'){_lockBuf=_lockBuf.slice(0,-1);renderLockDots();return;}
  if(_lockBuf.length>=len)return;
  _lockBuf+=k; renderLockDots();
  if(_lockBuf.length>=len){
    if(await verifyPin(_lockBuf)){logInfo('ロック解除');hideLock();}
    else{ if(err)err.textContent='PINが違います'; logWarn('PIN不一致');
      const box=document.querySelector('.lock-box'); if(box){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
      _lockBuf=''; setTimeout(renderLockDots,120); }
  }
}
function hideLock(){const ov=$('lockOv'); if(ov)ov.remove(); document.body.classList.remove('locked'); _lockBuf=''; _lastHidden=0; maybeOnboarding();}
// 物理キーボード（PC）でも入力可
document.addEventListener('keydown',e=>{
  if(!$('lockOv'))return;
  if(/^[0-9]$/.test(e.key))lockKey(e.key);
  else if(e.key==='Backspace'){e.preventDefault();lockKey('⌫');}
});
// 自動ロック: バックグラウンド滞在が設定分を超えたら再ロック
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && window._hubDay && todayISO()!==window._hubDay && S.tab==='hub')renderHub();   // 復帰時に日付が変わっていたら本日の予定を更新＝前日の完了リストを消す
  if(!lockEnabled())return;
  if(document.hidden){_lastHidden=Date.now();}
  else{const min=(lockConf()||{}).autolockMin; const m=(min==null?3:min);
    if(m>=0 && _lastHidden && (Date.now()-_lastHidden)>=m*60000)showLock();}
});

      else if(kind==='action'){ const ab=el('button','btn ghost'); ab.type='button'; ab.style.marginTop='.4rem'; ab.innerHTML=ic(val.ic||'home')+val.label; ab.onclick=val.fn; bd.appendChild(ab); }
    });
    box.appendChild(bd);
    head.onclick=()=>{ box.classList.toggle('open'); };   // 各項目を独立して開閉
    body.appendChild(box);
  });
}
function openUsageGuide(){
  if($('usageGuidePage'))return;
  closeSheet();   // シート/スクリムを閉じてからページを開く（戻るボタンを塞がないように）
  const pg=el('div','settings-page'); pg.id='usageGuidePage';
  const hd=el('div','set-head');
  const back=el('button','set-back'); back.type='button'; back.setAttribute('aria-label','戻る'); back.innerHTML=ic('back'); back.onclick=closeUsageGuide;
  hd.appendChild(back); hd.appendChild(el('div','set-title','使い方ガイド'));
  pg.appendChild(hd);
  const body=el('div','set-body'); body.id='ugBody'; pg.appendChild(body);
  pg.appendChild(setBottomBackBar(closeUsageGuide));   // 画面下部にも戻るバー（片手操作用）
  document.body.appendChild(pg);
  renderUsageGuide();
}
function closeUsageGuide(){ closeSheet(); const p=$('usageGuidePage'); if(p)p.remove(); }
// 全画面ページ（設定/使い方ガイド）用の、画面下部に固定した「戻る」バーを生成
function setBottomBackBar(closeFn){
  const bar=el('div','set-botbar');
  const b=el('button','set-botback'); b.type='button'; b.setAttribute('aria-label','戻る');
  b.innerHTML=ic('back')+'<span>戻る</span>';   // 静的アイコン＋固定文言のみ（XSS無）
  b.onclick=closeFn;
  bar.appendChild(b);
  return bar;
}
// 「使い方ガイド」ボタンは詳しい別ページを開く（旧: オンボーディングのポップアップ再表示）
function openHelpGuide(){ openUsageGuide(); }

/* ════════ boot ════════ */
// 起動スプラッシュの制御：最低表示時間を確保しつつ、初期化完了でフェードアウト
const _splashStart=Date.now();
function hideSplash(){
  const s=document.getElementById('splash'); if(!s||s.classList.contains('hide'))return;
  const wait=Math.max(0,750-(Date.now()-_splashStart));   // 一瞬で消えないよう最低約0.75秒は表示
  setTimeout(()=>{ s.classList.add('hide'); setTimeout(()=>{ if(s.parentNode)s.parentNode.removeChild(s); },500); },wait);
}
setTimeout(hideSplash,4000);   // 初期化が失敗/長引いてもスプラッシュに閉じ込めない保険
(async function boot(){
  // 共有ビュー(#share=)では本体アプリを初期化しない＝オンボーディング案内やPINロックの
  // ポップアップが顧客の結果レポートに被らないようにする。共有ビューの描画とPDF保存は
  // ページ冒頭の早期スクリプト＋window.downloadSharedReportPDF側で完結する。
  if(document.documentElement.classList.contains('share-mode')){ hideSplash(); return; }
  applyThemeVisual(effectiveTheme());   // 早期にテーマ適用（チラつき防止・無料は常にホワイト）
  const _imp=$('importFile'); if(_imp)_imp.onchange=importJSON;   // 取込ファイル入力（常設）を配線
  await hydrateStore();          // IndexedDBを開き、未移行データを移行＆メモリへ読込（データ操作前に完了させる）
  requestPersistentStorage();    // ストレージ永続化を要求＝ブラウザの自動退避（データ消失）を防ぐ
  migrateRecDatesToDay();        // 旧・月単位の体組成記録(YYYY-MM)を日付(YYYY-MM-01)へ寄せて、日単位の任意記録と互換に
  migratePlansToSchedule();      // 旧・本日プランを日付つきスケジュール(SCHED)へ移行
  dedupeSchedule();              // 予定の重複(同一クライアント＋同一日)を整理＝人数が二重に見える不具合の保険
  seedPresetMenus();             // 定番メニューを編集可能な形(MDB)へ初回だけ取り込む
  ensureActive(); syncTop();
  setTab('hub');   // 起動時はホーム（メニュー管理ハブ）を表示
  restoreBoardOpen();   // ブラウザ更新(リロード)前に開いていたセッションボードを開き直す＝リセットされない
  if(lockEnabled())showLock();   // ロック設定済みなら起動時に施錠画面を表示（解除後にオンボーディング）
  else { maybeOnboarding();      // 未ロックなら起動時に初回案内
    maybeInstallGuide();         // 初回のホーム画面追加ガイド（端末別・オンボ表示中はその終了後に出す）
    maybeInstallHint(); }        // ホーム画面追加の案内（使い始めてから一度だけ・保存耐性UP）
  seedNewsWelcome();             // お知らせ機能の初回案内を1件（重複しない）
  logInfo('起動', location.origin+' / '+(_idb?'IndexedDB':'localStorage'));
  hideSplash();   // 初期化完了→スプラッシュをフェードアウト
})().catch(()=>hideSplash());   // 初期化で例外が出てもスプラッシュは必ず解除する
if('serviceWorker' in navigator){
  // 新SWが制御を握った瞬間に一度だけリロード（＝最新版に切り替わる）
  navigator.serviceWorker.addEventListener('controllerchange',forceReload);
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js');
      const notify=w=>{ if(w && navigator.serviceWorker.controller) showUpdateBanner(w); };
      if(reg.waiting) notify(reg.waiting);              // 既に待機中の更新があれば案内
      reg.addEventListener('updatefound',()=>{          // 新バージョン検出
        const w=reg.installing; if(!w)return;
        w.addEventListener('statechange',()=>{ if(w.state==='installed') notify(w); });
      });
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);   // 1時間ごとに更新確認
    }catch(_){}
  });
}
